services:
  sofia:
    image: ghcr.io/l8tenever/sofia:latest
    container_name: sofia
    restart: unless-stopped
    # ein Dienst, zwei Seiten: 8000 = Sofia, 8001 = sofianotes
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"   # Essensplan zum Anschauen (nur lesend)
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/sofia.db
      UPLOAD_DIR: /app/uploads
      TZ: Europe/Berlin
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./notes-data:/app/notes/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/auth/check')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
