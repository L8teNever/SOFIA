services:
  sofia:
    image: ghcr.io/l8tenever/sofia:latest
    container_name: sofia
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/sofia.db
      UPLOAD_DIR: /app/uploads
      SECRET_KEY: change-me-in-production
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/auth/check')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
