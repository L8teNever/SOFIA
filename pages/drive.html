<div class="page" id="page-drive" style="background:#f8f5fc;">
  <div id="ph-drive"></div>
  <div class="page-scroll-1col">
  <div class="page-inner">

    <input type="file" id="drive-file-input" multiple style="display:none;" onchange="handleDriveFileSelect(this)">

    <div id="drive-view-chips" style="display:flex;gap:8px;flex-wrap:wrap;">
      <button onclick="setDriveMode('folders',this)" class="chip active" id="drive-chip-folders">Ordner</button>
      <button onclick="setDriveMode('recent',this)" class="chip" id="drive-chip-recent">Zuletzt</button>
    </div>

    <div id="drive-content" style="margin-top:16px;"></div>

  </div>
  </div>

  <div id="drive-fab-slot"></div>

  <div id="drive-preview-lightbox" style="display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.92);backdrop-filter:blur(12px);flex-direction:column;opacity:0;transition:opacity 0.22s ease;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:max(12px, env(safe-area-inset-top)) 16px 12px;color:#fff;flex-shrink:0;">
      <div style="min-width:0;flex:1;">
        <div id="drive-preview-title" style="font-weight:700;font-size:0.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
        <div id="drive-preview-meta" style="font-size:0.75rem;opacity:0.65;"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-shrink:0;">
        <a id="drive-preview-open-link" href="#" download style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.12);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;" title="Herunterladen">
          <i data-lucide="download" style="width:18px;height:18px;"></i>
        </a>
        <button onclick="closeDriveFilePreview()" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.12);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;" title="Schließen">
          <i data-lucide="x" style="width:22px;height:22px;"></i>
        </button>
      </div>
    </div>
    <div id="drive-preview-body" style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;"></div>
    <div id="drive-preview-actions" style="display:none;gap:10px;padding:12px 16px;padding-bottom:max(16px, env(safe-area-inset-bottom));flex-shrink:0;"></div>
  </div>

  <style>
  .drive-folder-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  @media (min-width:560px) { .drive-folder-grid { grid-template-columns:repeat(3,1fr); } }
  .drive-folder-tile { background:#fff; border-radius:20px; padding:16px; display:flex; flex-direction:column; gap:10px; cursor:pointer; border:1px solid rgba(0,0,0,0.04); transition:transform 0.15s; -webkit-tap-highlight-color:transparent; }
  .drive-folder-tile:active { transform:scale(0.97); }
  .drive-topic-group { margin-bottom:18px; }
  .drive-topic-label { font-size:0.78rem; font-weight:700; opacity:0.55; margin:0 0 8px 4px; display:flex; align-items:center; gap:6px; }
  .drive-file-tag { font-size:0.66rem; font-weight:700; padding:2px 8px; border-radius:8px; background:#eaddff; color:#442b7a; white-space:nowrap; }
  .drive-header-search-wrap {
    display: flex; align-items: center; gap: 4px;
    position: absolute; top: 0; left: 0; height: 100%;
    width: 0; opacity: 0; overflow: hidden;
    transition: width 0.28s cubic-bezier(0.2,0.8,0.2,1), opacity 0.18s ease;
  }
  .drive-header-search-wrap.open { width: 100%; opacity: 1; }
  .drive-gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }
  .drive-gallery-item {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    cursor: pointer;
    aspect-ratio: 4/3;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    -webkit-tap-highlight-color: transparent;
  }
  .drive-gallery-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .drive-gallery-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
    display: flex; align-items: flex-end; gap: 6px; padding: 8px; color: #fff;
  }
  .drive-file-card {
    background: #fff;
    border-radius: 16px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    border: 1px solid rgba(0,0,0,0.04);
  }
  </style>
</div>

<script>
document.getElementById('ph-drive').outerHTML = pageHeader({
  backAction: 'driveHeaderBack()',
  titleHtml: `<div style="flex:1;min-width:0;position:relative;height:100%;display:flex;align-items:center;">
      <span class="page-title" id="drive-title-text" style="transition:opacity 0.15s;">Drive</span>
      <div id="drive-header-search-wrap" class="drive-header-search-wrap">
        <input type="text" id="drive-search-input" placeholder="Dateien durchsuchen..." autocomplete="off" inputmode="search" style="flex:1;min-width:0;border:none;outline:none;background:transparent;padding:6px 0;font-size:1.05rem;font-weight:600;color:inherit;" oninput="onDriveSearchInput(this.value)">
        <button type="button" id="drive-search-clear" onclick="clearDriveSearch()" style="display:none;background:none;border:none;cursor:pointer;opacity:0.4;padding:6px;flex-shrink:0;">
          <i data-lucide="x" style="width:16px;height:16px;"></i>
        </button>
      </div>
    </div>`,
  trailing: `<button class="icon-btn" id="drive-search-btn" onclick="toggleDriveHeaderSearch()" title="Suchen">
      <i data-lucide="search" id="drive-search-btn-icon" style="width:20px;height:20px;"></i>
      <i data-lucide="x" id="drive-search-btn-icon-close" style="width:20px;height:20px;display:none;"></i>
    </button>`
});
document.getElementById('drive-fab-slot').outerHTML = fab({
  icon: 'upload', onclick: 'document.getElementById("drive-file-input").click()',
  title: 'Datei hochladen', id: 'drive-fab'
});

let driveFiles = [], driveSubjects = [];
let driveMode = 'folders';
let driveSelectedSubjectId = null;
let driveSearchQuery = '';
let drivePreviewFileId = null;
let driveTopicsCache = {};
let driveUploading = false;

const DRIVE_COLORS = ['#eaddff','#d3e3fd','#c4eed0','#ffdec1','#ffd8e4','#fff3c4'];
const DRIVE_ICON_MAP = {
  pdf:'file-text', doc:'file-text', docx:'file-text', md:'file-text', markdown:'file-text', txt:'file-text',
  jpg:'image', jpeg:'image', png:'image', gif:'image', webp:'image', svg:'image', bmp:'image',
  mp3:'music', wav:'music', mp4:'video', mov:'video', avi:'video',
  zip:'archive', rar:'archive', '7z':'archive',
  xls:'table', xlsx:'table', csv:'table',
  ppt:'presentation', pptx:'presentation',
};
const DRIVE_TEXT_EXTS = ['md', 'markdown', 'txt'];
const DRIVE_IMAGE_EXTS = ['jpg','jpeg','png','gif','webp','bmp','svg'];

function driveExt(name) { return (name.split('.').pop() || '').toLowerCase(); }
function driveIcon(name) { return DRIVE_ICON_MAP[driveExt(name)] || 'file'; }
function driveColorFor(id) { return DRIVE_COLORS[Math.abs(id||0) % DRIVE_COLORS.length]; }
function driveIsImage(f) { return DRIVE_IMAGE_EXTS.includes(driveExt(f.original_name)); }

function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}

function driveFileUrl(f, suffix) {
  const subject = encodeURIComponent(f.subject_name || 'Unsortiert');
  const topic = encodeURIComponent(f.topic || 'Ohne-Thema');
  const filename = encodeURIComponent(f.original_name || 'Datei');
  return `/drive/${subject}/${topic}/${filename}${suffix ? '/' + suffix : ''}`;
}

function driveRelTime(iso) {
  const then = new Date(iso).getTime();
  const diffMin = Math.floor((Date.now() - then) / 60000);
  if (diffMin < 1) return 'gerade eben';
  if (diffMin < 60) return 'vor ' + diffMin + ' Min.';
  const diffH = Math.floor(diffMin / 60);
  if (diffH < 24) return 'vor ' + diffH + ' Std.';
  const diffD = Math.floor(diffH / 24);
  if (diffD < 7) return 'vor ' + diffD + ' Tag' + (diffD === 1 ? '' : 'en');
  const d = new Date(iso);
  return d.getDate() + '.' + (d.getMonth()+1) + '.' + d.getFullYear();
}

async function init_drive() {
  [driveFiles, driveSubjects] = await Promise.all([
    API.driveFiles().catch(() => []),
    API.subjects().catch(() => []),
  ]);
  renderDrive();
}

function setDriveMode(mode, btn) {
  driveMode = mode;
  driveSelectedSubjectId = null;
  document.querySelectorAll('#drive-view-chips .chip').forEach(c => c.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderDrive();
}

let driveHeaderSearchOpen = false;

function toggleDriveHeaderSearch() {
  driveHeaderSearchOpen = !driveHeaderSearchOpen;
  const title = document.getElementById('drive-title-text');
  const wrap = document.getElementById('drive-header-search-wrap');
  const fabBtn = document.getElementById('drive-fab');
  document.getElementById('drive-search-btn-icon').style.display = driveHeaderSearchOpen ? 'none' : '';
  document.getElementById('drive-search-btn-icon-close').style.display = driveHeaderSearchOpen ? '' : 'none';
  if (fabBtn) fabBtn.style.display = driveHeaderSearchOpen ? 'none' : '';

  if (driveHeaderSearchOpen) {
    title.style.opacity = '0';
    wrap.classList.add('open');
    setTimeout(() => document.getElementById('drive-search-input').focus(), 150);
  } else {
    wrap.classList.remove('open');
    title.style.opacity = '';
    if (driveSearchQuery) clearDriveSearch();
  }
}

function onDriveSearchInput(value) {
  driveSearchQuery = value.trim();
  document.getElementById('drive-search-clear').style.display = driveSearchQuery ? 'flex' : 'none';
  renderDrive();
}

function clearDriveSearch() {
  driveSearchQuery = '';
  document.getElementById('drive-search-input').value = '';
  document.getElementById('drive-search-clear').style.display = 'none';
  renderDrive();
}

function driveMatchesSearch(f, q) {
  const hay = [f.original_name, f.topic, f.subject_name, f.uploader_name].filter(Boolean).join(' ').toLowerCase();
  return hay.includes(q);
}

function driveHeaderTitle() {
  if (driveSearchQuery || driveMode === 'recent') return 'Drive';
  if (driveSelectedSubjectId === null) return 'Drive';
  if (driveSelectedSubjectId === 'unsorted') return 'Unsortiert';
  const subject = driveSubjects.find(s => s.id === driveSelectedSubjectId);
  return subject ? subject.name : 'Drive';
}

function renderDrive() {
  const el = document.getElementById('drive-content');
  document.getElementById('drive-view-chips').style.display = (driveSearchQuery || driveSelectedSubjectId !== null) ? 'none' : 'flex';
  const titleEl = document.getElementById('drive-title-text');
  if (titleEl) titleEl.textContent = driveHeaderTitle();

  if (driveSearchQuery) {
    const q = driveSearchQuery.toLowerCase();
    const matches = driveFiles.filter(f => driveMatchesSearch(f, q));
    el.innerHTML = renderDriveSectionLabel('Suchergebnisse') + renderDriveFileList(matches, true);
  } else if (driveMode === 'recent') {
    const recent = [...driveFiles].sort((a,b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 40);
    el.innerHTML = renderDriveSectionLabel('Zuletzt hochgeladen') + renderDriveFileList(recent, true);
  } else if (driveSelectedSubjectId !== null) {
    el.innerHTML = renderDriveSubjectFolder(driveSelectedSubjectId);
  } else {
    el.innerHTML = renderDriveFolderGrid();
  }
  if (window.lucide) lucide.createIcons();
}

function renderDriveSectionLabel(text) {
  return `<div class="section-label" style="margin-top:0;">${text}</div>`;
}

function renderDriveFolderGrid() {
  const hasUnsorted = driveFiles.some(f => !f.subject_id);
  const tiles = driveSubjects.map(s => {
    const count = driveFiles.filter(f => f.subject_id === s.id).length;
    return `<div class="drive-folder-tile" onclick="openDriveSubjectFolder(${s.id})">
      <div class="icon-box" style="width:44px;height:44px;border-radius:14px;background:${driveColorFor(s.id)};">
        <i data-lucide="folder" style="width:22px;height:22px;color:#442b7a;"></i>
      </div>
      <div style="font-weight:700;font-size:0.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(s.name)}</div>
      <div style="font-size:0.75rem;opacity:0.5;">${count} Datei${count===1?'':'en'}</div>
    </div>`;
  }).join('');
  const unsortedTile = hasUnsorted ? `<div class="drive-folder-tile" onclick="openDriveSubjectFolder('unsorted')">
      <div class="icon-box" style="width:44px;height:44px;border-radius:14px;background:rgba(0,0,0,0.06);color:#49454f;">
        <i data-lucide="folder-open" style="width:22px;height:22px;"></i>
      </div>
      <div style="font-weight:700;font-size:0.92rem;">Unsortiert</div>
      <div style="font-size:0.75rem;opacity:0.5;">${driveFiles.filter(f=>!f.subject_id).length} Datei${driveFiles.filter(f=>!f.subject_id).length===1?'':'en'}</div>
    </div>` : '';

  if (!driveSubjects.length && !hasUnsorted) {
    return emptyState({ icon:'hard-drive', title:'Noch keine Dateien', subtitle:'Tippe auf den Upload-Button und wähle einfach Dateien aus.', hidden:false });
  }
  return `<div class="drive-folder-grid">${tiles}${unsortedTile}</div>`;
}

function driveUrlPath() {
  if (driveSelectedSubjectId === null) return '/drive';
  if (driveSelectedSubjectId === 'unsorted') return '/drive/Unsortiert';
  const subject = driveSubjects.find(s => s.id === driveSelectedSubjectId);
  return `/drive/${encodeURIComponent(subject ? subject.name : 'Fach')}`;
}

function drivePushHistory() {
  history.pushState({
    page: 'drive', subjectId: driveSelectedSubjectId,
  }, '', driveUrlPath());
}

function driveHandlePopstate(state) {
  driveSelectedSubjectId = state.subjectId ?? null;
  renderDrive();
}

async function openDriveSubjectFolder(id) {
  driveSelectedSubjectId = id;
  if (id !== 'unsorted' && !driveTopicsCache[id]) {
    driveTopicsCache[id] = await API.driveTopics(id).catch(() => []);
  }
  renderDrive();
  drivePushHistory();
}

function driveHeaderBack() {
  if (driveSelectedSubjectId === null) {
    closePage();
    return;
  }
  history.back();
}

function renderDriveTopicGroups(topicNames, topicMap, subjectId) {
  return topicNames.map(name => {
    const g = topicMap[name];
    const list = g.files.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    return `<div class="drive-topic-group">
      <div class="drive-topic-label">
        <i data-lucide="folder" style="width:12px;height:12px;"></i>${escapeHtml(name)}
        ${g.topicId ? `<button onclick="openRenameTopicSheet(${g.topicId},${subjectId})" style="background:none;border:none;cursor:pointer;opacity:0.5;padding:2px;display:flex;" title="Umbenennen">
          <i data-lucide="pencil" style="width:12px;height:12px;"></i>
        </button>` : ''}
      </div>
      ${list.length ? renderDriveFileList(list, false) : `<div style="opacity:0.4;font-size:0.82rem;padding:6px 4px 14px;">Leerer Ordner</div>`}
    </div>`;
  }).join('');
}

function renderDriveSubjectFolder(id) {
  const isUnsorted = id === 'unsorted';
  const files = isUnsorted
    ? driveFiles.filter(f => !f.subject_id)
    : driveFiles.filter(f => f.subject_id === id);

  const header = !isUnsorted ? `<div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
    <button class="icon-btn" onclick="openCreateTopicSheet(${id})" style="width:36px;height:36px;flex-shrink:0;" title="Neuer Ordner">
      <i data-lucide="folder-plus" style="width:18px;height:18px;"></i>
    </button>
  </div>` : '';

  if (isUnsorted) {
    if (!files.length) return header + emptyState({ icon:'folder-open', title:'Noch keine Dateien in diesem Ordner', hidden:false });
    return header + renderDriveFileList(files, false);
  }

  const knownTopics = driveTopicsCache[id] || [];
  const topicMap = {};
  knownTopics.forEach(t => { topicMap[t.name] = { files: [], topicId: t.id }; });
  const untagged = [];
  files.forEach(f => {
    if (f.topic) {
      if (!topicMap[f.topic]) topicMap[f.topic] = { files: [], topicId: null };
      topicMap[f.topic].files.push(f);
    } else {
      untagged.push(f);
    }
  });

  const topicNames = Object.keys(topicMap).sort((a,b) => a.localeCompare(b));
  if (!topicNames.length && !untagged.length) {
    return header + emptyState({ icon:'folder-open', title:'Noch keine Dateien in diesem Ordner', subtitle:'Tippe unten rechts, um Dateien hochzuladen.', hidden:false });
  }

  const otherGroups = renderDriveTopicGroups(topicNames, topicMap, id);
  const untaggedGroup = untagged.length ? `<div class="drive-topic-group">
    ${topicNames.length ? `<div class="drive-topic-label"><i data-lucide="files" style="width:12px;height:12px;"></i>Dateien</div>` : ''}
    ${renderDriveFileList(untagged.sort((a,b) => new Date(b.created_at) - new Date(a.created_at)), false)}
  </div>` : '';

  return header + otherGroups + untaggedGroup;
}

function openCreateTopicSheet(subjectId) {
  openSheet(`
    <div style="padding:4px;">
      <div style="font-weight:700;font-size:1.05rem;margin-bottom:14px;">Neuer Ordner</div>
      <input type="text" class="m3-input" id="drive-newtopic-input" placeholder="Name des Ordners" style="margin-bottom:14px;">
      <button class="m3-btn-full" onclick="submitCreateTopic(${subjectId})">Erstellen</button>
    </div>
  `);
  setTimeout(() => document.getElementById('drive-newtopic-input')?.focus(), 100);
}

async function submitCreateTopic(subjectId) {
  const name = document.getElementById('drive-newtopic-input').value.trim();
  if (!name) return;
  try {
    await API.createDriveTopic({ subject_id: subjectId, name });
    driveTopicsCache[subjectId] = await API.driveTopics(subjectId).catch(() => []);
    closeSheet();
    renderDrive();
    showToast('Ordner erstellt');
  } catch { showToast('Fehler beim Erstellen'); }
}

function openRenameTopicSheet(topicId, subjectId) {
  const t = (driveTopicsCache[subjectId] || []).find(x => x.id === topicId);
  openSheet(`
    <div style="padding:4px;">
      <div style="font-weight:700;font-size:1.05rem;margin-bottom:14px;">Ordner umbenennen</div>
      <input type="text" class="m3-input" id="drive-rename-input" value="${escapeHtml(t ? t.name : '')}" style="margin-bottom:14px;">
      <button class="m3-btn-full" onclick="submitRenameTopic(${topicId},${subjectId})">Speichern</button>
    </div>
  `);
  setTimeout(() => document.getElementById('drive-rename-input')?.focus(), 100);
}

async function submitRenameTopic(topicId, subjectId) {
  const name = document.getElementById('drive-rename-input').value.trim();
  if (!name) return;
  try {
    await API.renameDriveTopic(topicId, { name });
    driveFiles = await API.driveFiles().catch(() => driveFiles);
    driveTopicsCache[subjectId] = await API.driveTopics(subjectId).catch(() => []);
    closeSheet();
    renderDrive();
    showToast('Ordner umbenannt');
  } catch { showToast('Fehler beim Umbenennen'); }
}

function openMoveFileSheet(fileId) {
  const f = driveFiles.find(x => x.id === fileId);
  if (!f) return;
  const subjectOptions = driveSubjects.map(s => `<option value="${s.id}"${s.id===f.subject_id?' selected':''}>${escapeHtml(s.name)}</option>`).join('');
  openSheet(`
    <div style="padding:4px;">
      <div style="font-weight:700;font-size:1.05rem;margin-bottom:4px;">Datei verschieben</div>
      <div style="opacity:0.6;font-size:0.85rem;margin-bottom:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(f.original_name)}</div>
      <div style="font-size:0.8rem;font-weight:700;opacity:0.5;margin-bottom:6px;">ORDNER</div>
      <select class="m3-select" id="drive-move-subject" style="margin-bottom:14px;">
        <option value="">Unsortiert</option>
        ${subjectOptions}
      </select>
      <div style="font-size:0.8rem;font-weight:700;opacity:0.5;margin-bottom:6px;">UNTERORDNER (optional)</div>
      <input type="text" class="m3-input" id="drive-move-topic" value="${escapeHtml(f.topic||'')}" placeholder="z. B. Arbeitsblätter" style="margin-bottom:14px;">
      <button class="m3-btn-full" onclick="submitMoveFile(${fileId})">Verschieben</button>
    </div>
  `);
}

async function submitMoveFile(fileId) {
  const subjVal = document.getElementById('drive-move-subject').value;
  const topicVal = document.getElementById('drive-move-topic').value;
  try {
    const updated = await API.updateDriveFile(fileId, {
      subject_id: subjVal ? parseInt(subjVal) : null,
      topic: topicVal,
    });
    const idx = driveFiles.findIndex(f => f.id === fileId);
    if (idx !== -1) driveFiles[idx] = updated;
    driveTopicsCache = {};
    closeSheet();
    renderDrive();
    showToast('Datei verschoben');
  } catch { showToast('Fehler beim Verschieben'); }
}

function renderDriveFileList(files, showTag) {
  if (!files.length) {
    return `<div style="text-align:center;padding:30px;opacity:0.4;font-size:0.9rem;">Keine Dateien gefunden</div>`;
  }
  const images = files.filter(driveIsImage);
  const others = files.filter(f => !driveIsImage(f));
  let html = '';
  if (images.length) {
    html += `<div class="drive-gallery-grid">${images.map(f => `
      <div class="drive-gallery-item" onclick="openDriveFile(${f.id})">
        <img class="drive-gallery-img" src="${driveFileUrl(f, 'raw')}" alt="${escapeHtml(f.original_name)}" loading="lazy">
        <div class="drive-gallery-overlay">
          <span style="font-size:0.7rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;">${escapeHtml(f.original_name)}</span>
          <button onclick="event.stopPropagation();openDriveFileActions(${f.id})" style="background:rgba(255,255,255,0.18);border:none;border-radius:10px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;cursor:pointer;" title="Mehr">
            <i data-lucide="more-vertical" style="width:14px;height:14px;"></i>
          </button>
        </div>
      </div>`).join('')}</div>`;
  }
  html += others.map(f => {
    const canDelete = currentUser && (f.uploader_id === currentUser.id || currentUser.role === 'admin' || currentUser.role === 'super_admin');
    const tag = showTag && (f.subject_name || f.topic)
      ? `<div style="margin-top:2px;"><span class="drive-file-tag">${escapeHtml([f.subject_name, f.topic].filter(Boolean).join(' · '))}</span></div>`
      : '';
    return `
    <div class="drive-file-card">
      <div onclick="openDriveFile(${f.id})" style="display:flex;align-items:center;gap:12px;min-width:0;flex:1;cursor:pointer;">
        <div class="icon-box" style="width:40px;height:40px;background:${driveColorFor(f.subject_id||f.id)};border-radius:12px;flex-shrink:0;">
          <i data-lucide="${driveIcon(f.original_name)}" style="width:18px;height:18px;color:#442b7a;"></i>
        </div>
        <div style="min-width:0;flex:1;">
          <div style="font-weight:600;font-size:0.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(f.original_name)}</div>
          <div style="font-size:0.72rem;opacity:0.55;">${formatBytes(f.file_size)} · ${escapeHtml(f.uploader_name||'?')} · ${driveRelTime(f.created_at)}</div>
          ${tag}
        </div>
      </div>
      <button onclick="openDriveFileActions(${f.id})" style="background:#f3edf7;border:none;border-radius:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;" title="Mehr">
        <i data-lucide="more-vertical" style="width:18px;height:18px;"></i>
      </button>
      ${canDelete ? `<button onclick="deleteDriveFileConfirm(${f.id})" style="background:none;border:none;cursor:pointer;opacity:0.4;padding:8px;flex-shrink:0;" title="Löschen">
        <i data-lucide="trash-2" style="width:16px;height:16px;"></i>
      </button>` : ''}
    </div>`;
  }).join('');
  return html;
}

function openDriveFileActions(fileId) {
  const f = driveFiles.find(x => x.id === fileId);
  if (!f) return;
  const canDelete = currentUser && (f.uploader_id === currentUser.id || currentUser.role === 'admin' || currentUser.role === 'super_admin');
  openSheet(`
    <div style="padding:4px;">
      <div style="font-weight:700;font-size:1.05rem;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(f.original_name)}</div>
      <div style="opacity:0.55;font-size:0.82rem;margin-bottom:16px;">${formatBytes(f.file_size)} · ${escapeHtml(f.uploader_name||'?')}</div>
      <button class="m3-btn-full" style="margin-bottom:8px;" onclick="closeSheet();openDriveFile(${f.id})">Vorschau</button>
      <a href="${driveFileUrl(f, 'download')}" download class="m3-btn-outline" style="display:block;text-align:center;text-decoration:none;margin-bottom:8px;">Herunterladen</a>
      <button class="m3-btn-outline" style="width:100%;margin-bottom:8px;" onclick="closeSheet();openMoveFileSheet(${f.id})">Verschieben</button>
      ${canDelete ? `<button class="m3-btn-outline" style="width:100%;color:#ba1a1a;" onclick="closeSheet();deleteDriveFileConfirm(${f.id})">Löschen</button>` : ''}
    </div>
  `);
}

async function handleDriveFileSelect(inputEl) {
  const fileList = Array.from(inputEl.files || []);
  inputEl.value = '';
  if (!fileList.length || driveUploading) return;

  const subjectId = (driveSelectedSubjectId && driveSelectedSubjectId !== 'unsorted') ? String(driveSelectedSubjectId) : '';
  driveUploading = true;
  const fabBtn = document.getElementById('drive-fab');
  if (fabBtn) fabBtn.style.opacity = '0.45';

  let uploaded = 0, failed = 0;
  for (const file of fileList) {
    showToast(fileList.length > 1 ? `Hochladen… (${uploaded + failed + 1}/${fileList.length})` : 'Hochladen…');
    const form = new FormData();
    form.append('file', file);
    form.append('subject_id', subjectId);
    form.append('topic', '');
    try {
      const f = await API.uploadDriveFile(form);
      driveFiles.unshift(f);
      uploaded++;
    } catch {
      failed++;
    }
  }

  driveUploading = false;
  if (fabBtn) fabBtn.style.opacity = '';
  driveTopicsCache = {};
  renderDrive();

  if (failed && uploaded) showToast(`${uploaded} hochgeladen, ${failed} fehlgeschlagen`);
  else if (failed) showToast('Upload fehlgeschlagen');
  else if (uploaded > 1) showToast(`${uploaded} Dateien hochgeladen`);
  else showToast('Datei hochgeladen');
}

function deleteDriveFileConfirm(id) {
  const f = driveFiles.find(x => x.id === id);
  if (!f) return;
  openModal(confirmDelete({
    title: 'Datei löschen?',
    message: `<b>${escapeHtml(f.original_name)}</b> wird unwiderruflich gelöscht.`,
    onConfirm: `executeDeleteDriveFile(${id})`,
  }));
}

async function executeDeleteDriveFile(id) {
  try {
    await API.deleteDriveFile(id);
  } catch {
    showToast('Fehler beim Löschen');
    return;
  }
  driveFiles = driveFiles.filter(f => f.id !== id);
  driveTopicsCache = {};
  closeModal();
  renderDrive();
  showToast('Gelöscht');
}

function openDriveFile(id) {
  openDriveFilePreview(id);
}

let drivePreviewHome = null;

async function openDriveFilePreview(id) {
  const f = driveFiles.find(x => x.id === id);
  if (!f) return;
  drivePreviewFileId = id;
  const lb = document.getElementById('drive-preview-lightbox');
  if (!lb) return;
  if (lb.parentElement !== document.body) {
    drivePreviewHome = { parent: lb.parentElement, nextSibling: lb.nextSibling };
    document.body.appendChild(lb);
  }

  document.getElementById('drive-preview-title').textContent = f.original_name;
  document.getElementById('drive-preview-meta').textContent = `${formatBytes(f.file_size)} · ${f.uploader_name||'?'} · ${driveRelTime(f.created_at)}`;
  const openLink = document.getElementById('drive-preview-open-link');
  if (openLink) openLink.href = driveFileUrl(f, 'download');

  const ext = driveExt(f.original_name);
  const isImage = DRIVE_IMAGE_EXTS.includes(ext);
  const isPdf = ext === 'pdf';
  const isText = DRIVE_TEXT_EXTS.includes(ext);

  const body = document.getElementById('drive-preview-body');
  const actions = document.getElementById('drive-preview-actions');
  body.style.alignItems = '';
  body.style.justifyContent = '';
  lb.style.background = isImage ? 'rgba(0,0,0,0.92)' : '#f3edf7';

  if (isImage) {
    actions.style.display = 'none';
    body.innerHTML = `<div id="drive-preview-image-wrap" style="width:100%;height:100%;overflow:hidden;touch-action:none;position:relative;">
      <img id="drive-preview-image" src="${driveFileUrl(f, 'raw')}" alt="" style="max-width:100%;max-height:100%;position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;border-radius:0;">
    </div>`;
    const img = document.getElementById('drive-preview-image');
    if (img.complete) initDriveZoomPan('drive-preview-image-wrap', 'drive-preview-image');
    else img.onload = () => initDriveZoomPan('drive-preview-image-wrap', 'drive-preview-image');
  } else if (isPdf) {
    actions.style.display = 'none';
    body.innerHTML = `<div id="drive-preview-pdf-wrap" style="width:100%;height:100%;overflow:hidden;touch-action:none;position:relative;background:#1c1b1f;">
      <div id="drive-preview-pdf-pages" style="position:absolute;top:0;left:0;transform-origin:0 0;"></div>
    </div>`;
    renderDrivePdfPreview(id);
  } else if (isText) {
    actions.style.display = 'flex';
    actions.innerHTML = `<button class="m3-btn-primary" style="flex:1;" onclick="startDriveTextEdit(${id})" id="drive-edit-toggle-btn">Bearbeiten</button>`;
    body.style.padding = '16px';
    body.style.overflow = 'auto';
    body.innerHTML = `<div style="text-align:center;margin:auto;opacity:0.5;color:#1c1b1f;">Lädt…</div>`;
  } else {
    actions.style.display = 'flex';
    actions.innerHTML = `<a href="${driveFileUrl(f, 'download')}" download class="m3-btn-primary" style="flex:1;text-align:center;text-decoration:none;">Herunterladen</a>`;
    body.style.padding = '24px';
    body.style.overflow = 'auto';
    body.style.alignItems = 'center';
    body.style.justifyContent = 'center';
    body.innerHTML = `<div style="text-align:center;opacity:0.7;color:#1c1b1f;">
      <i data-lucide="${driveIcon(f.original_name)}" style="width:48px;height:48px;margin-bottom:12px;"></i>
      <div>Keine Vorschau für diesen Dateityp.</div>
    </div>`;
  }

  lb.style.display = 'flex';
  requestAnimationFrame(() => lb.style.opacity = '1');
  if (window.lucide) lucide.createIcons();

  if (isText) {
    try {
      const res = await API.driveFileText(id);
      body.innerHTML = `<textarea id="drive-preview-textarea" readonly style="flex:1;width:100%;min-height:50vh;border:1px solid rgba(0,0,0,0.1);border-radius:12px;padding:14px;font-family:monospace;font-size:0.9rem;resize:none;background:#faf9fc;color:#1c1b1f;">${escapeHtml(res.content)}</textarea>`;
    } catch {
      body.innerHTML = `<div style="text-align:center;margin:auto;opacity:0.5;color:#1c1b1f;">Inhalt konnte nicht geladen werden.</div>`;
    }
  }
}

function closeDriveFilePreview(isPopState = false) {
  const lb = document.getElementById('drive-preview-lightbox');
  if (!lb) return;
  lb.style.opacity = '0';
  setTimeout(() => {
    lb.style.display = 'none';
    if (drivePreviewHome && document.body.contains(drivePreviewHome.parent)) {
      drivePreviewHome.parent.insertBefore(lb, drivePreviewHome.nextSibling);
    } else if (lb.parentElement === document.body) {
      lb.remove();
    }
    drivePreviewHome = null;
  }, 220);
}

let driveZoom = { scale: 1, x: 0, y: 0, startDist: null, startScale: 1, dragging: false, dragStartX: 0, dragStartY: 0, panStartX: 0, panStartY: 0, lastTapTime: 0 };
let driveZoomWrapId = null, driveZoomTargetId = null;

function clampDriveZoomPan() {
  const wrap = document.getElementById(driveZoomWrapId);
  const target = document.getElementById(driveZoomTargetId);
  if (!wrap || !target) return;
  const wrapW = wrap.clientWidth, wrapH = wrap.clientHeight;
  const naturalW = target.scrollWidth || target.offsetWidth;
  const naturalH = target.scrollHeight || target.offsetHeight;
  const scaledW = naturalW * driveZoom.scale;
  const scaledH = naturalH * driveZoom.scale;
  driveZoom.x = scaledW <= wrapW ? (wrapW - scaledW) / 2 : Math.min(0, Math.max(wrapW - scaledW, driveZoom.x));
  driveZoom.y = scaledH <= wrapH ? (wrapH - scaledH) / 2 : Math.min(0, Math.max(wrapH - scaledH, driveZoom.y));
}

function applyDriveZoomTransform() {
  const target = document.getElementById(driveZoomTargetId);
  if (!target) return;
  clampDriveZoomPan();
  target.style.transform = `translate(${driveZoom.x}px, ${driveZoom.y}px) scale(${driveZoom.scale})`;
}

function driveZoomTo(newScale, anchorX, anchorY) {
  newScale = Math.min(5, Math.max(1, newScale));
  const contentX = (anchorX - driveZoom.x) / driveZoom.scale;
  const contentY = (anchorY - driveZoom.y) / driveZoom.scale;
  driveZoom.scale = newScale;
  driveZoom.x = anchorX - contentX * newScale;
  driveZoom.y = anchorY - contentY * newScale;
  applyDriveZoomTransform();
}

function initDriveZoomPan(wrapId, targetId) {
  const wrap = document.getElementById(wrapId);
  const target = document.getElementById(targetId);
  if (!wrap || !target) return;
  driveZoomWrapId = wrapId;
  driveZoomTargetId = targetId;
  driveZoom = { scale: 1, x: 0, y: 0, startDist: null, startScale: 1, dragging: false, dragStartX: 0, dragStartY: 0, panStartX: 0, panStartY: 0, lastTapTime: 0 };
  applyDriveZoomTransform();

  const pointers = new Map();
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  wrap.onpointerdown = (e) => {
    try { wrap.setPointerCapture(e.pointerId); } catch {}
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      const now = Date.now();
      if (now - driveZoom.lastTapTime < 300) {
        target.style.transition = 'transform 0.2s ease';
        const rect = wrap.getBoundingClientRect();
        driveZoomTo(driveZoom.scale > 1 ? 1 : 2.5, e.clientX - rect.left, e.clientY - rect.top);
        setTimeout(() => { target.style.transition = ''; }, 200);
      }
      driveZoom.lastTapTime = now;
      driveZoom.dragging = true;
      driveZoom.dragStartX = e.clientX;
      driveZoom.dragStartY = e.clientY;
      driveZoom.panStartX = driveZoom.x;
      driveZoom.panStartY = driveZoom.y;
    } else if (pointers.size === 2) {
      driveZoom.dragging = false;
      const pts = [...pointers.values()];
      driveZoom.startDist = dist(pts[0], pts[1]);
      driveZoom.startScale = driveZoom.scale;
    }
  };

  wrap.onpointermove = (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2 && driveZoom.startDist) {
      const pts = [...pointers.values()];
      const d = dist(pts[0], pts[1]);
      const rect = wrap.getBoundingClientRect();
      const midX = (pts[0].x + pts[1].x) / 2 - rect.left;
      const midY = (pts[0].y + pts[1].y) / 2 - rect.top;
      driveZoomTo(driveZoom.startScale * (d / driveZoom.startDist), midX, midY);
    } else if (pointers.size === 1 && driveZoom.dragging) {
      driveZoom.x = driveZoom.panStartX + (e.clientX - driveZoom.dragStartX);
      driveZoom.y = driveZoom.panStartY + (e.clientY - driveZoom.dragStartY);
      applyDriveZoomTransform();
    }
  };

  const endPointer = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) driveZoom.startDist = null;
    if (pointers.size === 0) driveZoom.dragging = false;
  };
  wrap.onpointerup = endPointer;
  wrap.onpointercancel = endPointer;

  wrap.onwheel = (e) => {
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    driveZoomTo(driveZoom.scale - e.deltaY * 0.0015, e.clientX - rect.left, e.clientY - rect.top);
  };
}

let pdfjsLibPromise = null;
function loadPdfJs() {
  if (!pdfjsLibPromise) {
    const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/';
    pdfjsLibPromise = import(base + 'pdf.min.mjs').then(mod => {
      mod.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.mjs';
      return mod;
    });
  }
  return pdfjsLibPromise;
}

async function renderDrivePdfPreview(id) {
  const wrap = document.getElementById('drive-preview-pdf-wrap');
  const pagesEl = document.getElementById('drive-preview-pdf-pages');
  if (!wrap || !pagesEl) return;
  const f = driveFiles.find(x => x.id === id);
  if (!f) return;
  try {
    const pdfjsLib = await loadPdfJs();
    const pdf = await pdfjsLib.getDocument({ url: driveFileUrl(f, 'raw') }).promise;
    const wrapWidth = wrap.clientWidth || 320;
    const dpr = window.devicePixelRatio || 1;
    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      const page = await pdf.getPage(pageNum);
      const fitScale = wrapWidth / page.getViewport({ scale: 1 }).width;
      const viewport = page.getViewport({ scale: fitScale * dpr });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width = (viewport.width / dpr) + 'px';
      canvas.style.height = (viewport.height / dpr) + 'px';
      canvas.style.display = 'block';
      if (pageNum < pdf.numPages) canvas.style.marginBottom = '6px';
      pagesEl.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    }
    initDriveZoomPan('drive-preview-pdf-wrap', 'drive-preview-pdf-pages');
  } catch (e) {
    wrap.innerHTML = '<div style="text-align:center;margin:auto;padding:20px;opacity:0.7;color:#fff;">PDF konnte nicht geladen werden.</div>';
  }
}

function startDriveTextEdit(id) {
  const ta = document.getElementById('drive-preview-textarea');
  if (!ta) return;
  ta.readOnly = false;
  ta.style.background = '#fff';
  ta.focus();
  const actions = document.getElementById('drive-preview-actions');
  actions.innerHTML = `
    <button class="m3-btn-outline" style="flex:1;" onclick="openDriveFilePreview(${id})">Abbrechen</button>
    <button class="m3-btn-primary" style="flex:1;" onclick="saveDriveTextEdit(${id})">Speichern</button>
  `;
}

async function saveDriveTextEdit(id) {
  const ta = document.getElementById('drive-preview-textarea');
  if (!ta) return;
  try {
    const updated = await API.updateDriveFileText(id, { content: ta.value });
    const idx = driveFiles.findIndex(f => f.id === id);
    if (idx !== -1) driveFiles[idx] = updated;
    showToast('Gespeichert');
    openDriveFilePreview(id);
  } catch {
    showToast('Speichern fehlgeschlagen');
  }
}
