<div class="page" id="page-admin" style="background:#f5f3f9;">
  <div class="page-header">
    <button class="back-btn"><i data-lucide="arrow-left" style="width:22px;height:22px;"></i></button>
    <span class="page-title">Admin</span>
    <div style="flex:1;"></div>
    <div id="admin-role-badge" style="background:#25232a;color:white;padding:6px 14px;border-radius:12px;font-size:0.8rem;font-weight:600;"></div>
  </div>

  <!-- Stats bar -->
  <div id="admin-stats-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 16px 20px;flex-shrink:0;"></div>

  <!-- Desktop: sidebar + content / Mobile: stacked -->
  <div style="display:flex;flex:1;overflow:hidden;">

    <!-- Sidebar nav (desktop) / top tabs (mobile) -->
    <div id="admin-nav" style="flex-shrink:0;">
      <div id="admin-tab-btns" style="display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 12px 20px;">
        <button class="admin-tab-btn active" onclick="adminTab('users',this)" data-tab="users">Nutzer</button>
        <button class="admin-tab-btn" onclick="adminTab('classes',this)" data-tab="classes">Klassen</button>
        <button class="admin-tab-btn" onclick="adminTab('subjects',this)" data-tab="subjects">Fächer</button>
        <button class="admin-tab-btn" onclick="adminTab('untis',this)" data-tab="untis">Untis</button>
        <button class="admin-tab-btn" onclick="adminTab('push',this)" data-tab="push">Push</button>
      </div>
    </div>

    <!-- Content area -->
    <div style="flex:1;overflow-y:auto;padding:0 20px 80px 20px;">

      <div id="tab-users">
        <div id="admin-users-list"></div>
        <button class="m3-btn-tonal" style="width:100%;margin-top:8px;" onclick="openNewUserSheet()">+ Neuer Nutzer</button>
      </div>

      <div id="tab-classes" style="display:none;">
        <div id="admin-classes-list"></div>
        <button class="m3-btn-tonal" style="width:100%;margin-top:8px;" onclick="openNewClassSheet()">+ Neue Klasse</button>
      </div>

      <div id="tab-subjects" style="display:none;">
        <div id="admin-subjects-list"></div>
        <button class="m3-btn-tonal" style="width:100%;margin-top:8px;" onclick="openNewSubjectSheet()">+ Neues Fach</button>
      </div>

      <div id="tab-untis" style="display:none;">
        <div class="m3-card-tonal" style="background:#ffdec1;color:#442b00;margin-bottom:12px;">
          <div style="font-weight:700;margin-bottom:6px;">WebUntis Stundenplan</div>
          <div style="font-size:0.82rem;opacity:0.75;line-height:1.5;">Trage pro Klasse die WebUntis-Zugangsdaten ein. Der Stundenplan wird dann automatisch geladen. Die Daten findest du in deinem WebUntis-Konto unter <strong>Einstellungen → API-Zugang</strong>.</div>
        </div>
        <div id="untis-classes-list"></div>
      </div>

      <div id="tab-push" style="display:none;" class="m3-card">
        <div style="font-weight:700;margin-bottom:12px;">Push-Benachrichtigung senden</div>
        <input class="m3-input" id="push-title" placeholder="Titel">
        <textarea class="m3-input" id="push-body" placeholder="Nachricht" rows="3" style="resize:none;height:auto;"></textarea>
        <select class="m3-select" id="push-target">
          <option value="class">Meine Klasse</option>
          <option value="all">Alle</option>
        </select>
        <button class="m3-btn-full" onclick="sendAdminPush()">Senden</button>
      </div>

    </div>
  </div>
</div>

<script>
let adminUsers=[], adminClasses=[], adminSubjects=[], adminMe=null;

async function init_admin() {
  adminMe = await API.me().catch(()=>null);
  if (!adminMe) return;
  const isSuperAdmin = adminMe.role === 'super_admin';
  document.getElementById('admin-role-badge').textContent = isSuperAdmin ? 'Super-Admin' : 'Admin';

  const tasks = [
    API.classUsers().catch(()=>[]),
    API.classes().catch(()=>[]),
    API.subjects().catch(()=>[]),
  ];
  if (isSuperAdmin) tasks[0] = API.users().catch(()=>[]);
  [adminUsers, adminClasses, adminSubjects] = await Promise.all(tasks);

  if (isSuperAdmin) {
    const stats = await API.adminStats().catch(()=>({users:0,classes:0}));
    document.getElementById('admin-stats-row').innerHTML = `
      <div class="m3-card-tonal" style="background:#eaddff;color:#21005d;text-align:center;">
        <div style="font-size:1.8rem;font-weight:700;">${stats.users}</div>
        <div style="font-size:0.8rem;opacity:0.7;">Nutzer</div>
      </div>
      <div class="m3-card-tonal" style="background:#c4eed0;color:#072711;text-align:center;">
        <div style="font-size:1.8rem;font-weight:700;">${stats.classes}</div>
        <div style="font-size:0.8rem;opacity:0.7;">Klassen</div>
      </div>`;
  }

  renderAdminUsers();
  renderAdminClasses();
  renderAdminSubjects();
}

function adminTab(tab, btn) {
  ['users','classes','subjects','untis','push'].forEach(t => {
    document.getElementById('tab-'+t).style.display = t===tab?'block':'none';
  });
  document.querySelectorAll('#page-admin .admin-tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if (tab === 'untis') renderUntisTab();
}

async function renderUntisTab() {
  const list = document.getElementById('untis-classes-list');
  if (!adminClasses.length) {
    list.innerHTML = '<div class="m3-card" style="opacity:0.5;text-align:center;">Keine Klassen vorhanden</div>';
    return;
  }
  list.innerHTML = adminClasses.map(c => `
    <div class="m3-card" style="margin-bottom:10px;">
      <div style="display:flex;align-items:center;gap:14px;">
        <div style="width:44px;height:44px;background:#ffdec1;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <i data-lucide="calendar-days" style="width:20px;height:20px;color:#442b00;"></i>
        </div>
        <div style="flex:1;">
          <div style="font-weight:700;">${c.name}</div>
          <div style="font-size:0.75rem;opacity:0.5;" id="untis-status-${c.id}">Status wird geladen…</div>
        </div>
        <button onclick="openUntisSheet(${c.id})" style="background:#ffdec1;color:#442b00;border:none;border-radius:14px;padding:10px 16px;font-size:0.82rem;font-weight:700;cursor:pointer;font-family:inherit;">
          Konfigurieren
        </button>
      </div>
    </div>`).join('');
  lucide.createIcons();
  // Load status for each class
  for (const c of adminClasses) {
    API.getUntis(c.id).then(d => {
      const el = document.getElementById('untis-status-' + c.id);
      if (!el) return;
      if (d && d.url) {
        el.innerHTML = '<span style="color:#146c2e;font-weight:600;">✓ Konfiguriert</span> · ' + d.url;
      } else {
        el.innerHTML = '<span style="color:#b3261e;">Nicht konfiguriert</span>';
      }
    }).catch(() => {
      const el = document.getElementById('untis-status-' + c.id);
      if (el) el.innerHTML = '<span style="color:#b3261e;">Nicht konfiguriert</span>';
    });
  }
}

function renderAdminUsers() {
  const roleLabel = { student:'Schüler', admin:'Admin', super_admin:'Super-Admin' };
  const classMap = Object.fromEntries(adminClasses.map(c=>[c.id,c]));
  document.getElementById('admin-users-list').innerHTML = adminUsers.map(u => `
    <div class="m3-card" style="padding:14px;margin-bottom:8px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="avatar" style="background:#6750a4;">${(u.display_name||u.email).slice(0,2).toUpperCase()}</div>
        <div style="flex:1;">
          <div style="font-weight:600;">${u.display_name||u.email.split('@')[0]}</div>
          <div style="font-size:0.75rem;opacity:0.6;">${u.email}</div>
          <div style="font-size:0.72rem;margin-top:4px;display:flex;gap:6px;">
            <span style="background:#eaddff;color:#21005d;padding:2px 8px;border-radius:8px;">${roleLabel[u.role]||u.role}</span>
            ${u.class_id?`<span style="background:#d3e3fd;color:#041e49;padding:2px 8px;border-radius:8px;">${classMap[u.class_id]?.name||'?'}</span>`:''}
          </div>
        </div>
        <button onclick="openEditUserSheet(${u.id})" style="background:#f3edf7;border:none;border-radius:12px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;">
          <i data-lucide="edit-2" style="width:16px;height:16px;"></i>
        </button>
      </div>
    </div>`).join('');
  lucide.createIcons();
}

function renderAdminClasses() {
  document.getElementById('admin-classes-list').innerHTML = adminClasses.map(c => `
    <div class="m3-card" style="padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;">
      <div style="background:#eaddff;border-radius:14px;padding:10px;"><i data-lucide="users" style="width:20px;height:20px;color:#21005d;"></i></div>
      <div style="flex:1;font-weight:600;">${c.name}</div>
      <button onclick="openUntisSheet(${c.id})" style="background:#ffdec1;border:none;border-radius:12px;padding:8px 12px;font-size:0.78rem;font-weight:600;cursor:pointer;font-family:inherit;">Untis</button>
      <button onclick="deleteClass(${c.id})" style="background:none;border:none;cursor:pointer;opacity:0.4;padding:4px;"><i data-lucide="trash-2" style="width:16px;height:16px;"></i></button>
    </div>`).join('');
  lucide.createIcons();
}

function renderAdminSubjects() {
  document.getElementById('admin-subjects-list').innerHTML = adminSubjects.map(s => `
    <div class="m3-card" style="padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;">
      <div style="width:16px;height:16px;border-radius:50%;background:${s.color||'#6750a4'};flex-shrink:0;"></div>
      <div style="flex:1;font-weight:600;">${s.name}${s.short_name?` <span style="opacity:0.5;font-size:0.8rem;">(${s.short_name})</span>`:''}</div>
      ${s.is_global?'<span style="background:#c4eed0;color:#072711;padding:3px 8px;border-radius:8px;font-size:0.72rem;font-weight:600;">Global</span>':''}
      <button onclick="deleteSubject(${s.id})" style="background:none;border:none;cursor:pointer;opacity:0.4;padding:4px;"><i data-lucide="trash-2" style="width:16px;height:16px;"></i></button>
    </div>`).join('');
  lucide.createIcons();
}

function openNewUserSheet() {
  openSheet(`
    <div class="sheet-title">Neuer Nutzer</div>
    <input class="m3-input" id="nu-email" type="email" placeholder="E-Mail-Adresse" autocomplete="off">
    <input class="m3-input" id="nu-name" placeholder="Anzeigename (optional)">
    <select class="m3-select" id="nu-role">
      <option value="student">Schüler</option>
      <option value="admin">Admin</option>
      <option value="super_admin">Super-Admin</option>
    </select>
    <select class="m3-select" id="nu-class">
      <option value="">Keine Klasse</option>
      ${adminClasses.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}
    </select>
    <div id="nu-err" style="color:#b3261e;font-size:0.82rem;min-height:18px;margin-bottom:8px;"></div>
    <button class="m3-btn-full" onclick="submitNewUser()">Erstellen</button>
  `);
}

async function submitNewUser() {
  const email = document.getElementById('nu-email').value.trim().toLowerCase();
  const name = document.getElementById('nu-name').value.trim();
  const role = document.getElementById('nu-role').value;
  const classId = parseInt(document.getElementById('nu-class').value) || null;
  const err = document.getElementById('nu-err');
  if (!email || !email.includes('@')) { err.textContent = 'Gültige E-Mail eingeben'; return; }
  try {
    const user = await API.createUser({ email, display_name: name || null, role, class_id: classId });
    adminUsers.push(user);
    closeSheet();
    renderAdminUsers();
    showToast('Nutzer erstellt');
  } catch(e) {
    err.textContent = e.detail || 'Fehler beim Erstellen';
  }
}

function openEditUserSheet(uid) {
  const u = adminUsers.find(x=>x.id===uid);
  if (!u) return;
  openSheet(`
    <div class="sheet-title">Nutzer bearbeiten</div>
    <div style="font-size:0.82rem;color:#79747e;margin-bottom:14px;padding:10px 14px;background:#f3edf7;border-radius:12px;">${u.email}</div>
    <input class="m3-input" id="eu-name" placeholder="Anzeigename" value="${u.display_name||''}">
    <select class="m3-select" id="eu-role">
      <option value="student"${u.role==='student'?' selected':''}>Schüler</option>
      <option value="admin"${u.role==='admin'?' selected':''}>Admin</option>
      <option value="super_admin"${u.role==='super_admin'?' selected':''}>Super-Admin</option>
    </select>
    <select class="m3-select" id="eu-class">
      <option value="">Keine Klasse</option>
      ${adminClasses.map(c=>`<option value="${c.id}"${u.class_id===c.id?' selected':''}>${c.name}</option>`).join('')}
    </select>
    <button class="m3-btn-full" onclick="saveUser(${uid})">Speichern</button>
  `);
}

async function saveUser(uid) {
  const data = {
    display_name: document.getElementById('eu-name').value.trim() || null,
    role: document.getElementById('eu-role').value,
    class_id: parseInt(document.getElementById('eu-class').value) || null,
  };
  await API.updateUser(uid, data).catch(()=>{ showToast('Fehler'); return; });
  const idx = adminUsers.findIndex(u=>u.id===uid);
  if (idx>=0) Object.assign(adminUsers[idx], data);
  closeSheet();
  renderAdminUsers();
  showToast('Gespeichert');
}

function openNewClassSheet() {
  openSheet(`
    <div class="sheet-title">Neue Klasse</div>
    <input class="m3-input" id="nc-name" placeholder="Klassenname (z.B. 10a)">
    <button class="m3-btn-full" onclick="createClass()">Erstellen</button>
  `);
}

async function createClass() {
  const name = document.getElementById('nc-name').value.trim();
  if (!name) return;
  const cls = await API.createClass({ name }).catch(()=>null);
  if (!cls) { showToast('Fehler'); return; }
  adminClasses.push(cls);
  closeSheet();
  renderAdminClasses();
  showToast('Klasse erstellt');
}

async function deleteClass(id) {
  if (!confirm('Klasse wirklich löschen?')) return;
  await API.deleteClass(id).catch(()=>{ showToast('Fehler'); return; });
  adminClasses = adminClasses.filter(c=>c.id!==id);
  renderAdminClasses();
  showToast('Gelöscht');
}

function openUntisSheet(classId) {
  openSheet(`
    <div class="sheet-title">Untis-Zugangsdaten</div>
    <input class="m3-input" id="ut-url" placeholder="Server-URL (z.B. https://niobe.webuntis.com)" autocomplete="off">
    <input class="m3-input" id="ut-school" placeholder="Schulkürzel" autocomplete="off">
    <input class="m3-input" id="ut-class" placeholder="Klasse (z.B. 10a)" autocomplete="off">
    <input class="m3-input" id="ut-user" placeholder="Benutzername" autocomplete="off">
    <input class="m3-input" id="ut-pass" type="password" placeholder="Passwort" autocomplete="new-password">
    <button class="m3-btn-full" onclick="saveUntis(${classId})">Speichern</button>
  `);
}

async function saveUntis(classId) {
  const data = {
    url: document.getElementById('ut-url').value.trim(),
    school: document.getElementById('ut-school').value.trim(),
    class_name: document.getElementById('ut-class').value.trim(),
    username: document.getElementById('ut-user').value.trim(),
    password: document.getElementById('ut-pass').value,
  };
  await API.saveUntis(classId, data).catch(()=>{ showToast('Fehler'); return; });
  closeSheet();
  showToast('Untis-Daten gespeichert');
}

function openNewSubjectSheet() {
  openSheet(`
    <div class="sheet-title">Neues Fach</div>
    <input class="m3-input" id="ns-name" placeholder="Name (z.B. Mathematik)">
    <input class="m3-input" id="ns-short" placeholder="Kürzel (z.B. M)">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
      <label style="font-size:0.9rem;color:#49454f;flex:1;">Farbe</label>
      <input type="color" id="ns-color" value="#6750a4" style="width:48px;height:40px;border:none;border-radius:10px;cursor:pointer;padding:2px;background:#f3edf7;">
    </div>
    <label style="display:flex;align-items:center;gap:12px;margin-bottom:18px;cursor:pointer;padding:14px;background:#f3edf7;border-radius:14px;">
      <input type="checkbox" id="ns-global" style="width:18px;height:18px;accent-color:#6750a4;cursor:pointer;">
      <div>
        <div style="font-size:0.9rem;font-weight:600;color:#1c1b1f;">Globales Fach</div>
        <div style="font-size:0.78rem;color:#79747e;">Für alle Klassen sichtbar</div>
      </div>
    </label>
    <button class="m3-btn-full" onclick="createSubject()">Erstellen</button>
  `);
}

async function createSubject() {
  const data = {
    name: document.getElementById('ns-name').value.trim(),
    short_name: document.getElementById('ns-short').value.trim() || null,
    color: document.getElementById('ns-color').value,
    is_global: document.getElementById('ns-global').checked,
  };
  if (!data.name) return;
  const s = await API.createSubject(data).catch(()=>null);
  if (!s) { showToast('Fehler'); return; }
  adminSubjects.push(s);
  closeSheet();
  renderAdminSubjects();
  showToast('Fach erstellt');
}

async function deleteSubject(id) {
  await API.deleteSubject(id).catch(()=>{ showToast('Fehler'); return; });
  adminSubjects = adminSubjects.filter(s=>s.id!==id);
  renderAdminSubjects();
  showToast('Gelöscht');
}

async function sendAdminPush() {
  const title = document.getElementById('push-title').value.trim();
  const body = document.getElementById('push-body').value.trim();
  const target = document.getElementById('push-target').value;
  if (!title || !body) { showToast('Felder ausfüllen'); return; }
  const r = await API.sendPush({ title, body, target }).catch(()=>null);
  if (r) showToast(`Gesendet an ${r.sent} Gerät(e)`);
  else showToast('Fehler');
}
</script>
