<script>
document.getElementById('ph-calendar').outerHTML = pageHeader({
  className: 'cal-header-row',
  backClassName: 'cal-back-btn',
  titleHtml: `<div style="flex:1;min-width:0;position:relative;">
      <div id="cal-title-block" onclick="toggleCalMiniDrawer()" style="cursor:pointer;display:flex;align-items:center;gap:2px;">
        <div style="min-width:0;overflow:hidden;">
          <div style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;opacity:0.6;color:#6750a4;" id="cal-year-label"></div>
          <span class="page-title cal-month-title" style="color:#1c1b1f;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;" id="cal-month-title">Kalender</span>
        </div>
        <i data-lucide="chevron-down" id="cal-title-chevron" style="width:18px;height:18px;flex-shrink:0;opacity:0.5;transition:transform 0.2s ease;margin-top:9px;"></i>
      </div>
      <div id="cal-header-search-wrap" style="display:none;align-items:center;height:100%;width:100%;">
        <i data-lucide="search" style="width:18px;height:18px;opacity:0.45;flex-shrink:0;margin-right:8px;"></i>
        <input type="text" id="cal-header-search-input" placeholder="Termine durchsuchen..." autocomplete="off"
          style="flex:1;min-width:0;border:none;outline:none;background:none;font-family:inherit;font-size:1.05rem;font-weight:700;color:#1c1b1f;"
          oninput="onCalSearchInput(this.value)" onkeydown="if(event.key==='Escape')toggleCalHeaderSearch(false)">
        <button type="button" class="icon-btn cal-nav-btn" onclick="toggleCalHeaderSearch(false)" title="Suche schließen" style="flex-shrink:0;">
          <i data-lucide="x"></i>
        </button>
      </div>
    </div>`,
  trailing: `<div class="cal-nav-row" style="display:flex;align-items:center;flex-shrink:0;">
      <button onclick="calNav(-1)" class="icon-btn cal-nav-btn cal-period-nav" title="Zurück" id="cal-nav-prev"><i data-lucide="chevron-left"></i></button>
      <button onclick="calToday()" class="cal-today-btn" title="Heute" id="cal-today-btn"><span class="cal-today-num" id="cal-today-num"></span></button>
      <button onclick="calNav(1)" class="icon-btn cal-nav-btn cal-period-nav" title="Weiter" id="cal-nav-next"><i data-lucide="chevron-right"></i></button>
      <button type="button" id="cal-viewmode-btn" class="icon-btn cal-nav-btn" onclick="toggleCalViewPicker(this)" title="Ansicht">
        <i data-lucide="calendar-days" id="cal-viewmode-icon"></i>
        <span class="cal-view-label" id="cal-view-label">Monat</span>
      </button>
      <button type="button" id="cal-header-search-btn" class="icon-btn cal-nav-btn" onclick="toggleCalHeaderSearch()" title="Termine durchsuchen">
        <i data-lucide="search"></i>
      </button>
      <button type="button" id="cal-filter-btn" class="icon-btn cal-nav-btn" onclick="toggleCalFilterMenu(this)" title="Nach Kategorie filtern" style="position:relative;">
        <i data-lucide="filter"></i>
        <span id="cal-filter-dot" style="display:none;position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#6750a4;border:2px solid #f9f6fc;"></span>
      </button>
    </div>`
});
document.getElementById('cal-fab-slot').outerHTML = fab({
  onclick: 'openNewEventSheet()', title: 'Neuen Termin erstellen'
});

// Position search dropdown under the sticky page header
(function placeCalSearchDropdown() {
  const dd = document.getElementById('cal-search-dropdown');
  const page = document.getElementById('page-calendar');
  if (dd && page) {
    // Keep it as a direct child of the page so absolute positioning works relative to page
    page.style.position = page.style.position || 'relative';
  }
})();

const CAL_MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const CAL_MONTHS_SHORT = ['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sept.','Okt.','Nov.','Dez.'];
const CAL_MONTHS_PILL = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const CAL_WEEKDAY_SHORT = ['Mo','Di','Mi','Do','Fr','Sa','So'];

  { id: 'agenda', label: 'Terminübersicht', icon: 'list' },
  { id: 'day',    label: 'Tag',             icon: 'calendar-range' },
  { id: 'week',   label: 'Woche',           icon: 'calendar-days' },
  { id: 'month',  label: 'Monat',           icon: 'layout-grid' },
];

const CAL_TYPE_LABEL = { exam: 'Klassenarbeit', holiday: 'Schulferien', trip: 'Ausflug', personal: 'Persönlich', other: 'Sonstiges' };

  exam: 'rgba(186, 26, 26, 0.1)', holiday: 'rgba(138, 90, 0, 0.1)',
  trip: 'rgba(0, 109, 58, 0.1)', personal: 'rgba(0, 99, 153, 0.1)', other: 'rgba(103, 80, 164, 0.1)'
};

const CAL_WEEK_EVENT_DURATION_MIN = 60;

var calMonth = new Date().getMonth();

var calDisplayMode = 'month';
(function restoreCalMode() {
  try {
    const saved = localStorage.getItem('cal_display_mode');
    if (CAL_VIEW_MODES.some(m => m.id === saved)) calDisplayMode = saved;
    // Migrate old 'all' agenda-via-scope leftover — ignore unknown values
  } catch {}
})();

var calSearchQuery = '';
var calSearchPool = [];
var calSearchDebounce = null;
let calHeaderSearchOpen = false;
let calViewPickerEl = null;
let calFilterMenuEl = null;
let calPollInterval = null;

function calEventColors(ev) {
  return { bg: CAL_TYPE_SOLID[ev.event_type] || CAL_TYPE_SOLID.other, color: '#ffffff' };
}
function calTypeMeta(ev) {
  const t = ev.event_type || 'other';
  return {
    label: CAL_TYPE_LABEL[t] || CAL_TYPE_LABEL.other,
    color: CAL_TYPE_SOLID[t] || CAL_TYPE_SOLID.other,
    bg: CAL_TYPE_BG[t] || CAL_TYPE_BG.other,
  };
}
function _calMonday(d) {
  const day = (d.getDay() + 6) % 7;
  const r = new Date(d);
  r.setDate(r.getDate() - day);
  r.setHours(0, 0, 0, 0);
  return r;
}
function _calAddDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function _calToMin(hhmm) {
  const parts = (hhmm || '0:0').split(':').map(Number);
  return parts[0] * 60 + (parts[1] || 0);
}
function _calMonthsForRange(start, end) {
  const set = new Set();
  const cur = new Date(start.getFullYear(), start.getMonth(), 1);
  const last = new Date(end.getFullYear(), end.getMonth(), 1);
  while (cur <= last) {
    set.add(cur.getFullYear() + '-' + String(cur.getMonth() + 1).padStart(2, '0'));
    cur.setMonth(cur.getMonth() + 1);
  }
  return set;
}
function _calMonthsForWeek(anchor) {
  const monday = _calMonday(anchor);
  return _calMonthsForRange(monday, _calAddDays(monday, 6));
}
function eventCoversDate(ev, dateStr) {
  const start = ev.date ? ev.date.slice(0, 10) : '';
  const end = ev.end_date ? ev.end_date.slice(0, 10) : start;
  return dateStr >= start && dateStr <= end;
}
function calCanModifyEvent(ev) {
  if (!calCurrentUser) return false;
  if (ev.event_type === 'personal') return ev.created_by === calCurrentUser.id;
  return true;
}
function syncCalTodayBtn() {
  const el = document.getElementById('cal-today-num');

}

// ── Mini-month drawer ──
function toggleCalMiniDrawer() {
  if (calHeaderSearchOpen) return;
  calMiniOpen = !calMiniOpen;
  const drawer = document.getElementById('cal-mini-drawer');
  const chevron = document.getElementById('cal-title-chevron');
  if (!drawer) return;
  if (calMiniOpen) {
    calMiniYear = calYear;
    calMiniMonth = calMonth;
    drawer.hidden = false;
    renderCalMiniDrawer();
    if (chevron) chevron.style.transform = 'rotate(180deg)';
  } else {
    drawer.hidden = true;
    if (chevron) chevron.style.transform = '';
  }
}
function closeCalMiniDrawer() {
  if (!calMiniOpen) return;
  calMiniOpen = false;
  const drawer = document.getElementById('cal-mini-drawer');
  const chevron = document.getElementById('cal-title-chevron');
  if (drawer) drawer.hidden = true;
  if (chevron) chevron.style.transform = '';
}
function renderCalMiniDrawer() {
  const pills = document.getElementById('cal-month-pills');
  const grid = document.getElementById('cal-mini-grid');
  if (!pills || !grid) return;

  // Show a year of pills centered on the current mini month
  let html = '';
  for (let m = 0; m < 12; m++) {
    const active = m === calMiniMonth;
    html += `<button type="button" class="cal-month-pill${active ? ' active' : ''}" onclick="calMiniPickMonth(${m})">${CAL_MONTHS_PILL[m]}</button>`;
  }
  pills.innerHTML = html;
  // Scroll active pill into view
  const activePill = pills.querySelector('.active');
  if (activePill) activePill.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'auto' });

  const first = new Date(calMiniYear, calMiniMonth, 1);
  const startDay = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(calMiniYear, calMiniMonth + 1, 0).getDate();
  const prevDays = new Date(calMiniYear, calMiniMonth, 0).getDate();
  const todayStr = localDateStr();
  const sel = selectedCalDate || localDateStr(calWeekAnchor);

  let cells = '';
  for (let i = startDay - 1; i >= 0; i--) {
    const d = prevDays - i;
    const pm = calMiniMonth === 0 ? 11 : calMiniMonth - 1;
    const py = calMiniMonth === 0 ? calMiniYear - 1 : calMiniYear;
    const ds = py + '-' + String(pm + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    cells += `<button type="button" class="cal-mini-cell muted" onclick="calMiniPickDay('${ds}')">${d}</button>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = calMiniYear + '-' + String(calMiniMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const has = calEvents.some(e => eventCoversDate(e, ds) && (activeCategoryFilter === 'all' || (e.event_type || 'other') === activeCategoryFilter));
    let cls = 'cal-mini-cell';
    if (ds === todayStr) cls += ' today';
    if (ds === sel) cls += ' selected';
    cells += `<button type="button" class="${cls}" onclick="calMiniPickDay('${ds}')">${d}${has ? '<span class="cal-mini-dot"></span>' : ''}</button>`;
  }
  // trailing to fill 6 rows max not required — stop at natural end
  const totalSoFar = startDay + daysInMonth;
  const rem = (7 - (totalSoFar % 7)) % 7;
  for (let d = 1; d <= rem; d++) {
    const nm = calMiniMonth === 11 ? 0 : calMiniMonth + 1;
    const ny = calMiniMonth === 11 ? calMiniYear + 1 : calMiniYear;
    const ds = ny + '-' + String(nm + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    cells += `<button type="button" class="cal-mini-cell muted" onclick="calMiniPickDay('${ds}')">${d}</button>`;
  }
  grid.innerHTML = cells;
}
async function calMiniPickMonth(m) {
  calMiniMonth = m;
  // Jump main calendar to that month too
  calMonth = m;
  calYear = calMiniYear;
  calWeekAnchor = new Date(calYear, calMonth, Math.min(calWeekAnchor.getDate(), 28));
  await loadCalEvents();
  renderCalMiniDrawer();
  renderCal();
}
async function calMiniPickDay(dateStr) {
  const d = new Date(dateStr + 'T00:00');
  calYear = d.getFullYear();
  calMonth = d.getMonth();
  calWeekAnchor = d;
  selectedCalDate = dateStr;
  closeCalMiniDrawer();
  // Day pick → day view (mock parity)
  await setCalDisplayMode('day', { skipReload: false, anchor: d });
}

// ── View picker ──
function toggleCalViewPicker(btn) {
  if (calViewPickerEl) { closeCalViewPicker(); return; }
  closeCalFilterMenu();
  const panel = document.createElement('div');
  panel.className = 'm3-dropdown-panel dd-open';
  panel.innerHTML = CAL_VIEW_MODES.map(m =>
    `<div class="m3-dropdown-opt${m.id === calDisplayMode ? ' dd-sel' : ''}" data-mode="${m.id}">
      <i data-lucide="${m.icon}" style="width:16px;height:16px;margin-right:8px;vertical-align:-3px;"></i>${m.label}
    </div>`
  ).join('');
  document.body.appendChild(panel);
  calViewPickerEl = panel;
  if (window.lucide) lucide.createIcons();

  const r = btn.getBoundingClientRect();
  panel.style.minWidth = '200px';
  panel.style.left = 'auto';
  panel.style.right = (window.innerWidth - r.right) + 'px';
  panel.style.top = (r.bottom + 6) + 'px';

  panel.querySelectorAll('[data-mode]').forEach(opt => {

      setCalDisplayMode(opt.dataset.mode);
      closeCalViewPicker();
    });

  setTimeout(() => document.addEventListener('click', onCalViewPickerOutside), 0);

function onCalViewPickerOutside(e) {
  if (calViewPickerEl && !calViewPickerEl.contains(e.target) && !e.target.closest('#cal-viewmode-btn')) {
    closeCalViewPicker();
  }
}
function closeCalViewPicker() {
  if (calViewPickerEl) { calViewPickerEl.remove(); calViewPickerEl = null; }
  document.removeEventListener('click', onCalViewPickerOutside);
}

async function setCalDisplayMode(mode, opts = {}) {
  if (!CAL_VIEW_MODES.some(m => m.id === mode)) return;
  const prev = calDisplayMode;
  calDisplayMode = mode;
  try { localStorage.setItem('cal_display_mode', mode); } catch {}
  closeCalMiniDrawer();

  if (opts.anchor) calWeekAnchor = opts.anchor;
  else if (mode === 'day' || mode === 'week') {
    if (selectedCalDate) calWeekAnchor = new Date(selectedCalDate + 'T00:00');
    else if (prev === 'month') calWeekAnchor = new Date(calYear, calMonth, Math.min(new Date().getDate(), 28));
  }
  if (mode === 'month' || mode === 'agenda') {
    calYear = calWeekAnchor.getFullYear();
    calMonth = calWeekAnchor.getMonth();
  }
  if (mode === 'day') selectedCalDate = localDateStr(calWeekAnchor);

  if (!opts.skipReload) await loadCalEvents();
  renderCal();
}

// ── Search ──
async function onCalSearchInput(value) {
  const q = value.trim();
  const startingSearch = q && !calSearchQuery;
  calSearchQuery = q;
  clearTimeout(calSearchDebounce);

  if (startingSearch) {
    calSearchPool = await API.events().catch(() => []);
  }
  calSearchDebounce = setTimeout(() => renderCalSearchDropdown(), startingSearch ? 0 : 120);
}
function renderCalSearchDropdown() {
  const dd = document.getElementById('cal-search-dropdown');
  if (!dd) return;
  if (!calSearchQuery) {
    dd.hidden = true;
    dd.innerHTML = '';
    return;
  }
  const q = calSearchQuery.toLowerCase();
  let hits = calSearchPool.filter(e =>
    (e.title || '').toLowerCase().includes(q) || (e.description || '').toLowerCase().includes(q)
  );
  if (activeCategoryFilter !== 'all') {
    hits = hits.filter(e => (e.event_type || 'other') === activeCategoryFilter);
  }
  hits.sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.time || '').localeCompare(b.time || ''));
  hits = hits.slice(0, 12);

  // Position under header
  const header = document.querySelector('#page-calendar .page-header');
  if (header) {
    const hr = header.getBoundingClientRect();
    const page = document.getElementById('page-calendar');
    const pr = page.getBoundingClientRect();
    dd.style.top = (hr.bottom - pr.top + 4) + 'px';
    dd.style.left = '16px';
    dd.style.right = '16px';
  }

  if (!hits.length) {
    dd.innerHTML = `<div class="cal-search-empty">Kein Termin passt zu „${escapeHtml(calSearchQuery)}“.</div>`;
  } else {
    dd.innerHTML = hits.map(e => {
      const d = e.date ? new Date(e.date + 'T00:00').toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
      const meta = [d, e.time ? e.time + ' Uhr' : null].filter(Boolean).join(' · ');
      return `<button type="button" class="cal-search-hit" onclick="onCalSearchHit(${e.id})">
        <div style="width:8px;height:8px;border-radius:50%;background:${calEventColors(e).bg};flex-shrink:0;"></div>
        <div style="min-width:0;flex:1;">
          <div class="cal-search-hit-title">${escapeHtml(e.title)}</div>
          <div class="cal-search-hit-meta">${escapeHtml(meta)}</div>
        </div>
      </button>`;
    }).join('');
  }
  dd.hidden = false;
}
async function onCalSearchHit(id) {
  // Prefer opening detail; also jump agenda to that date so context is clear
  const pool = calSearchPool.length ? calSearchPool : calEvents;
  const ev = pool.find(e => e.id === id);
  toggleCalHeaderSearch(false);
  if (ev && ev.date) {
    const d = new Date(ev.date.slice(0, 10) + 'T00:00');
    calWeekAnchor = d;
    calYear = d.getFullYear();
    calMonth = d.getMonth();
    selectedCalDate = ev.date.slice(0, 10);
    // Keep current view unless in month — jump to agenda for list context feels natural for search
    if (calDisplayMode === 'month') await setCalDisplayMode('agenda');
    else { await loadCalEvents(); renderCal(); }
  }
  openCalEventDetail(id, pool);
}
function clearCalSearch() {
  calSearchQuery = '';
  const input = document.getElementById('cal-header-search-input');
  if (input) input.value = '';
  const dd = document.getElementById('cal-search-dropdown');
  if (dd) { dd.hidden = true; dd.innerHTML = ''; }
}
function toggleCalHeaderSearch(force) {
  calHeaderSearchOpen = typeof force === 'boolean' ? force : !calHeaderSearchOpen;
  const titleBlock = document.getElementById('cal-title-block');
  const searchWrap = document.getElementById('cal-header-search-wrap');
  const input = document.getElementById('cal-header-search-input');
  const searchBtn = document.getElementById('cal-header-search-btn');
  closeCalMiniDrawer();
  closeCalViewPicker();
  if (calHeaderSearchOpen) {
    if (titleBlock) titleBlock.style.display = 'none';
    if (searchWrap) searchWrap.style.display = 'flex';
    if (searchBtn) searchBtn.style.display = 'none';
    if (input) { input.value = calSearchQuery; input.focus(); }
    if (calSearchQuery) renderCalSearchDropdown();
  } else {
    if (titleBlock) titleBlock.style.display = 'flex';
    if (searchWrap) searchWrap.style.display = 'none';
    if (searchBtn) searchBtn.style.display = '';
    clearCalSearch();
  }
  if (window.lucide) lucide.createIcons();
}

// ── Init / polling / swipe ──
async function init_calendar() {
  syncCalTodayBtn();
  const [, , me] = await Promise.all([
    loadCalEvents(),
    loadCalSubjects(),
    API.me().catch(() => null),
  ]);
  calCurrentUser = me;
  if (!selectedCalDate) {
    const t = new Date();
    if (calDisplayMode === 'day' || (t.getFullYear() === calYear && t.getMonth() === calMonth)) {
      selectedCalDate = localDateStr(t);
      calWeekAnchor = t;
    }
  }
  const dot = document.getElementById('cal-filter-dot');
  if (dot) dot.style.display = activeCategoryFilter !== 'all' ? 'block' : 'none';
  renderCal();
  initCalSwipe();
  startCalPolling();
}

function startCalPolling() {
  if (calPollInterval) clearInterval(calPollInterval);
  calPollInterval = setInterval(async () => {
    if (!document.getElementById('page-calendar')) { clearInterval(calPollInterval); calPollInterval = null; return; }
    if (document.hidden) return;
    let fresh;
    try {
      fresh = await _fetchCalEventsForMode();
    } catch { return; }
    if (!fresh || !document.getElementById('page-calendar')) return;
    if (JSON.stringify(fresh) !== JSON.stringify(calEvents)) {
      calEvents = fresh;
      renderCal();
    }
  }, 15000);
}

function initCalSwipe() {
  const targets = [
    document.getElementById('cal-view-month'),
    document.getElementById('cal-view-time'),
    document.getElementById('cal-view-agenda'),
  ].filter(Boolean);
  targets.forEach(el => {
    let startX = null, startY = null;
    el.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, { passive: true });
    el.addEventListener('touchend', (e) => {
      if (startX == null) return;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      startX = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        calNav(dx < 0 ? 1 : -1);
      }
    }, { passive: true });
  });
}

async function loadCalSubjects() {
  try { calSubjects = await API.subjects(); }
  catch { calSubjects = []; }
}

async function _fetchCalEventsForMode() {
  if (calDisplayMode === 'week') {
    const months = _calMonthsForWeek(calWeekAnchor);
    const results = await Promise.all([...months].map(m => API.events(m).catch(() => [])));
    const merged = new Map();
    results.flat().forEach(e => merged.set(e.id, e));
    return [...merged.values()];
  }
  if (calDisplayMode === 'day') {
    const ds = localDateStr(calWeekAnchor);
    const m = ds.slice(0, 7);
    return await API.events(m);
  }
  // month + agenda (±1 month scope)
  const key = calYear + '-' + String(calMonth + 1).padStart(2, '0');
  return await API.events(key);
}

async function loadCalEvents() {
  try { calEvents = await _fetchCalEventsForMode(); }
  catch { calEvents = []; }
}

function setCalCategoryFilter(cat) {
  activeCategoryFilter = cat;
  const dot = document.getElementById('cal-filter-dot');
  if (dot) dot.style.display = cat === 'all' ? 'none' : 'block';
  renderCal();
}

// ── Navigation ──
async function calToday() {
  const today = new Date();
  calYear = today.getFullYear();
  calMonth = today.getMonth();
  calWeekAnchor = today;
  selectedCalDate = localDateStr(today);
  syncCalTodayBtn();
  closeCalMiniDrawer();
  await loadCalEvents();
  renderCal();
}
async function goToToday() { return calToday(); }

async function calNav(dir) {
  return navigatePeriod(dir);
}
async function navigatePeriod(dir) {
  closeCalMiniDrawer();
  if (calDisplayMode === 'week') {
    calWeekAnchor = _calAddDays(calWeekAnchor, dir * 7);
    calYear = calWeekAnchor.getFullYear();
    calMonth = calWeekAnchor.getMonth();
  } else if (calDisplayMode === 'day') {
    calWeekAnchor = _calAddDays(calWeekAnchor, dir);
    calYear = calWeekAnchor.getFullYear();
    calMonth = calWeekAnchor.getMonth();
    selectedCalDate = localDateStr(calWeekAnchor);
  } else {
    // month + agenda: ±1 month
    calMonth += dir;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    if (calMonth > 11) { calMonth = 0; calYear++; }
    calWeekAnchor = new Date(calYear, calMonth, Math.min(calWeekAnchor.getDate(), 28));
    if (calDisplayMode === 'month') selectedCalDate = null;
  }
  await loadCalEvents();
  renderCal(dir);
}

// ── Render orchestration ──
function renderCal(dir) {
  syncCalTodayBtn();
  const modeMeta = CAL_VIEW_MODES.find(m => m.id === calDisplayMode) || CAL_VIEW_MODES[3];
  const viewIcon = document.getElementById('cal-viewmode-icon');
  const viewLabel = document.getElementById('cal-view-label');
  const viewBtn = document.getElementById('cal-viewmode-btn');
  if (viewIcon) viewIcon.setAttribute('data-lucide', modeMeta.icon);
  if (viewLabel) viewLabel.textContent = modeMeta.label;
  if (viewBtn) viewBtn.title = 'Ansicht: ' + modeMeta.label;

  const monthEl = document.getElementById('cal-view-month');
  const timeEl = document.getElementById('cal-view-time');
  const agendaEl = document.getElementById('cal-view-agenda');

  const showMonth = calDisplayMode === 'month';
  const showTime = calDisplayMode === 'week' || calDisplayMode === 'day';
  const showAgenda = calDisplayMode === 'agenda';

  if (monthEl) monthEl.style.display = showMonth ? '' : 'none';
  if (timeEl) timeEl.style.display = showTime ? 'block' : 'none';
  if (agendaEl) agendaEl.style.display = showAgenda ? '' : 'none';

  // Title
  if (calDisplayMode === 'week') {
    const monday = _calMonday(calWeekAnchor);
    const sunday = _calAddDays(monday, 6);
    document.getElementById('cal-month-title').textContent = monday.getMonth() === sunday.getMonth()
      ? `${monday.getDate()}. – ${sunday.getDate()}. ${CAL_MONTHS_SHORT[monday.getMonth()]}`
      : `${monday.getDate()}. ${CAL_MONTHS_SHORT[monday.getMonth()]} – ${sunday.getDate()}. ${CAL_MONTHS_SHORT[sunday.getMonth()]}`;
    document.getElementById('cal-year-label').textContent = String(sunday.getFullYear());
  } else if (calDisplayMode === 'day') {
    const d = calWeekAnchor;
    document.getElementById('cal-month-title').textContent =
      d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
    document.getElementById('cal-year-label').textContent = String(d.getFullYear());
  } else if (calDisplayMode === 'agenda') {
    document.getElementById('cal-month-title').textContent = CAL_MONTHS[calMonth];
    document.getElementById('cal-year-label').textContent = 'Terminübersicht · ' + calYear;
  } else {
    document.getElementById('cal-month-title').textContent = CAL_MONTHS[calMonth];
    document.getElementById('cal-year-label').textContent = String(calYear);
  }

  if (showMonth) renderCalGridOnly(true, dir);
  if (showTime) renderCalTimeGrid(calDisplayMode === 'day' ? 1 : 7);
  if (showAgenda) renderAgendaList();

  if (calMiniOpen) renderCalMiniDrawer();
  if (window.lucide) lucide.createIcons();
}

function renderCalGridOnly(animate, dir) {
  const grid = document.getElementById('cal-grid');
  if (!grid) return;
  const build = () => { grid.innerHTML = ''; _buildCalGrid(grid); };
  if (dir) { slideNav(grid, dir, build); return; }
  if (animate) {
    grid.classList.remove('cal-grid-enter');
    void grid.offsetWidth;
    grid.classList.add('cal-grid-enter');
  }
  build();
}

function _buildCalGrid(grid) {
  const first = new Date(calYear, calMonth, 1);
  const startDay = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const prevDays = new Date(calYear, calMonth, 0).getDate();
  const todayStr = localDateStr();

  for (let i = startDay - 1; i >= 0; i--) {
    const d = document.createElement('div');
    d.className = 'cal-day muted';
    d.innerHTML = `<span class="cal-day-num">${prevDays - i}</span>`;
    grid.appendChild(d);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = calYear + '-' + String(calMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const covering = calEvents.filter(e =>
      eventCoversDate(e, dateStr) &&
      (activeCategoryFilter === 'all' || (e.event_type || 'other') === activeCategoryFilter)
    );
    const isToday = dateStr === todayStr;
    const isSelected = selectedCalDate === dateStr;

    const el = document.createElement('div');
    let cls = 'cal-day';
    if (isToday) cls += ' today';
    if (isSelected) cls += ' selected';
    el.className = cls;

    let barsHtml = '';
    if (covering.length) {
      const maxBars = 2;
      const barTags = covering.slice(0, maxBars).map(ev => {
        const { bg, color } = calEventColors(ev);
        return `<div class="cal-day-bar" style="background:${bg};color:${color};" title="${escapeHtml(ev.title)}" onclick="event.stopPropagation();openCalEventDetail(${ev.id})">${escapeHtml(ev.title)}</div>`;
      }).join('');
      const moreTag = covering.length > maxBars
        ? `<div class="cal-day-more">+${covering.length - maxBars} weitere</div>` : '';
      barsHtml = `<div class="cal-day-bars">${barTags}${moreTag}</div>`;
    }

    el.innerHTML = `<span class="cal-day-num">${d}</span>${barsHtml}`;
    // Day cell → Day view (mock parity)
    el.onclick = () => {
      selectedCalDate = dateStr;
      calWeekAnchor = new Date(dateStr + 'T00:00');
      setCalDisplayMode('day');
    };
    grid.appendChild(el);
  }
}

// Shared day/week time-grid. dayCount=1 → Tag, dayCount=7 → Woche.
function renderCalTimeGrid(dayCount) {
  const grid = document.getElementById('cal-week-grid');
  const alldayRow = document.getElementById('cal-week-allday-row');
  if (!grid || !alldayRow) return;

  const days = dayCount === 1
    ? [new Date(calWeekAnchor.getFullYear(), calWeekAnchor.getMonth(), calWeekAnchor.getDate())]
    : Array.from({ length: 7 }, (_, i) => _calAddDays(_calMonday(calWeekAnchor), i));
  const dayStrs = days.map(d => localDateStr(d));
  const todayStr = localDateStr();

  grid.classList.toggle('cal-days-1', dayCount === 1);
  alldayRow.classList.toggle('cal-days-1', dayCount === 1);

  const timedByDay = dayStrs.map(() => []);
  const alldayEvents = new Map();
  days.forEach((d, i) => {
    const ds = dayStrs[i];
    calEvents.forEach(ev => {
      if (!eventCoversDate(ev, ds)) return;
      if (activeCategoryFilter !== 'all' && (ev.event_type || 'other') !== activeCategoryFilter) return;
      const isMulti = Boolean(ev.end_date && ev.end_date !== ev.date);
      if (ev.time && !isMulti) timedByDay[i].push(ev);
      else alldayEvents.set(ev.id + '-' + ds, ev);
    });
  });

  alldayRow.innerHTML = alldayEvents.size ? '<div></div>' + days.map((d, i) => {
    const ds = dayStrs[i];
    return [...alldayEvents.values()].filter(ev => eventCoversDate(ev, ds)).map(ev => {
      const { bg, color } = calEventColors(ev);
      return `<div class="cal-week-allday-chip" style="background:${bg};color:${color};" onclick="openCalEventDetail(${ev.id})" title="${escapeHtml(ev.title)}">${escapeHtml(ev.title)}</div>`;
    }).join('');
  }).join('') : '';

  const allTimed = timedByDay.flat();
  // Prefer full 0–24 feel for day view; week keeps compact range like before
  let minStart, maxEnd;
  if (dayCount === 1) {
    minStart = 0;
    maxEnd = 24 * 60;
  } else {
    minStart = allTimed.length ? Math.min(...allTimed.map(e => _calToMin(e.time))) : 8 * 60;
    maxEnd = allTimed.length ? Math.max(...allTimed.map(e => _calToMin(e.time) + CAL_WEEK_EVENT_DURATION_MIN)) : 16 * 60;
    minStart = Math.floor(minStart / 60) * 60;
    maxEnd = Math.max(Math.ceil(maxEnd / 60) * 60, minStart + 60);
  }
  const gridHeight = (maxEnd - minStart) * CAL_WEEK_PX_PER_MIN;

  let hourLines = '';
  for (let m = minStart; m < maxEnd; m += 60) {
    hourLines += `<div class="cal-week-hourline" style="top:${(m - minStart) * CAL_WEEK_PX_PER_MIN}px;"></div>`;
  }

  let axisHtml = `<div style="position:relative;height:${gridHeight}px;">`;
  for (let m = minStart; m < maxEnd; m += 60) {
    axisHtml += `<div class="cal-week-hour-label" style="top:${(m - minStart) * CAL_WEEK_PX_PER_MIN - 6}px;">${String(Math.floor(m / 60)).padStart(2,'0')}</div>`;
  }
  axisHtml += '</div>';

  const headerHtml = '<div></div>' + days.map((d, i) => {
    const isToday = dayStrs[i] === todayStr;
    const wd = CAL_WEEKDAY_SHORT[(d.getDay() + 6) % 7];
    return `<div class="cal-week-day-header${isToday ? ' is-today' : ''}">${wd} ${d.getDate()}.</div>`;
  }).join('');

  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();

  const colsHtml = days.map((d, i) => {
    const ds = dayStrs[i];
    const isToday = ds === todayStr;
    const blocks = timedByDay[i].map(ev => {
      const top = (_calToMin(ev.time) - minStart) * CAL_WEEK_PX_PER_MIN;
      const height = Math.max(CAL_WEEK_EVENT_DURATION_MIN * CAL_WEEK_PX_PER_MIN, CAL_WEEK_MIN_BLOCK_H);
      const { bg, color } = calEventColors(ev);
      return `<div class="cal-week-event-block" style="top:${top}px;height:${height}px;background:${bg};color:${color};" onclick="event.stopPropagation();openCalEventDetail(${ev.id})">`
        + `<span>${escapeHtml(ev.title)}</span>`
        + `<span class="cal-week-event-time">${ev.time} Uhr</span>`
        + `</div>`;
    }).join('');
    let nowLine = '';
    if (isToday && nowMin >= minStart && nowMin <= maxEnd) {
      nowLine = `<div class="cal-week-now-line" style="top:${(nowMin - minStart) * CAL_WEEK_PX_PER_MIN}px;"></div>`;
    }
    return `<div class="cal-week-day-col${isToday ? ' is-today' : ''}" style="height:${gridHeight}px;" data-date="${ds}" data-min-start="${minStart}" onclick="onCalSlotClick(event)">${hourLines}${blocks}${nowLine}</div>`;
  }).join('');

  grid.innerHTML = headerHtml + axisHtml + colsHtml;
}

function onCalSlotClick(e) {
  const col = e.currentTarget;
  const ds = col.dataset.date;
  const minStart = parseInt(col.dataset.minStart || '0', 10);
  const rect = col.getBoundingClientRect();
  const y = Math.max(0, e.clientY - rect.top);
  let minutes = minStart + Math.floor(y / CAL_WEEK_PX_PER_MIN);
  // Snap to 15 min
  minutes = Math.round(minutes / 15) * 15;
  minutes = Math.max(0, Math.min(23 * 60 + 45, minutes));
  const hh = String(Math.floor(minutes / 60)).padStart(2, '0');
  const mm = String(minutes % 60).padStart(2, '0');
  openNewEventSheet(ds, hh + ':' + mm);
}

// Legacy name kept so any leftover callers still work
function renderCalWeekView() { renderCalTimeGrid(calDisplayMode === 'day' ? 1 : 7); }

// ── Agenda ──
function renderAgendaList() {
  const list = document.getElementById('cal-events-list');
  const headerEl = document.getElementById('cal-events-header');
  const emptyEl = document.getElementById('cal-no-events');
  if (!list) return;

  const monthStart = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-01`;
  const lastDay = new Date(calYear, calMonth + 1, 0).getDate();
  const monthEnd = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;

  let pool = calEvents.filter(e => {
    const s = (e.date || '').slice(0, 10);
    const end = (e.end_date || s).slice(0, 10);
    return s <= monthEnd && end >= monthStart;
  });
  if (activeCategoryFilter !== 'all') {
    pool = pool.filter(e => (e.event_type || 'other') === activeCategoryFilter);
  }
  pool.sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.time || '').localeCompare(b.time || ''));

  headerEl.innerHTML = `
    <div class="cal-list-header">
      <div class="cal-list-header-label">Terminübersicht</div>
      <span class="cal-list-header-count">${pool.length} ${pool.length === 1 ? 'Eintrag' : 'Einträge'}</span>
    </div>`;

  if (!pool.length) {
    list.innerHTML = '';
    emptyEl.style.display = 'block';
    document.getElementById('cal-empty-title').textContent = 'Keine Termine';
    document.getElementById('cal-empty-sub').textContent = activeCategoryFilter === 'all'
      ? 'In diesem Monat stehen keine Termine an.'
      : 'Keine Termine in dieser Kategorie vorhanden.';
    return;
  }
  emptyEl.style.display = 'none';

  // Group by start date
  const groups = new Map();
  pool.forEach(e => {
    const key = (e.date || '').slice(0, 10);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(e);
  });

  const todayStr = localDateStr();
  const subMap = Object.fromEntries((calSubjects || []).map(s => [s.id, s]));

  list.innerHTML = [...groups.entries()].map(([dateKey, events]) => {
    const d = new Date(dateKey + 'T00:00');
    const groupTitle = d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
    const cards = events.map(e => renderCalEventCard(e, { todayStr, subMap, isPast: (e.end_date || e.date || '').slice(0, 10) < todayStr })).join('');
    return `<div class="cal-agenda-group"><div class="cal-agenda-group-title">${escapeHtml(groupTitle)}</div>${cards}</div>`;
  }).join('');
}

function renderCalEventCard(e, { todayStr, subMap, isPast }) {
  const isEvToday = eventCoversDate(e, todayStr);
  const isMulti = Boolean(e.end_date && e.end_date !== e.date);
  const canEdit = calCanModifyEvent(e);
  const sDate = new Date(e.date + 'T00:00');
  const dayNum = sDate.getDate();
  const weekday = sDate.toLocaleDateString('de-DE', { weekday: 'short' });
  let dayLabel = sDate.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' });
  if (isMulti) {
    const eDate = new Date(e.end_date + 'T00:00');
    dayLabel = `${sDate.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' })} – ${eDate.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' })}`;
  }
  const meta = calTypeMeta(e);
  const subObj = e.subject_id ? subMap[e.subject_id] : null;
  const subName = subObj ? (subObj.name || subObj.short_name) : null;
  const subColor = subObj ? (subObj.color || '#ede7f6') : null;
  const personalNote = e.event_type === 'personal'
    ? `<span class="cal-personal-note"><i data-lucide="lock"></i> Nur für dich</span>` : '';
  const subjectBadge = subName
    ? `<span class="cal-subject-badge" style="background:${subColor || '#ede7f6'};">${escapeHtml(subName)}</span>` : '';

  return `
    <div class="m3-card cal-event-card list-card-enter${isPast ? ' is-past' : ''}" data-id="${e.id}" onclick="openCalEventDetail(${e.id})">
      <div class="cal-event-body">
        <div class="ev-date-badge ${isEvToday ? 'is-today' : ''}">
          <span class="ev-date-num">${dayNum}</span>
          <span class="ev-date-wd">${weekday}</span>
        </div>
        <div class="cal-event-main">
          <div class="cal-event-tags">
            <span class="ev-category-pill" style="background:${meta.bg};color:${meta.color};">${meta.label}</span>
            ${subjectBadge}${personalNote}
          </div>
          <div class="cal-event-title">${escapeHtml(e.title)}</div>
          <div class="cal-event-meta">
            <i data-lucide="calendar"></i><span>${dayLabel}</span>
            ${e.time ? `<span style="opacity:0.4;">·</span><i data-lucide="clock"></i><span>${e.time} Uhr</span>` : ''}
          </div>
          ${e.description ? `<div class="cal-event-desc">${escapeHtml(e.description)}</div>` : ''}
        </div>
      </div>
      <div class="cal-event-actions" onclick="event.stopPropagation()">
        ${canEdit ? moreMenuBtn(`openCalEventMenu(this, ${e.id})`) : ''}
      </div>
    </div>`;
}

function openCalEventMenu(btn, eventId) {
  toggleMoreMenu(btn, [
    { icon: 'pencil', label: 'Bearbeiten', onclick: () => openEditEventSheet(eventId) },
    { icon: 'trash-2', label: 'Löschen', onclick: () => confirmDelEvent(eventId), danger: true },
  ]);
}

// ── Detail (view) modal — Edit/Delete from here if allowed ──
function openCalEventDetail(eventId, pool) {
  const src = pool || calEvents;
  let ev = src.find(x => x.id === eventId);
  if (!ev && calSearchPool.length) ev = calSearchPool.find(x => x.id === eventId);
  if (!ev) { showToast('Termin nicht gefunden'); return; }

  const meta = calTypeMeta(ev);
  const canEdit = calCanModifyEvent(ev);
  const sDate = new Date(ev.date + 'T00:00');
  let when = sDate.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  if (ev.end_date && ev.end_date !== ev.date) {
    const eDate = new Date(ev.end_date + 'T00:00');
    when = sDate.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' })
      + ' – ' + eDate.toLocaleDateString('de-DE', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  const subMap = Object.fromEntries((calSubjects || []).map(s => [s.id, s]));
  const subObj = ev.subject_id ? subMap[ev.subject_id] : null;

  openSheet(`
    <div class="sheet-title" style="font-size:1.25rem;font-weight:800;color:#1c1b1f;margin-bottom:6px;">${escapeHtml(ev.title)}</div>
    <div style="margin-bottom:16px;">
      <span class="ev-category-pill" style="background:${meta.bg};color:${meta.color};">${meta.label}</span>
      ${ev.event_type === 'personal' ? `<span class="cal-personal-note" style="margin-left:8px;"><i data-lucide="lock"></i> Nur für dich</span>` : ''}
    </div>
    <div class="cal-detail-row"><i data-lucide="calendar"></i><div>${escapeHtml(when)}</div></div>
    ${ev.time ? `<div class="cal-detail-row"><i data-lucide="clock"></i><div>${escapeHtml(ev.time)} Uhr</div></div>` : ''}
    ${subObj ? `<div class="cal-detail-row"><i data-lucide="book-open"></i><div>${escapeHtml(subObj.name || subObj.short_name || '')}</div></div>` : ''}
    ${ev.description ? `<div class="cal-detail-row"><i data-lucide="align-left"></i><div style="white-space:pre-wrap;line-height:1.45;">${escapeHtml(ev.description)}</div></div>` : ''}
    ${canEdit ? `
      <div class="cal-detail-actions">
        <button class="m3-btn-primary" style="flex:1;" onclick="closeSheet();openEditEventSheet(${ev.id})">
          <i data-lucide="pencil" style="width:16px;height:16px;"></i> Bearbeiten
        </button>
        <button class="m3-btn-outline" style="flex:1;color:#ba1a1a;border-color:rgba(186,26,26,0.35);" onclick="closeSheet();confirmDelEvent(${ev.id})">
          <i data-lucide="trash-2" style="width:16px;height:16px;"></i> Löschen
        </button>
      </div>` : ''}
  `);
}

async function saveEvent() {
  const title = document.getElementById('ev-title').value.trim();
  const date = document.getElementById('ev-date').value;
  if (!title || !date) { showToast('Titel und Datum erforderlich'); return; }
  const description = document.getElementById('ev-description').value.trim() || null;
  const isRange = document.getElementById('ev-mode-range')?.classList.contains('active');
  const endVal = document.getElementById('ev-end-date')?.value;
  const end_date = isRange && endVal && endVal >= date ? endVal : (isRange && endVal ? date : null);
  const event_type = document.getElementById('ev-type').value;
  const subEl = document.getElementById('ev-subject');
  const subject_id = (event_type === 'exam' && subEl && subEl.value) ? parseInt(subEl.value, 10) : null;
  const timeEl = document.getElementById('ev-time');
  const time = (timeEl && timeEl.value) ? timeEl.value : null;
  try {
    await API.createEvent({ title, description, date, end_date, time, event_type, subject_id });
    closeSheet();
    await loadCalEvents();
    renderCal();
    showToast('Termin gespeichert');
  } catch {
    showToast('Fehler beim Speichern');
  }
}

async function openEditEventSheet(eventId) {
  let ev = calEvents.find(x => x.id === eventId);
  if (!ev && calSearchPool.length) ev = calSearchPool.find(x => x.id === eventId);
  if (!ev) { showToast('Termin nicht gefunden'); return; }

  await loadCalSubjects();
  const isRange = Boolean(ev.end_date && ev.end_date !== ev.date);
  const subOpts = (calSubjects || []).map(s => {
    const sel = s.id === ev.subject_id ? 'selected' : '';
    return `<option value="${s.id}" ${sel}>${escapeHtml(s.name || s.short_name || '')}</option>`;
  }).join('');
  const typeOpts = [
    { value: 'other', label: 'Sonstiges' },
    { value: 'exam', label: 'Klassenarbeit' },
    { value: 'trip', label: 'Ausflug / Klassenfahrt' },
    { value: 'holiday', label: 'Ferien' },
    { value: 'personal', label: 'Persönlich (nur für dich sichtbar)' }
  ].map(t => `<option value="${t.value}" ${t.value === ev.event_type ? 'selected' : ''}>${t.label}</option>`).join('');
  const hasTime = Boolean(ev.time);
  const hasMore = isRange || hasTime;

  openSheet(`
    <div class="sheet-title" style="font-size:1.25rem;font-weight:800;color:#1c1b1f;margin-bottom:16px;">Termin bearbeiten</div>
    <div class="m3-field">
      <label class="m3-field-label">Titel des Termins:</label>
      <input class="m3-input" id="ev-title" placeholder="Titel" value="${escapeHtml(ev.title)}">
    </div>
    <div class="m3-field">
      <label class="m3-field-label">Beschreibung (optional):</label>
      <textarea class="m3-input" id="ev-description" rows="3" placeholder="Weitere Details zum Termin..." style="resize:none;height:auto;font-family:inherit;line-height:1.4;">${escapeHtml(ev.description || '')}</textarea>
    </div>
    <div class="m3-field" id="ev-start-date-wrap">
      <label id="ev-start-label" class="m3-field-label">${isRange ? 'Startdatum (Ab):' : 'Datum:'}</label>
      <input class="m3-input" id="ev-date" type="date" value="${ev.date}">
    </div>
    <div id="ev-end-date-wrap" class="m3-field" style="display:${isRange ? 'block' : 'none'};">
      <label class="m3-field-label">Enddatum (Bis einschließlich):</label>
      <input class="m3-input" id="ev-end-date" type="date" value="${ev.end_date || ev.date}">
    </div>
    <div class="m3-field">
      <label class="m3-field-label">Kategorie:</label>
      <select class="m3-select" id="ev-type">${typeOpts}</select>
    </div>
    <div id="ev-subject-row" class="m3-field" style="display:${ev.event_type === 'exam' ? 'block' : 'none'};">
      <label class="m3-field-label">Fach für die Klassenarbeit:</label>
      <select class="m3-select" id="ev-subject">
        <option value="">Fach auswählen (optional)</option>${subOpts}
      </select>
    </div>
    <div class="m3-field" id="ev-more-toggle-wrap" style="display:${hasMore ? 'none' : 'block'};">
      <button type="button" id="ev-more-toggle" class="m3-inline-toggle m3-more-toggle" onclick="toggleEventMore()">
        <span style="display:flex;align-items:center;gap:6px;"><i data-lucide="sliders-horizontal" style="width:16px;height:16px;"></i> Weitere Optionen</span>
        <i data-lucide="chevron-down" style="width:16px;height:16px;"></i>
      </button>
    </div>
    <div id="ev-more-wrap" style="display:${hasMore ? 'block' : 'none'};">
      <div class="m3-field">
        <label class="m3-field-label">Dauer:</label>
        <div class="ev-segmented-wrap">
          <button type="button" id="ev-mode-single" class="ev-seg-btn ${!isRange ? 'active' : ''}" onclick="setEventRangeMode(false)">
            <i data-lucide="calendar" style="width:16px;height:16px;"></i><span>Einzelner Tag</span>
          </button>
          <button type="button" id="ev-mode-range" class="ev-seg-btn ${isRange ? 'active' : ''}" onclick="setEventRangeMode(true)">
            <i data-lucide="calendar-range" style="width:16px;height:16px;"></i><span>Zeitraum (mehrere Tage)</span>
          </button>
        </div>
      </div>
      <div class="m3-field">
        <button type="button" id="ev-time-toggle" class="m3-inline-toggle" style="display:${hasTime ? 'none' : 'flex'};" onclick="toggleEventTime()">
          <i data-lucide="clock" style="width:16px;height:16px;"></i> + Uhrzeit hinzufügen (optional)
        </button>
        <div id="ev-time-wrap" style="display:${hasTime ? 'block' : 'none'};margin-top:6px;">
          <label class="m3-field-label">Uhrzeit:</label>
          <input class="m3-input" id="ev-time" type="time" placeholder="Uhrzeit (optional)" value="${ev.time || ''}">
        </div>
      </div>
    </div>
    ${sheetActions({ saveAction: `saveEditedEvent(${ev.id})` })}
  `);

  const typeEl = document.getElementById('ev-type');
  const subRow = document.getElementById('ev-subject-row');
  if (typeEl && subRow) {
    typeEl.addEventListener('change', () => {
      subRow.style.display = typeEl.value === 'exam' ? 'block' : 'none';
    });
  }
}

async function saveEditedEvent(eventId) {
  const title = document.getElementById('ev-title').value.trim();
  const date = document.getElementById('ev-date').value;
  if (!title || !date) { showToast('Titel und Datum erforderlich'); return; }
  const description = document.getElementById('ev-description').value.trim() || null;
  const isRange = document.getElementById('ev-mode-range')?.classList.contains('active');
  const endVal = document.getElementById('ev-end-date')?.value;
  const end_date = isRange && endVal && endVal >= date ? endVal : (isRange && endVal ? date : null);
  const event_type = document.getElementById('ev-type').value;
  const subEl = document.getElementById('ev-subject');
  const subject_id = (event_type === 'exam' && subEl && subEl.value) ? parseInt(subEl.value, 10) : null;
  const timeEl = document.getElementById('ev-time');
  const time = (timeEl && timeEl.value) ? timeEl.value : null;
  try {
    await API.updateEvent(eventId, { title, description, date, end_date, time, event_type, subject_id });
    closeSheet();
    await loadCalEvents();
    renderCal();
    showToast('Termin aktualisiert');
  } catch {
    showToast('Fehler beim Aktualisieren');
  }
}

function confirmDelEvent(eventId) {
  const ev = calEvents.find(x => x.id === eventId) || calSearchPool.find(x => x.id === eventId);
  const title = ev ? escapeHtml(ev.title) : 'diesen Termin';
  openModal(confirmDelete({
    title: 'Termin löschen?',
    message: `Willst du das wirklich löschen?<br><span style="font-weight:700;color:#1c1b1f;display:inline-block;margin-top:6px;">„${title}“</span>`,
    onConfirm: `doDelEvent(${eventId})`,
  }));
}

async function doDelEvent(eventId) {
  closeModal();
  animateCardRemoval(document.getElementById('cal-events-list'), eventId);
  try {
    await API.deleteEvent(eventId);
    calEvents = calEvents.filter(e => e.id !== eventId);
    calSearchPool = calSearchPool.filter(e => e.id !== eventId);
    showToast('Termin gelöscht');
  } catch {
    showToast('Fehler beim Löschen');
  }
  renderCal();
}

// Back-compat aliases used by older call sites / comments
function selectDay(dateStr) {
  selectedCalDate = dateStr;
  calWeekAnchor = new Date(dateStr + 'T00:00');
  setCalDisplayMode('day');
}
function toggleCalDisplayMode() { toggleCalViewPicker(document.getElementById('cal-viewmode-btn')); }
function renderEventList() { if (calDisplayMode === 'agenda') renderAgendaList(); }
function toggleCalMonthPanel() { toggleCalMiniDrawer(); }
</script>
