<div class="page" id="page-calendar" style="background:#f9f6fc;">
  <!-- Header -->
  <div class="page-header" style="display:flex;align-items:center;gap:10px;padding:max(20px,env(safe-area-inset-top,20px)) 20px 14px 20px;">
    <button class="back-btn" title="Zurück"><i data-lucide="arrow-left" style="width:22px;height:22px;"></i></button>
    <div style="flex:1;min-width:0;">
      <div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;opacity:0.6;color:#6750a4;" id="cal-year-label"></div>
      <span class="page-title" style="color:#1c1b1f;font-size:1.45rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="cal-month-title">Kalender</span>
    </div>
    <!-- Quick Nav -->
    <div style="display:flex;align-items:center;gap:6px;">
      <button onclick="calNav(-1)" class="icon-btn" title="Vorheriger Monat" style="width:40px;height:40px;border-radius:14px;"><i data-lucide="chevron-left" style="width:20px;height:20px;"></i></button>
      <button onclick="calToday()" class="m3-btn-outline" style="padding:6px 14px;border-radius:12px;font-size:0.8rem;font-weight:700;height:40px;" title="Zum heutigen Tag springen">Heute</button>
      <button onclick="calNav(1)" class="icon-btn" title="Nächster Monat" style="width:40px;height:40px;border-radius:14px;"><i data-lucide="chevron-right" style="width:20px;height:20px;"></i></button>
    </div>
  </div>

  <!-- Main 2-Column Responsive Layout -->
  <div class="cal-main-container">
    <!-- Left Column: Modern White Calendar Card -->
    <div class="cal-left-pane">
      <div class="cal-card">
        <!-- Weekdays Header -->
        <div class="cal-weekdays-grid">
          <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
        </div>
        <!-- Days Grid -->
        <div id="cal-grid" class="cal-days-grid"></div>
        
        <!-- Legend / Overview -->
        <div id="cal-overview-box" class="cal-overview-box"></div>
      </div>
    </div>

    <!-- Right Column: Filter Bar & Events List -->
    <div class="cal-right-pane">
      <!-- Interactive Category Filter Chips -->
      <div class="cal-filter-bar" id="cal-filter-bar">
        <!-- Active day filter — appears only once a day is tapped in the
             grid, right in the same row as the category chips, instead of
             a separate "Alle anzeigen" button living elsewhere on the
             page. Tapping it (or its x) clears the day, same as before. -->
        <button type="button" id="cal-day-chip" class="cal-filter-chip active" style="display:none;" onclick="clearDateSelection()">
          <span id="cal-day-chip-label"></span>
          <i data-lucide="x" style="width:12px;height:12px;"></i>
        </button>
        <!-- One dropdown instead of six separate chips — same category
             list as the "Neuer Termin" sheet's Kategorie field, so picking
             a filter here works exactly like picking one there. -->
        <select class="m3-select" id="cal-category-select" onchange="setCalCategoryFilter(this.value)">
          <option value="all">Alle Termine</option>
          <option value="exam">Klassenarbeiten</option>
          <option value="holiday">Ferien</option>
          <option value="trip">Ausflüge</option>
          <option value="personal">Persönlich</option>
          <option value="other">Sonstige</option>
        </select>
      </div>

      <!-- Events List Header / Active Filter Info -->
      <div id="cal-events-header"></div>

      <!-- Events Cards Container -->
      <div id="cal-events-list"></div>

      <!-- Empty State -->
      <div id="cal-no-events" style="display:none;" class="cal-empty-card">
        <div style="width:54px;height:54px;border-radius:18px;background:#ede7f6;color:#6750a4;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;">
          <i data-lucide="calendar" style="width:28px;height:28px;"></i>
        </div>
        <div style="font-weight:700;font-size:1.05rem;color:#1c1b1f;margin-bottom:4px;" id="cal-empty-title">Keine Termine</div>
        <div style="font-size:0.85rem;color:#49454f;margin-bottom:16px;" id="cal-empty-sub">Für diesen Zeitraum sind keine Termine eingetragen.</div>
        <button class="m3-btn-primary" onclick="openNewEventSheet(selectedCalDate)" style="display:inline-flex;align-items:center;gap:6px;">
          <i data-lucide="plus" style="width:18px;height:18px;"></i>
          <span>Neuen Termin eintragen</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Floating Action Button -->
  <button class="fab" onclick="openNewEventSheet()" title="Neuen Termin erstellen">
    <i data-lucide="plus" style="width:24px;height:24px;"></i>
  </button>

<style>
/* Layout: calendar card + filters/list, side by side from tablet up —
   same two-pane pattern as before, just breathes a bit more. */
.cal-main-container {
  display: flex;
  flex-direction: column;
  gap: 22px;
  padding: 4px 16px 100px 16px;
  max-width: 1140px;
  margin: 0 auto;
  width: 100%;
  box-sizing: border-box;
}
@media (min-width: 768px) {
  .cal-main-container {
    flex-direction: row;
    align-items: flex-start;
    gap: 28px;
    padding: 8px 28px 100px 28px;
  }
  .cal-left-pane {
    width: 380px;
    flex-shrink: 0;
    position: sticky;
    top: 16px;
  }
  .cal-right-pane {
    flex: 1;
    min-width: 0;
  }
}
@media (min-width: 1024px) {
  .cal-left-pane {
    width: 408px;
  }
}

.cal-card {
  background: #ffffff;
  border-radius: 28px;
  padding: 20px 16px;
  box-shadow: 0 2px 12px rgba(103, 80, 164, 0.08), 0 1px 3px rgba(0,0,0,0.04);
  border: 1px solid rgba(103, 80, 164, 0.08);
}

.cal-weekdays-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 10px;
}
.cal-weekdays-grid div {
  text-align: center;
  font-size: 0.72rem;
  font-weight: 800;
  color: #6750a4;
  opacity: 0.55;
  padding: 4px 0;
}

.cal-days-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px 0;
}

/* Day cell: a plain number by default. "Today" and "selected" borrow
   Android's own Calendar/Clock convention — a ring for today, a solid
   filled circle for the selected day — so the meaning is instantly
   familiar instead of needing a legend. Capped at 44px and centered so
   it stays a crisp circle instead of stretching into an oval on wide
   desktop columns. */
.cal-day {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  aspect-ratio: 1/1;
  width: 100%;
  max-width: 44px;
  margin: 0 auto;
  border-radius: 50%;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s cubic-bezier(0.2,0.8,0.2,1), background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  user-select: none;
  background: transparent;
  color: #1c1b1f;
}
.cal-day:hover:not(.muted):not(.selected) {
  background: #f3edf7;
}
.cal-day:active:not(.muted) {
  transform: scale(0.92);
}
.cal-day.muted {
  opacity: 0.28;
  cursor: default;
}
.cal-day.today {
  box-shadow: inset 0 0 0 2px #6750a4;
  color: #6750a4;
  font-weight: 800;
}
.cal-day.selected {
  background: #6750a4 !important;
  color: #ffffff !important;
  font-weight: 800;
  box-shadow: 0 3px 10px rgba(103, 80, 164, 0.4);
}

.cal-day-num {
  line-height: 1;
  font-size: 0.85rem;
  z-index: 1;
}

/* Dots container — the one place category color still shows on the grid;
   a holiday no longer tints the whole cell, it just gets a dot like every
   other category, so the day cell has exactly one visual language. */
.cal-dots-wrap {
  position: absolute;
  bottom: 6px;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2.5px;
  pointer-events: none;
  height: 5px;
}
.cal-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}
.cal-dot-exam { background: #ba1a1a; }
.cal-dot-holiday { background: #7d5260; }
.cal-dot-trip { background: #006d3a; }
.cal-dot-personal { background: #006399; }
.cal-dot-other { background: #6750a4; }

.cal-dot-more {
  font-size: 0.58rem;
  line-height: 1;
  font-weight: 800;
  color: #6750a4;
}
/* Selected day is a solid purple circle — dots need to invert to stay
   visible against it. */
.cal-day.selected .cal-dot,
.cal-day.selected .cal-dot-more {
  background: rgba(255,255,255,0.9) !important;
  color: rgba(255,255,255,0.9) !important;
}

/* Overview / quick-action row below the grid — a plain text row rather
   than a second boxed card, so the grid stays the one thing your eye
   lands on first. */
.cal-overview-box {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid rgba(103, 80, 164, 0.1);
}

/* Date Badge in Event Cards */
.ev-date-badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 48px;
  border-radius: 14px;
  background: #f3edf7;
  color: #21005d;
  margin-right: 14px;
  flex-shrink: 0;
  border: 1px solid rgba(103, 80, 164, 0.1);
  transition: all 0.15s ease;
}
.ev-date-badge.is-today {
  background: #6750a4;
  color: #ffffff;
  border-color: #6750a4;
  box-shadow: 0 2px 6px rgba(103, 80, 164, 0.3);
}
.ev-date-num {
  font-size: 1.15rem;
  font-weight: 800;
  line-height: 1;
}
.ev-date-wd {
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  opacity: 0.75;
  margin-top: 2px;
  line-height: 1;
}

/* Category pill on event cards — one consistent tag style instead of
   mixing a dot, an uppercase label and separate badge styles. */
.ev-category-pill {
  font-size: 0.7rem;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: 8px;
  white-space: nowrap;
}

.cal-empty-card {
  background: #ffffff;
  border-radius: 24px;
  padding: 36px 20px;
  text-align: center;
  border: 1px dashed rgba(103, 80, 164, 0.2);
  margin-top: 10px;
}
</style>
</div>

<script>
var calYear = new Date().getFullYear();
var calMonth = new Date().getMonth();
var calEvents = [];
var calSubjects = [];
var selectedCalDate = null;
var activeCategoryFilter = 'all';

async function init_calendar() {
  await Promise.all([
    loadCalEvents(),
    loadCalSubjects()
  ]);
  renderCal();
}

async function loadCalSubjects() {
  try {
    calSubjects = await API.subjects();
  } catch {
    calSubjects = [];
  }
}

async function loadCalEvents() {
  const m = String(calMonth + 1).padStart(2, '0');
  try {
    calEvents = await API.events(calYear + '-' + m);
  } catch {
    calEvents = [];
  }
}

function eventCoversDate(ev, dateStr) {
  const start = ev.date ? ev.date.slice(0, 10) : '';
  const end = ev.end_date ? ev.end_date.slice(0, 10) : start;
  return dateStr >= start && dateStr <= end;
}

function setCalCategoryFilter(cat) {
  activeCategoryFilter = cat;
  renderEventList();
}

function selectDay(dateStr) {
  if (selectedCalDate === dateStr) {
    selectedCalDate = null; // Toggle off if clicked again
  } else {
    selectedCalDate = dateStr;
  }
  renderCalGridOnly();
  renderEventList();
}

function clearDateSelection() {
  selectedCalDate = null;
  renderCalGridOnly();
  renderEventList();
}

async function calToday() {
  const today = new Date();
  calYear = today.getFullYear();
  calMonth = today.getMonth();
  selectedCalDate = today.toISOString().slice(0, 10);
  await loadCalEvents();
  renderCal();
}

async function calNav(dir) {
  calMonth += dir;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  selectedCalDate = null;
  await loadCalEvents();
  renderCal();
}

function renderCal() {
  const months = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  document.getElementById('cal-month-title').textContent = months[calMonth];
  document.getElementById('cal-year-label').textContent = String(calYear);

  renderCalGridOnly();
  renderEventList();
}

function renderCalGridOnly() {
  const grid = document.getElementById('cal-grid');
  if (!grid) return;
  grid.innerHTML = '';

  const first = new Date(calYear, calMonth, 1);
  const startDay = (first.getDay() + 6) % 7; // 0=Mo ... 6=So
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const prevDays = new Date(calYear, calMonth, 0).getDate();
  const todayStr = new Date().toISOString().slice(0, 10);

  // Leading days from previous month
  for (let i = startDay - 1; i >= 0; i--) {
    const d = document.createElement('div');
    d.className = 'cal-day muted';
    d.innerHTML = `<span class="cal-day-num">${prevDays - i}</span>`;
    grid.appendChild(d);
  }

  // Days of current month
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = calYear + '-' + String(calMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const covering = calEvents.filter(e => eventCoversDate(e, dateStr));
    const hasEvent = covering.length > 0;
    const hasHoliday = covering.some(e => e.event_type === 'holiday');
    const isToday = dateStr === todayStr;
    const isSelected = selectedCalDate === dateStr;

    const el = document.createElement('div');
    let cls = 'cal-day';
    if (isToday) cls += ' today';
    if (isSelected) cls += ' selected';
    if (hasHoliday) cls += ' is-holiday';

    el.className = cls;

    let dotsHtml = '';
    if (hasEvent) {
      const maxDots = 3;
      const dotsToShow = covering.slice(0, maxDots);
      const dotsTags = dotsToShow.map(ev => {
        const type = ev.event_type || 'other';
        return `<span class="cal-dot cal-dot-${type}" title="${escapeHtml(ev.title)}"></span>`;
      }).join('');

      let moreTag = '';
      if (covering.length > maxDots) {
        moreTag = `<span class="cal-dot-more">+${covering.length - maxDots + 1}</span>`;
      }
      dotsHtml = `<div class="cal-dots-wrap">${dotsTags}${moreTag}</div>`;
    }

    el.innerHTML = `<span class="cal-day-num">${d}</span>${dotsHtml}`;
    el.onclick = () => selectDay(dateStr);
    grid.appendChild(el);
  }

  renderOverviewBox();
}

// The day chip lives in the same row as the category chips (see the
// static markup in #cal-filter-bar) instead of a separate "Alle anzeigen"
// button elsewhere on the page — one row for every active filter.
function updateDayChip() {
  const chip = document.getElementById('cal-day-chip');
  if (!chip) return;
  if (selectedCalDate) {
    const d = new Date(selectedCalDate + 'T00:00');
    const label = document.getElementById('cal-day-chip-label');
    if (label) label.textContent = d.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' });
    chip.style.display = 'inline-flex';
  } else {
    chip.style.display = 'none';
  }
}

function renderOverviewBox() {
  updateDayChip();

  const box = document.getElementById('cal-overview-box');
  if (!box) return;

  // The selected-day summary used to duplicate here as its own boxed
  // row with an "Alle anzeigen" button — that info now lives in the day
  // chip (filter row) and the events list header instead, so this stays
  // a single, constant hint regardless of selection.
  box.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;font-size:0.78rem;color:#49454f;">
      <span>Tippe auf einen Tag für Details</span>
      <button onclick="openNewEventSheet()" style="background:transparent;border:none;color:#6750a4;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px;">
        <i data-lucide="plus-circle" style="width:14px;height:14px;"></i> Neuer Termin
      </button>
    </div>
  `;
  if (window.lucide) lucide.createIcons();
}

function renderEventList() {
  const list = document.getElementById('cal-events-list');
  const headerEl = document.getElementById('cal-events-header');
  const emptyEl = document.getElementById('cal-no-events');
  if (!list) return;

  const monthStart = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-01`;
  const lastDay = new Date(calYear, calMonth + 1, 0).getDate();
  const monthEnd = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;

  let pool = calEvents.filter(e => {
    const s = (e.date || '').slice(0, 10);
    const end = (e.end_date || s).slice(0, 10);
    return s <= monthEnd && end >= monthStart;
  });

  // Filter by selected day if active
  if (selectedCalDate) {
    pool = pool.filter(e => eventCoversDate(e, selectedCalDate));
  }

  // Filter by category if not 'all'
  if (activeCategoryFilter !== 'all') {
    pool = pool.filter(e => (e.event_type || 'other') === activeCategoryFilter);
  }

  // Sort chronologically
  pool.sort((a, b) => (a.date || '').localeCompare(b.date || ''));

  // Header above list
  if (selectedCalDate) {
    // Clearing the day now happens via its chip up in the filter row, not
    // a second "Alle anzeigen" button duplicated here.
    const d = new Date(selectedCalDate + 'T00:00');
    const fullStr = d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    headerEl.innerHTML = `
      <div style="margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <div style="min-width:0;">
          <div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#6750a4;">Termine am</div>
          <div style="font-size:1.15rem;font-weight:800;color:#1c1b1f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${fullStr}</div>
        </div>
        <span style="font-size:0.75rem;color:#49454f;font-weight:600;flex-shrink:0;">${pool.length} ${pool.length === 1 ? 'Eintrag' : 'Einträge'}</span>
      </div>
    `;
  } else {
    headerEl.innerHTML = `
      <div style="margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;">
        <div style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#6750a4;">
          ${activeCategoryFilter === 'all' ? 'Alle Termine dieses Monats' : 'Gefilterte Termine'}
        </div>
        <span style="font-size:0.75rem;color:#49454f;font-weight:600;">${pool.length} ${pool.length === 1 ? 'Eintrag' : 'Einträge'}</span>
      </div>
    `;
  }

  if (pool.length === 0) {
    list.innerHTML = '';
    emptyEl.style.display = 'block';
    const emptyTitle = document.getElementById('cal-empty-title');
    const emptySub = document.getElementById('cal-empty-sub');
    if (selectedCalDate) {
      const d = new Date(selectedCalDate + 'T00:00');
      const f = d.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' });
      emptyTitle.textContent = `Keine Termine am ${f}`;
      emptySub.textContent = `Für diesen Tag ist bisher noch nichts eingetragen.`;
    } else {
      emptyTitle.textContent = 'Keine Termine gefunden';
      emptySub.textContent = activeCategoryFilter === 'all'
        ? 'In diesem Monat stehen keine Termine an.'
        : 'Keine Termine in dieser Kategorie vorhanden.';
    }
  } else {
    emptyEl.style.display = 'none';
    const subMap = Object.fromEntries((calSubjects || []).map(s => [s.id, s]));
    const todayStr = new Date().toISOString().slice(0, 10);

    list.innerHTML = pool.map(e => {
      const isEvToday = eventCoversDate(e, todayStr);
      const isMulti = Boolean(e.end_date && e.end_date !== e.date);

      const sDate = new Date(e.date + 'T00:00');
      const dayNum = sDate.getDate();
      const weekday = sDate.toLocaleDateString('de-DE', { weekday: 'short' });

      let dayLabel = sDate.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' });
      if (isMulti) {
        const eDate = new Date(e.end_date + 'T00:00');
        dayLabel = `${sDate.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' })} – ${eDate.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' })}`;
      }

      let typeLabel = 'Sonstiges';
      let typeColor = '#6750a4';
      let typeBg = 'rgba(103, 80, 164, 0.1)';

      if (e.event_type === 'exam') {
        typeLabel = 'Klassenarbeit';
        typeColor = '#ba1a1a';
        typeBg = 'rgba(186, 26, 26, 0.1)';
      } else if (e.event_type === 'holiday') {
        typeLabel = 'Schulferien';
        typeColor = '#7d5260';
        typeBg = 'rgba(125, 82, 96, 0.1)';
      } else if (e.event_type === 'trip') {
        typeLabel = 'Ausflug';
        typeColor = '#006d3a';
        typeBg = 'rgba(0, 109, 58, 0.1)';
      } else if (e.event_type === 'personal') {
        typeLabel = 'Persönlich';
        typeColor = '#006399';
        typeBg = 'rgba(0, 99, 153, 0.1)';
      }

      const subObj = e.subject_id ? subMap[e.subject_id] : null;
      const subName = subObj ? (subObj.name || subObj.short_name) : null;
      const subColor = subObj ? (subObj.color || '#6750a4') : null;

      const personalNote = e.event_type === 'personal'
        ? `<span style="font-size:0.72rem;font-weight:600;color:#49454f;display:inline-flex;align-items:center;gap:3px;"><i data-lucide="lock" style="width:11px;height:11px;"></i> Nur für dich</span>`
        : '';

      const subjectBadge = subName
        ? `<span style="font-size:0.7rem;font-weight:700;background:${subColor || '#ede7f6'};color:#1c1b1f;padding:2px 8px;border-radius:6px;">${escapeHtml(subName)}</span>`
        : '';

      return `
        <div class="m3-card" style="margin-bottom:10px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:20px;box-shadow:0 1px 4px rgba(0,0,0,0.05);transition:transform 0.1s ease;">
          <div style="display:flex;align-items:center;flex:1;min-width:0;">
            <div class="ev-date-badge ${isEvToday ? 'is-today' : ''}">
              <span class="ev-date-num">${dayNum}</span>
              <span class="ev-date-wd">${weekday}</span>
            </div>
            <div style="flex:1;min-width:0;">
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px;">
                <span class="ev-category-pill" style="background:${typeBg};color:${typeColor};">${typeLabel}</span>
                ${subjectBadge}
                ${personalNote}
              </div>
              <div style="font-weight:700;font-size:0.98rem;color:#1c1b1f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(e.title)}</div>
              <div style="font-size:0.78rem;color:#49454f;margin-top:2px;display:flex;align-items:center;gap:5px;">
                <i data-lucide="calendar" style="width:13px;height:13px;opacity:0.6;"></i>
                <span>${dayLabel}</span>
                ${e.time ? `<span style="opacity:0.4;">·</span><i data-lucide="clock" style="width:13px;height:13px;opacity:0.6;"></i><span>${e.time} Uhr</span>` : ''}
              </div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
            <button onclick="openEditEventSheet(${e.id})" title="Bearbeiten" class="ev-action-btn edit">
              <i data-lucide="pencil" style="width:16px;height:16px;"></i>
            </button>
            <button onclick="confirmDelEvent(${e.id})" title="Löschen" class="ev-action-btn delete">
              <i data-lucide="trash-2" style="width:16px;height:16px;"></i>
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  if (window.lucide) lucide.createIcons();
}

function setEventRangeMode(isRange) {
  const btnSingle = document.getElementById('ev-mode-single');
  const btnRange = document.getElementById('ev-mode-range');
  const wrap = document.getElementById('ev-end-date-wrap');
  const startLbl = document.getElementById('ev-start-label');

  if (btnSingle) btnSingle.classList.toggle('active', !isRange);
  if (btnRange) btnRange.classList.toggle('active', isRange);
  if (startLbl) startLbl.textContent = isRange ? 'Startdatum (Ab):' : 'Datum:';

  if (wrap) {
    wrap.style.display = isRange ? 'block' : 'none';
    if (isRange) {
      const startVal = document.getElementById('ev-date')?.value;
      const endInput = document.getElementById('ev-end-date');
      if (startVal && endInput && (!endInput.value || endInput.value < startVal)) {
        endInput.value = startVal;
      }
      if (typeof enhanceDateTimeInputs === 'function') enhanceDateTimeInputs(wrap);
    }
  }
}

function toggleEventTime() {
  const btn = document.getElementById('ev-time-toggle');
  const wrap = document.getElementById('ev-time-wrap');
  if (wrap) {
    wrap.style.display = 'block';
    if (btn) btn.style.display = 'none';
    if (typeof enhanceDateTimeInputs === 'function') enhanceDateTimeInputs(wrap);
  }
}

// Dauer/Kategorie/Uhrzeit start collapsed behind "Weitere Optionen" so the
// sheet opens with just title + date instead of every field at once — they
// were already enhanced (dropdowns, date/time inputs) when the sheet itself
// opened, hidden or not, so revealing the wrapper here is enough.
function toggleEventMore() {
  const wrap = document.getElementById('ev-more-wrap');
  const toggleWrap = document.getElementById('ev-more-toggle-wrap');
  if (wrap) wrap.style.display = 'block';
  if (toggleWrap) toggleWrap.style.display = 'none';
}

async function openNewEventSheet(defaultDate) {
  await loadCalSubjects();
  const today = defaultDate || selectedCalDate || new Date().toISOString().slice(0, 10);
  const subOpts = (calSubjects || []).map(s => `<option value="${s.id}">${escapeHtml(s.name || s.short_name || '')}</option>`).join('');

  openSheet(`
    <div class="sheet-title" style="font-size:1.25rem;font-weight:800;color:#1c1b1f;margin-bottom:16px;">Neuer Termin</div>

    <div class="m3-field">
      <label class="m3-field-label">Titel des Termins:</label>
      <input class="m3-input" id="ev-title" placeholder="z. B. Mathearbeit, Schulausflug, Zahnarzt...">
    </div>

    <div class="m3-field" id="ev-start-date-wrap">
      <label id="ev-start-label" class="m3-field-label">Datum:</label>
      <input class="m3-input" id="ev-date" type="date" value="${today}">
    </div>

    <div id="ev-end-date-wrap" class="m3-field" style="display:none;">
      <label class="m3-field-label">Enddatum (Bis einschließlich):</label>
      <input class="m3-input" id="ev-end-date" type="date" value="${today}">
    </div>

    <!-- Dauer, Kategorie and Uhrzeit default to Einzelner Tag / Sonstiges /
         ohne Uhrzeit for most events, so they stay collapsed behind one
         toggle instead of all showing at once. -->
    <div class="m3-field" id="ev-more-toggle-wrap">
      <button type="button" id="ev-more-toggle" class="m3-inline-toggle m3-more-toggle" onclick="toggleEventMore()">
        <span style="display:flex;align-items:center;gap:6px;"><i data-lucide="sliders-horizontal" style="width:16px;height:16px;"></i> Weitere Optionen</span>
        <i data-lucide="chevron-down" style="width:16px;height:16px;"></i>
      </button>
    </div>

    <div id="ev-more-wrap" style="display:none;">
      <div class="m3-field">
        <label class="m3-field-label">Dauer:</label>
        <div class="ev-segmented-wrap">
          <button type="button" id="ev-mode-single" class="ev-seg-btn active" onclick="setEventRangeMode(false)">
            <i data-lucide="calendar" style="width:16px;height:16px;"></i>
            <span>Einzelner Tag</span>
          </button>
          <button type="button" id="ev-mode-range" class="ev-seg-btn" onclick="setEventRangeMode(true)">
            <i data-lucide="calendar-range" style="width:16px;height:16px;"></i>
            <span>Zeitraum (mehrere Tage)</span>
          </button>
        </div>
      </div>

      <div class="m3-field">
        <label class="m3-field-label">Kategorie:</label>
        <select class="m3-select" id="ev-type">
          <option value="other">Sonstiges</option>
          <option value="exam">Klassenarbeit</option>
          <option value="trip">Ausflug / Klassenfahrt</option>
          <option value="holiday">Ferien</option>
          <option value="personal">Persönlich (nur für dich sichtbar)</option>
        </select>
      </div>

      <div id="ev-subject-row" class="m3-field" style="display:none;">
        <label class="m3-field-label">Fach für die Klassenarbeit:</label>
        <select class="m3-select" id="ev-subject">
          <option value="">Fach auswählen (optional)</option>
          ${subOpts}
        </select>
      </div>

      <div class="m3-field">
        <button type="button" id="ev-time-toggle" class="m3-inline-toggle" onclick="toggleEventTime()">
          <i data-lucide="clock" style="width:16px;height:16px;"></i> + Uhrzeit hinzufügen (optional)
        </button>
        <div id="ev-time-wrap" style="display:none;margin-top:6px;">
          <label class="m3-field-label">Uhrzeit:</label>
          <input class="m3-input" id="ev-time" type="time" placeholder="Uhrzeit (optional)">
        </div>
      </div>
    </div>

    <div class="m3-sheet-actions">
      <button type="button" class="m3-btn-outline" style="flex:1;" onclick="closeSheet()">Abbrechen</button>
      <button type="button" class="m3-btn-primary" style="flex:2;" onclick="saveEvent()">Speichern</button>
    </div>
  `);

  const typeEl = document.getElementById('ev-type');
  const subRow = document.getElementById('ev-subject-row');
  if (typeEl && subRow) {
    typeEl.addEventListener('change', () => {
      const isExam = typeEl.value === 'exam';
      subRow.style.display = isExam ? 'block' : 'none';
    });
  }
}

async function saveEvent() {
  const title = document.getElementById('ev-title').value.trim();
  const date = document.getElementById('ev-date').value;
  if (!title || !date) { showToast('Titel und Datum erforderlich'); return; }

  const isRange = document.getElementById('ev-mode-range')?.classList.contains('active');
  const endVal = document.getElementById('ev-end-date')?.value;
  const end_date = isRange && endVal && endVal >= date ? endVal : (isRange && endVal ? date : null);

  const event_type = document.getElementById('ev-type').value;
  const subEl = document.getElementById('ev-subject');
  const subject_id = (event_type === 'exam' && subEl && subEl.value) ? parseInt(subEl.value, 10) : null;
  const timeEl = document.getElementById('ev-time');
  const time = (timeEl && timeEl.value) ? timeEl.value : null;

  try {
    await API.createEvent({ title, date, end_date, time, event_type, subject_id });
    closeSheet();
    await loadCalEvents();
    renderCal();
    showToast('Termin gespeichert');
  } catch {
    showToast('Fehler beim Speichern');
  }
}

async function openEditEventSheet(eventId) {
  const ev = calEvents.find(x => x.id === eventId);
  if (!ev) { showToast('Termin nicht gefunden'); return; }

  await loadCalSubjects();
  const isRange = Boolean(ev.end_date && ev.end_date !== ev.date);
  const subOpts = (calSubjects || []).map(s => {
    const sel = s.id === ev.subject_id ? 'selected' : '';
    return `<option value="${s.id}" ${sel}>${escapeHtml(s.name || s.short_name || '')}</option>`;
  }).join('');

  const typeOpts = [
    { value: 'other', label: 'Sonstiges' },
    { value: 'exam', label: 'Klassenarbeit' },
    { value: 'trip', label: 'Ausflug / Klassenfahrt' },
    { value: 'holiday', label: 'Ferien' },
    { value: 'personal', label: 'Persönlich (nur für dich sichtbar)' }
  ].map(t => `<option value="${t.value}" ${t.value === ev.event_type ? 'selected' : ''}>${t.label}</option>`).join('');

  const hasTime = Boolean(ev.time);
  // Expand "Weitere Optionen" upfront whenever the event already uses one of
  // the fields hidden behind it — otherwise editing would silently hide an
  // already-set category/range/time instead of just defaulting to it.
  const hasMore = isRange || ev.event_type !== 'other' || hasTime;

  openSheet(`
    <div class="sheet-title" style="font-size:1.25rem;font-weight:800;color:#1c1b1f;margin-bottom:16px;">Termin bearbeiten</div>

    <div class="m3-field">
      <label class="m3-field-label">Titel des Termins:</label>
      <input class="m3-input" id="ev-title" placeholder="Titel" value="${escapeHtml(ev.title)}">
    </div>

    <div class="m3-field" id="ev-start-date-wrap">
      <label id="ev-start-label" class="m3-field-label">${isRange ? 'Startdatum (Ab):' : 'Datum:'}</label>
      <input class="m3-input" id="ev-date" type="date" value="${ev.date}">
    </div>

    <div id="ev-end-date-wrap" class="m3-field" style="display:${isRange ? 'block' : 'none'};">
      <label class="m3-field-label">Enddatum (Bis einschließlich):</label>
      <input class="m3-input" id="ev-end-date" type="date" value="${ev.end_date || ev.date}">
    </div>

    <div class="m3-field" id="ev-more-toggle-wrap" style="display:${hasMore ? 'none' : 'block'};">
      <button type="button" id="ev-more-toggle" class="m3-inline-toggle m3-more-toggle" onclick="toggleEventMore()">
        <span style="display:flex;align-items:center;gap:6px;"><i data-lucide="sliders-horizontal" style="width:16px;height:16px;"></i> Weitere Optionen</span>
        <i data-lucide="chevron-down" style="width:16px;height:16px;"></i>
      </button>
    </div>

    <div id="ev-more-wrap" style="display:${hasMore ? 'block' : 'none'};">
      <div class="m3-field">
        <label class="m3-field-label">Dauer:</label>
        <div class="ev-segmented-wrap">
          <button type="button" id="ev-mode-single" class="ev-seg-btn ${!isRange ? 'active' : ''}" onclick="setEventRangeMode(false)">
            <i data-lucide="calendar" style="width:16px;height:16px;"></i>
            <span>Einzelner Tag</span>
          </button>
          <button type="button" id="ev-mode-range" class="ev-seg-btn ${isRange ? 'active' : ''}" onclick="setEventRangeMode(true)">
            <i data-lucide="calendar-range" style="width:16px;height:16px;"></i>
            <span>Zeitraum (mehrere Tage)</span>
          </button>
        </div>
      </div>

      <div class="m3-field">
        <label class="m3-field-label">Kategorie:</label>
        <select class="m3-select" id="ev-type">
          ${typeOpts}
        </select>
      </div>

      <div id="ev-subject-row" class="m3-field" style="display:${ev.event_type === 'exam' ? 'block' : 'none'};">
        <label class="m3-field-label">Fach für die Klassenarbeit:</label>
        <select class="m3-select" id="ev-subject">
          <option value="">Fach auswählen (optional)</option>
          ${subOpts}
        </select>
      </div>

      <div class="m3-field">
        <button type="button" id="ev-time-toggle" class="m3-inline-toggle" style="display:${hasTime ? 'none' : 'flex'};" onclick="toggleEventTime()">
          <i data-lucide="clock" style="width:16px;height:16px;"></i> + Uhrzeit hinzufügen (optional)
        </button>
        <div id="ev-time-wrap" style="display:${hasTime ? 'block' : 'none'};margin-top:6px;">
          <label class="m3-field-label">Uhrzeit:</label>
          <input class="m3-input" id="ev-time" type="time" placeholder="Uhrzeit (optional)" value="${ev.time || ''}">
        </div>
      </div>
    </div>

    <div class="m3-sheet-actions">
      <button type="button" class="m3-btn-outline" style="flex:1;" onclick="closeSheet()">Abbrechen</button>
      <button type="button" class="m3-btn-primary" style="flex:2;" onclick="saveEditedEvent(${ev.id})">Speichern</button>
    </div>
  `);

  const typeEl = document.getElementById('ev-type');
  const subRow = document.getElementById('ev-subject-row');
  if (typeEl && subRow) {
    typeEl.addEventListener('change', () => {
      const isExam = typeEl.value === 'exam';
      subRow.style.display = isExam ? 'block' : 'none';
    });
  }
}

async function saveEditedEvent(eventId) {
  const title = document.getElementById('ev-title').value.trim();
  const date = document.getElementById('ev-date').value;
  if (!title || !date) { showToast('Titel und Datum erforderlich'); return; }

  const isRange = document.getElementById('ev-mode-range')?.classList.contains('active');
  const endVal = document.getElementById('ev-end-date')?.value;
  const end_date = isRange && endVal && endVal >= date ? endVal : (isRange && endVal ? date : null);

  const event_type = document.getElementById('ev-type').value;
  const subEl = document.getElementById('ev-subject');
  const subject_id = (event_type === 'exam' && subEl && subEl.value) ? parseInt(subEl.value, 10) : null;
  const timeEl = document.getElementById('ev-time');
  const time = (timeEl && timeEl.value) ? timeEl.value : null;

  try {
    await API.updateEvent(eventId, { title, date, end_date, time, event_type, subject_id });
    closeSheet();
    await loadCalEvents();
    renderCal();
    showToast('Termin aktualisiert');
  } catch {
    showToast('Fehler beim Aktualisieren');
  }
}

function confirmDelEvent(eventId) {
  const ev = calEvents.find(x => x.id === eventId);
  const title = ev ? escapeHtml(ev.title) : 'diesen Termin';

  openModal(`
    <div style="text-align:center;padding:12px 6px 6px;">
      <div style="width:54px;height:54px;border-radius:18px;background:#ffdad6;color:#ba1a1a;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
        <i data-lucide="trash-2" style="width:26px;height:26px;"></i>
      </div>
      <div style="font-size:1.2rem;font-weight:800;margin-bottom:8px;color:#1c1b1f;">Termin löschen?</div>
      <div style="font-size:0.92rem;color:#49454f;line-height:1.45;margin-bottom:22px;">
        Willst du das wirklich löschen?<br>
        <span style="font-weight:700;color:#1c1b1f;display:inline-block;margin-top:6px;">„${title}“</span>
      </div>
      <div style="display:flex;gap:10px;">
        <button class="m3-btn-outline" style="flex:1;" onclick="closeModal()">Abbrechen</button>
        <button class="m3-btn-primary" style="flex:1;background:#ba1a1a;box-shadow:0 2px 8px rgba(186,26,26,0.3);" onclick="doDelEvent(${eventId})">Löschen</button>
      </div>
    </div>
  `);
}

async function doDelEvent(eventId) {
  closeModal();
  try {
    await API.deleteEvent(eventId);
    await loadCalEvents();
    renderCal();
    showToast('Termin gelöscht');
  } catch {
    showToast('Fehler beim Löschen');
  }
}
</script>
