<div class="page" id="page-calendar" style="background:#f9f6fc;">

  <!-- Monat | Agenda — same chip pattern as homework/timetable -->
  <div id="cal-chips-slot" class="no-scrollbar page-subbar" style="padding-top:0;padding-bottom:8px;display:flex;gap:8px;overflow-x:auto;flex-shrink:0;"></div>

      <div class="m3-card cal-card">
        <div class="cal-weekdays-grid">
          <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>

        <button type="button" id="cal-search-clear" class="cal-search-clear" onclick="clearCalSearch()" style="display:none;" title="Suche löschen">
          <i data-lucide="x"></i>
        </button>
      </div>

      <!-- Selected-day chip (month view only) -->
      <div id="cal-day-chip-slot" class="cal-day-chip-slot" style="display:none;"></div>

      <div id="cal-events-header"></div>
      <div id="cal-events-list" class="cal-events-list"></div>

      <div id="cal-no-events" class="cal-empty-card" style="display:none;">
        <div class="cal-empty-icon">
          <i data-lucide="calendar"></i>
        </div>
        <div class="cal-empty-title" id="cal-empty-title">Keine Termine</div>
        <div class="cal-empty-sub" id="cal-empty-sub">Für diesen Zeitraum sind keine Termine eingetragen.</div>

          <i data-lucide="plus"></i>
          <span>Neuen Termin eintragen</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Week View — hourly time-grid, Google Calendar-style. Hidden by
       default; toggled with .cal-main-container via calDisplayMode. Reuses
       the exact block-positioning approach the Timetable page's week view
       already uses (top/height in px from minutes-since-grid-start), so
       the two grids behave identically even though they're separate
       implementations (Timetable's lessons have real start/end times;
       calendar events only have an optional single time, see
       CAL_WEEK_EVENT_DURATION_MIN). -->
  <div id="cal-week-view" style="display:none;">
    <div class="cal-week-scroll">
      <div class="cal-week-allday-row" id="cal-week-allday-row"></div>
      <div id="cal-week-grid" class="cal-week-grid"></div>
    </div>

  <!-- Floating Action Button -->

/* All-day row shares the exact same column template and min-width as the
   grid below, and lives inside the same scroll container (see the HTML) —
   otherwise on mobile the grid scrolls horizontally with wide columns
   while this row stays squeezed to the viewport width, misaligning the
   two and truncating chip text far more aggressively than the grid ever
   needs to. */
.cal-week-allday-row {
  display: grid;
  grid-template-columns: 34px repeat(7, minmax(74px, 1fr));
  gap: 3px;
  min-width: 560px;
  margin-bottom: 6px;
}
.cal-week-allday-row:empty { display: none; margin-bottom: 0; }
.cal-week-allday-chip {
  font-size: 0.68rem; font-weight: 700; padding: 4px 6px; border-radius: 7px;

}

  box-shadow: 0 2px 12px rgba(103, 80, 164, 0.08), 0 1px 3px rgba(0,0,0,0.04);
  border: 1px solid rgba(103, 80, 164, 0.08);
  padding: 10px 6px;
  overflow-x: auto;
}
.cal-week-grid {
  display: grid;
  grid-template-columns: 34px repeat(7, minmax(74px, 1fr));
  gap: 3px;
  min-width: 560px;
}
.cal-week-day-header {

.cal-week-day-col { position: relative; border-radius: 8px; }
.cal-week-day-col.is-today { background: rgba(103,80,164,0.04); }
.cal-week-event-block {
  position: absolute; left: 1px; right: 1px; border-radius: 7px; padding: 3px 5px;
  overflow: hidden; cursor: pointer; font-size: 0.64rem; font-weight: 700; line-height: 1.25;

.cal-week-now-line { position: absolute; left: 0; right: 0; height: 2px; background: #ba1a1a; z-index: 5; }

<script>
document.getElementById('ph-calendar').outerHTML = pageHeader({
  className: 'cal-header-row',
  backClassName: 'cal-back-btn',
  titleHtml: `<div style="flex:1;min-width:0;position:relative;">
      <div id="cal-title-block">
        <div style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;opacity:0.6;color:#6750a4;" id="cal-year-label"></div>
        <span class="page-title cal-month-title" style="color:#1c1b1f;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;" id="cal-month-title">Kalender</span>
      </div>
      <div id="cal-header-search-wrap" style="display:none;align-items:center;height:100%;">
        <i data-lucide="search" style="width:18px;height:18px;opacity:0.45;flex-shrink:0;margin-right:8px;"></i>
        <input type="text" id="cal-header-search-input" placeholder="Termine durchsuchen..." style="flex:1;min-width:0;border:none;outline:none;background:none;font-family:inherit;font-size:1.05rem;font-weight:700;color:#1c1b1f;" oninput="onCalSearchInput(this.value)">
      </div>
    </div>`,
  trailing: `<div class="cal-nav-row" style="display:flex;align-items:center;flex-shrink:0;">
      <button type="button" id="cal-viewmode-btn" class="icon-btn cal-nav-btn cal-flat-btn" onclick="toggleCalDisplayMode()" title="Wochenansicht">
        <i data-lucide="calendar-days" id="cal-viewmode-icon"></i>
      </button>
      <button onclick="calNav(-1)" class="icon-btn cal-nav-btn" title="Vorheriger Monat" id="cal-nav-prev"><i data-lucide="chevron-left"></i></button>
      <button onclick="calToday()" class="cal-today-btn cal-today-icon-btn" id="cal-today-btn" title="Zum heutigen Tag springen"></button>
      <button onclick="calNav(1)" class="icon-btn cal-nav-btn" title="Nächster Monat" id="cal-nav-next"><i data-lucide="chevron-right"></i></button>
      <button type="button" id="cal-header-search-btn" class="icon-btn cal-nav-btn cal-search-header-btn cal-flat-btn" onclick="toggleCalHeaderSearch()" title="Termine durchsuchen">
        <i data-lucide="search"></i>
      </button>
      <button type="button" id="cal-filter-btn" class="icon-btn cal-nav-btn cal-flat-btn" onclick="toggleCalFilterMenu(this)" title="Nach Kategorie filtern" style="position:relative;">
        <i data-lucide="filter"></i>
        <span id="cal-filter-dot" style="display:none;position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#6750a4;border:2px solid #f9f6fc;"></span>
      </button>
    </div>`
});
document.getElementById('cal-today-btn').textContent = new Date().getDate();
document.getElementById('cal-fab-slot').outerHTML = fab({
  onclick: 'openNewEventSheet()', title: 'Neuen Termin erstellen'
});
document.getElementById('cal-chips-slot').innerHTML = chipRow({
  onclick: 'calSetViewChip',
  idPrefix: 'cal-chip',
  items: [
    { value: 'month', label: 'Monat', active: true },
    { value: 'all', label: 'Agenda', active: false },
  ],
});

function calSetViewChip(scope, btn) {
  document.querySelectorAll('#cal-chips-slot .chip').forEach(c => c.classList.remove('active'));
  if (btn) btn.classList.add('active');
  setCalViewScope(scope);
}
var calYear = new Date().getFullYear();
var calMonth = new Date().getMonth();
var calEvents = [];
var calSubjects = [];
var selectedCalDate = null;
var activeCategoryFilter = 'all';
var calCurrentUser = null;
// 'month' (default: only the selected month, day-grid shown) or 'all'
// (every upcoming event across every month, no day-grid — a single
// month's grid doesn't mean anything once the list spans all of them).
// Persisted the same way the timetable's Tag/Woche choice is.
var calViewScope = 'month';
try { calViewScope = localStorage.getItem('cal_view_scope') === 'all' ? 'all' : 'month'; } catch {}
(function syncCalChips() {
  const month = document.getElementById('cal-chip-month');
  const all = document.getElementById('cal-chip-all');
  if (month) month.classList.toggle('active', calViewScope === 'month');
  if (all) all.classList.toggle('active', calViewScope === 'all');
})();

// 'month' (the existing mini-grid + list) or 'week' (new: an hourly
// Google Calendar-style time-grid). Independent of calViewScope above —
// that's about how much the LIST spans, this is a whole different layout.
// Persisted the same way.
var calDisplayMode = 'month';
try { calDisplayMode = localStorage.getItem('cal_display_mode') === 'week' ? 'week' : 'month'; } catch {}
// Any date within the week currently shown — Monday of its week is
// derived from this each render rather than stored directly, same as
// calYear/calMonth representing "the month" without a specific day.
var calWeekAnchor = new Date();

// Search matches title/description across every event regardless of
// month, scope, or whether it's already past — a search is a "find it
// no matter where/when" tool, not scoped to whatever's currently on
// screen. calSearchPool is fetched fresh each time a search starts so
// it can't go stale, independent of calEvents (which stays whatever the
// month/all toggle last loaded, so clearing the search returns to
// exactly that view without needing to reload it).
var calSearchQuery = '';
var calSearchPool = [];
var calSearchDebounce = null;

async function onCalSearchInput(value) {
  const q = value.trim();
  const clearBtn = document.getElementById('cal-search-clear');
  if (clearBtn) clearBtn.style.display = q ? 'flex' : 'none';
  // Keep both entry points (mobile bar, desktop header) in sync regardless
  // of which one the user is actually typing in — matters if the window
  // gets resized across the breakpoint mid-search.
  const mobileInput = document.getElementById('cal-search-input');
  const headerInput = document.getElementById('cal-header-search-input');
  if (mobileInput && mobileInput.value !== value) mobileInput.value = value;
  if (headerInput && headerInput.value !== value) headerInput.value = value;

  const startingSearch = q && !calSearchQuery;
  calSearchQuery = q;
  clearTimeout(calSearchDebounce);

  if (startingSearch) {
    calSearchPool = await API.events().catch(() => []);
  }
  calSearchDebounce = setTimeout(renderCal, startingSearch ? 0 : 150);
}

function clearCalSearch() {
  calSearchQuery = '';
  const input = document.getElementById('cal-search-input');
  const headerInput = document.getElementById('cal-header-search-input');
  const clearBtn = document.getElementById('cal-search-clear');
  if (input) input.value = '';
  if (headerInput) headerInput.value = '';
  if (clearBtn) clearBtn.style.display = 'none';
  renderCal();
}

// Tablet/desktop only (see .cal-search-header-btn) — expands the title
// area into a search input instead of a permanent bar, since there's
// room to spare there and a permanent bar would look like unused chrome.
let calHeaderSearchOpen = false;
function toggleCalHeaderSearch() {
  calHeaderSearchOpen = !calHeaderSearchOpen;
  const titleBlock = document.getElementById('cal-title-block');
  const searchWrap = document.getElementById('cal-header-search-wrap');
  const input = document.getElementById('cal-header-search-input');
  if (calHeaderSearchOpen) {
    if (titleBlock) titleBlock.style.display = 'none';
    if (searchWrap) searchWrap.style.display = 'flex';
    if (input) { input.value = calSearchQuery; input.focus(); }
  } else {
    if (titleBlock) titleBlock.style.display = 'block';
    if (searchWrap) searchWrap.style.display = 'none';
    if (calSearchQuery) clearCalSearch();
  }
}

async function init_calendar() {
  const [, , me] = await Promise.all([
    loadCalEvents(),
    loadCalSubjects(),
    API.me().catch(() => null),
  ]);
  calCurrentUser = me;
  // Month view opens on today's day-agenda (Android-style) when the
  // persisted month is the current one — otherwise keep the month list.
  if (calViewScope === 'month' && !selectedCalDate) {
    const t = new Date();
    if (t.getFullYear() === calYear && t.getMonth() === calMonth) {
      selectedCalDate = localDateStr(t);
    }
  }
  const dot = document.getElementById('cal-filter-dot');
  if (dot) dot.style.display = (calViewScope === 'all' || activeCategoryFilter !== 'all') ? 'block' : 'none';
  renderCal();
  initCalSwipe();
  startCalPolling();
}

let calPollInterval = null;

// Same rationale as homework's polling: the calendar is shared with the
// whole class, and a classmate (or an admin importing school holidays)
// adding an event while this page is already open otherwise only shows
// up the next time it's reopened. There's no websocket/push channel for
// this, so a quiet background poll is the low-risk way to make that show
// up reasonably soon instead. Self-stops once this page's own elements
// are gone, and skips while the tab/app isn't visible.
function startCalPolling() {
  if (calPollInterval) clearInterval(calPollInterval);
  calPollInterval = setInterval(async () => {
    if (!document.getElementById('cal-grid')) { clearInterval(calPollInterval); calPollInterval = null; return; }
    if (document.hidden) return;
    let fresh;
    if (calViewScope === 'all') {
      fresh = await API.events().catch(() => null);
    } else if (calDisplayMode === 'week') {
      const months = _calMonthsForWeek(calWeekAnchor);
      const results = await Promise.all([...months].map(m => API.events(m).catch(() => []))).catch(() => null);
      if (results) { const merged = new Map(); results.flat().forEach(e => merged.set(e.id, e)); fresh = [...merged.values()]; }
    } else {
      fresh = await API.events(calYear + '-' + String(calMonth + 1).padStart(2, '0')).catch(() => null);
    }
    if (!fresh || !document.getElementById('cal-grid')) return;
    if (JSON.stringify(fresh) !== JSON.stringify(calEvents)) {
      calEvents = fresh;
      if (calDisplayMode === 'week') renderCalWeekView();
      else if (calViewScope !== 'all') renderCalGridOnly(false); // no month-change entrance animation for a quiet background sync
      renderEventList();
    }
  }, 15000);
}

// Swipe left/right on the month card to step months, same direction
// convention as every native calendar app — left = forward, right = back.
// Deliberately requires a mostly-horizontal drag well past a small
// threshold, so a vertical scroll or tapping a day cell doesn't
// accidentally flip the month underneath the user.
function initCalSwipe() {
  const card = document.querySelector('.cal-card');
  if (!card) return;
  let startX = null, startY = null;
  card.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  card.addEventListener('touchend', (e) => {
    if (startX == null) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    startX = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      calNav(dx < 0 ? 1 : -1);
    }
  }, { passive: true });
}

// Matches the backend's rule exactly: a "personal" event is private to its
// creator (only they can even see it, per the class-wide visibility query),
// so it stays creator-only to edit/delete too. Every other event is
// already visible to the whole class, and any class member can now edit
// or delete it — not just the creator or an admin.
function calCanModifyEvent(ev) {
  if (!calCurrentUser) return false;
  if (ev.event_type === 'personal') return ev.created_by === calCurrentUser.id;
  return true;
}

async function loadCalSubjects() {
  try {
    calSubjects = await API.subjects();
  } catch {
    calSubjects = [];
  }
}

function _calMonday(d) {
  const day = (d.getDay() + 6) % 7; // 0=Mo ... 6=So
  const r = new Date(d);
  r.setDate(r.getDate() - day);
  r.setHours(0, 0, 0, 0);
  return r;
}
function _calAddDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function _calToMin(hhmm) {
  const parts = (hhmm || '0:0').split(':').map(Number);
  return parts[0] * 60 + (parts[1] || 0);
}

// The month(s) a given week's events could fall under — usually one, but a
// week straddling a month boundary needs both fetched and merged, since
// the events API is scoped to a single calendar month.
function _calMonthsForWeek(anchor) {
  const monday = _calMonday(anchor);
  const sunday = _calAddDays(monday, 6);
  return new Set([
    monday.getFullYear() + '-' + String(monday.getMonth() + 1).padStart(2, '0'),
    sunday.getFullYear() + '-' + String(sunday.getMonth() + 1).padStart(2, '0'),
  ]);
}

async function loadCalEvents() {
  try {
    if (calViewScope === 'all') {
      calEvents = await API.events(); // no month param -> every event for the class
    } else if (calDisplayMode === 'week') {
      const months = _calMonthsForWeek(calWeekAnchor);
      const results = await Promise.all([...months].map(m => API.events(m).catch(() => [])));
      const merged = new Map();
      results.flat().forEach(e => merged.set(e.id, e));
      calEvents = [...merged.values()];
    } else {
      const m = String(calMonth + 1).padStart(2, '0');
      calEvents = await API.events(calYear + '-' + m);
    }
  } catch {
    calEvents = [];
  }
}

function eventCoversDate(ev, dateStr) {
  const start = ev.date ? ev.date.slice(0, 10) : '';
  const end = ev.end_date ? ev.end_date.slice(0, 10) : start;
  return dateStr >= start && dateStr <= end;
}

function setCalCategoryFilter(cat) {
  activeCategoryFilter = cat;
  const dot = document.getElementById('cal-filter-dot');
  if (dot) dot.style.display = (cat === 'all' && calViewScope === 'month' && !calSearchQuery) ? 'none' : 'block';
  if (calViewScope !== 'all' && !calSearchQuery) renderCalGridOnly();
  renderEventList();
}

async function setCalViewScope(scope) {
  if (scope === calViewScope) return;
  calViewScope = scope;
  try { localStorage.setItem('cal_view_scope', scope); } catch {}
  selectedCalDate = null;
  const monthChip = document.getElementById('cal-chip-month');
  const allChip = document.getElementById('cal-chip-all');
  if (monthChip) monthChip.classList.toggle('active', scope === 'month');
  if (allChip) allChip.classList.toggle('active', scope === 'all');
  const chipsSlot = document.getElementById('cal-chips-slot');
  // Hide view chips while searching — search spans all months anyway.
  if (chipsSlot) chipsSlot.style.display = calSearchQuery ? 'none' : '';
  const dot = document.getElementById('cal-filter-dot');
  if (dot) dot.style.display = (scope === 'all' || activeCategoryFilter !== 'all' || calSearchQuery) ? 'block' : 'none';
  await loadCalEvents();
  renderCal();
}

const CAL_FILTER_OPTIONS = [
  { value: 'all', label: 'Alle Termine' },
  { value: 'exam', label: 'Klassenarbeiten' },
  { value: 'holiday', label: 'Ferien' },
  { value: 'trip', label: 'Ausflüge' },
  { value: 'personal', label: 'Persönlich' },
  { value: 'other', label: 'Sonstige' },
];
let calFilterMenuEl = null;

// A plain icon button in the header opens this instead of a labelled
// dropdown — reuses the app's .m3-dropdown-panel look (same portal-to-body
// positioning trick) so it still matches every other dropdown, just
// without a permanently-visible text trigger taking up header space.
function toggleCalFilterMenu(btn) {
  if (calFilterMenuEl) { closeCalFilterMenu(); return; }

  const panel = document.createElement('div');
  panel.className = 'm3-dropdown-panel dd-open';
  panel.innerHTML = `
    <div class="cal-filter-scope">
      <button type="button" data-scope="month" class="${calViewScope==='month'?'active':''}">Monat</button>
      <button type="button" data-scope="all" class="${calViewScope==='all'?'active':''}">Agenda</button>
    </div>
    <div style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;opacity:0.5;padding:4px 12px 2px;">Kategorie</div>
    ${CAL_FILTER_OPTIONS.map(o =>
      `<div class="m3-dropdown-opt${o.value === activeCategoryFilter ? ' dd-sel' : ''}" data-value="${o.value}">${o.label}</div>`
    ).join('')}
  `;
  document.body.appendChild(panel);
  calFilterMenuEl = panel;

  panel.querySelectorAll('[data-scope]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setCalViewScope(btn.dataset.scope);
      closeCalFilterMenu();
    });
  });

  const r = btn.getBoundingClientRect();
  panel.style.minWidth = '190px';
  panel.style.left = 'auto';
  panel.style.right = (window.innerWidth - r.right) + 'px';
  const spaceBelow = window.innerHeight - r.bottom - 8;
  if (spaceBelow >= 220 || spaceBelow >= r.top) {
    panel.style.top = (r.bottom + 6) + 'px';
  } else {
    panel.style.bottom = (window.innerHeight - r.top + 6) + 'px';
  }

  panel.querySelectorAll('.m3-dropdown-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      setCalCategoryFilter(opt.dataset.value);
      closeCalFilterMenu();
    });
  });

  setTimeout(() => document.addEventListener('click', onCalFilterMenuOutsideClick), 0);
}

function onCalFilterMenuOutsideClick(e) {
  if (calFilterMenuEl && !calFilterMenuEl.contains(e.target) && !e.target.closest('#cal-filter-btn')) {
    closeCalFilterMenu();
  }
}

function closeCalFilterMenu() {
  if (calFilterMenuEl) { calFilterMenuEl.remove(); calFilterMenuEl = null; }
  document.removeEventListener('click', onCalFilterMenuOutsideClick);
}

function selectDay(dateStr) {
  if (selectedCalDate === dateStr) {
    selectedCalDate = null; // Toggle off if clicked again
  } else {
    selectedCalDate = dateStr;
  }
  renderCalGridOnly();
  renderEventList();
}

async function calToday() {
  const today = new Date();
  calYear = today.getFullYear();
  calMonth = today.getMonth();
  calWeekAnchor = today;
  selectedCalDate = localDateStr(today);
  await loadCalEvents();
  renderCal();
}

async function calNav(dir) {
  if (calDisplayMode === 'week') { await calWeekNav(dir); return; }
  calMonth += dir;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  selectedCalDate = null;
  await loadCalEvents();
  renderCal(dir);
}

async function calWeekNav(dir) {
  calWeekAnchor = _calAddDays(calWeekAnchor, dir * 7);
  await loadCalEvents();
  renderCal(dir);
}

// Switches between the existing month-grid+list layout and the new
// Google Calendar-style hourly week grid. 'all' (every upcoming event,
// no day-grid at all) has no meaning for a specific week, so entering
// week mode quietly drops back to 'month' scope first.
async function toggleCalDisplayMode() {
  calDisplayMode = calDisplayMode === 'week' ? 'month' : 'week';
  try { localStorage.setItem('cal_display_mode', calDisplayMode); } catch {}
  if (calDisplayMode === 'week') {
    if (calViewScope === 'all') {
      calViewScope = 'month';
      try { localStorage.setItem('cal_view_scope', 'month'); } catch {}
    }
    calWeekAnchor = selectedCalDate ? new Date(selectedCalDate + 'T00:00') : new Date();
  } else {
    calYear = calWeekAnchor.getFullYear();
    calMonth = calWeekAnchor.getMonth();
  }
  await loadCalEvents();
  renderCal();
}

function renderCal(dir) {
  const leftPane = document.querySelector('.cal-left-pane');
  const navRow = document.querySelector('.cal-nav-row');
  const chipsSlot = document.getElementById('cal-chips-slot');
  const mainContainer = document.querySelector('.cal-main-container');
  const weekView = document.getElementById('cal-week-view');
  const viewIcon = document.getElementById('cal-viewmode-icon');
  const viewBtn = document.getElementById('cal-viewmode-btn');

  if (viewIcon) viewIcon.setAttribute('data-lucide', calDisplayMode === 'week' ? 'layout-grid' : 'calendar-days');
  if (viewBtn) viewBtn.title = calDisplayMode === 'week' ? 'Monatsansicht' : 'Wochenansicht';

  // A search result list spans however many months match, same as Agenda —
  // neither a single month's grid, the week grid, nor stepping through
  // either makes sense while search is active, so all three hide, leaving
  // just the filter/view-mode buttons.
  const showWeek = calDisplayMode === 'week' && !calSearchQuery;
  const showGrid = !showWeek && calViewScope === 'month' && !calSearchQuery;

  if (mainContainer) mainContainer.style.display = showWeek ? 'none' : '';
  if (weekView) weekView.style.display = showWeek ? 'block' : 'none';
  if (chipsSlot) chipsSlot.style.display = (calSearchQuery || showWeek) ? 'none' : '';

  if (showWeek) {
    const monday = _calMonday(calWeekAnchor);
    const sunday = _calAddDays(monday, 6);
    const MONTHS_SHORT = ['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sept.','Okt.','Nov.','Dez.'];
    document.getElementById('cal-month-title').textContent = monday.getMonth() === sunday.getMonth()
      ? `${monday.getDate()}. – ${sunday.getDate()}. ${MONTHS_SHORT[monday.getMonth()]}`
      : `${monday.getDate()}. ${MONTHS_SHORT[monday.getMonth()]} – ${sunday.getDate()}. ${MONTHS_SHORT[sunday.getMonth()]}`;
    document.getElementById('cal-year-label').textContent = String(sunday.getFullYear());
    if (navRow) [...navRow.children].forEach(c => { c.style.display = ''; });
    renderCalWeekView();
    if (window.lucide) lucide.createIcons();
    return;
  }

  if (!showGrid) {
    if (leftPane) leftPane.style.display = 'none';
    document.getElementById('cal-month-title').textContent = calSearchQuery ? 'Suche' : 'Agenda';
    document.getElementById('cal-year-label').textContent = calSearchQuery ? '' : 'Kommende Termine';
    if (navRow) [...navRow.children].forEach(c => {
      if (c.id !== 'cal-filter-btn' && c.id !== 'cal-header-search-btn' && c.id !== 'cal-viewmode-btn') c.style.display = 'none';
    });
  } else {
    if (leftPane) leftPane.style.display = '';
    const months = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
    document.getElementById('cal-month-title').textContent = months[calMonth];
    document.getElementById('cal-year-label').textContent = String(calYear);
    if (navRow) [...navRow.children].forEach(c => { c.style.display = ''; });
    renderCalGridOnly(true, dir);
  }
  renderEventList();
}

// animate: only for an actual month change (arrows, "Heute") — day-select
// and category-filter re-renders call this without it, since fading the
// whole grid on every single day tap would feel busier than helpful.
function renderCalGridOnly(animate, dir) {
  const grid = document.getElementById('cal-grid');
  if (!grid) return;

  const build = () => { grid.innerHTML = ''; _buildCalGrid(grid); };

  // A real month change (arrows, swipe) gets a directional slide — old
  // month exits the way you navigated, new one enters from the other side.
  // "Heute" and other non-directional refreshes (day-select, filter,
  // background sync, after creating/editing something) keep the simpler
  // fade+lift, or no animation at all for the quiet ones.
  if (dir) { slideNav(grid, dir, build); return; }
  if (animate) {
    grid.classList.remove('cal-grid-enter');
    void grid.offsetWidth;
    grid.classList.add('cal-grid-enter');
  }
  build();
}

function _buildCalGrid(grid) {
  const first = new Date(calYear, calMonth, 1);
  const startDay = (first.getDay() + 6) % 7; // 0=Mo ... 6=So
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const prevDays = new Date(calYear, calMonth, 0).getDate();
  const todayStr = localDateStr();

  // Leading days from previous month
  for (let i = startDay - 1; i >= 0; i--) {
    const d = document.createElement('div');
    d.className = 'cal-day muted';
    d.innerHTML = `<span class="cal-day-num">${prevDays - i}</span>`;
    grid.appendChild(d);
  }

  // Days of current month
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = calYear + '-' + String(calMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    // Same category filter as the events list below — a dot for an event
    // that's currently filtered out would be showing something the list
    // doesn't, so it disappears here too instead of just staying visible.
    const covering = calEvents.filter(e =>
      eventCoversDate(e, dateStr) &&
      (activeCategoryFilter === 'all' || (e.event_type || 'other') === activeCategoryFilter)
    );
    const hasEvent = covering.length > 0;
    const isToday = dateStr === todayStr;
    const isSelected = selectedCalDate === dateStr;

    const el = document.createElement('div');
    let cls = 'cal-day';
    if (isToday) cls += ' today';
    if (isSelected) cls += ' selected';

    el.className = cls;

    let dotsHtml = '';
    if (hasEvent) {
      const maxDots = 3;
      const dotsToShow = covering.slice(0, maxDots);
      const dotsTags = dotsToShow.map(ev => {
        const type = ev.event_type || 'other';
        return `<span class="cal-dot cal-dot-${type}" title="${escapeHtml(ev.title)}"></span>`;
      }).join('');

      let moreTag = '';
      if (covering.length > maxDots) {
        moreTag = `<span class="cal-dot-more">+${covering.length - maxDots + 1}</span>`;
      }
      dotsHtml = `<div class="cal-dots-wrap">${dotsTags}${moreTag}</div>`;
    }

    el.innerHTML = `<span class="cal-day-num">${d}</span>${dotsHtml}`;
    el.onclick = () => selectDay(dateStr);
    grid.appendChild(el);
  }

}

// --- Week view (hourly time-grid) ---

const CAL_WEEK_PX_PER_MIN = 1.4;
const CAL_WEEK_MIN_BLOCK_H = 30;
// Calendar events only ever have a single optional time, never a duration
// (unlike Timetable's lessons, which have real start/end times) — this is
// purely a rendering assumption for how tall a timed event's block looks,
// it isn't stored or sent anywhere.
const CAL_WEEK_EVENT_DURATION_MIN = 60;
const CAL_WEEKDAY_SHORT = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const CAL_TYPE_SOLID = { exam: '#ba1a1a', holiday: '#8a5a00', trip: '#006d3a', personal: '#006399', other: '#6750a4' };

function calEventColors(ev) {
  return { bg: CAL_TYPE_SOLID[ev.event_type] || CAL_TYPE_SOLID.other, color: '#ffffff' };
}

// Long-press-menu style click target for a week-view event: same
// permission check the list's edit/delete menu already uses (personal
// events are creator-only, everything else is open to the whole class) —
// a read-only user gets a quick toast instead of a dead click.
function calWeekEventClick(id) {
  const ev = calEvents.find(e => e.id === id);
  if (!ev) return;
  if (calCanModifyEvent(ev)) openEditEventSheet(id);
  else showToast(ev.title + (ev.time ? ' · ' + ev.time + ' Uhr' : ''));
}

function renderCalWeekView() {
  const grid = document.getElementById('cal-week-grid');
  const alldayRow = document.getElementById('cal-week-allday-row');
  if (!grid) return;

  const monday = _calMonday(calWeekAnchor);
  const days = Array.from({ length: 7 }, (_, i) => _calAddDays(monday, i));
  const dayStrs = days.map(d => localDateStr(d));
  const todayStr = localDateStr();

  // Split each day's covering events into "timed" (gets a positioned block
  // in the hourly grid) vs "all-day" (no time at all, or spans multiple
  // days) — the same split Google Calendar's own all-day row above the
  // grid uses. Keyed per-day so a multi-day event's chip correctly repeats
  // across every day it covers instead of only appearing once.
  const timedByDay = dayStrs.map(() => []);
  const alldayEvents = new Map();
  days.forEach((d, i) => {
    const ds = dayStrs[i];
    calEvents.forEach(ev => {
      if (!eventCoversDate(ev, ds)) return;
      if (activeCategoryFilter !== 'all' && (ev.event_type || 'other') !== activeCategoryFilter) return;
      const isMulti = Boolean(ev.end_date && ev.end_date !== ev.date);
      if (ev.time && !isMulti) timedByDay[i].push(ev);
      else alldayEvents.set(ev.id + '-' + ds, ev);
    });
  });

  alldayRow.innerHTML = alldayEvents.size ? '<div></div>' + days.map((d, i) => {
    const ds = dayStrs[i];
    return [...alldayEvents.values()].filter(ev => eventCoversDate(ev, ds)).map(ev => {
      const { bg, color } = calEventColors(ev);
      return `<div class="cal-week-allday-chip" style="background:${bg};color:${color};" onclick="calWeekEventClick(${ev.id})" title="${escapeHtml(ev.title)}">${escapeHtml(ev.title)}</div>`;
    }).join('');
  }).join('') : '';

  // Time range: like Timetable's week view, derive from what's actually
  // scheduled this week (rounded out to whole hours), falling back to a
  // sensible default range when there's nothing timed at all.
  const allTimed = timedByDay.flat();
  let minStart = allTimed.length ? Math.min(...allTimed.map(e => _calToMin(e.time))) : 8 * 60;
  let maxEnd = allTimed.length ? Math.max(...allTimed.map(e => _calToMin(e.time) + CAL_WEEK_EVENT_DURATION_MIN)) : 16 * 60;
  minStart = Math.floor(minStart / 60) * 60;
  maxEnd = Math.max(Math.ceil(maxEnd / 60) * 60, minStart + 60);
  const gridHeight = (maxEnd - minStart) * CAL_WEEK_PX_PER_MIN;

  let hourLines = '';
  for (let m = minStart; m <= maxEnd; m += 60) {
    hourLines += `<div class="cal-week-hourline" style="top:${(m - minStart) * CAL_WEEK_PX_PER_MIN}px;"></div>`;
  }

  let axisHtml = `<div style="position:relative;height:${gridHeight}px;">`;
  for (let m = minStart; m <= maxEnd; m += 60) {
    axisHtml += `<div class="cal-week-hour-label" style="top:${(m - minStart) * CAL_WEEK_PX_PER_MIN - 6}px;">${Math.floor(m / 60)}</div>`;
  }
  axisHtml += '</div>';

  const headerHtml = '<div></div>' + days.map((d, i) => {
    const isToday = dayStrs[i] === todayStr;
    return `<div class="cal-week-day-header${isToday ? ' is-today' : ''}">${CAL_WEEKDAY_SHORT[i]} ${d.getDate()}.</div>`;
  }).join('');

  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();

  const colsHtml = days.map((d, i) => {
    const ds = dayStrs[i];
    const isToday = ds === todayStr;
    const blocks = timedByDay[i].map(ev => {
      const top = (_calToMin(ev.time) - minStart) * CAL_WEEK_PX_PER_MIN;
      const height = Math.max(CAL_WEEK_EVENT_DURATION_MIN * CAL_WEEK_PX_PER_MIN, CAL_WEEK_MIN_BLOCK_H);
      const { bg, color } = calEventColors(ev);
      return `<div class="cal-week-event-block" style="top:${top}px;height:${height}px;background:${bg};color:${color};" onclick="event.stopPropagation();calWeekEventClick(${ev.id})">`
        + `<span>${escapeHtml(ev.title)}</span>`
        + `<span class="cal-week-event-time">${ev.time} Uhr</span>`
        + `</div>`;
    }).join('');
    let nowLine = '';
    if (isToday && nowMin >= minStart && nowMin <= maxEnd) {
      nowLine = `<div class="cal-week-now-line" style="top:${(nowMin - minStart) * CAL_WEEK_PX_PER_MIN}px;"></div>`;
    }
    // Clicking empty space in a day column starts a new event pre-filled
    // with that date — event blocks stop the click from bubbling here via
    // stopPropagation above, so this only fires on a genuinely empty tap.
    return `<div class="cal-week-day-col${isToday ? ' is-today' : ''}" style="height:${gridHeight}px;" onclick="openNewEventSheet('${ds}')">${hourLines}${blocks}${nowLine}</div>`;
  }).join('');

  grid.innerHTML = headerHtml + axisHtml + colsHtml;
  if (window.lucide) lucide.createIcons();
}

function renderEventList() {
  const list = document.getElementById('cal-events-list');
  const headerEl = document.getElementById('cal-events-header');
  const emptyEl = document.getElementById('cal-no-events');
  const dayChipSlot = document.getElementById('cal-day-chip-slot');
  if (!list) return;

  let pool;
  if (calSearchQuery) {
    const q = calSearchQuery.toLowerCase();
    pool = calSearchPool.filter(e =>
      (e.title || '').toLowerCase().includes(q) || (e.description || '').toLowerCase().includes(q)
    );
  } else if (calViewScope === 'all') {
    // Agenda: every event that hasn't fully passed yet.
    const todayStr = localDateStr();
    pool = calEvents.filter(e => (e.end_date || e.date || '').slice(0, 10) >= todayStr);
  } else {
    const monthStart = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-01`;
    const lastDay = new Date(calYear, calMonth + 1, 0).getDate();
    const monthEnd = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
    pool = calEvents.filter(e => {
      const s = (e.date || '').slice(0, 10);
      const end = (e.end_date || s).slice(0, 10);
      return s <= monthEnd && end >= monthStart;
    });
    if (selectedCalDate) {
      pool = pool.filter(e => eventCoversDate(e, selectedCalDate));
    }
  }

  if (activeCategoryFilter !== 'all') {
    pool = pool.filter(e => (e.event_type || 'other') === activeCategoryFilter);
  }

  pool.sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.time || '').localeCompare(b.time || ''));

  const isMonthView = !calSearchQuery && calViewScope !== 'all';
  if (isMonthView) {
    const todayStr0 = localDateStr();
    const upcoming = [], past = [];
    pool.forEach(e => ((e.end_date || e.date || '').slice(0, 10) < todayStr0 ? past : upcoming).push(e));
    pool = upcoming.concat(past);
  }

  // Selected-day chip — clear way back to the full month list.
  if (dayChipSlot) {
    if (isMonthView && selectedCalDate) {
      const d = new Date(selectedCalDate + 'T00:00');
      const label = d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
      dayChipSlot.style.display = 'block';
      dayChipSlot.innerHTML = `
        <div class="cal-day-chip">
          <span>${label}</span>
          <button type="button" class="cal-day-chip-clear" onclick="selectDay('${selectedCalDate}')" title="Tagesfilter aufheben">
            <i data-lucide="x"></i>
          </button>
        </div>`;
    } else {
      dayChipSlot.style.display = 'none';
      dayChipSlot.innerHTML = '';
    }
  }

  const headerLabel = calSearchQuery
    ? 'Suchergebnisse'
    : (calViewScope === 'all'
        ? (activeCategoryFilter === 'all' ? 'Kommende Termine' : 'Gefilterte Agenda')
        : (selectedCalDate
            ? 'Termine an diesem Tag'
            : (activeCategoryFilter === 'all' ? 'Termine dieses Monats' : 'Gefilterte Termine')));
  headerEl.innerHTML = `
    <div class="cal-list-header">
      <div class="cal-list-header-label">${headerLabel}</div>
      <span class="cal-list-header-count">${pool.length} ${pool.length === 1 ? 'Eintrag' : 'Einträge'}</span>
    </div>
  `;

  if (pool.length === 0) {
    list.innerHTML = '';
    emptyEl.style.display = 'block';
    const emptyTitle = document.getElementById('cal-empty-title');
    const emptySub = document.getElementById('cal-empty-sub');
    if (calSearchQuery) {
      emptyTitle.textContent = 'Nichts gefunden';
      emptySub.textContent = `Kein Termin passt zu „${calSearchQuery}".`;
    } else if (calViewScope === 'all') {
      emptyTitle.textContent = 'Keine kommenden Termine';
      emptySub.textContent = activeCategoryFilter === 'all'
        ? 'Es stehen aktuell keine Termine an.'
        : 'Keine kommenden Termine in dieser Kategorie.';
    } else if (selectedCalDate) {
      const d = new Date(selectedCalDate + 'T00:00');
      const f = d.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' });
      emptyTitle.textContent = `Keine Termine am ${f}`;
      emptySub.textContent = `Für diesen Tag ist bisher noch nichts eingetragen.`;
    } else {
      emptyTitle.textContent = 'Keine Termine gefunden';
      emptySub.textContent = activeCategoryFilter === 'all'
        ? 'In diesem Monat stehen keine Termine an.'
        : 'Keine Termine in dieser Kategorie vorhanden.';
    }
  } else {
    emptyEl.style.display = 'none';
    const subMap = Object.fromEntries((calSubjects || []).map(s => [s.id, s]));
    const todayStr = localDateStr();

    list.innerHTML = pool.map(e => {
      const isEvToday = eventCoversDate(e, todayStr);
      const isPastEvent = isMonthView && (e.end_date || e.date || '').slice(0, 10) < todayStr;
      const isMulti = Boolean(e.end_date && e.end_date !== e.date);
      const canEdit = calCanModifyEvent(e);

      const sDate = new Date(e.date + 'T00:00');
      const dayNum = sDate.getDate();
      const weekday = sDate.toLocaleDateString('de-DE', { weekday: 'short' });

      let dayLabel = sDate.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' });
      if (isMulti) {
        const eDate = new Date(e.end_date + 'T00:00');
        dayLabel = `${sDate.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' })} – ${eDate.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' })}`;
      }

      let typeLabel = 'Sonstiges';
      let typeColor = '#6750a4';
      let typeBg = 'rgba(103, 80, 164, 0.1)';
      if (e.event_type === 'exam') {
        typeLabel = 'Klassenarbeit'; typeColor = '#ba1a1a'; typeBg = 'rgba(186, 26, 26, 0.1)';
      } else if (e.event_type === 'holiday') {
        typeLabel = 'Schulferien'; typeColor = '#8a5a00'; typeBg = 'rgba(138, 90, 0, 0.1)';
      } else if (e.event_type === 'trip') {
        typeLabel = 'Ausflug'; typeColor = '#006d3a'; typeBg = 'rgba(0, 109, 58, 0.1)';
      } else if (e.event_type === 'personal') {
        typeLabel = 'Persönlich'; typeColor = '#006399'; typeBg = 'rgba(0, 99, 153, 0.1)';
      }

      const subObj = e.subject_id ? subMap[e.subject_id] : null;
      const subName = subObj ? (subObj.name || subObj.short_name) : null;
      const subColor = subObj ? (subObj.color || '#ede7f6') : null;

      const personalNote = e.event_type === 'personal'
        ? `<span class="cal-personal-note"><i data-lucide="lock"></i> Nur für dich</span>`
        : '';
      const subjectBadge = subName
        ? `<span class="cal-subject-badge" style="background:${subColor || '#ede7f6'};">${escapeHtml(subName)}</span>`
        : '';

      const cardClick = canEdit
        ? `onclick="openEditEventSheet(${e.id})"`
        : '';
      const clickable = canEdit ? ' is-clickable' : '';
      const pastCls = isPastEvent ? ' is-past' : '';

      return `
        <div class="m3-card cal-event-card list-card-enter${clickable}${pastCls}" data-id="${e.id}" ${cardClick}>
          <div class="cal-event-body">
            <div class="ev-date-badge ${isEvToday ? 'is-today' : ''}">
              <span class="ev-date-num">${dayNum}</span>
              <span class="ev-date-wd">${weekday}</span>
            </div>
            <div class="cal-event-main">
              <div class="cal-event-tags">
                <span class="ev-category-pill" style="background:${typeBg};color:${typeColor};">${typeLabel}</span>
                ${subjectBadge}
                ${personalNote}
              </div>
              <div class="cal-event-title">${escapeHtml(e.title)}</div>
              <div class="cal-event-meta">
                <i data-lucide="calendar"></i>
                <span>${dayLabel}</span>
                ${e.time ? `<span style="opacity:0.4;">·</span><i data-lucide="clock"></i><span>${e.time} Uhr</span>` : ''}
              </div>
              ${e.description ? `<div class="cal-event-desc">${escapeHtml(e.description)}</div>` : ''}
            </div>
          </div>
          <div class="cal-event-actions" onclick="event.stopPropagation()">
            ${canEdit ? moreMenuBtn(`openCalEventMenu(this, ${e.id})`) : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  if (window.lucide) lucide.createIcons();
}

function openCalEventMenu(btn, eventId) {
  toggleMoreMenu(btn, [
    { icon: 'pencil', label: 'Bearbeiten', onclick: () => openEditEventSheet(eventId) },
    { icon: 'trash-2', label: 'Löschen', onclick: () => confirmDelEvent(eventId), danger: true },
  ]);
}

function setEventRangeMode(isRange) {
  const btnSingle = document.getElementById('ev-mode-single');
  const btnRange = document.getElementById('ev-mode-range');
  const wrap = document.getElementById('ev-end-date-wrap');
  const startLbl = document.getElementById('ev-start-label');

  if (btnSingle) btnSingle.classList.toggle('active', !isRange);
  if (btnRange) btnRange.classList.toggle('active', isRange);
  if (startLbl) startLbl.textContent = isRange ? 'Startdatum (Ab):' : 'Datum:';

  if (wrap) {
    wrap.style.display = isRange ? 'block' : 'none';
    if (isRange) {
      const startVal = document.getElementById('ev-date')?.value;
      const endInput = document.getElementById('ev-end-date');
      if (startVal && endInput && (!endInput.value || endInput.value < startVal)) {
        endInput.value = startVal;
      }
      if (typeof enhanceDateTimeInputs === 'function') enhanceDateTimeInputs(wrap);
    }
  }
}

function toggleEventTime() {
  const btn = document.getElementById('ev-time-toggle');
  const wrap = document.getElementById('ev-time-wrap');
  if (wrap) {
    wrap.style.display = 'block';
    if (btn) btn.style.display = 'none';
    if (typeof enhanceDateTimeInputs === 'function') enhanceDateTimeInputs(wrap);
  }
}

// Dauer/Kategorie/Uhrzeit start collapsed behind "Weitere Optionen" so the
// sheet opens with just title + date instead of every field at once — they
// were already enhanced (dropdowns, date/time inputs) when the sheet itself
// opened, hidden or not, so revealing the wrapper here is enough.
function toggleEventMore() {
  const wrap = document.getElementById('ev-more-wrap');
  const toggleWrap = document.getElementById('ev-more-toggle-wrap');
  if (wrap) wrap.style.display = 'block';
  if (toggleWrap) toggleWrap.style.display = 'none';
}

  await loadCalSubjects();
  const today = defaultDate || selectedCalDate || localDateStr();
  const subOpts = (calSubjects || []).map(s => `<option value="${s.id}">${escapeHtml(s.name || s.short_name || '')}</option>`).join('');

  openSheet(`
    <div class="sheet-title" style="font-size:1.25rem;font-weight:800;color:#1c1b1f;margin-bottom:16px;">Neuer Termin</div>

    <div class="m3-field">
      <label class="m3-field-label">Titel des Termins:</label>
      <input class="m3-input" id="ev-title" placeholder="z. B. Mathearbeit, Schulausflug, Zahnarzt...">
    </div>

    <div class="m3-field">
      <label class="m3-field-label">Beschreibung (optional):</label>
      <textarea class="m3-input" id="ev-description" rows="3" placeholder="Weitere Details zum Termin..." style="resize:none;height:auto;font-family:inherit;line-height:1.4;"></textarea>
    </div>

    <div class="m3-field" id="ev-start-date-wrap">

    </div>

    <div id="ev-end-date-wrap" class="m3-field" style="display:none;">
      <label class="m3-field-label">Enddatum (Bis einschließlich):</label>
      <input class="m3-input" id="ev-end-date" type="date" value="${today}">
    </div>

    <div class="m3-field">
      <label class="m3-field-label">Kategorie:</label>
      <select class="m3-select" id="ev-type">
        <option value="other">Sonstiges</option>
        <option value="exam">Klassenarbeit</option>
        <option value="trip">Ausflug / Klassenfahrt</option>
        <option value="holiday">Ferien</option>
        <option value="personal">Persönlich (nur für dich sichtbar)</option>
      </select>
    </div>

    <div id="ev-subject-row" class="m3-field" style="display:none;">
      <label class="m3-field-label">Fach für die Klassenarbeit:</label>

    <!-- Dauer and Uhrzeit default to Einzelner Tag / ohne Uhrzeit for most
         events, so they stay collapsed behind one toggle instead of

         primary field, not a secondary one. -->
    <div class="m3-field" id="ev-more-toggle-wrap">
      <button type="button" id="ev-more-toggle" class="m3-inline-toggle m3-more-toggle" onclick="toggleEventMore()">
        <span style="display:flex;align-items:center;gap:6px;"><i data-lucide="sliders-horizontal" style="width:16px;height:16px;"></i> Weitere Optionen</span>
        <i data-lucide="chevron-down" style="width:16px;height:16px;"></i>
      </button>
    </div>

    <div id="ev-more-wrap" style="display:none;">
      <div class="m3-field">
        <label class="m3-field-label">Dauer:</label>
        <div class="ev-segmented-wrap">
          <button type="button" id="ev-mode-single" class="ev-seg-btn active" onclick="setEventRangeMode(false)">
            <i data-lucide="calendar" style="width:16px;height:16px;"></i>
            <span>Einzelner Tag</span>
          </button>
          <button type="button" id="ev-mode-range" class="ev-seg-btn" onclick="setEventRangeMode(true)">
            <i data-lucide="calendar-range" style="width:16px;height:16px;"></i>
            <span>Zeitraum (mehrere Tage)</span>
          </button>
        </div>
      </div>

      <div class="m3-field">
        <button type="button" id="ev-time-toggle" class="m3-inline-toggle" onclick="toggleEventTime()">

        </button>
        <div id="ev-time-wrap" style="display:none;margin-top:6px;">
          <label class="m3-field-label">Uhrzeit:</label>
          <input class="m3-input" id="ev-time" type="time" placeholder="Uhrzeit (optional)">
        </div>
      </div>
    </div>

    ${sheetActions({ saveAction: 'saveEvent()' })}
  `);

  const typeEl = document.getElementById('ev-type');
  const subRow = document.getElementById('ev-subject-row');
  if (typeEl && subRow) {
    typeEl.addEventListener('change', () => {
      const isExam = typeEl.value === 'exam';
      subRow.style.display = isExam ? 'block' : 'none';
    });

async function saveEvent() {
  const title = document.getElementById('ev-title').value.trim();
  const date = document.getElementById('ev-date').value;
  if (!title || !date) { showToast('Titel und Datum erforderlich'); return; }

  const description = document.getElementById('ev-description').value.trim() || null;
  const isRange = document.getElementById('ev-mode-range')?.classList.contains('active');
  const endVal = document.getElementById('ev-end-date')?.value;
  const end_date = isRange && endVal && endVal >= date ? endVal : (isRange && endVal ? date : null);

  const event_type = document.getElementById('ev-type').value;
  const subEl = document.getElementById('ev-subject');
  const subject_id = (event_type === 'exam' && subEl && subEl.value) ? parseInt(subEl.value, 10) : null;
  const timeEl = document.getElementById('ev-time');
  const time = (timeEl && timeEl.value) ? timeEl.value : null;

  try {
    await API.createEvent({ title, description, date, end_date, time, event_type, subject_id });
    closeSheet();
    await loadCalEvents();
    renderCal();
    showToast('Termin gespeichert');
  } catch {
    showToast('Fehler beim Speichern');
  }
}

          </button>
          <button type="button" id="ev-mode-range" class="ev-seg-btn ${isRange ? 'active' : ''}" onclick="setEventRangeMode(true)">
            <i data-lucide="calendar-range" style="width:16px;height:16px;"></i>
            <span>Zeitraum (mehrere Tage)</span>
          </button>
        </div>
      </div>

      <div class="m3-field">
        <button type="button" id="ev-time-toggle" class="m3-inline-toggle" style="display:${hasTime ? 'none' : 'flex'};" onclick="toggleEventTime()">
          <i data-lucide="clock" style="width:16px;height:16px;"></i> + Uhrzeit hinzufügen (optional)
        </button>
        <div id="ev-time-wrap" style="display:${hasTime ? 'block' : 'none'};margin-top:6px;">
          <label class="m3-field-label">Uhrzeit:</label>
          <input class="m3-input" id="ev-time" type="time" placeholder="Uhrzeit (optional)" value="${ev.time || ''}">
        </div>
      </div>
    </div>

    ${sheetActions({ saveAction: `saveEditedEvent(${ev.id})` })}
  `);

  const typeEl = document.getElementById('ev-type');
  const subRow = document.getElementById('ev-subject-row');
  if (typeEl && subRow) {
    typeEl.addEventListener('change', () => {
      const isExam = typeEl.value === 'exam';
      subRow.style.display = isExam ? 'block' : 'none';
    });
  }
}

async function saveEditedEvent(eventId) {
  const title = document.getElementById('ev-title').value.trim();
  const date = document.getElementById('ev-date').value;
  if (!title || !date) { showToast('Titel und Datum erforderlich'); return; }

  const description = document.getElementById('ev-description').value.trim() || null;
  const isRange = document.getElementById('ev-mode-range')?.classList.contains('active');
  const endVal = document.getElementById('ev-end-date')?.value;
  const end_date = isRange && endVal && endVal >= date ? endVal : (isRange && endVal ? date : null);

  const event_type = document.getElementById('ev-type').value;
  const subEl = document.getElementById('ev-subject');
  const subject_id = (event_type === 'exam' && subEl && subEl.value) ? parseInt(subEl.value, 10) : null;
  const timeEl = document.getElementById('ev-time');
  const time = (timeEl && timeEl.value) ? timeEl.value : null;

  try {
    await API.updateEvent(eventId, { title, description, date, end_date, time, event_type, subject_id });
    closeSheet();
    await loadCalEvents();
    renderCal();
    showToast('Termin aktualisiert');
  } catch {
    showToast('Fehler beim Aktualisieren');
  }
}

function confirmDelEvent(eventId) {
  const ev = calEvents.find(x => x.id === eventId);
  const title = ev ? escapeHtml(ev.title) : 'diesen Termin';

  openModal(confirmDelete({
    title: 'Termin löschen?',
    message: `Willst du das wirklich löschen?<br><span style="font-weight:700;color:#1c1b1f;display:inline-block;margin-top:6px;">„${title}“</span>`,
    onConfirm: `doDelEvent(${eventId})`,
  }));
}

async function doDelEvent(eventId) {
  closeModal();
  animateCardRemoval(document.getElementById('cal-events-list'), eventId);
  try {
    await API.deleteEvent(eventId);
    calEvents = calEvents.filter(e => e.id !== eventId);
    showToast('Termin gelöscht');
  } catch {
    showToast('Fehler beim Löschen');
  }
  renderCalGridOnly(false); // dots on the grid can change too — no month-change animation for a single delete
  renderEventList();
}
</script>
