<div class="page" id="page-chat" style="background:#f4fbf5;">
  <div class="page-header">
    <button class="back-btn"><i data-lucide="arrow-left" style="width:22px;height:22px;"></i></button>
    <span class="page-title">Chat</span>
    <div style="flex:1;"></div>
    <button onclick="openNewChatSheet()" style="background:#c4eed0;border:none;border-radius:14px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:0.85rem;font-family:inherit;display:flex;align-items:center;gap:6px;">
      <i data-lucide="message-square-plus" style="width:16px;height:16px;"></i> + Neu
    </button>
  </div>

  <div class="page-scroll-1col">
  <div class="page-inner">
    <div id="chat-rooms-list"></div>
    <div id="chat-empty" style="display:none;text-align:center;padding:60px 20px;opacity:0.4;">
      <i data-lucide="message-circle" style="width:48px;height:48px;margin-bottom:12px;"></i>
      <div>Noch keine Chats</div>
    </div>
  </div>
  </div>
  <template id="tpl-chat-room">
    <div class="page" id="page-chat-room" style="background:#f4fbf5;">
      <div class="page-header" style="padding-bottom:12px; display:flex; align-items:center; gap:8px;">
        <button class="icon-btn" onclick="event.stopPropagation(); event.preventDefault(); roomBack();"><i data-lucide="arrow-left" style="width:22px;height:22px;"></i></button>
        <div class="avatar" id="room-avatar" style="background:#6750a4;width:36px;height:36px;font-size:0.8rem;"></div>
        <span id="room-title" style="font-weight:700;font-size:1.1rem; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
        <button id="room-mute-btn" onclick="toggleMuteActiveRoom()" class="icon-btn" style="color:#49454f; display:flex; align-items:center; justify-content:center; padding:8px;">
          <i data-lucide="volume-2" style="width:20px;height:20px;"></i>
        </button>
      </div>
      <div id="chat-messages" style="flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 80px 16px;display:flex;flex-direction:column;"></div>
      <div class="composer-wrap" id="composer-wrap">
        <div class="composer-context" id="reply-edit-bar" style="display:none;"></div>
        <div class="input-bar" id="input-bar-normal" style="position:static;">
          <button onclick="startRecording()" id="rec-btn" style="background:none;border:none;cursor:pointer;color:#49454f;padding:4px;">
            <i data-lucide="mic" style="width:20px;height:20px;"></i>
          </button>
          <input id="chat-input" placeholder="Nachricht…" onkeydown="if(event.key==='Enter')sendMsg(); if(event.key==='Escape'){cancelReply();cancelEdit();}">
          <label style="cursor:pointer;padding:4px;color:#49454f;">
            <i data-lucide="paperclip" style="width:20px;height:20px;"></i>
            <input type="file" style="display:none;" onchange="sendFile(this.files[0])">
          </label>
          <button class="send-btn" onclick="sendMsg()">
            <i data-lucide="send" style="width:18px;height:18px;"></i>
          </button>
        </div>
        <div class="input-bar recording-bar" id="recording-bar" style="position:static;display:none;">
          <button onclick="cancelRecording()" style="background:none;border:none;cursor:pointer;color:#b3261e;padding:4px;">
            <i data-lucide="trash-2" style="width:20px;height:20px;"></i>
          </button>
          <div class="rec-indicator">
            <span class="rec-dot"></span>
            <span id="rec-timer">0:00</span>
          </div>
          <div class="rec-wave" id="rec-wave"></div>
          <button id="rec-pause-btn" onclick="toggleRecordingPause()" style="background:none;border:none;cursor:pointer;color:#49454f;padding:4px;">
            <i data-lucide="pause" style="width:18px;height:18px;"></i>
          </button>
          <button class="send-btn" onclick="finishRecordingToPreview()">
            <i data-lucide="check" style="width:18px;height:18px;"></i>
          </button>
        </div>
        <div class="input-bar preview-bar" id="preview-bar" style="position:static;display:none;">
          <button onclick="discardPreview()" style="background:none;border:none;cursor:pointer;color:#b3261e;padding:4px;">
            <i data-lucide="trash-2" style="width:20px;height:20px;"></i>
          </button>
          <div class="voice-msg" id="preview-voice-msg" style="flex:1;"></div>
          <button class="send-btn" onclick="sendVoicePreview()">
            <i data-lucide="send" style="width:18px;height:18px;"></i>
          </button>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
let chatRooms = [], chatCurrentUser = null, chatClassUsers = [], activeRoomId = null, chatWs = null;
let mutedUserIds = [];
let roomMessages = [], messagesById = {}, replyingTo = null, editingMessageId = null;

async function toggleMuteUser(userId, userName) {
  const isCurrentlyMuted = mutedUserIds.includes(userId);
  try {
    if (isCurrentlyMuted) {
      await API.unmuteUser(userId);
      mutedUserIds = mutedUserIds.filter(id => id !== userId);
      showToast(`${userName} nicht mehr stummgeschaltet`);
    } else {
      await API.muteUser(userId);
      mutedUserIds.push(userId);
      showToast(`${userName} stummgeschaltet`);
    }
    if (chatCurrentUser) {
      chatCurrentUser.muted_user_ids = JSON.stringify(mutedUserIds);
    }
    
    // Re-render rooms list and active room if open
    renderRooms();
    if (activeRoomId) {
      const msgs = await API.messages(activeRoomId).catch(() => []);
      renderMessages(msgs);
    }
    // Re-open/refresh Neuer Chat sheet if active
    const sheet = document.querySelector('.bottom-sheet');
    if (sheet && sheet.classList.contains('active')) {
      openNewChatSheet();
    }
  } catch (err) {
    showToast('Aktion fehlgeschlagen');
  }
}

function updateRoomMuteUI(isMuted) {
  const btn = document.getElementById('room-mute-btn');
  if (!btn) return;
  btn.innerHTML = `<i data-lucide="${isMuted ? 'volume-x' : 'volume-2'}" style="width:20px;height:20px;"></i>`;
  btn.style.color = isMuted ? '#b3261e' : '#49454f';
  if (window.lucide) lucide.createIcons();
}

async function toggleMuteActiveRoom() {
  if (!activeRoomId) return;
  const room = chatRooms.find(r => r.id === activeRoomId);
  if (!room) return;
  const isCurrentlyMuted = !!room.is_muted;
  try {
    if (isCurrentlyMuted) {
      await API.unmuteRoom(activeRoomId);
      room.is_muted = false;
      showToast('Chat nicht mehr stummgeschaltet');
    } else {
      await API.muteRoom(activeRoomId);
      room.is_muted = true;
      showToast('Chat stummgeschaltet');
    }
    updateRoomMuteUI(room.is_muted);
    renderRooms();
  } catch (err) {
    showToast('Aktion fehlgeschlagen');
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

// --- Voice messages (WhatsApp-style bubble) ---
function strHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0; }
  return Math.abs(h) || 1;
}

function waveformBars(seedStr, count = 24) {
  const seed = strHash(seedStr);
  const bars = [];
  for (let i = 0; i < count; i++) {
    const v = Math.sin(seed * (i + 1) * 12.9898) * 43758.5453;
    const frac = v - Math.floor(v);
    bars.push(6 + Math.round(frac * 18)); // 6-24px
  }
  return bars;
}

function formatTime(sec) {
  if (!isFinite(sec) || isNaN(sec)) return '0:00';
  sec = Math.max(0, Math.floor(sec));
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
}

function renderVoiceBubble(m) {
  const uid = `v${m.id || Math.random().toString(36).slice(2, 9)}`;
  const heights = Array.isArray(m.waveform) && m.waveform.length ? m.waveform : waveformBars(m.file_url || uid);
  const barsHtml = heights.map(h => `<span style="height:${h}px;"></span>`).join('');
  return `
    <div class="voice-msg">
      <audio id="${uid}" src="${m.file_url}" preload="metadata"></audio>
      <button class="voice-play-btn" onclick="toggleVoicePlay('${uid}')">
        <i data-lucide="play" style="width:16px;height:16px;"></i>
      </button>
      <div class="voice-wave-wrap">
        <div class="voice-wave">${barsHtml}</div>
        <div class="voice-wave-progress" id="${uid}-progress">${barsHtml}</div>
        <div class="voice-seek-thumb" id="${uid}-thumb" style="left:0%;"></div>
      </div>
      <span class="voice-time" id="${uid}-time">0:00</span>
    </div>`;
}

function initVoiceSeeking(wrapEl, audioId) {
  let isDragging = false;
  
  function handleSeek(clientX) {
    const audio = document.getElementById(audioId);
    if (!audio || !isFinite(audio.duration) || !audio.duration) return;
    const rect = wrapEl.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    audio.currentTime = pct * audio.duration;
  }
  
  wrapEl.addEventListener('pointerdown', e => {
    e.preventDefault();
    isDragging = true;
    wrapEl.setPointerCapture(e.pointerId);
    handleSeek(e.clientX);
  });
  
  wrapEl.addEventListener('pointermove', e => {
    if (!isDragging) return;
    handleSeek(e.clientX);
  });
  
  wrapEl.addEventListener('pointerup', e => {
    if (!isDragging) return;
    isDragging = false;
    wrapEl.releasePointerCapture(e.pointerId);
  });
  
  wrapEl.addEventListener('pointercancel', e => {
    isDragging = false;
  });
}

let currentVoiceAudio = null;
function toggleVoicePlay(id) {
  const audio = document.getElementById(id);
  if (!audio) return;
  if (audio.paused) {
    if (currentVoiceAudio && currentVoiceAudio !== audio && !currentVoiceAudio.paused) currentVoiceAudio.pause();
    audio.play().catch(() => {});
  } else {
    audio.pause();
  }
}

function fixVoiceDuration(audio) {
  const timeEl = document.getElementById(`${audio.id}-time`);
  if (isFinite(audio.duration)) {
    if (timeEl) timeEl.textContent = formatTime(audio.duration);
    return;
  }
  // Chrome/webm MediaRecorder blobs often report Infinity duration until this seek trick runs
  audio.currentTime = 1e101;
  const onTimeUpdate = () => {
    audio.removeEventListener('timeupdate', onTimeUpdate);
    audio.currentTime = 0;
    if (timeEl) timeEl.textContent = formatTime(audio.duration);
  };
  audio.addEventListener('timeupdate', onTimeUpdate);
}

// Media events don't bubble, so listen on document in the capture phase to cover all voice bubbles at once
document.addEventListener('loadedmetadata', e => { if (e.target.id?.startsWith('v')) fixVoiceDuration(e.target); }, true);
document.addEventListener('play', e => {
  const audio = e.target;
  if (!audio.id?.startsWith('v')) return;
  currentVoiceAudio = audio;
  const icon = audio.parentElement.querySelector('.voice-play-btn i');
  if (icon) { icon.setAttribute('data-lucide', 'pause'); lucide.createIcons(); }
}, true);
document.addEventListener('pause', e => {
  const audio = e.target;
  if (!audio.id?.startsWith('v')) return;
  const icon = audio.parentElement.querySelector('.voice-play-btn i');
  if (icon) { icon.setAttribute('data-lucide', 'play'); lucide.createIcons(); }
}, true);
document.addEventListener('timeupdate', e => {
  const audio = e.target;
  if (!audio.id?.startsWith('v')) return;
  const progress = document.getElementById(`${audio.id}-progress`);
  const thumb = document.getElementById(`${audio.id}-thumb`);
  const timeEl = document.getElementById(`${audio.id}-time`);
  const dur = isFinite(audio.duration) ? audio.duration : 0;
  if (progress && dur) progress.style.width = `${(audio.currentTime / dur) * 100}%`;
  if (thumb && dur) thumb.style.left = `${(audio.currentTime / dur) * 100}%`;
  if (timeEl && dur) timeEl.textContent = formatTime(audio.currentTime);
}, true);
document.addEventListener('ended', e => {
  const audio = e.target;
  if (!audio.id?.startsWith('v')) return;
  audio.currentTime = 0;
  const progress = document.getElementById(`${audio.id}-progress`);
  if (progress) progress.style.width = '0%';
  const thumb = document.getElementById(`${audio.id}-thumb`);
  if (thumb) thumb.style.left = '0%';
  const timeEl = document.getElementById(`${audio.id}-time`);
  if (timeEl && isFinite(audio.duration)) timeEl.textContent = formatTime(audio.duration);
}, true);

async function init_chat() {
  [chatRooms, chatCurrentUser, chatClassUsers] = await Promise.all([
    API.rooms().catch(() => []),
    API.me().catch(() => null),
    API.classUsers().catch(() => []),
  ]);
  
  if (chatCurrentUser) {
    try {
      mutedUserIds = JSON.parse(chatCurrentUser.muted_user_ids || '[]');
    } catch(e) {
      mutedUserIds = [];
    }
  }
  
  renderRooms();
  
  // Check if a room ID is present in the URL path, e.g., /chat/5
  const pathParts = window.location.pathname.replace(/^\//, '').split('/');
  if (pathParts[0] === 'chat' && pathParts[1]) {
    const roomId = parseInt(pathParts[1]);
    if (roomId) {
      const room = chatRooms.find(r => r.id === roomId);
      if (room) {
        const uid = chatCurrentUser?.id;
        const other = room.member_ids.find(id => id !== uid);
        const userMap = Object.fromEntries(chatClassUsers.map(u=>[u.id, u]));
        const name = room.name || (other ? (userMap[other]?.display_name || userMap[other]?.email?.split('@')[0] || '?') : (room.is_group ? 'Gruppe' : 'Notizen an mich'));
        openRoom(roomId, name, true);
      }
    }
  }
}

function renderRooms() {
  if (!chatRooms.length) {
    document.getElementById('chat-empty').style.display = 'block';
    return;
  }
  document.getElementById('chat-empty').style.display = 'none';
  const userMap = Object.fromEntries(chatClassUsers.map(u=>[u.id, u]));
  const uid = chatCurrentUser?.id;
  document.getElementById('chat-rooms-list').innerHTML = chatRooms.map(r => {
    const other = r.member_ids.find(id => id !== uid);
    const name = r.name || (other ? (userMap[other]?.display_name || userMap[other]?.email?.split('@')[0] || '?') : (r.is_group ? 'Gruppe' : 'Notizen an mich'));
    const isMuted = r.is_muted || (!r.is_group && other && mutedUserIds.includes(other));
    const initials = name.slice(0,2).toUpperCase();
    const colors = ['#c4eed0','#d3e3fd','#ffd8e4','#eaddff','#ffdec1'];
    const color = colors[r.id % colors.length];
    return `
    <div onclick="openRoom(${r.id},'${escapeHtml(name)}')" style="display:flex;gap:14px;align-items:center;padding:14px;background:white;border-radius:20px;margin-bottom:8px;cursor:pointer;border:1px solid rgba(0,0,0,0.04);">
      <div class="avatar" style="background:${color};color:#1c1b1f;flex-shrink:0;">${initials}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:600;display:flex;align-items:center;gap:6px;">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">${name}</span>
          ${isMuted ? `<i data-lucide="volume-x" style="width:14px;height:14px;color:#b3261e;flex-shrink:0;"></i>` : ''}
        </div>
        <div style="font-size:0.78rem;opacity:0.5;">${r.is_group?'Gruppe':'Direktnachricht'}</div>
      </div>
      <i data-lucide="chevron-right" style="width:18px;height:18px;opacity:0.3;flex-shrink:0;"></i>
    </div>`;
  }).join('');
  lucide.createIcons();
}

async function openRoom(roomId, roomName, preserveUrl = false) {
  activeRoomId = roomId;
  replyingTo = null;
  editingMessageId = null;

  // Clean up any existing room page to avoid duplicates
  const existing = document.getElementById('page-chat-room');
  if (existing) existing.remove();

  const tpl = document.getElementById('tpl-chat-room').content.cloneNode(true);
  document.body.appendChild(tpl);
  const roomPage = document.getElementById('page-chat-room');
  roomPage.style.setProperty('--ox','50%');
  roomPage.style.setProperty('--oy','50%');
  requestAnimationFrame(() => requestAnimationFrame(() => roomPage.classList.add('active')));
  document.getElementById('room-title').textContent = roomName;
  document.getElementById('room-avatar').textContent = roomName.slice(0,2).toUpperCase();
  
  const room = chatRooms.find(r => r.id === roomId);
  updateRoomMuteUI(room ? !!room.is_muted : false);
  
  initMessageGestures(document.getElementById('chat-messages'));
  lucide.createIcons();

  if (!preserveUrl) {
    history.pushState({ page: 'chat', roomId: roomId }, '', '/chat/' + roomId);
  } else {
    history.replaceState({ page: 'chat', roomId: roomId }, '', '/chat/' + roomId);
  }

  const msgs = await API.messages(roomId).catch(() => []);
  renderMessages(msgs);
  connectWs(roomId);
}

// --- Message gestures: swipe-right to reply, long-press / right-click for actions menu ---
let swipeState = null;
function initMessageGestures(container) {
  if (!container) return;
  container.addEventListener('pointerdown', e => {
    const row = e.target.closest('.msg-row');
    if (!row || e.button) return;
    const bubble = row.querySelector('.bubble');
    swipeState = { row, bubble, msgId: parseInt(row.dataset.msgId), startX: e.clientX, startY: e.clientY, moved: false, longFired: false };
    swipeState.timer = setTimeout(() => {
      if (swipeState && !swipeState.moved) {
        swipeState.longFired = true;
        if (navigator.vibrate) navigator.vibrate(15);
        openMessageActions(swipeState.msgId);
      }
    }, 480);
  });
  container.addEventListener('pointermove', e => {
    if (!swipeState) return;
    const dx = e.clientX - swipeState.startX, dy = e.clientY - swipeState.startY;
    if (!swipeState.moved && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      swipeState.moved = true;
      clearTimeout(swipeState.timer);
    }
    if (swipeState.moved && !swipeState.longFired && Math.abs(dy) < 40 && swipeState.bubble) {
      const isMe = swipeState.bubble.classList.contains('me');
      if (isMe) {
        if (dx < 0) {
          const clamped = Math.max(dx, -70);
          swipeState.bubble.style.transform = `translateX(${clamped}px)`;
          const icon = swipeState.row.querySelector('.msg-swipe-icon');
          if (icon) icon.style.opacity = Math.min(1, Math.abs(clamped) / 60);
        }
      } else {
        if (dx > 0) {
          const clamped = Math.min(dx, 70);
          swipeState.bubble.style.transform = `translateX(${clamped}px)`;
          const icon = swipeState.row.querySelector('.msg-swipe-icon');
          if (icon) icon.style.opacity = Math.min(1, clamped / 60);
        }
      }
    }
  });
  const endSwipe = e => {
    if (!swipeState) return;
    clearTimeout(swipeState.timer);
    const { row, bubble, msgId, moved, longFired, startX } = swipeState;
    const dx = (e.clientX ?? startX) - startX;
    if (bubble) {
      bubble.style.transition = 'transform 0.2s ease';
      bubble.style.transform = 'translateX(0)';
      setTimeout(() => { bubble.style.transition = ''; }, 200);
    }
    const icon = row?.querySelector('.msg-swipe-icon');
    if (icon) icon.style.opacity = 0;
    if (moved && !longFired) {
      const isMe = bubble.classList.contains('me');
      if (isMe && dx < -60) setReplyTo(msgId);
      if (!isMe && dx > 60) setReplyTo(msgId);
    }
    swipeState = null;
  };
  container.addEventListener('pointerup', endSwipe);
  container.addEventListener('pointercancel', endSwipe);
  container.addEventListener('pointerleave', endSwipe);
  container.addEventListener('contextmenu', e => {
    const row = e.target.closest('.msg-row');
    if (!row) return;
    e.preventDefault();
    openMessageActions(parseInt(row.dataset.msgId));
  });
}

function openMessageActions(msgId) {
  const m = messagesById[msgId];
  if (!m || m.deleted) return;
  const isMe = m.sender_id === chatCurrentUser?.id;
  const canEdit = isMe && (!m.file_type || m.file_type === 'text');
  openSheet(`
    <div class="sheet-title" style="margin-bottom:12px;display:flex;align-items:center;gap:8px;">
      <i data-lucide="message-square" style="width:20px;height:20px;color:#6750a4;"></i> Nachricht
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;">
      <button class="msg-action-btn" onclick="closeSheet(); setReplyTo(${msgId});">
        <i data-lucide="reply" style="width:18px;height:18px;"></i> Antworten
      </button>
      ${canEdit ? `<button class="msg-action-btn" onclick="closeSheet(); startEditMessage(${msgId});">
        <i data-lucide="pencil" style="width:18px;height:18px;"></i> Bearbeiten
      </button>` : ''}
      ${isMe ? `<button class="msg-action-btn" style="color:#b3261e;" onclick="closeSheet(); deleteMessage(${msgId});">
        <i data-lucide="trash-2" style="width:18px;height:18px;"></i> Löschen
      </button>` : ''}
    </div>
  `);
  if (window.lucide) lucide.createIcons();
}

function snippetForMessage(m) {
  if (!m) return '';
  if (m.deleted) return 'Nachricht gelöscht';
  if (m.file_type === 'image') return '📷 Foto';
  if (m.file_type === 'audio') return '🎤 Sprachnachricht';
  if (m.file_type === 'file') return '📎 ' + (m.content || 'Datei');
  return m.content || '';
}

function senderNameFor(m) {
  if (!m) return '';
  if (m.sender_id === chatCurrentUser?.id) return 'Dir';
  const u = chatClassUsers.find(u => u.id === m.sender_id);
  return u ? (u.display_name || u.email.split('@')[0]) : 'User';
}

function renderComposerContext() {
  const bar = document.getElementById('reply-edit-bar');
  if (!bar) return;
  const messagesEl = document.getElementById('chat-messages');
  if (replyingTo) {
    bar.style.display = 'flex';
    bar.innerHTML = `
      <div class="composer-context-bar"></div>
      <div class="composer-context-body">
        <div class="composer-context-title">Antwort an ${escapeHtml(senderNameFor(replyingTo))}</div>
        <div class="composer-context-snippet">${escapeHtml(snippetForMessage(replyingTo))}</div>
      </div>
      <button class="composer-context-close" onclick="cancelReply()"><i data-lucide="x" style="width:16px;height:16px;"></i></button>`;
  } else if (editingMessageId) {
    const m = messagesById[editingMessageId];
    bar.style.display = 'flex';
    bar.innerHTML = `
      <div class="composer-context-bar" style="background:#7d5260;"></div>
      <div class="composer-context-body">
        <div class="composer-context-title" style="color:#7d5260;">Nachricht bearbeiten</div>
        <div class="composer-context-snippet">${escapeHtml(snippetForMessage(m))}</div>
      </div>
      <button class="composer-context-close" onclick="cancelEdit()"><i data-lucide="x" style="width:16px;height:16px;"></i></button>`;
  } else {
    bar.style.display = 'none';
    bar.innerHTML = '';
    if (messagesEl) messagesEl.style.paddingBottom = '80px';
    return;
  }
  if (messagesEl) { messagesEl.style.paddingBottom = '130px'; messagesEl.scrollTop = messagesEl.scrollHeight; }
  if (window.lucide) lucide.createIcons();
}

function renderMessages(msgs) {
  roomMessages = msgs;
  messagesById = Object.fromEntries(msgs.map(m => [m.id, m]));
  const uid = chatCurrentUser?.id;
  const container = document.getElementById('chat-messages');
  const userMap = Object.fromEntries(chatClassUsers.map(u=>[u.id,u]));
  const room = chatRooms.find(r => r.id === activeRoomId);
  const isGroupChat = !!room?.is_group;
  container.innerHTML = msgs.map((m, i) => {
    const isGroupStart = i === 0 || msgs[i - 1].sender_id !== m.sender_id || msgs[i - 1].deleted;
    const isGroupEnd = i === msgs.length - 1 || msgs[i + 1].sender_id !== m.sender_id || msgs[i + 1].deleted;
    return getSingleMessageHTML(m, uid, userMap, isGroupStart, isGroupEnd, isGroupChat);
  }).join('');

  // Init voice seeking
  container.querySelectorAll('.voice-wave-wrap').forEach(wrap => {
    const audioEl = wrap.parentElement.querySelector('audio');
    if (audioEl) initVoiceSeeking(wrap, audioEl.id);
  });

  container.scrollTop = container.scrollHeight;
  if (window.lucide) lucide.createIcons();
}

function rerenderSingleMessage(id) {
  const m = messagesById[id];
  if (!m) return;
  const uid = chatCurrentUser?.id;
  const userMap = Object.fromEntries(chatClassUsers.map(u=>[u.id,u]));
  const room = chatRooms.find(r => r.id === activeRoomId);
  const isGroupChat = !!room?.is_group;
  const row = document.querySelector(`.msg-row[data-msg-id="${id}"]`);
  const isGroupStart = row ? row.dataset.groupStart === '1' : true;
  const isGroupEnd = row ? row.dataset.groupEnd === '1' : true;
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = getSingleMessageHTML(m, uid, userMap, isGroupStart, isGroupEnd, isGroupChat);
  const newRow = tempDiv.firstElementChild;
  if (row) row.replaceWith(newRow);
  else document.getElementById('chat-messages')?.appendChild(newRow);

  // Init voice seeking
  newRow.querySelectorAll('.voice-wave-wrap').forEach(wrap => {
    const audioEl = wrap.parentElement.querySelector('audio');
    if (audioEl) initVoiceSeeking(wrap, audioEl.id);
  });

  if (window.lucide) lucide.createIcons();
}

function connectWs(roomId) {
  if (chatWs) chatWs.close();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  chatWs = new WebSocket(`${proto}://${location.host}/api/v1/chat/ws/${roomId}`);
  chatWs.onmessage = e => {
    const msg = JSON.parse(e.data);
    const container = document.getElementById('chat-messages');
    if (!container) return;

    if (msg.type === 'edit') {
      const existing = messagesById[msg.id];
      if (existing) { existing.content = msg.content; existing.edited = true; }
      rerenderSingleMessage(msg.id);
      return;
    }
    if (msg.type === 'delete') {
      const existing = messagesById[msg.id];
      if (existing) { existing.deleted = true; existing.content = null; existing.file_url = null; }
      rerenderSingleMessage(msg.id);
      return;
    }

    const uid = chatCurrentUser?.id;
    const userMap = Object.fromEntries(chatClassUsers.map(u=>[u.id,u]));
    const room = chatRooms.find(r => r.id === activeRoomId);
    const isGroupChat = !!room?.is_group;
    const prevLast = roomMessages[roomMessages.length - 1];
    const isGroupStart = !prevLast || prevLast.sender_id !== msg.sender_id || prevLast.deleted;
    if (!isGroupStart && prevLast) {
      const prevRow = document.querySelector(`.msg-row[data-msg-id="${prevLast.id}"]`);
      if (prevRow) { prevRow.classList.remove('group-end'); prevRow.dataset.groupEnd = '0'; }
    }
    messagesById[msg.id] = msg;
    roomMessages.push(msg);
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = getSingleMessageHTML(msg, uid, userMap, isGroupStart, true, isGroupChat);
    const newEl = tempDiv.firstElementChild;
    container.appendChild(newEl);

    // Init voice seeking
    newEl.querySelectorAll('.voice-wave-wrap').forEach(wrap => {
      const audioEl = wrap.parentElement.querySelector('audio');
      if (audioEl) initVoiceSeeking(wrap, audioEl.id);
    });

    container.scrollTop = container.scrollHeight;
    if (window.lucide) lucide.createIcons();
  };
}

async function sendMsg() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !chatWs) return;
  if (editingMessageId) {
    chatWs.send(JSON.stringify({ action: 'edit', message_id: editingMessageId, sender_id: chatCurrentUser?.id, content: text }));
    editingMessageId = null;
  } else {
    chatWs.send(JSON.stringify({ sender_id: chatCurrentUser?.id, content: text, file_type: 'text', reply_to_id: replyingTo?.id || null }));
    replyingTo = null;
  }
  renderComposerContext();
  input.value = '';
}

async function sendFile(file, waveform) {
  if (!file) return;
  const form = new FormData();
  form.append('file', file);
  form.append('visibility', 'all');
  form.append('expires_minutes', '120');
  try {
    const uploaded = await API.uploadFile(form);
    if (chatWs) {
      chatWs.send(JSON.stringify({
        sender_id: chatCurrentUser?.id,
        content: file.name,
        file_url: `/api/v1/files/download/${uploaded.id}`,
        file_type: file.type.startsWith('image') ? 'image' : (file.type.startsWith('audio') ? 'audio' : 'file'),
        reply_to_id: replyingTo?.id || null,
        waveform: waveform || null,
      }));
      replyingTo = null;
      renderComposerContext();
    }
  } catch { showToast('Upload fehlgeschlagen'); }
}

let mediaRecorder, audioChunks = [], recAudioCtx = null, recRafId = null, recTimerInterval = null,
    recCancelled = false, recPaused = false, recLevels = [], recBlob = null, recBlobUrl = null, elapsedMs = 0;

async function startRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') return;
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => null);
  if (!stream) { showToast('Mikrofonzugriff verweigert'); return; }
  recCancelled = false;
  recPaused = false;
  recLevels = [];
  mediaRecorder = new MediaRecorder(stream);
  audioChunks = [];
  mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
  mediaRecorder.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    if (recAudioCtx) { recAudioCtx.close().catch(() => {}); recAudioCtx = null; }
    clearInterval(recTimerInterval);
    if (recRafId) cancelAnimationFrame(recRafId);
    if (recCancelled) { resetComposerToNormal(); return; }
    const blob = new Blob(audioChunks, { type: 'audio/webm' });
    const avgLevel = recLevels.length ? (recLevels.reduce((a, b) => a + b, 0) / recLevels.length) : 0;
    
    // Check if the recording is empty (size too small, duration too short, or average audio level is silent)
    if (blob.size < 1000 || elapsedMs < 800 || avgLevel < 1.0) {
      showToast('Sprachnachricht ist leer oder zu kurz');
      resetComposerToNormal();
      return;
    }
    
    recBlob = blob;
    recBlobUrl = URL.createObjectURL(blob);
    showPreviewUI();
  };
  mediaRecorder.start();
  startRecordingUI(stream);
}

function cancelRecording() {
  if (!mediaRecorder || mediaRecorder.state === 'inactive') { resetComposerToNormal(); return; }
  recCancelled = true;
  mediaRecorder.stop();
}

function finishRecordingToPreview() {
  if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
  recCancelled = false;
  mediaRecorder.stop();
}

function toggleRecordingPause() {
  if (!mediaRecorder) return;
  if (mediaRecorder.state === 'recording' && mediaRecorder.pause) {
    mediaRecorder.pause();
    recPaused = true;
    updateRecordingPauseUI();
  } else if (mediaRecorder.state === 'paused' && mediaRecorder.resume) {
    mediaRecorder.resume();
    recPaused = false;
    updateRecordingPauseUI();
  }
}

function updateRecordingPauseUI() {
  const bar = document.getElementById('recording-bar');
  const pauseBtn = document.getElementById('rec-pause-btn');
  if (!bar || !pauseBtn) return;
  bar.classList.toggle('paused', recPaused);
  pauseBtn.innerHTML = recPaused
    ? '<i data-lucide="play" style="width:18px;height:18px;"></i>'
    : '<i data-lucide="pause" style="width:18px;height:18px;"></i>';
  if (window.lucide) lucide.createIcons();
}

function startRecordingUI(stream) {
  document.getElementById('input-bar-normal').style.display = 'none';
  document.getElementById('preview-bar').style.display = 'none';
  const bar = document.getElementById('recording-bar');
  bar.classList.remove('paused');
  bar.style.display = 'flex';

  elapsedMs = 0;
  const timerEl = document.getElementById('rec-timer');
  timerEl.textContent = '0:00';
  recTimerInterval = setInterval(() => {
    if (mediaRecorder?.state === 'recording') {
      elapsedMs += 200;
      timerEl.textContent = formatTime(elapsedMs / 1000);
    }
  }, 200);

  const waveEl = document.getElementById('rec-wave');
  const barCount = 20;
  waveEl.innerHTML = Array.from({ length: barCount }, () => '<span></span>').join('');
  const bars = [...waveEl.children];

  try {
    recAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = recAudioCtx.createMediaStreamSource(stream);
    const analyser = recAudioCtx.createAnalyser();
    analyser.fftSize = 64;
    source.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    let i = 0;
    const tick = () => {
      if (mediaRecorder?.state === 'recording') {
        analyser.getByteFrequencyData(data);
        const level = data.reduce((a, b) => a + b, 0) / data.length; // 0-255
        recLevels.push(level);
        bars[i % barCount].style.height = `${4 + Math.min(24, (level / 255) * 28)}px`;
        i++;
      }
      recRafId = requestAnimationFrame(tick);
    };
    tick();
  } catch {
    bars.forEach((b, idx) => { b.style.animationDelay = `${idx * 0.05}s`; b.classList.add('rec-bar-fallback'); });
  }
}

function downsampleLevels(levels, count = 24) {
  if (!levels.length) return Array.from({ length: count }, () => 6);
  const bucket = levels.length / count;
  const bars = [];
  for (let i = 0; i < count; i++) {
    const start = Math.floor(i * bucket);
    const end = Math.max(start + 1, Math.floor((i + 1) * bucket));
    const slice = levels.slice(start, end);
    const avg = slice.reduce((a, b) => a + b, 0) / slice.length; // 0-255
    bars.push(6 + Math.round((avg / 255) * 18));
  }
  return bars;
}

function showPreviewUI() {
  document.getElementById('input-bar-normal').style.display = 'none';
  document.getElementById('recording-bar').style.display = 'none';
  const previewBar = document.getElementById('preview-bar');
  previewBar.style.display = 'flex';

  const heights = downsampleLevels(recLevels);
  const barsHtml = heights.map(h => `<span style="height:${h}px;"></span>`).join('');
  const msgEl = document.getElementById('preview-voice-msg');
  msgEl.innerHTML = `
    <audio id="v-preview" src="${recBlobUrl}" preload="metadata"></audio>
    <button class="voice-play-btn" onclick="toggleVoicePlay('v-preview')">
      <i data-lucide="play" style="width:16px;height:16px;"></i>
    </button>
    <div class="voice-wave-wrap">
      <div class="voice-wave">${barsHtml}</div>
      <div class="voice-wave-progress" id="v-preview-progress">${barsHtml}</div>
      <div class="voice-seek-thumb" id="v-preview-thumb" style="left:0%;"></div>
    </div>
    <span class="voice-time" id="v-preview-time">0:00</span>`;
  
  const wrap = msgEl.querySelector('.voice-wave-wrap');
  if (wrap) {
    initVoiceSeeking(wrap, 'v-preview');
  }

  if (window.lucide) lucide.createIcons();
}

function discardPreview() {
  const audio = document.getElementById('v-preview');
  if (audio) audio.pause();
  if (recBlobUrl) { URL.revokeObjectURL(recBlobUrl); recBlobUrl = null; }
  recBlob = null;
  recLevels = [];
  resetComposerToNormal();
}

async function sendVoicePreview() {
  if (!recBlob) return;
  const waveform = downsampleLevels(recLevels);
  const blob = recBlob, url = recBlobUrl;
  recBlob = null; recBlobUrl = null; recLevels = [];
  resetComposerToNormal();
  const file = new File([blob], 'voice.webm', { type: 'audio/webm' });
  await sendFile(file, waveform);
  URL.revokeObjectURL(url);
}

function resetComposerToNormal() {
  clearInterval(recTimerInterval);
  if (recRafId) cancelAnimationFrame(recRafId);
  if (recAudioCtx) { recAudioCtx.close().catch(() => {}); recAudioCtx = null; }
  const recBar = document.getElementById('recording-bar');
  const previewBar = document.getElementById('preview-bar');
  const normal = document.getElementById('input-bar-normal');
  if (recBar) recBar.style.display = 'none';
  if (previewBar) previewBar.style.display = 'none';
  if (normal) normal.style.display = 'flex';
  mediaRecorder = null;
}

function closeChatRoom(isPopState = false) {
  if (chatWs) { chatWs.close(); chatWs = null; }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') cancelRecording();
  if (recBlobUrl) discardPreview();
  replyingTo = null;
  editingMessageId = null;
  activeRoomId = null;
  const page = document.getElementById('page-chat-room');
  if (page) { page.classList.remove('active'); page.classList.add('closing'); setTimeout(() => page.remove(), 600); }
  
  if (!isPopState) {
    history.pushState({ page: 'chat' }, '', '/chat');
  }
}

function roomBack() {
  if (pageHistory.length > 1 || (history.state && history.state.roomId)) {
    history.back();
  } else {
    history.pushState({ page: 'chat' }, '', '/chat');
    closeChatRoom(true);
  }
}

            </div>
            <button onclick="event.stopPropagation(); toggleMuteUser(${u.id}, '${escapeHtml(name)}')" style="background:none; border:none; padding:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:${isMuted?'#b3261e':'#49454f'}; opacity:${isMuted?1:0.4};">
              <i data-lucide="${isMuted?'volume-x':'volume-2'}" style="width:18px; height:18px;"></i>
            </button>
            <i data-lucide="chevron-right" style="width:16px; height:16px; opacity:0.3; flex-shrink:0;"></i>
          </div>
        `;
      }).join('')}
    </div>
  `);
  if (window.lucide) lucide.createIcons();
}

async function startDirectChat(userId, userName) {
  closeSheet();
  const currentUserId = chatCurrentUser?.id;
  if (!currentUserId) return;
  
  let room = chatRooms.find(r => !r.is_group && r.member_ids.includes(currentUserId) && r.member_ids.includes(userId));
  
  if (room) {
    openRoom(room.id, userName);
  } else {
    try {
      showToast('Chat wird gestartet…');
      room = await API.createRoom({ name: "", is_group: false, member_ids: [userId] });
      chatRooms.push(room);
      renderRooms();
      openRoom(room.id, userName);
    } catch (e) {
      console.error(e);
      showToast('Fehler beim Starten des Chats');
    }
  }
}

function openNewRoomSheet() {
  openSheet(`
    <div class="sheet-title">Neue Gruppe</div>
    <input class="m3-input" id="room-name" placeholder="Gruppenname">
    <div style="font-size:0.8rem;font-weight:700;opacity:0.5;margin-bottom:10px;">MITGLIEDER</div>
    <div id="room-members" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      ${chatClassUsers.filter(u=>u.id!==chatCurrentUser?.id).map(u=>`
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" value="${u.id}">
          <span>${u.display_name||u.email.split('@')[0]}</span>
        </label>`).join('')}
    </div>
    <button class="m3-btn-full" onclick="createRoom()">Gruppe erstellen</button>
  `);
  if (window.lucide) lucide.createIcons();
}

async function createRoom() {
  const name = document.getElementById('room-name').value.trim();
  const checked = [...document.querySelectorAll('#room-members input:checked')].map(i=>parseInt(i.value));
  const member_ids = [...checked, chatCurrentUser?.id];
  try {
    const room = await API.createRoom({ name, is_group: true, member_ids });
    chatRooms.push(room);
    closeSheet();
    renderRooms();
    showToast('Gruppe erstellt');
  } catch { showToast('Fehler'); }
}
</script>
