<div class="page" id="page-chat">
  <div class="chat-layout-wrapper">
    <!-- Left Pane: Chat List & Operations -->
    <div class="chat-sidebar">
      <div class="chat-sidebar-header">
        <button class="back-btn"><i data-lucide="arrow-left" style="width:22px;height:22px;"></i></button>
        <span class="page-title">Chats</span>
      </div>

      <div class="chat-search-bar-wrap">
        <div class="chat-search-bar">
          <i data-lucide="search" style="width:18px;height:18px;"></i>
          <input type="text" id="chat-search-input" placeholder="Chats durchsuchen..." oninput="filterChatRooms()">
        </div>
      </div>

      <div class="chat-rooms-scroll no-scrollbar">
        <div id="chat-rooms-list"></div>
        <div id="chat-empty" style="display:none;text-align:center;padding:60px 20px;opacity:0.4;">
          <i data-lucide="message-circle" style="width:48px;height:48px;margin-bottom:12px;"></i>
          <div>Noch keine Chats</div>
        </div>
      </div>

      <button class="chat-fab" onclick="openNewChatSheet()" title="Neuer Chat">
        <i data-lucide="message-square-plus"></i>
      </button>
    </div>

    <!-- Right Pane: Desktop Placeholder Screen -->
    <div class="chat-placeholder-pane">
      <div class="chat-placeholder-content">
        <div class="chat-placeholder-icon">
          <i data-lucide="message-square"></i>
        </div>
        <h2>Sofia Chat</h2>
        <p>Wähle einen Kontakt oder eine Gruppe aus der Liste, um eine Unterhaltung zu beginnen.</p>
      </div>
    </div>
  </div>

  <template id="tpl-chat-room">
    <div class="page" id="page-chat-room">
      <div class="page-header">
        <button class="icon-btn" onclick="event.stopPropagation(); event.preventDefault(); roomBack();">
          <i data-lucide="arrow-left" style="width:22px;height:22px;"></i>
        </button>
        <div class="avatar" id="room-avatar" style="background:#6750a4;width:36px;height:36px;font-size:0.8rem;"></div>
        <div style="display:flex; flex-direction:column; flex:1; min-width:0; margin-left:4px;">
          <span id="room-title" style="font-weight:700;font-size:1.05rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
          <span id="room-subtitle" style="font-size:0.75rem; opacity:0.5; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
        </div>
        <button id="room-mute-btn" onclick="toggleMuteActiveRoom()" class="icon-btn" style="color:#49454f; display:flex; align-items:center; justify-content:center; padding:8px;">
          <i data-lucide="volume-2" style="width:20px;height:20px;"></i>
        </button>
      </div>
      <div id="chat-messages" style="flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;"></div>
      <div class="composer-wrap" id="composer-wrap">
        <div class="composer-context" id="reply-edit-bar" style="display:none;"></div>
        <div class="input-bar" id="input-bar-normal" style="position:static;">
          <button onclick="startRecording()" id="rec-btn" style="background:none;border:none;cursor:pointer;color:#49454f;padding:4px;">
            <i data-lucide="mic" style="width:20px;height:20px;"></i>
          </button>
          <input id="chat-input" placeholder="Nachricht…" onkeydown="if(event.key==='Enter')sendMsg(); if(event.key==='Escape'){cancelReply();cancelEdit();}">
          <label style="cursor:pointer;padding:4px;color:#49454f;">
            <i data-lucide="paperclip" style="width:20px;height:20px;"></i>
            <input type="file" style="display:none;" onchange="sendFile(this.files[0])">
          </label>
          <button onclick="openPollCreatorSheet()" style="background:none;border:none;cursor:pointer;color:#49454f;padding:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <i data-lucide="bar-chart-2" style="width:20px;height:20px;"></i>
          </button>
          <button class="send-btn" onclick="sendMsg()">
            <i data-lucide="send" style="width:18px;height:18px;"></i>
          </button>
        </div>
        <div class="input-bar recording-bar" id="recording-bar" style="position:static;display:none;">
          <button onclick="cancelRecording()" style="background:none;border:none;cursor:pointer;color:#b3261e;padding:4px;">
            <i data-lucide="trash-2" style="width:20px;height:20px;"></i>
          </button>
          <div class="rec-indicator">
            <span class="rec-dot"></span>
            <span id="rec-timer">0:00</span>
          </div>
          <div class="rec-wave" id="rec-wave"></div>
          <button id="rec-pause-btn" onclick="toggleRecordingPause()" style="background:none;border:none;cursor:pointer;color:#49454f;padding:4px;">
            <i data-lucide="pause" style="width:18px;height:18px;"></i>
          </button>
          <button class="send-btn" onclick="finishRecordingToPreview()" style="background:#b3261e;color:white;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;padding:0;">
            <i data-lucide="square" style="width:12px;height:12px;fill:white;"></i>
          </button>
        </div>
        <div class="input-bar preview-bar" id="preview-bar" style="position:static;display:none;">
          <button onclick="discardPreview()" style="background:none;border:none;cursor:pointer;color:#b3261e;padding:4px;">
            <i data-lucide="trash-2" style="width:20px;height:20px;"></i>
          </button>
          <div class="voice-msg" id="preview-voice-msg" style="flex:1;"></div>
          <button class="send-btn" onclick="sendVoicePreview()">
            <i data-lucide="send" style="width:18px;height:18px;"></i>
          </button>
        </div>
      </div>
    </div>
  </template>

  <style>
  /* Android 16 Material Theme Variables for isolation */
  #page-chat, #page-chat-room {
    --md-sys-color-primary: #386a20;
    --md-sys-color-on-primary: #ffffff;
    --md-sys-color-primary-container: #b8f397;
    --md-sys-color-on-primary-container: #042100;
    --md-sys-color-secondary: #55624c;
    --md-sys-color-on-secondary: #ffffff;
    --md-sys-color-secondary-container: #d9e7cb;
    --md-sys-color-on-secondary-container: #131f0d;
    --md-sys-color-surface: #f8faf4;
    --md-sys-color-on-surface: #1a1c18;
    --md-sys-color-surface-variant: #e1e4da;
    --md-sys-color-on-surface-variant: #44483f;
    --md-sys-color-outline: #74796e;
    --md-sys-color-outline-variant: #c4c8ba;
    
    --chat-bubble-me: #d2ebd4;
    --chat-bubble-me-text: #052107;
    --chat-bubble-them: #ffffff;
    --chat-bubble-them-text: #1a1c18;
  }

  /* Layout Wrapper for sidebar & main panel */
  .chat-layout-wrapper {
    display: flex;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .chat-sidebar {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    background: var(--md-sys-color-surface);
    position: relative;
  }

  .chat-sidebar-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: max(20px, env(safe-area-inset-top, 20px)) 20px 12px 20px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    background: rgba(248, 250, 244, 0.85);
    backdrop-filter: blur(20px);
    z-index: 10;
    flex-shrink: 0;
  }

  .chat-search-bar-wrap {
    padding: 12px 20px;
    background: transparent;
    flex-shrink: 0;
  }

  .chat-search-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: #edf2ea;
    border-radius: 28px;
    border: 1px solid transparent;
    transition: all 0.25s ease;
  }

  .chat-search-bar:focus-within {
    background: #ffffff;
    border-color: var(--md-sys-color-primary);
    box-shadow: 0 4px 12px rgba(56, 106, 32, 0.08);
  }

  .chat-search-bar input {
    flex: 1;
    border: none;
    background: transparent;
    outline: none;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--md-sys-color-on-surface);
  }

  .chat-search-bar i {
    color: var(--md-sys-color-on-surface-variant);
    flex-shrink: 0;
  }

  .chat-rooms-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 80px 16px;
  }

  .chat-placeholder-pane {
    display: none; /* Hidden on mobile */
  }

  /* Floating Action Button (FAB) */
  .chat-fab {
    position: absolute;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-on-primary-container);
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(56, 106, 32, 0.15);
    transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 10;
  }

  .chat-fab:hover {
    transform: scale(1.06);
    background: #a9e887;
    box-shadow: 0 12px 30px rgba(56, 106, 32, 0.22);
  }

  .chat-fab:active {
    transform: scale(0.96);
  }

  .chat-fab i {
    width: 24px;
    height: 24px;
  }

  /* Chat list item styling */
  .chat-room-item {
    display: flex;
    gap: 14px;
    align-items: center;
    padding: 14px 16px;
    background: #ffffff;
    border-radius: 20px;
    margin-bottom: 8px;
    cursor: pointer;
    border: 1px solid rgba(0, 0, 0, 0.03);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.015);
    transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .chat-room-item:hover {
    transform: translateY(-2px);
    background: #f0f4ee;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.04);
  }

  .chat-room-item.active {
    background: #e1ecd9 !important;
    border-color: rgba(56, 106, 32, 0.1);
    transform: scale(0.98);
  }

  .chat-room-item .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-weight: 700;
    color: var(--md-sys-color-on-primary-container);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    flex-shrink: 0;
    border: 1.5px solid #ffffff;
  }

  .chat-room-info {
    flex: 1;
    min-width: 0;
  }

  .chat-room-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2px;
  }

  .chat-room-title {
    font-weight: 600;
    color: var(--md-sys-color-on-surface);
    font-size: 0.95rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .chat-room-type {
    font-size: 0.75rem;
    color: var(--md-sys-color-secondary);
  }

  .chat-room-item .chevron-right {
    opacity: 0.3;
    transition: transform 0.2s ease;
  }

  .chat-room-item:hover .chevron-right {
    transform: translateX(3px);
    opacity: 0.6;
  }

  /* Desktop Split Pane Interface */
  @media (min-width: 900px) {
    /* base.css floats every .page as a centered, rounded, inset card once the
       viewport hits 1100px — override it here so chat always fills the full
       browser width/height on tablet and desktop instead of shrinking into
       a card with margins around it. */
    #page-chat, #page-chat-room {
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      border: none !important;
    }

    #page-chat {
      display: flex !important;
      flex-direction: row !important;
      padding: 0 !important;
    }

    .chat-layout-wrapper {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .chat-sidebar {
      width: 380px !important;
      flex-shrink: 0;
      border-right: 1px solid rgba(0, 0, 0, 0.06);
    }

    .chat-placeholder-pane {
      display: flex !important;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fdfdfd;
      padding: 40px;
      text-align: center;
    }
    
    .chat-placeholder-content {
      max-width: 380px;
    }
    
    .chat-placeholder-icon {
      width: 100px;
      height: 100px;
      border-radius: 36px;
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px auto;
      box-shadow: 0 12px 30px rgba(56, 106, 32, 0.12);
    }
    
    .chat-placeholder-icon i {
      width: 44px;
      height: 44px;
    }
    
    .chat-placeholder-content h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 12px;
    }
    
    .chat-placeholder-content p {
      font-size: 0.95rem;
      color: var(--md-sys-color-secondary);
      line-height: 1.6;
    }
    
    /* Active Chat Room Desktop layout */
    /* Small Desktop screen / Tablet landscape */
    #page-chat-room {
      left: 380px !important;
      right: 0 !important;
      top: 0 !important;
      bottom: 0 !important;
      border-radius: 0 !important;
      border-left: 1px solid rgba(0, 0, 0, 0.06) !important;
      z-index: 101 !important;
      box-shadow: none !important;
    }
    
    #page-chat-room .page-header .icon-btn:first-child {
      display: none !important; /* Hide back button on desktop */
    }
  }

  /* Chat Room visual structure */
  #page-chat-room {
    background: var(--md-sys-color-surface);
    display: flex;
    flex-direction: column;
  }

  #page-chat-room .page-header {
    background: rgba(248, 250, 244, 0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 10;
    flex-shrink: 0;
  }

  #page-chat-room #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 140px 20px;
    background: linear-gradient(180deg, #f4fbf5 0%, #edf4ed 100%);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* Beautiful organic bubbles */
  .msg-row {
    display: flex;
    flex-direction: column;
    width: 100%;
    margin-bottom: 2px;
    position: relative;
  }

  .msg-row.group-end {
    margin-bottom: 12px;
  }

  .msg-row .bubble {
    max-width: 72%;
    padding: 10px 16px 11px 16px;
    font-size: 0.95rem;
    line-height: 1.45;
    box-shadow: 0 1.5px 3px rgba(0, 0, 0, 0.03);
    position: relative;
    transition: all 0.2s ease;
  }

  /* Me Bubble Styles */
  .msg-row .bubble.me {
    background: var(--chat-bubble-me);
    color: var(--chat-bubble-me-text);
    align-self: flex-end;
  }

  /* Them Bubble Styles */
  .msg-row .bubble.them {
    background: var(--chat-bubble-them);
    color: var(--chat-bubble-them-text);
    align-self: flex-start;
  }

  /* Rounded Corner Structures for Bubble Groups */
  .msg-row[data-group-start="1"] .bubble.me {
    border-radius: 20px 20px 4px 20px;
  }
  .msg-row[data-group-start="0"][data-group-end="0"] .bubble.me {
    border-radius: 20px 4px 4px 20px;
  }
  .msg-row[data-group-end="1"] .bubble.me {
    border-radius: 20px 4px 20px 20px;
  }
  .msg-row[data-group-start="1"][data-group-end="1"] .bubble.me {
    border-radius: 20px 20px 4px 20px;
  }

  .msg-row[data-group-start="1"] .bubble.them {
    border-radius: 20px 20px 20px 4px;
  }
  .msg-row[data-group-start="0"][data-group-end="0"] .bubble.them {
    border-radius: 4px 20px 20px 4px;
  }
  .msg-row[data-group-end="1"] .bubble.them {
    border-radius: 4px 20px 20px 20px;
  }
  .msg-row[data-group-start="1"][data-group-end="1"] .bubble.them {
    border-radius: 20px 20px 20px 4px;
  }

  .bubble-meta {
    font-size: 0.68rem;
    color: var(--md-sys-color-secondary);
    opacity: 0.65;
    margin: 3px 8px 1px 8px;
    user-select: none;
  }

  .msg-row[style*="align-items: flex-end"] .bubble-meta,
  .msg-row[style*="align-items:flex-end"] .bubble-meta {
    text-align: right;
    align-self: flex-end;
  }

  .msg-row[style*="align-items: flex-start"] .bubble-meta,
  .msg-row[style*="align-items:flex-start"] .bubble-meta {
    text-align: left;
    align-self: flex-start;
  }

  /* Swipe animations & icons */
  .msg-swipe-icon {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0;
    color: var(--md-sys-color-primary);
    pointer-events: none;
    transition: opacity 0.15s ease;
    z-index: 1;
  }

  /* Reply quotes inside bubbles */
  .bubble-reply-quote {
    background: rgba(0, 0, 0, 0.05);
    border-left: 3.5px solid var(--md-sys-color-primary);
    border-radius: 8px;
    padding: 6px 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .bubble-reply-quote:hover {
    background: rgba(0, 0, 0, 0.08);
  }

  .bubble.me .bubble-reply-quote {
    background: rgba(255, 255, 255, 0.25);
    border-left-color: var(--md-sys-color-on-primary-container);
    color: var(--md-sys-color-on-primary-container);
  }

  .bubble.me .bubble-reply-quote:hover {
    background: rgba(255, 255, 255, 0.35);
  }

  .bubble-reply-quote-name {
    font-size: 0.72rem;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .bubble-reply-quote-text {
    font-size: 0.8rem;
    opacity: 0.8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Context Menu */
  .msg-ctx-scrim {
    background: rgba(26, 28, 24, 0.3);
    backdrop-filter: blur(4px);
  }

  .msg-ctx-menu {
    background: rgba(248, 250, 244, 0.88);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 24px;
    padding: 12px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.06);
  }

  .msg-ctx-emojis {
    background: #ffffff;
    border-radius: 99px;
    padding: 6px 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
  }

  .msg-ctx-emoji {
    font-size: 1.4rem;
    border-radius: 50%;
  }

  .msg-ctx-emoji:hover {
    background: rgba(56, 106, 32, 0.1);
  }

  .msg-ctx-emoji.active {
    background: var(--md-sys-color-primary-container);
  }

  .msg-ctx-item {
    border-radius: 14px;
    padding: 10px 14px;
  }

  .msg-ctx-item:hover {
    background: rgba(56, 106, 32, 0.07);
  }

  /* Reactions design */
  .msg-reactions {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: -6px;
    margin-bottom: 6px;
    z-index: 5;
  }

  .msg-row[style*="align-items: flex-end"] .msg-reactions,
  .msg-row[style*="align-items:flex-end"] .msg-reactions {
    justify-content: flex-end;
    margin-right: 12px;
  }

  .msg-row[style*="align-items: flex-start"] .msg-reactions,
  .msg-row[style*="align-items:flex-start"] .msg-reactions {
    justify-content: flex-start;
    margin-left: 12px;
  }

  .msg-reaction-chip {
    background: #ffffff;
    border: 1px solid rgba(0, 0, 0, 0.06);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    padding: 3px 9px;
    font-size: 0.75rem;
    border-radius: 20px;
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .msg-reaction-chip:hover {
    transform: scale(1.1) translateY(-1px);
  }

  .msg-reaction-chip.mine {
    background: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-on-primary-container);
    border-color: transparent;
  }

  /* Composer Capsule Design */
  .composer-wrap {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 16px;
    z-index: 20;
  }

  .composer-context {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    border: 1.5px solid rgba(56, 106, 32, 0.1);
    padding: 10px 14px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    margin-bottom: 8px;
    transform: translateY(10px);
    opacity: 0;
    animation: slideUpComposerContext 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }

  @keyframes slideUpComposerContext {
    to { transform: translateY(0); opacity: 1; }
  }

  .composer-context-bar {
    width: 4px;
    border-radius: 4px;
    background: var(--md-sys-color-primary);
  }

  .input-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #ffffff;
    border-radius: 32px;
    padding: 6px 6px 6px 18px;
    border: 1.5px solid rgba(56, 106, 32, 0.08);
    box-shadow: 0 8px 24px rgba(56, 106, 32, 0.05);
    transition: all 0.25s ease;
  }

  .input-bar:focus-within {
    border-color: var(--md-sys-color-primary);
    box-shadow: 0 8px 30px rgba(56, 106, 32, 0.1);
  }

  .input-bar input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    outline: none;
    font-size: 0.95rem;
    color: var(--md-sys-color-on-surface);
  }

  .input-bar input::placeholder {
    color: var(--md-sys-color-outline);
    opacity: 0.8;

<script>
let chatRooms = [], chatCurrentUser = null, chatClassUsers = [], activeRoomId = null, chatWs = null;
let mutedUserIds = [];
let roomMessages = [], messagesById = {}, replyingTo = null, editingMessageId = null;

async function toggleMuteUser(userId, userName) {
  const isCurrentlyMuted = mutedUserIds.includes(userId);
  try {
    if (isCurrentlyMuted) {
      await API.unmuteUser(userId);
      mutedUserIds = mutedUserIds.filter(id => id !== userId);
      showToast(`${userName} nicht mehr stummgeschaltet`);
    } else {
      await API.muteUser(userId);
      mutedUserIds.push(userId);
      showToast(`${userName} stummgeschaltet`);
    }
    if (chatCurrentUser) {
      chatCurrentUser.muted_user_ids = JSON.stringify(mutedUserIds);
    }
    
    // Re-render rooms list and active room if open
    renderRooms();
    if (activeRoomId) {
      const msgs = await API.messages(activeRoomId).catch(() => []);
      renderMessages(msgs);
    }
    // Re-open/refresh Neuer Chat sheet if active
    const sheet = document.querySelector('.bottom-sheet');
    if (sheet && sheet.classList.contains('active')) {
      openNewChatSheet();
    }
  } catch (err) {
    showToast('Aktion fehlgeschlagen');
  }
}

function updateRoomMuteUI(isMuted) {
  const btn = document.getElementById('room-mute-btn');
  if (!btn) return;
  btn.innerHTML = `<i data-lucide="${isMuted ? 'volume-x' : 'volume-2'}" style="width:20px;height:20px;"></i>`;
  btn.style.color = isMuted ? '#b3261e' : '#49454f';
  if (window.lucide) lucide.createIcons();
}

async function toggleMuteActiveRoom() {
  if (!activeRoomId) return;
  const room = chatRooms.find(r => r.id === activeRoomId);
  if (!room) return;
  const isCurrentlyMuted = !!room.is_muted;
  try {
    if (isCurrentlyMuted) {
      await API.unmuteRoom(activeRoomId);
      room.is_muted = false;
      showToast('Chat nicht mehr stummgeschaltet');
    } else {
      await API.muteRoom(activeRoomId);
      room.is_muted = true;
      showToast('Chat stummgeschaltet');
    }
    updateRoomMuteUI(room.is_muted);
    renderRooms();
  } catch (err) {
    showToast('Aktion fehlgeschlagen');
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

let waveformCache = {};

async function decodeAudioWaveform(source, count = 24) {
  const cacheKey = typeof source === 'string' ? source : null;
  if (cacheKey && waveformCache[cacheKey]) return waveformCache[cacheKey];
  try {
    const arrayBuffer = await (source instanceof Blob ? source.arrayBuffer() : fetch(source).then(r => r.arrayBuffer()));
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
    const raw = audioBuffer.getChannelData(0);
    const bucketSize = Math.max(1, Math.floor(raw.length / count));
    const bars = [];
    for (let i = 0; i < count; i++) {
      const start = i * bucketSize;
      const end = i === count - 1 ? raw.length : start + bucketSize;
      let peak = 0;
      for (let j = start; j < end; j++) {
        const abs = Math.abs(raw[j]);
        if (abs > peak) peak = abs;
      }
      bars.push(6 + Math.round(Math.min(1, peak * 1.6) * 18));
    }
    audioCtx.close().catch(() => {});
    if (cacheKey) waveformCache[cacheKey] = bars;
    return bars;
  } catch {
    return null;
  }
}

function formatTime(sec) {
  if (!isFinite(sec) || isNaN(sec)) return '0:00';
  sec = Math.max(0, Math.floor(sec));
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
}

function renderVoiceBubble(m) {
  const uid = `v${m.id || Math.random().toString(36).slice(2, 9)}`;
  const hasRealWaveform = Array.isArray(m.waveform) && m.waveform.length;
  const cached = !hasRealWaveform && m.file_url ? waveformCache[m.file_url] : null;
  const heights = hasRealWaveform ? m.waveform : (cached || Array(24).fill(6));
  const barsHtml = heights.map(h => `<span style="height:${h}px;"></span>`).join('');

  if (!hasRealWaveform && !cached && m.file_url) {
    decodeAudioWaveform(m.file_url).then(bars => {
      if (!bars) return;
      const bars_html = bars.map(h => `<span style="height:${h}px;"></span>`).join('');
      const waveEl = document.getElementById(uid)?.parentElement.querySelector('.voice-wave');
      const progEl = document.getElementById(`${uid}-progress`);
      if (waveEl) waveEl.innerHTML = bars_html;
      if (progEl) progEl.innerHTML = bars_html;
    });
  }

  return `
    <div class="voice-msg">
      <audio id="${uid}" src="${m.file_url}" preload="metadata"></audio>
      <button class="voice-play-btn" onclick="toggleVoicePlay('${uid}')">
        <i data-lucide="play" style="width:16px;height:16px;"></i>
      </button>
      <div class="voice-wave-wrap">
        <div class="voice-wave">${barsHtml}</div>
        <div class="voice-wave-progress" id="${uid}-progress">${barsHtml}</div>
        <div class="voice-seek-thumb" id="${uid}-thumb" style="left:0%;"></div>
      </div>
      <span class="voice-time" id="${uid}-time">0:00</span>
    </div>`;
}

function renderPollBubble(m) {
  if (!m.poll_data) return `<div>[Ungültige Umfrage]</div>`;
  const pdata = m.poll_data;
  const question = pdata.question || m.content || 'Umfrage';
  const options = pdata.options || [];
  const votes = pdata.votes || {};
  
  let totalVotes = 0;
  options.forEach((opt, idx) => {
    const vList = votes[idx.toString()] || [];
    totalVotes += vList.length;
  });
  
  const uid = chatCurrentUser?.id;
  const optionsHtml = options.map((opt, idx) => {
    const vList = votes[idx.toString()] || [];
    const hasVoted = uid && vList.includes(uid);
    const count = vList.length;
    const percent = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
    
    const userMap = Object.fromEntries(chatClassUsers.map(u => [u.id, u]));
    const votersAvatars = vList.map(vid => {
      const u = userMap[vid];
      if (!u) return '';
      const name = u.display_name || u.email.split('@')[0];
      const initials = name.slice(0, 2).toUpperCase();
      return `<span class="poll-voter-dot" title="${escapeHtml(name)}">${initials}</span>`;
    }).slice(0, 3).join('');
    
    const plusMore = vList.length > 3 ? `<span class="poll-voter-more">+${vList.length - 3}</span>` : '';
    
    return `
      <div class="poll-option-row ${hasVoted ? 'voted' : ''}" onclick="votePollOption(${m.id}, ${idx})">
        <div class="poll-option-bg" style="width: ${percent}%;"></div>
        <div class="poll-option-content">
          <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;">
            <i data-lucide="${hasVoted ? 'check-circle-2' : 'circle'}" class="poll-check-icon"></i>
            <span class="poll-option-text" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">${escapeHtml(opt)}</span>
          </div>
          <div style="display:flex;align-items:center;flex-shrink:0;">
            <span class="poll-option-percent">${percent}%</span>
            <span class="poll-option-count">(${count})</span>
          </div>
        </div>
        ${vList.length > 0 ? `
        <div class="poll-option-voters">
          <div class="poll-voters-list">${votersAvatars}${plusMore}</div>
        </div>` : ''}
      </div>
    `;
  }).join('');
  
  return `
    <div class="poll-container" id="poll-${m.id}">
      <div class="poll-question">
        <i data-lucide="bar-chart-2" style="width:18px;height:18px;margin-right:4px;"></i>
        <span style="flex:1;word-break:break-word;">${escapeHtml(question)}</span>
      </div>
      <div class="poll-options-list">${optionsHtml}</div>
      <div class="poll-footer">Gesamtstimmen: ${totalVotes}</div>
    </div>
  `;
}

function votePollOption(msgId, optionIndex) {
  if (!chatWs) return;
  chatWs.send(JSON.stringify({
    action: 'vote',
    message_id: msgId,
    sender_id: chatCurrentUser?.id,
    option_index: optionIndex
  }));
}

function initVoiceSeeking(wrapEl, audioId) {
  let isDragging = false;
  
  function handleSeek(clientX) {
    const audio = document.getElementById(audioId);
    if (!audio || !isFinite(audio.duration) || !audio.duration) return;
    const rect = wrapEl.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    audio.currentTime = pct * audio.duration;
  }
  
  wrapEl.addEventListener('pointerdown', e => {
    e.preventDefault();
    isDragging = true;
    wrapEl.setPointerCapture(e.pointerId);
    handleSeek(e.clientX);
  });
  
  wrapEl.addEventListener('pointermove', e => {
    if (!isDragging) return;
    handleSeek(e.clientX);
  });
  
  wrapEl.addEventListener('pointerup', e => {
    if (!isDragging) return;
    isDragging = false;
    wrapEl.releasePointerCapture(e.pointerId);
  });
  
  wrapEl.addEventListener('pointercancel', e => {
    isDragging = false;
  });
}

let currentVoiceAudio = null;
function toggleVoicePlay(id) {
  const audio = document.getElementById(id);
  if (!audio) return;
  if (audio.paused) {
    if (currentVoiceAudio && currentVoiceAudio !== audio && !currentVoiceAudio.paused) currentVoiceAudio.pause();
    audio.play().catch(() => {});
  } else {
    audio.pause();
  }
}

function fixVoiceDuration(audio) {
  const timeEl = document.getElementById(`${audio.id}-time`);
  if (isFinite(audio.duration)) {
    if (timeEl) timeEl.textContent = formatTime(audio.duration);
    return;
  }
  audio.currentTime = 1e101;
  const onTimeUpdate = () => {
    audio.removeEventListener('timeupdate', onTimeUpdate);
    audio.currentTime = 0;
    if (timeEl) timeEl.textContent = formatTime(audio.duration);
  };
  audio.addEventListener('timeupdate', onTimeUpdate);
}

document.addEventListener('loadedmetadata', e => { if (e.target.id?.startsWith('v')) fixVoiceDuration(e.target); }, true);
document.addEventListener('play', e => {
  const audio = e.target;
  if (!audio.id?.startsWith('v')) return;
  currentVoiceAudio = audio;
  const btn = audio.parentElement.querySelector('.voice-play-btn');
  if (btn) {
    btn.innerHTML = '<i data-lucide="pause" style="width:16px;height:16px;"></i>';
    if (window.lucide) lucide.createIcons();
  }
}, true);
document.addEventListener('pause', e => {
  const audio = e.target;
  if (!audio.id?.startsWith('v')) return;
  const btn = audio.parentElement.querySelector('.voice-play-btn');
  if (btn) {
    btn.innerHTML = '<i data-lucide="play" style="width:16px;height:16px;"></i>';
    if (window.lucide) lucide.createIcons();
  }
}, true);
document.addEventListener('timeupdate', e => {
  const audio = e.target;
  if (!audio.id?.startsWith('v')) return;
  const progress = document.getElementById(`${audio.id}-progress`);
  const thumb = document.getElementById(`${audio.id}-thumb`);
  const timeEl = document.getElementById(`${audio.id}-time`);
  const dur = isFinite(audio.duration) ? audio.duration : 0;
  if (progress && dur) progress.style.width = `${(audio.currentTime / dur) * 100}%`;
  if (thumb && dur) thumb.style.left = `${(audio.currentTime / dur) * 100}%`;
  if (timeEl && dur) timeEl.textContent = formatTime(audio.currentTime);
}, true);
document.addEventListener('ended', e => {
  const audio = e.target;
  if (!audio.id?.startsWith('v')) return;
  audio.currentTime = 0;
  const progress = document.getElementById(`${audio.id}-progress`);
  if (progress) progress.style.width = '0%';
  const thumb = document.getElementById(`${audio.id}-thumb`);
  if (thumb) thumb.style.left = '0%';
  const timeEl = document.getElementById(`${audio.id}-time`);
  if (timeEl && isFinite(audio.duration)) timeEl.textContent = formatTime(audio.duration);
}, true);

async function init_chat() {
  [chatRooms, chatCurrentUser, chatClassUsers] = await Promise.all([
    API.rooms().catch(() => []),
    API.me().catch(() => null),
    API.classUsers().catch(() => []),
  ]);
  
  if (chatCurrentUser) {
    try {
      mutedUserIds = JSON.parse(chatCurrentUser.muted_user_ids || '[]');
    } catch(e) {
      mutedUserIds = [];
    }
  }
  
  renderRooms();
  
  const pathParts = window.location.pathname.replace(/^\//, '').split('/');
  if (pathParts[0] === 'chat' && pathParts[1]) {
    const roomId = parseInt(pathParts[1]);
    if (roomId) {
      const room = chatRooms.find(r => r.id === roomId);
      if (room) {
        const uid = chatCurrentUser?.id;
        const other = room.member_ids.find(id => id !== uid);
        const userMap = Object.fromEntries(chatClassUsers.map(u=>[u.id, u]));
        const name = room.name || (other ? (userMap[other]?.display_name || userMap[other]?.email?.split('@')[0] || '?') : (room.is_group ? 'Gruppe' : 'Notizen an mich'));
        openRoom(roomId, name, true);
      }
    }
  }
}

function filterChatRooms() {
  const query = document.getElementById('chat-search-input').value.toLowerCase();
  document.querySelectorAll('.chat-room-item').forEach(el => {
    const title = el.querySelector('.chat-room-title').textContent.toLowerCase();
    const type = el.querySelector('.chat-room-type').textContent.toLowerCase();
    if (title.includes(query) || type.includes(query)) {
      el.style.display = 'flex';
    } else {
      el.style.display = 'none';
    }
  });
}

function renderRooms() {
  if (!chatRooms.length) {
    document.getElementById('chat-empty').style.display = 'block';
    return;
  }
  document.getElementById('chat-empty').style.display = 'none';
  const userMap = Object.fromEntries(chatClassUsers.map(u=>[u.id, u]));
  const uid = chatCurrentUser?.id;
  document.getElementById('chat-rooms-list').innerHTML = chatRooms.map(r => {
    const other = r.member_ids.find(id => id !== uid);
    const otherUser = (!r.is_group && other) ? userMap[other] : null;
    const name = r.name || (other ? (userMap[other]?.display_name || userMap[other]?.email?.split('@')[0] || '?') : (r.is_group ? 'Gruppe' : 'Notizen an mich'));
    const isMuted = r.is_muted || (!r.is_group && other && mutedUserIds.includes(other));
    const initials = name.slice(0,2).toUpperCase();
    const colors = ['#b8f397','#d3e3fd','#ffd8e4','#eaddff','#ffdec1'];
    const color = colors[r.id % colors.length];
    const isActive = r.id === activeRoomId;
    
    return `
    <div class="chat-room-item ${isActive ? 'active' : ''}" data-room-id="${r.id}" onclick="openRoom(${r.id},'${escapeHtml(name)}')">
      <div class="avatar" style="background:${color};color:#042100;flex-shrink:0;${avatarImgStyle(otherUser)}">${otherUser && otherUser.avatar_url ? '' : initials}</div>
      <div class="chat-room-info">
        <div class="chat-room-title-row">
          <span class="chat-room-title">${escapeHtml(name)}</span>
          ${isMuted ? `<i data-lucide="volume-x" style="width:14px;height:14px;color:#b3261e;flex-shrink:0;"></i>` : ''}
        </div>
        <div class="chat-room-type">${r.is_group?'Gruppe':'Direktnachricht'}</div>
      </div>
      <i data-lucide="chevron-right" class="chevron-right" style="width:18px;height:18px;"></i>
    </div>`;
  }).join('');
  
  lucide.createIcons();
  
  const searchInput = document.getElementById('chat-search-input');
  if (searchInput && searchInput.value) {
    filterChatRooms();
  }
}

async function openRoom(roomId, roomName, preserveUrl = false) {
  activeRoomId = roomId;
  replyingTo = null;
  editingMessageId = null;

  const existing = document.getElementById('page-chat-room');
  if (existing) existing.remove();

  const tpl = document.getElementById('tpl-chat-room').content.cloneNode(true);
  document.body.appendChild(tpl);
  const roomPage = document.getElementById('page-chat-room');
  roomPage.style.setProperty('--ox','50%');
  roomPage.style.setProperty('--oy','50%');
  requestAnimationFrame(() => requestAnimationFrame(() => roomPage.classList.add('active')));
  document.getElementById('room-title').textContent = roomName;
  const room = chatRooms.find(r => r.id === roomId);
  const roomUid = chatCurrentUser?.id;
  const roomOtherId = room && !room.is_group ? room.member_ids.find(id => id !== roomUid) : null;
  const roomOtherUser = roomOtherId ? chatClassUsers.find(u => u.id === roomOtherId) : null;
  applyAvatarEl(document.getElementById('room-avatar'), roomOtherUser, roomName.slice(0,2).toUpperCase());
  updateRoomMuteUI(room ? !!room.is_muted : false);
  
  // Set subtitle in active room header
  const subtitleEl = document.getElementById('room-subtitle');
  if (subtitleEl && room) {
    if (room.is_group) {
      subtitleEl.textContent = `${room.member_ids.length} Mitglieder`;
    } else {
      subtitleEl.textContent = 'Aktiv';
    }
  }

  // Highlight active item in sidebar list
  document.querySelectorAll('.chat-room-item').forEach(el => {
    el.classList.toggle('active', el.getAttribute('data-room-id') == roomId);
  });
  
  initMessageGestures(document.getElementById('chat-messages'));
  lucide.createIcons();

  if (!preserveUrl) {
    history.pushState({ page: 'chat', roomId: roomId }, '', '/chat/' + roomId);
  } else {
    history.replaceState({ page: 'chat', roomId: roomId }, '', '/chat/' + roomId);
  }

  const msgs = await API.messages(roomId).catch(() => []);
  renderMessages(msgs);
  connectWs(roomId);
}

let swipeState = null;
function initMessageGestures(container) {
  if (!container) return;
  container.addEventListener('pointerdown', e => {
    const row = e.target.closest('.msg-row');
    if (!row || e.button) return;
    const bubble = row.querySelector('.bubble');
    swipeState = { row, bubble, msgId: parseInt(row.dataset.msgId), startX: e.clientX, startY: e.clientY, moved: false, longFired: false };
    swipeState.timer = setTimeout(() => {
      if (swipeState && !swipeState.moved) {
        swipeState.longFired = true;
        if (navigator.vibrate) navigator.vibrate(15);
        openMessageActions(swipeState.msgId, swipeState.bubble);
      }
    }, 480);
  });
  container.addEventListener('pointermove', e => {
    if (!swipeState) return;
    const dx = e.clientX - swipeState.startX, dy = e.clientY - swipeState.startY;
    if (!swipeState.moved && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      swipeState.moved = true;
      clearTimeout(swipeState.timer);
    }
    if (swipeState.moved && !swipeState.longFired && Math.abs(dy) < 40 && swipeState.bubble) {
      const isMe = swipeState.bubble.classList.contains('me');
      if (isMe) {
        if (dx < 0) {
          const clamped = Math.max(dx, -70);
          swipeState.bubble.style.transform = `translateX(${clamped}px)`;
          const icon = swipeState.row.querySelector('.msg-swipe-icon');
          if (icon) icon.style.opacity = Math.min(1, Math.abs(clamped) / 60);
        }
      } else {
        if (dx > 0) {
          const clamped = Math.min(dx, 70);
          swipeState.bubble.style.transform = `translateX(${clamped}px)`;
          const icon = swipeState.row.querySelector('.msg-swipe-icon');
          if (icon) icon.style.opacity = Math.min(1, clamped / 60);
        }
      }
    }
  });
  const endSwipe = e => {
    if (!swipeState) return;
    clearTimeout(swipeState.timer);
    const { row, bubble, msgId, moved, longFired, startX } = swipeState;
    const dx = (e.clientX ?? startX) - startX;
    if (bubble) {
      bubble.style.transition = 'transform 0.2s ease';
      bubble.style.transform = 'translateX(0)';
      setTimeout(() => { bubble.style.transition = ''; }, 200);
    }
    const icon = row?.querySelector('.msg-swipe-icon');
    if (icon) icon.style.opacity = 0;
    if (moved && !longFired) {
      const isMe = bubble.classList.contains('me');
      if (isMe && dx < -60) setReplyTo(msgId);
      if (!isMe && dx > 60) setReplyTo(msgId);
    }
    swipeState = null;
  };
  container.addEventListener('pointerup', endSwipe);
  container.addEventListener('pointercancel', endSwipe);
  container.addEventListener('pointerleave', endSwipe);
  container.addEventListener('contextmenu', e => {
    const row = e.target.closest('.msg-row');
    if (!row) return;
    e.preventDefault();
    openMessageActions(parseInt(row.dataset.msgId), row.querySelector('.bubble'));
  });
}

const QUICK_REACTIONS = ['😂', '👍', '❤️', '🔥', '✅', '😊'];

function myReactionFor(m) {
  const uid = chatCurrentUser?.id;
  if (!m?.reactions || uid == null) return null;
  return Object.keys(m.reactions).find(e => (m.reactions[e] || []).includes(uid)) || null;
}

function openMessageActions(msgId, anchorEl) {
  const m = messagesById[msgId];
  if (!m || m.deleted) return;
  const isMe = m.sender_id === chatCurrentUser?.id;
  const canEdit = isMe && (!m.file_type || m.file_type === 'text');
  const canCopy = !m.file_type || m.file_type === 'text';
  const myReaction = myReactionFor(m);

  closeMessageActions();

  const scrim = document.createElement('div');
  scrim.className = 'msg-ctx-scrim';
  scrim.onclick = closeMessageActions;

  const menu = document.createElement('div');
  menu.className = 'msg-ctx-menu';
  menu.innerHTML = `
    <div class="msg-ctx-emojis">
      ${QUICK_REACTIONS.map(e => `<button class="msg-ctx-emoji${e === myReaction ? ' active' : ''}" onclick="reactToMessage(${msgId}, '${e}')">${e}</button>`).join('')}
    </div>
    <div class="msg-ctx-actions">
      <button class="msg-ctx-item" onclick="closeMessageActions(); setReplyTo(${msgId});">
        <span>Antworten</span><i data-lucide="reply" style="width:18px;height:18px;"></i>
      </button>
      ${canEdit ? `<button class="msg-ctx-item" onclick="closeMessageActions(); startEditMessage(${msgId});">
        <span>Bearbeiten</span><i data-lucide="pencil" style="width:18px;height:18px;"></i>
      </button>` : ''}
      ${canCopy ? `<button class="msg-ctx-item" onclick="closeMessageActions(); copyMessageText(${msgId});">
        <span>Kopieren</span><i data-lucide="copy" style="width:18px;height:18px;"></i>
      </button>` : ''}
      ${isMe ? `<button class="msg-ctx-item msg-ctx-item-danger" onclick="closeMessageActions(); deleteMessage(${msgId});">
        <span>Löschen</span><i data-lucide="trash-2" style="width:18px;height:18px;"></i>
      </button>` : ''}
    </div>
  `;

  document.body.appendChild(scrim);
  document.body.appendChild(menu);
  positionMsgCtxMenu(menu, anchorEl);
  if (window.lucide) lucide.createIcons();
  requestAnimationFrame(() => { scrim.classList.add('active'); menu.classList.add('active'); });
}

function positionMsgCtxMenu(menu, anchorEl) {
  const margin = 12;
  const anchorRect = anchorEl ? anchorEl.getBoundingClientRect() : { top: window.innerHeight / 2, bottom: window.innerHeight / 2, left: window.innerWidth / 2, right: window.innerWidth / 2, width: 0 };
  const menuRect = menu.getBoundingClientRect();

  let top = anchorRect.top - menuRect.height - margin;
  if (top < margin) top = Math.min(anchorRect.bottom + margin, window.innerHeight - menuRect.height - margin);
  top = Math.max(margin, top);

  let left = anchorRect.left + anchorRect.width / 2 - menuRect.width / 2;
  left = Math.min(Math.max(margin, left), window.innerWidth - menuRect.width - margin);

  menu.style.top = `${top}px`;
  menu.style.left = `${left}px`;
}

function closeMessageActions() {
  document.querySelectorAll('.msg-ctx-menu, .msg-ctx-scrim').forEach(el => {
    el.classList.remove('active');
    setTimeout(() => el.remove(), 180);
  });
}

function reactToMessage(msgId, emoji) {
  closeMessageActions();
  if (!chatWs) return;
  chatWs.send(JSON.stringify({ action: 'react', message_id: msgId, sender_id: chatCurrentUser?.id, emoji }));
}

function copyMessageText(msgId) {
  const m = messagesById[msgId];
  if (!m) return;
  const text = snippetForMessage(m);
  if (!text || !navigator.clipboard) { showToast('Nichts zu kopieren'); return; }
  navigator.clipboard.writeText(text).then(() => showToast('Kopiert')).catch(() => showToast('Fehler'));
}

function renderReactions(m) {
  if (!m.reactions || !Object.keys(m.reactions).length) return '';
  const uid = chatCurrentUser?.id;
  const chips = Object.entries(m.reactions)
    .filter(([, ids]) => ids && ids.length)
    .map(([emoji, ids]) => `<span class="msg-reaction-chip${ids.includes(uid) ? ' mine' : ''}" onclick="reactToMessage(${m.id}, '${emoji}')">${emoji} ${ids.length}</span>`)
    .join('');
  return chips ? `<div class="msg-reactions">${chips}</div>` : '';
}

function snippetForMessage(m) {
  if (!m) return '';
  if (m.deleted) return 'Nachricht gelöscht';
  if (m.file_type === 'image') return '📷 Foto';
  if (m.file_type === 'audio') return '🎤 Sprachnachricht';
  if (m.file_type === 'file') return '📎 ' + (m.content || 'Datei');
  return m.content || '';
}

function senderNameFor(m) {
  if (!m) return '';
  if (m.sender_id === chatCurrentUser?.id) return 'Dir';
  const u = chatClassUsers.find(u => u.id === m.sender_id);
  return u ? (u.display_name || u.email.split('@')[0]) : 'User';
}

function renderComposerContext() {
  const bar = document.getElementById('reply-edit-bar');
  if (!bar) return;
  const messagesEl = document.getElementById('chat-messages');
  if (replyingTo) {
    bar.style.display = 'flex';
    bar.innerHTML = `
      <div class="composer-context-bar"></div>
      <div class="composer-context-body">
        <div class="composer-context-title">Antwort an ${escapeHtml(senderNameFor(replyingTo))}</div>
        <div class="composer-context-snippet">${escapeHtml(snippetForMessage(replyingTo))}</div>
      </div>
      <button class="composer-context-close" onclick="cancelReply()"><i data-lucide="x" style="width:16px;height:16px;"></i></button>`;
  } else if (editingMessageId) {
    const m = messagesById[editingMessageId];
    bar.style.display = 'flex';
    bar.innerHTML = `
      <div class="composer-context-bar" style="background:#7d5260;"></div>
      <div class="composer-context-body">
        <div class="composer-context-title" style="color:#7d5260;">Nachricht bearbeiten</div>
        <div class="composer-context-snippet">${escapeHtml(snippetForMessage(m))}</div>
      </div>
      <button class="composer-context-close" onclick="cancelEdit()"><i data-lucide="x" style="width:16px;height:16px;"></i></button>`;
  } else {
    bar.style.display = 'none';
    bar.innerHTML = '';
    if (messagesEl) messagesEl.style.paddingBottom = '100px';
    return;
  }
  if (messagesEl) { messagesEl.style.paddingBottom = '145px'; messagesEl.scrollTop = messagesEl.scrollHeight; }
  if (window.lucide) lucide.createIcons();
}

function setReplyTo(msgId) {
  const m = messagesById[msgId];
  if (!m || m.deleted) return;
  editingMessageId = null;
  replyingTo = m;
  renderComposerContext();
  document.getElementById('chat-input')?.focus();
}

function cancelReply() {
  if (!replyingTo) return;
  replyingTo = null;
  renderComposerContext();
}

function startEditMessage(msgId) {
  const m = messagesById[msgId];
  if (!m || m.deleted || (m.file_type && m.file_type !== 'text')) return;
  replyingTo = null;
  editingMessageId = msgId;
  const input = document.getElementById('chat-input');
  if (input) { input.value = m.content || ''; input.focus(); }
  renderComposerContext();
}

function cancelEdit() {
  if (!editingMessageId) return;
  editingMessageId = null;
  const input = document.getElementById('chat-input');
  if (input) input.value = '';
  renderComposerContext();
}

function deleteMessage(msgId) {
  const m = messagesById[msgId];
  if (!m || m.deleted) return;
  if (!confirm('Nachricht wirklich löschen?')) return;
  if (chatWs) chatWs.send(JSON.stringify({ action: 'delete', message_id: msgId, sender_id: chatCurrentUser?.id }));
}

function scrollToMessage(id) {
  const row = document.querySelector(`.msg-row[data-msg-id="${id}"]`);
  if (!row) { showToast('Nachricht nicht mehr sichtbar'); return; }
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  const bubble = row.querySelector('.bubble');
  if (bubble) { bubble.classList.add('highlight-flash'); setTimeout(() => bubble.classList.remove('highlight-flash'), 1000); }
}

function getSingleMessageHTML(m, currentUserId, userMap, isGroupStart = true, isGroupEnd = true, isGroupChat = false) {
  const isMe = m.sender_id === currentUserId;
  const sender = userMap ? userMap[m.sender_id] : null;
  const senderName = sender ? (sender.display_name || sender.email.split('@')[0]) : 'User';
  const time = new Date(m.created_at).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  const rowClass = `msg-row${isGroupEnd ? ' group-end' : ''}`;
  const rowDataAttrs = `data-msg-id="${m.id}" data-group-start="${isGroupStart ? 1 : 0}" data-group-end="${isGroupEnd ? 1 : 0}"`;
  const showHeader = !isMe && isGroupStart && isGroupChat;

  if (m.deleted) {
    return `
      <div class="${rowClass}" ${rowDataAttrs} style="display:flex; flex-direction:column; align-items: ${isMe?'flex-end':'flex-start'};">
        <div class="bubble ${isMe?'me':'them'}" style="opacity:0.6; font-style:italic; display:flex; align-items:center; gap:6px;">
          <i data-lucide="ban" style="width:14px;height:14px;"></i> Nachricht gelöscht
        </div>
        <div class="bubble-meta" style="text-align:${isMe?'right':'left'}; margin-top:2px;">${time}</div>
      </div>`;
  }

  const replyHtml = m.reply_preview ? `
      <div class="bubble-reply-quote" onclick="scrollToMessage(${m.reply_preview.id})">
        <div class="bubble-reply-quote-name">${escapeHtml(senderNameFor(m.reply_preview))}</div>
        <div class="bubble-reply-quote-text">${escapeHtml(snippetForMessage(m.reply_preview))}</div>
      </div>` : '';
  const editedLabel = m.edited ? ' · bearbeitet' : '';
  const swipeIconHtml = `<div class="msg-swipe-icon" style="${isMe ? 'right:8px;' : 'left:8px;'}"><i data-lucide="reply" style="width:16px;height:16px;"></i></div>`;

  let content = '';
  if (m.file_type === 'image' && m.file_url) {
    content = `
      <div style="position:relative;display:inline-block;">
        <img src="${m.file_url}" style="max-width:200px;border-radius:12px;display:block;cursor:pointer;" onclick="window.open('${m.file_url}')">
        <a href="${m.file_url}" download style="position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.5);color:white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;text-decoration:none;">
          <i data-lucide="download" style="width:16px;height:16px;"></i>
        </a>
      </div>`;
  } else if (m.file_type === 'audio' && m.file_url) {
    content = renderVoiceBubble(m);
  } else if (m.file_type === 'file' && m.file_url) {
    const filename = m.content || 'Datei';
    content = `
      <div style="display:flex;align-items:center;gap:10px;padding:4px 0;">
        <div style="background:rgba(0,0,0,0.06);padding:8px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <i data-lucide="file" style="width:20px;height:20px;color:#386a20;"></i>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;font-size:0.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${filename}</div>
          <div style="font-size:0.7rem;opacity:0.5;">Dokument</div>
        </div>
        <a href="${m.file_url}" download style="background:#f0f4ee;border-radius:12px;padding:8px;display:flex;align-items:center;justify-content:center;color:inherit;text-decoration:none;flex-shrink:0;">
          <i data-lucide="download" style="width:16px;height:16px;"></i>
        </a>
      </div>`;
  } else if (m.file_type === 'poll') {
    content = renderPollBubble(m);
  } else {
    content = escapeHtml(m.content || '');
  }

  const isMuted = mutedUserIds.includes(m.sender_id);
  if (isMuted && !isMe) {
    const uniqueMsgId = `muted-msg-${m.id}`;
    return `
      <div class="${rowClass}" ${rowDataAttrs} style="display:flex; flex-direction:column; align-items: flex-start; width: 100%;">
        ${swipeIconHtml}
        ${isGroupStart ? `<div style="font-size:0.7rem;opacity:0.5;margin-bottom:2px;padding-left:4px;display:flex;align-items:center;gap:6px;">
          <span>${senderName}</span>
          <button onclick="toggleMuteUser(${m.sender_id}, '${escapeHtml(senderName)}')" style="background:none; border:none; padding:0; cursor:pointer; color:#386a20; font-size:0.65rem; text-decoration:underline;">Mute aufheben</button>
        </div>` : ''}
        <div id="${uniqueMsgId}-placeholder" class="bubble them" style="cursor:pointer; display:flex; align-items:center; gap:8px;" onclick="document.getElementById('${uniqueMsgId}-content').style.display='block'; this.style.display='none';">
          <i data-lucide="volume-x" style="width:16px; height:16px; color:#b3261e;"></i> Nachricht von stummgeschaltetem Nutzer. Klicken zum Anzeigen.
        </div>
        <div id="${uniqueMsgId}-content" style="display:none; width: 100%;">
          <div class="bubble them">${replyHtml}${content}</div>
        </div>
        <div class="bubble-meta" style="text-align:left; margin-top:2px;">${time}${editedLabel}</div>
      </div>`;
  }

  return `
    <div class="${rowClass}" ${rowDataAttrs} style="display:flex; flex-direction:column; align-items: ${isMe?'flex-end':'flex-start'};">
      ${swipeIconHtml}
      ${showHeader ? `
        <div style="font-size:0.7rem;opacity:0.5;margin-bottom:2px;padding-left:4px;display:flex;align-items:center;gap:6px;">
          <span>${senderName}</span>
          <button onclick="toggleMuteUser(${m.sender_id}, '${escapeHtml(senderName)}')" style="background:none; border:none; padding:0; cursor:pointer; color:#386a20; font-size:0.65rem; text-decoration:underline;">Stummschalten</button>
        </div>` : ''}
      <div class="bubble ${isMe?'me':'them'}">${replyHtml}${content}</div>
      ${renderReactions(m)}
      <div class="bubble-meta" style="text-align:${isMe?'right':'left'}; margin-top:2px;">${time}${editedLabel}</div>
    </div>`;
}

function renderMessages(msgs) {
  roomMessages = msgs;
  messagesById = Object.fromEntries(msgs.map(m => [m.id, m]));
  const uid = chatCurrentUser?.id;
  const container = document.getElementById('chat-messages');
  const userMap = Object.fromEntries(chatClassUsers.map(u=>[u.id,u]));
  const room = chatRooms.find(r => r.id === activeRoomId);
  const isGroupChat = !!room?.is_group;
  container.innerHTML = msgs.map((m, i) => {
    const isGroupStart = i === 0 || msgs[i - 1].sender_id !== m.sender_id || msgs[i - 1].deleted;
    const isGroupEnd = i === msgs.length - 1 || msgs[i + 1].sender_id !== m.sender_id || msgs[i + 1].deleted;
    return getSingleMessageHTML(m, uid, userMap, isGroupStart, isGroupEnd, isGroupChat);
  }).join('');

  container.querySelectorAll('.voice-wave-wrap').forEach(wrap => {
    const audioEl = wrap.parentElement.querySelector('audio');
    if (audioEl) initVoiceSeeking(wrap, audioEl.id);
  });

  container.scrollTop = container.scrollHeight;
  if (window.lucide) lucide.createIcons();
}

function rerenderSingleMessage(id) {
  const m = messagesById[id];
  if (!m) return;
  const uid = chatCurrentUser?.id;
  const userMap = Object.fromEntries(chatClassUsers.map(u=>[u.id,u]));
  const room = chatRooms.find(r => r.id === activeRoomId);
  const isGroupChat = !!room?.is_group;
  const row = document.querySelector(`.msg-row[data-msg-id="${id}"]`);
  const isGroupStart = row ? row.dataset.groupStart === '1' : true;
  const isGroupEnd = row ? row.dataset.groupEnd === '1' : true;
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = getSingleMessageHTML(m, uid, userMap, isGroupStart, isGroupEnd, isGroupChat);
  const newRow = tempDiv.firstElementChild;
  if (row) row.replaceWith(newRow);
  else document.getElementById('chat-messages')?.appendChild(newRow);

  newRow.querySelectorAll('.voice-wave-wrap').forEach(wrap => {
    const audioEl = wrap.parentElement.querySelector('audio');
    if (audioEl) initVoiceSeeking(wrap, audioEl.id);
  });

  if (window.lucide) lucide.createIcons();
}

function connectWs(roomId) {
  if (chatWs) chatWs.close();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  chatWs = new WebSocket(`${proto}://${location.host}/api/v1/chat/ws/${roomId}`);
  chatWs.onmessage = e => {
    const msg = JSON.parse(e.data);
    const container = document.getElementById('chat-messages');
    if (!container) return;

    if (msg.type === 'edit') {
      const existing = messagesById[msg.id];
      if (existing) { existing.content = msg.content; existing.edited = true; }
      rerenderSingleMessage(msg.id);
      return;
    }
    if (msg.type === 'delete') {
      const existing = messagesById[msg.id];
      if (existing) { existing.deleted = true; existing.content = null; existing.file_url = null; }
      rerenderSingleMessage(msg.id);
      return;
    }
    if (msg.type === 'vote') {
      const existing = messagesById[msg.id];
      if (existing) { existing.poll_data = msg.poll_data; }
      rerenderSingleMessage(msg.id);
      return;
    }
    if (msg.type === 'reaction') {
      const existing = messagesById[msg.id];
      if (existing) { existing.reactions = msg.reactions; }
      rerenderSingleMessage(msg.id);
      return;
    }

    const uid = chatCurrentUser?.id;
    const userMap = Object.fromEntries(chatClassUsers.map(u=>[u.id,u]));
    const room = chatRooms.find(r => r.id === activeRoomId);
    const isGroupChat = !!room?.is_group;
    const prevLast = roomMessages[roomMessages.length - 1];
    const isGroupStart = !prevLast || prevLast.sender_id !== msg.sender_id || prevLast.deleted;
    if (!isGroupStart && prevLast) {
      const prevRow = document.querySelector(`.msg-row[data-msg-id="${prevLast.id}"]`);
      if (prevRow) { prevRow.classList.remove('group-end'); prevRow.dataset.groupEnd = '0'; }
    }
    messagesById[msg.id] = msg;
    roomMessages.push(msg);
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = getSingleMessageHTML(msg, uid, userMap, isGroupStart, true, isGroupChat);
    const newEl = tempDiv.firstElementChild;
    container.appendChild(newEl);

    newEl.querySelectorAll('.voice-wave-wrap').forEach(wrap => {
      const audioEl = wrap.parentElement.querySelector('audio');
      if (audioEl) initVoiceSeeking(wrap, audioEl.id);
    });

    container.scrollTop = container.scrollHeight;
    if (window.lucide) lucide.createIcons();
  };
}

async function sendMsg() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !chatWs) return;
  if (editingMessageId) {
    chatWs.send(JSON.stringify({ action: 'edit', message_id: editingMessageId, sender_id: chatCurrentUser?.id, content: text }));
    editingMessageId = null;
  } else {
    chatWs.send(JSON.stringify({ sender_id: chatCurrentUser?.id, content: text, file_type: 'text', reply_to_id: replyingTo?.id || null }));
    replyingTo = null;
  }
  renderComposerContext();
  input.value = '';
}

async function sendFile(file, waveform) {
  if (!file) return;
  if (!waveform && file.type.startsWith('audio')) {
    waveform = await decodeAudioWaveform(file).catch(() => null);
  }
  const form = new FormData();
  form.append('file', file);
  try {
    const uploaded = await API.uploadChatFile(form);
    if (chatWs) {
      chatWs.send(JSON.stringify({
        sender_id: chatCurrentUser?.id,
        content: file.name,
        file_url: uploaded.url,
        file_type: file.type.startsWith('image') ? 'image' : (file.type.startsWith('audio') ? 'audio' : 'file'),
        reply_to_id: replyingTo?.id || null,
        waveform: waveform || null,
      }));
      replyingTo = null;
      renderComposerContext();
    }
  } catch { showToast('Upload fehlgeschlagen'); }
}

let mediaRecorder, audioChunks = [], recAudioCtx = null, recRafId = null, recTimerInterval = null,
    recCancelled = false, recPaused = false, recLevels = [], recBlob = null, recBlobUrl = null, elapsedMs = 0;

async function startRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') return;
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => null);
  if (!stream) { showToast('Mikrofonzugriff verweigert'); return; }
  recCancelled = false;
  recPaused = false;
  recLevels = [];
  mediaRecorder = new MediaRecorder(stream);
  audioChunks = [];
  mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
  mediaRecorder.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    if (recAudioCtx) { recAudioCtx.close().catch(() => {}); recAudioCtx = null; }
    clearInterval(recTimerInterval);
    if (recRafId) cancelAnimationFrame(recRafId);
    if (recCancelled) { resetComposerToNormal(); return; }
    const blob = new Blob(audioChunks, { type: 'audio/webm' });
    const avgLevel = recLevels.length ? (recLevels.reduce((a, b) => a + b, 0) / recLevels.length) : 0;
    
    if (blob.size < 1000 || elapsedMs < 800 || avgLevel < 1.0) {
      showToast('Sprachnachricht ist leer oder zu kurz');
      resetComposerToNormal();
      return;
    }
    
    recBlob = blob;
    recBlobUrl = URL.createObjectURL(blob);
    showPreviewUI();
  };
  mediaRecorder.start();
  startRecordingUI(stream);
}

function cancelRecording() {
  if (!mediaRecorder || mediaRecorder.state === 'inactive') { resetComposerToNormal(); return; }
  recCancelled = true;
  mediaRecorder.stop();
}

function finishRecordingToPreview() {
  if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
  recCancelled = false;
  mediaRecorder.stop();
}

function toggleRecordingPause() {
  if (!mediaRecorder) return;
  if (mediaRecorder.state === 'recording' && mediaRecorder.pause) {
    mediaRecorder.pause();
    recPaused = true;
    updateRecordingPauseUI();
  } else if (mediaRecorder.state === 'paused' && mediaRecorder.resume) {
    mediaRecorder.resume();
    recPaused = false;
    updateRecordingPauseUI();
  }
}

function updateRecordingPauseUI() {
  const bar = document.getElementById('recording-bar');
  const pauseBtn = document.getElementById('rec-pause-btn');
  if (!bar || !pauseBtn) return;
  bar.classList.toggle('paused', recPaused);
  pauseBtn.innerHTML = recPaused
    ? '<i data-lucide="play" style="width:18px;height:18px;"></i>'
    : '<i data-lucide="pause" style="width:18px;height:18px;"></i>';
  if (window.lucide) lucide.createIcons();
}

function startRecordingUI(stream) {
  document.getElementById('input-bar-normal').style.display = 'none';
  document.getElementById('preview-bar').style.display = 'none';
  const bar = document.getElementById('recording-bar');
  bar.classList.remove('paused');
  bar.style.display = 'flex';

  elapsedMs = 0;
  const timerEl = document.getElementById('rec-timer');
  timerEl.textContent = '0:00';
  recTimerInterval = setInterval(() => {
    if (mediaRecorder?.state === 'recording') {
      elapsedMs += 200;
      timerEl.textContent = formatTime(elapsedMs / 1000);
    }
  }, 200);

  const waveEl = document.getElementById('rec-wave');
  const barCount = 20;
  waveEl.innerHTML = Array.from({ length: barCount }, () => '<span></span>').join('');
  const bars = [...waveEl.children];

  try {
    recAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = recAudioCtx.createMediaStreamSource(stream);
    const analyser = recAudioCtx.createAnalyser();
    analyser.fftSize = 64;
    source.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    let i = 0;
    const tick = () => {
      if (mediaRecorder?.state === 'recording') {
        analyser.getByteFrequencyData(data);
        const level = data.reduce((a, b) => a + b, 0) / data.length;
        recLevels.push(level);
        bars[i % barCount].style.height = `${4 + Math.min(24, (level / 255) * 28)}px`;
        i++;
      }
      recRafId = requestAnimationFrame(tick);
    };
    tick();
  } catch {
    bars.forEach((b, idx) => { b.style.animationDelay = `${idx * 0.05}s`; b.classList.add('rec-bar-fallback'); });
  }
}

function downsampleLevels(levels, count = 24) {
  if (!levels.length) return Array.from({ length: count }, () => 6);
  const bucket = levels.length / count;
  const bars = [];
  for (let i = 0; i < count; i++) {
    const start = Math.floor(i * bucket);
    const end = Math.max(start + 1, Math.floor((i + 1) * bucket));
    const slice = levels.slice(start, end);
    const avg = slice.reduce((a, b) => a + b, 0) / slice.length;
    bars.push(6 + Math.round((avg / 255) * 18));
  }
  return bars;
}

function showPreviewUI() {
  document.getElementById('input-bar-normal').style.display = 'none';
  document.getElementById('recording-bar').style.display = 'none';
  const previewBar = document.getElementById('preview-bar');
  previewBar.style.display = 'flex';

  const heights = downsampleLevels(recLevels);
  const barsHtml = heights.map(h => `<span style="height:${h}px;"></span>`).join('');
  const msgEl = document.getElementById('preview-voice-msg');
  msgEl.innerHTML = `
    <audio id="v-preview" src="${recBlobUrl}" preload="metadata"></audio>
    <button class="voice-play-btn" onclick="toggleVoicePlay('v-preview')">
      <i data-lucide="play" style="width:16px;height:16px;"></i>
    </button>
    <div class="voice-wave-wrap">
      <div class="voice-wave">${barsHtml}</div>
      <div class="voice-wave-progress" id="v-preview-progress">${barsHtml}</div>
      <div class="voice-seek-thumb" id="v-preview-thumb" style="left:0%;"></div>
    </div>
    <span class="voice-time" id="v-preview-time">0:00</span>`;
  
  const wrap = msgEl.querySelector('.voice-wave-wrap');
  if (wrap) {
    initVoiceSeeking(wrap, 'v-preview');
  }

  if (window.lucide) lucide.createIcons();
}

function discardPreview() {
  const audio = document.getElementById('v-preview');
  if (audio) audio.pause();
  if (recBlobUrl) { URL.revokeObjectURL(recBlobUrl); recBlobUrl = null; }
  recBlob = null;
  recLevels = [];
  resetComposerToNormal();
}

async function sendVoicePreview() {
  if (!recBlob) return;
  const waveform = downsampleLevels(recLevels);
  const blob = recBlob, url = recBlobUrl;
  recBlob = null; recBlobUrl = null; recLevels = [];
  resetComposerToNormal();
  const file = new File([blob], 'voice.webm', { type: 'audio/webm' });
  await sendFile(file, waveform);
  URL.revokeObjectURL(url);
}

function resetComposerToNormal() {
  clearInterval(recTimerInterval);
  if (recRafId) cancelAnimationFrame(recRafId);
  if (recAudioCtx) { recAudioCtx.close().catch(() => {}); recAudioCtx = null; }
  const recBar = document.getElementById('recording-bar');
  const previewBar = document.getElementById('preview-bar');
  const normal = document.getElementById('input-bar-normal');
  if (recBar) recBar.style.display = 'none';
  if (previewBar) previewBar.style.display = 'none';
  if (normal) normal.style.display = 'flex';
  mediaRecorder = null;
}

function closeChatRoom(isPopState = false) {
  if (chatWs) { chatWs.close(); chatWs = null; }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') cancelRecording();
  if (recBlobUrl) discardPreview();
  replyingTo = null;
  editingMessageId = null;
  activeRoomId = null;
  
  document.querySelectorAll('.chat-room-item').forEach(el => {
    el.classList.remove('active');
  });

  const page = document.getElementById('page-chat-room');
  if (page) { page.classList.remove('active'); page.classList.add('closing'); setTimeout(() => page.remove(), 600); }
  
  if (!isPopState) {
    history.pushState({ page: 'chat' }, '', '/chat');
  }
}

function roomBack() {
  if (pageHistory.length > 1 || (history.state && history.state.roomId)) {
    history.back();
  } else {
    history.pushState({ page: 'chat' }, '', '/chat');
    closeChatRoom(true);
  }
}

async function startDirectChat(userId, userName) {
  closeSheet();
  const currentUserId = chatCurrentUser?.id;
  if (!currentUserId) return;
  
  let room = chatRooms.find(r => !r.is_group && r.member_ids.includes(currentUserId) && r.member_ids.includes(userId));
  
  if (room) {
    openRoom(room.id, userName);
  } else {
    try {
      showToast('Chat wird gestartet…');
      room = await API.createRoom({ name: "", is_group: false, member_ids: [userId] });
      chatRooms.push(room);
      renderRooms();
      openRoom(room.id, userName);
    } catch (e) {
      console.error(e);
      showToast('Fehler beim Starten des Chats');
    }
  }
}

async function createRoom() {
  const name = document.getElementById('room-name').value.trim();
  const checked = [...document.querySelectorAll('#room-members input:checked')].map(i=>parseInt(i.value));
  const member_ids = [...checked, chatCurrentUser?.id];
  try {
    const room = await API.createRoom({ name, is_group: true, member_ids });
    chatRooms.push(room);
    closeSheet();
    renderRooms();
    showToast('Gruppe erstellt');
  } catch { showToast('Fehler'); }
}

  openSheet(`

function addPollOptionField() {
  const container = document.getElementById('poll-options-container');
  if (!container) return;
  const count = container.children.length + 1;
  const div = document.createElement('div');
  div.className = 'poll-option-input-row';
  div.style.display = 'flex';
  div.style.gap = '8px';
  div.style.alignItems = 'center';
  div.innerHTML = `
    <input class="m3-input" placeholder="Option ${count}" style="flex:1; margin-bottom:0;">
    <button class="icon-btn" onclick="this.parentElement.remove(); updatePollOptionPlaceholders();" style="color:#b3261e; padding:6px; flex-shrink:0;">
      <i data-lucide="trash-2" style="width:18px; height:18px;"></i>
    </button>
  `;
  container.appendChild(div);
  if (window.lucide) lucide.createIcons();
}

function updatePollOptionPlaceholders() {
  const container = document.getElementById('poll-options-container');
  if (!container) return;
  [...container.querySelectorAll('.poll-option-input-row')].forEach((row, idx) => {
    const input = row.querySelector('input');
    if (input) input.placeholder = `Option ${idx + 1}`;
  });
}

async function submitPoll() {
  const qInput = document.getElementById('poll-question-input');
  const question = qInput ? qInput.value.trim() : '';
  if (!question) {
    showToast('Bitte gib eine Frage ein');
    return;
  }
  
  const container = document.getElementById('poll-options-container');
  if (!container) return;
  const optionInputs = [...container.querySelectorAll('input')];
  const options = optionInputs.map(i => i.value.trim()).filter(val => val !== '');
  
  if (options.length < 2) {
    showToast('Bitte gib mindestens 2 Optionen ein');
    return;
  }
  
  const votes = {};
  options.forEach((_, idx) => {
    votes[idx.toString()] = [];
  });
  
  const poll_data = {
    question,
    options,
    votes
  };
  
  if (chatWs) {
    chatWs.send(JSON.stringify({
      sender_id: chatCurrentUser?.id,
      content: question,
      file_type: 'poll',
      poll_data: poll_data
    }));
    closeSheet();
  } else {
    showToast('Verbindung unterbrochen');
  }
}
