<script>
document.getElementById('ph-chat').outerHTML = pageHeader({
  backAction: 'chatHeaderBack()',
  titleHtml: `<div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
      <div id="chat-header-avatar" class="avatar" style="display:none;width:36px;height:36px;border-radius:50%;background:#eaddff;color:#442b7a;align-items:center;justify-content:center;font-weight:700;font-size:0.8rem;flex-shrink:0;"></div>
      <span class="page-title" id="chat-title" style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Chat</span>
    </div>`,
  trailing: `<button class="icon-btn" id="chat-search-btn" onclick="toggleChatSearch()" title="Chats durchsuchen">
      <i data-lucide="search" style="width:20px;height:20px;"></i>
    </button>
    <button class="icon-btn" id="chat-mute-btn" onclick="toggleChatMute()" title="Stummschalten" style="display:none;">
      <i data-lucide="bell" id="chat-mute-icon" style="width:20px;height:20px;"></i>
    </button>`,
});
document.getElementById('chat-fab-slot').outerHTML = fab({ icon: 'plus', onclick: 'openNewChatSheet()', title: 'Neuer Chat' });

let chatConversations = [], chatClassUsers = [];
let chatCurrentConversationId = null;
let chatMessages = [];
let chatListPollInterval = null, chatMsgPollInterval = null;
let chatNewGroupMode = false;
let chatReplyTo = null; // the message object currently being replied to, or null
let chatTouchState = null; // long-press/swipe tracking, see initChatGestureHandlers()
let _chatActionMenuEl = null, _chatActionMenuOutsideHandler = null;
let chatPlayingVoiceId = null; // message id of the voice note currently playing, or null
let chatOpenedFromDirectUrl = false;

async function init_chat() {
  [chatConversations, chatClassUsers] = await Promise.all([
    API.chatConversations().catch(() => []),
    API.classUsers().catch(() => []),
  ]);
  renderChatList();
  startChatListPolling();

  const pathParts = window.location.pathname.replace(/^\/chat\/?/, '').split('/');
  const subTarget = pathParts[0] ? decodeURIComponent(pathParts[0]).trim() : '';
  if (subTarget) {
    const targetConv = findConversationBySlugOrId(subTarget, chatConversations);
    if (targetConv) {
      openChatConversation(targetConv.id, true);
    } else {
      history.replaceState({ page: 'chat' }, '', '/chat');
    }
  }
}

function chatHeaderBack() {
  if (chatCurrentConversationId !== null) {
    closeChatConversation();
  } else {
    closePage();
  }
}

// --- Conversation list ---

function chatRelTime(iso) {
  const then = new Date(iso).getTime();
  const diffMin = Math.floor((Date.now() - then) / 60000);
  if (diffMin < 1) return 'jetzt';
  if (diffMin < 60) return diffMin + ' Min.';
  const diffH = Math.floor(diffMin / 60);
  if (diffH < 24) return diffH + ' Std.';
  const diffD = Math.floor(diffH / 24);
  if (diffD < 7) return diffD + ' Tag' + (diffD === 1 ? '' : 'en');
  const d = new Date(iso);
  return d.getDate() + '.' + (d.getMonth()+1) + '.';
}

function chatOtherParticipants(conv) {
  return conv.participants.filter(p => !currentUser || p.user_id !== currentUser.id);
}

function chatConversationTitle(conv) {
  if (conv.is_group) return conv.name || chatOtherParticipants(conv).map(p => p.display_name).join(', ');
  const other = chatOtherParticipants(conv)[0];
  return other ? other.display_name : '?';
}

function toggleChatSearch() {
  const bar = document.getElementById('chat-search-bar');
  const input = document.getElementById('chat-search-input');
  const showing = bar.style.display === 'none';
  bar.style.display = showing ? 'block' : 'none';
  if (showing) { input.focus(); } else { input.value = ''; renderChatList(); }
}

function updateChatHeaderAvatar(conv) {
  const el = document.getElementById('chat-header-avatar');
  if (!el) return;
  el.style.display = 'flex';
  if (!conv) { el.textContent = '?'; el.style.backgroundImage = ''; return; }
  if (conv.is_group) {
    el.style.backgroundImage = '';
    el.innerHTML = '<i data-lucide="users" style="width:16px;height:16px;"></i>';
    if (window.lucide) lucide.createIcons();
  } else {
    const other = chatOtherParticipants(conv)[0];
    applyAvatarEl(el, other ? { avatar_url: other.avatar_url } : null, (chatConversationTitle(conv) || '?').slice(0, 2).toUpperCase());
  }
}

function renderChatList() {
  const list = document.getElementById('chat-conversations-list');
  const empty = document.getElementById('chat-no-conversations');
  const query = (document.getElementById('chat-search-input')?.value || '').trim().toLowerCase();
  const filtered = query
    ? chatConversations.filter(c => chatConversationTitle(c).toLowerCase().includes(query) || (c.last_message || '').toLowerCase().includes(query))
    : chatConversations;
  if (!chatConversations.length) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  if (query && !filtered.length) {
    list.innerHTML = `<div style="text-align:center;padding:30px 20px;opacity:0.5;font-size:0.88rem;">Keine Chats gefunden.</div>`;
    return;
  }
  list.innerHTML = filtered.map(c => {
    const title = chatConversationTitle(c);
    const initials = title.slice(0, 2).toUpperCase();
    const time = c.last_message_at ? chatRelTime(c.last_message_at) : '';
    return `
    <div class="m3-card" style="padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;" onclick="openChatConversation(${c.id})">
      <div class="avatar" style="background:${c.is_group ? '#ffdec1' : '#eaddff'};color:#442b7a;flex-shrink:0;display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;font-weight:700;">
        ${c.is_group ? '<i data-lucide="users" style="width:20px;height:20px;"></i>' : initials}
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px;">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(title)}</span>
          ${c.is_muted ? '<i data-lucide="bell-off" style="width:13px;height:13px;opacity:0.45;flex-shrink:0;"></i>' : ''}
        </div>
        <div style="font-size:0.8rem;opacity:0.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;">${escapeHtml(c.last_message || 'Noch keine Nachrichten')}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;">
        <span style="font-size:0.7rem;opacity:0.5;">${time}</span>
        ${c.unread_count > 0 ? `<span style="background:${c.is_muted ? '#79747e' : '#b3261e'};color:#fff;font-size:0.68rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;">${c.unread_count > 99 ? '99+' : c.unread_count}</span>` : ''}
      </div>
    </div>`;
  }).join('');
  if (window.lucide) lucide.createIcons();
}

function startChatListPolling() {
  if (chatListPollInterval) clearInterval(chatListPollInterval);
  chatListPollInterval = setInterval(async () => {
    if (!document.getElementById('chat-conversations-list')) { clearInterval(chatListPollInterval); chatListPollInterval = null; return; }
    if (document.hidden) return;
    const fresh = await API.chatConversations().catch(() => null);
    if (!fresh || !document.getElementById('chat-conversations-list')) return;
    if (JSON.stringify(fresh) !== JSON.stringify(chatConversations)) {
      chatConversations = fresh;
      if (chatCurrentConversationId === null) renderChatList();
    }
  }, 15000);
}

// --- New chat sheet ---

function openNewChatSheet() {
  chatNewGroupMode = false;
  // API.classUsers() includes the current user too (other features that
  // reuse it don't care) — not a valid chat partner for yourself, so
  // filter it out here rather than in the shared endpoint.
  const pickable = chatClassUsers.filter(u => !currentUser || u.id !== currentUser.id);
  const userOptions = pickable.map(u => `
    <label style="display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(0,0,0,0.06);">
      <input type="checkbox" class="chat-new-user-cb" value="${u.id}" style="width:18px;height:18px;">
      <span>${escapeHtml(u.display_name || u.email.split('@')[0])}</span>
    </label>`).join('');

  openSheet(`
    <div style="padding:4px;">
      <div style="font-weight:700;font-size:1.05rem;margin-bottom:14px;">Neuer Chat</div>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button class="chip active" id="chat-new-mode-single" onclick="setChatNewMode(false,this)">Einzelperson</button>
        <button class="chip" id="chat-new-mode-group" onclick="setChatNewMode(true,this)">Gruppe</button>
      </div>
      <div id="chat-new-group-name-wrap" style="display:none;margin-bottom:14px;">
        <input type="text" class="m3-input" id="chat-new-group-name" placeholder="Gruppenname">
      </div>
      <div style="font-size:0.8rem;font-weight:700;opacity:0.5;margin-bottom:6px;">MITSCHÜLER:INNEN</div>
      <div style="max-height:280px;overflow-y:auto;margin-bottom:16px;">${userOptions || '<div style="opacity:0.5;font-size:0.85rem;padding:10px 4px;">Keine Mitschüler:innen gefunden.</div>'}</div>
      <div id="chat-new-err" style="color:#b3261e;font-size:0.82rem;min-height:18px;margin-bottom:4px;"></div>
      <button class="m3-btn-full" onclick="submitNewChat()">Chat starten</button>
    </div>
  `);
}

function setChatNewMode(isGroup, btn) {
  chatNewGroupMode = isGroup;
  document.querySelectorAll('#chat-new-mode-single, #chat-new-mode-group').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('chat-new-group-name-wrap').style.display = isGroup ? 'block' : 'none';
  // Single mode only makes sense with exactly one person selected — force
  // radio-like behavior by unchecking extras when switching back.
  if (!isGroup) {
    const checked = [...document.querySelectorAll('.chat-new-user-cb:checked')];
    checked.slice(1).forEach(cb => cb.checked = false);
  }
}

async function submitNewChat() {
  const checked = [...document.querySelectorAll('.chat-new-user-cb:checked')].map(cb => parseInt(cb.value));
  const err = document.getElementById('chat-new-err');
  if (!checked.length) { err.textContent = 'Mindestens eine Person auswählen'; return; }
  if (!chatNewGroupMode && checked.length > 1) { err.textContent = 'Für eine Gruppe oben „Gruppe" wählen'; return; }

  const body = { participant_ids: checked, is_group: chatNewGroupMode };
  if (chatNewGroupMode) {
    const name = document.getElementById('chat-new-group-name').value.trim();
    if (!name) { err.textContent = 'Gruppenname eingeben'; return; }
    body.name = name;
  }

  try {
    const conv = await API.createChatConversation(body);
    if (!chatConversations.find(c => c.id === conv.id)) chatConversations.unshift(conv);
    closeSheet();
    openChatConversation(conv.id);
  } catch (e) {
    err.textContent = e.detail || 'Fehler beim Erstellen';
  }
}

// --- URL Slugs & Deep Linking ---

function chatSlugify(text) {
  return (text || '')
    .toString()
    .trim()
    .toLowerCase()
    .replace(/ä/g, 'ae')
    .replace(/ö/g, 'oe')
    .replace(/ü/g, 'ue')
    .replace(/ß/g, 'ss')
    .replace(/[^a-z0-9_-]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

function chatSlug(conv) {
  if (!conv) return 'chat';
  const title = chatConversationTitle(conv);
  const baseSlug = chatSlugify(title) || 'chat';
  const collision = chatConversations.some(c => c.id !== conv.id && chatSlugify(chatConversationTitle(c)) === baseSlug);
  return collision ? `${baseSlug}-${conv.id}` : baseSlug;
}

function chatUrlPath(conv) {
  if (!conv) return '/chat';
  const slug = chatSlug(conv);
  return `/chat/${slug}`;
}

function findConversationBySlugOrId(slugOrId, list) {
  if (!slugOrId || !list || !list.length) return null;
  const decoded = decodeURIComponent(slugOrId).trim().toLowerCase();

  // 1. Direct ID match if numeric
  const numId = parseInt(decoded, 10);
  if (!isNaN(numId) && String(numId) === decoded) {
    const byId = list.find(c => c.id === numId);
    if (byId) return byId;
  }

  // 2. Exact slug match
  const bySlug = list.find(c => chatSlug(c).toLowerCase() === decoded);
  if (bySlug) return bySlug;

  // 3. Exact title match
  const byTitle = list.find(c => chatConversationTitle(c).trim().toLowerCase() === decoded);
  if (byTitle) return byTitle;

  // 4. First name or slugified first name match (e.g. "Simon" for "Simon Kulbarts")
  const byFirstName = list.find(c => {
    const title = chatConversationTitle(c).trim().toLowerCase();
    const firstName = title.split(/\s+/)[0];
    return firstName === decoded || chatSlugify(firstName) === decoded;
  });
  if (byFirstName) return byFirstName;

  return null;
}

// --- Conversation detail ---

async function openChatConversation(id, fromDeepLink = false, isPopState = false) {
  chatCurrentConversationId = id;
  document.getElementById('chat-list-view').style.display = 'none';
  document.getElementById('chat-detail-view').style.display = 'flex';
  document.querySelector('#page-chat .fab')?.style.setProperty('display', 'none');
  const conv = chatConversations.find(c => c.id === id);
  document.getElementById('chat-title').textContent = conv ? chatConversationTitle(conv) : 'Chat';
  document.getElementById('chat-mute-btn').style.display = 'flex';
  document.getElementById('chat-search-btn').style.display = 'none';
  updateChatMuteIcon(conv?.is_muted);
  updateChatHeaderAvatar(conv);

  chatReplyTo = null;
  document.getElementById('chat-reply-bar').style.display = 'none';
  chatMessages = await API.chatMessages(id).catch(() => []);
  renderChatMessages();
  await API.markChatRead(id).catch(() => {});
  const localConv = chatConversations.find(c => c.id === id);
  if (localConv) localConv.unread_count = 0;

  initChatGestureHandlers();
  startChatMsgPolling();

  const targetUrl = conv ? chatUrlPath(conv) : `/chat/${id}`;
  if (fromDeepLink) {
    chatOpenedFromDirectUrl = true;
    history.replaceState({ page: 'chat', chatConv: true, conversationId: id }, '', targetUrl);
  } else if (!isPopState) {
    chatOpenedFromDirectUrl = false;
    history.pushState({ page: 'chat', chatConv: true, conversationId: id }, '', targetUrl);
  }
}

function closeChatConversation(isPopState) {
  chatCurrentConversationId = null;
  if (chatMsgPollInterval) { clearInterval(chatMsgPollInterval); chatMsgPollInterval = null; }
  if (chatPlayingVoiceId !== null) {
    document.getElementById(`chat-voice-audio-${chatPlayingVoiceId}`)?.pause();
    chatPlayingVoiceId = null;
  }
  document.getElementById('chat-detail-view').style.display = 'none';
  document.getElementById('chat-list-view').style.display = '';
  document.querySelector('#page-chat .fab')?.style.setProperty('display', 'flex');
  document.getElementById('chat-title').textContent = 'Chat';
  document.getElementById('chat-mute-btn').style.display = 'none';
  document.getElementById('chat-search-btn').style.display = 'flex';
  document.getElementById('chat-header-avatar').style.display = 'none';
  renderChatList();

  if (isPopState) {
    chatOpenedFromDirectUrl = false;
    return;
  }

  if (chatOpenedFromDirectUrl) {
    chatOpenedFromDirectUrl = false;
    history.replaceState({ page: 'chat' }, '', '/chat');
  } else if (history.state && history.state.chatConv) {
    isSelfPopping = true;
    history.back();
  } else {
    history.pushState({ page: 'chat' }, '', '/chat');
  }
}

function chatHandlePopstate(state) {
  if (state && state.chatConv && state.conversationId) {
    if (chatCurrentConversationId !== state.conversationId) {
      openChatConversation(state.conversationId, false, true);
    }
  } else {
    if (chatCurrentConversationId !== null) {
      closeChatConversation(true);
    }
  }
}

function chatMsgTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}

function renderChatPollBubble(m) {
  const poll = m.poll;
  if (!poll) return '<div style="opacity:0.6;font-style:italic;">Umfrage konnte nicht geladen werden</div>';
  const myVotes = poll.my_votes || [];
  const options = poll.options.map(opt => {
    const pct = poll.total_votes ? Math.round(opt.vote_count / poll.total_votes * 100) : 0;
    const voted = myVotes.includes(opt.id);
    return `<button type="button" class="chat-poll-opt${voted ? ' voted' : ''}" onclick="castChatVote(${m.id},${opt.id})">
      <div class="chat-poll-opt-bar">
        <div class="chat-poll-opt-fill" style="width:${pct}%;"></div>
        <div class="chat-poll-opt-label"><span>${voted ? (poll.allow_multiple ? '☑ ' : '✓ ') : ''}${escapeHtml(opt.option_text)}</span><span>${pct}%</span></div>
      </div>
    </button>`;
  }).join('');
  return `
    <div style="display:flex;align-items:center;gap:6px;font-weight:700;margin-bottom:2px;">
      <i data-lucide="bar-chart-2" style="width:14px;height:14px;flex-shrink:0;"></i>
      <span>${escapeHtml(poll.question)}</span>
    </div>
    ${poll.allow_multiple ? '<div style="font-size:0.7rem;opacity:0.55;margin-bottom:2px;">Mehrfachauswahl möglich</div>' : ''}
    ${options}
    <div style="font-size:0.72rem;opacity:0.65;margin-top:2px;">${poll.total_votes} Stimme${poll.total_votes === 1 ? '' : 'n'}</div>`;
}

// A short one-line summary of any message, regardless of type — used for
// the reply-quote preview (both in the composer bar and inside a bubble
// that's replying to something) and doesn't need to match the fuller
// per-type rendering renderChatMessageBody() does for the message's own
// bubble.
function chatMessagePreviewText(m) {
  if (m.msg_type === 'text') return m.text || '';
  return { image: '📷 Bild', file: '📎 ' + (m.file_name || 'Datei'), voice: '🎤 Sprachnachricht', poll: '📊 ' + (m.text || 'Umfrage') }[m.msg_type] || '';
}

function chatFileUrl(m) {
  return `/api/v1/chat/conversations/${m.conversation_id}/messages/${m.id}/file`;
}

function renderChatMessageBody(m) {
  if (m.msg_type === 'poll') return renderChatPollBubble(m);
  if (m.msg_type === 'image') {
    // A GIF picked from the GIPHY library streams straight from GIPHY's CDN
    // (external_url) instead of our own file-serving endpoint — nothing to
    // download/re-host for something already meant to be publicly embedded.
    const src = m.external_url || chatFileUrl(m);
    return `<img src="${src}" loading="lazy" style="max-width:220px;max-height:280px;border-radius:10px;display:block;cursor:pointer;" onclick="window.open('${src}','_blank')">`;
  }
  if (m.msg_type === 'file') {
    return `<a href="${chatFileUrl(m)}" download="${escapeHtml(m.file_name || '')}" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;min-width:140px;">
      <i data-lucide="file" style="width:20px;height:20px;flex-shrink:0;"></i>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(m.file_name || 'Datei')}</span>
    </a>`;
  }
  if (m.msg_type === 'voice') {
    return `<div class="chat-voice-player">
      <button type="button" class="chat-voice-play-btn" onclick="toggleChatVoicePlayback(${m.id})">
        <i data-lucide="play" id="chat-voice-icon-${m.id}" style="width:16px;height:16px;margin-left:1px;"></i>
      </button>
      <div class="chat-voice-progress-wrap" onclick="seekChatVoice(event,${m.id})">
        <div class="chat-voice-progress-track"><div class="chat-voice-progress-fill" id="chat-voice-fill-${m.id}"></div></div>
      </div>
      <span class="chat-voice-time" id="chat-voice-time-${m.id}">0:00</span>
      <audio id="chat-voice-audio-${m.id}" src="${chatFileUrl(m)}" preload="metadata" style="display:none;"
        onloadedmetadata="onChatVoiceLoaded(${m.id})" ontimeupdate="onChatVoiceProgress(${m.id})" onended="onChatVoiceEnded(${m.id})"></audio>
    </div>`;
  }
  return `<div>${escapeHtml(m.text || '')}</div>`;
}

function renderChatReplyQuote(reply) {
  if (!reply) return '';
  return `<div class="chat-reply-quote">
    <div class="chat-reply-quote-sender">${escapeHtml(reply.sender_name)}</div>
    <div class="chat-reply-quote-text">${escapeHtml(chatMessagePreviewText(reply))}</div>
  </div>`;
}

function renderChatReactionPills(m) {
  if (!m.reactions || !m.reactions.length) return '';
  return `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;">
    ${m.reactions.map(r => `<button type="button" class="chat-reaction-pill" onclick="reactToChatMessage(${m.id},'${r.emoji}')" style="background:${r.reacted_by_me ? 'rgba(103,80,164,0.25)' : 'rgba(0,0,0,0.08)'};">${r.emoji}<span>${r.count}</span></button>`).join('')}
  </div>`;
}

function renderChatMessages() {
  const el = document.getElementById('chat-messages-scroll');
  const wasNearBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 80;
  el.innerHTML = chatMessages.map(m => {
    const mine = currentUser && m.sender_id === currentUser.id;
    const conv = chatConversations.find(c => c.id === chatCurrentConversationId);
    const showSender = !mine && conv && conv.is_group;
    const avatarHtml = showSender
      ? `<div class="avatar" style="${avatarImgStyle({ avatar_url: m.sender_avatar })}width:26px;height:26px;border-radius:50%;background:#eaddff;color:#442b7a;display:flex;align-items:center;justify-content:center;font-size:0.62rem;font-weight:700;flex-shrink:0;align-self:flex-end;margin-bottom:2px;">${m.sender_avatar ? '' : escapeHtml((m.sender_name || '?').slice(0, 2).toUpperCase())}</div>`
      : '';
    return `
    <div class="chat-bubble-row ${mine ? 'mine' : ''}" data-message-id="${m.id}" style="${showSender ? 'gap:6px;align-items:flex-end;' : ''}">
      ${avatarHtml}
      <div class="chat-bubble" style="${m.msg_type === 'poll' ? 'min-width:220px;' : ''}">
        ${showSender ? `<div class="chat-bubble-sender">${escapeHtml(m.sender_name)}</div>` : ''}
        ${renderChatReplyQuote(m.reply_to)}
        ${renderChatMessageBody(m)}
        ${renderChatReactionPills(m)}
        <div class="chat-bubble-time">${chatMsgTime(m.created_at)}</div>
      </div>
    </div>`;
  }).join('');
  if (wasNearBottom || !el.dataset.scrolledOnce) {
    el.scrollTop = el.scrollHeight;
    el.dataset.scrolledOnce = '1';
  }
  if (window.lucide) lucide.createIcons();
}

async function castChatVote(messageId, optionId) {
  if (!chatCurrentConversationId) return;
  try {
    const updatedPoll = await API.voteChatPoll(chatCurrentConversationId, messageId, optionId);
    const msg = chatMessages.find(m => m.id === messageId);
    if (msg) msg.poll = updatedPoll;
    renderChatMessages();
  } catch {
    showToast('Abstimmung fehlgeschlagen');
  }
}

function startChatMsgPolling() {
  if (chatMsgPollInterval) clearInterval(chatMsgPollInterval);
  chatMsgPollInterval = setInterval(async () => {
    if (!chatCurrentConversationId || !document.getElementById('chat-messages-scroll')) {
      clearInterval(chatMsgPollInterval); chatMsgPollInterval = null; return;
    }
    if (document.hidden) return;
    const fresh = await API.chatMessages(chatCurrentConversationId).catch(() => null);
    if (!fresh || !chatCurrentConversationId) return;
    if (JSON.stringify(fresh) !== JSON.stringify(chatMessages)) {
      chatMessages = fresh;
      renderChatMessages();
      API.markChatRead(chatCurrentConversationId).catch(() => {});
    }
  }, 3000);
}

function chatAutoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function chatInputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChatMessage();
  }
}

async function sendChatMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !chatCurrentConversationId) return;
  input.value = '';
  chatAutoGrow(input);
  const btn = document.getElementById('chat-send-btn');
  btn.disabled = true;
  const replyToId = chatReplyTo?.id || null;
  try {
    const msg = await API.sendChatMessage(chatCurrentConversationId, { msg_type: 'text', text, reply_to_id: replyToId });
    chatMessages.push(msg);
    renderChatMessages();
    cancelChatReply();
    const conv = chatConversations.find(c => c.id === chatCurrentConversationId);
    if (conv) { conv.last_message = text; conv.last_message_at = msg.created_at; }
  } catch {
    showToast('Nachricht konnte nicht gesendet werden');
    input.value = text;
  }
  btn.disabled = false;
}

// --- Reply, copy, react (long-press / swipe on a message) ---

function startChatReply(messageId) {
  closeChatActionMenu();
  const msg = chatMessages.find(m => m.id === messageId);
  if (!msg) return;
  chatReplyTo = msg;
  document.getElementById('chat-reply-sender').textContent = msg.sender_name;
  document.getElementById('chat-reply-preview').textContent = chatMessagePreviewText(msg);
  document.getElementById('chat-reply-bar').style.display = 'flex';
  document.getElementById('chat-input').focus();
}

function cancelChatReply() {
  chatReplyTo = null;
  const bar = document.getElementById('chat-reply-bar');
  if (bar) bar.style.display = 'none';
}

async function copyChatMessage(messageId) {
  closeChatActionMenu();
  const msg = chatMessages.find(m => m.id === messageId);
  if (!msg || !msg.text) return;
  try {
    await navigator.clipboard.writeText(msg.text);
    showToast('Kopiert');
  } catch {
    showToast('Kopieren nicht möglich');
  }
}

async function reactToChatMessage(messageId, emoji) {
  closeChatActionMenu();
  if (!chatCurrentConversationId) return;
  try {
    const reactions = await API.reactChatMessage(chatCurrentConversationId, messageId, emoji);
    const msg = chatMessages.find(m => m.id === messageId);
    if (msg) msg.reactions = reactions;
    renderChatMessages();
  } catch {
    showToast('Reaktion fehlgeschlagen');
  }
}

const CHAT_QUICK_EMOJIS = ['👍', '❤️', '😂', '😮', '😢', '🙏'];

function closeChatActionMenu() {
  if (_chatActionMenuEl) { _chatActionMenuEl.remove(); _chatActionMenuEl = null; }
  if (_chatActionMenuOutsideHandler) { document.removeEventListener('pointerdown', _chatActionMenuOutsideHandler); _chatActionMenuOutsideHandler = null; }
}

// Long-press context menu — portaled to <body> and positioned at the touch
// point (not anchored to a button, unlike toggleMoreMenu() elsewhere in the
// app, since a long-press can land anywhere on a message bubble). Two
// separately-elevated surfaces stacked with a gap (a rounded emoji pill
// above a rounded menu card) — the same two-tier shape most chat apps use
// for this gesture, built from this app's own Material components
// (.m3-dropdown-panel/.m3-dropdown-opt) rather than copying their look.
function openMessageActionMenu(messageId, clientX, clientY) {
  closeChatActionMenu();
  const msg = chatMessages.find(m => m.id === messageId);
  if (!msg) return;

  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;z-index:9999;display:flex;flex-direction:column;gap:8px;';
  wrap.innerHTML = `
    <div class="m3-dropdown-panel dd-open" style="position:static;display:flex;gap:2px;padding:6px 8px;justify-content:space-between;">
      ${CHAT_QUICK_EMOJIS.map(e => `<button type="button" onclick="reactToChatMessage(${messageId},'${e}')" style="font-size:1.3rem;background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:50%;line-height:1;">${e}</button>`).join('')}
    </div>
    <div class="m3-dropdown-panel dd-open" style="position:static;min-width:200px;padding:6px;">
      <div class="m3-dropdown-opt" onclick="startChatReply(${messageId})" style="gap:10px;">
        <i data-lucide="reply" style="width:16px;height:16px;"></i><span>Antworten</span>
      </div>
      ${msg.msg_type === 'text' ? `<div class="m3-dropdown-opt" onclick="copyChatMessage(${messageId})" style="gap:10px;">
        <i data-lucide="copy" style="width:16px;height:16px;"></i><span>Kopieren</span>
      </div>` : ''}
    </div>
  `;
  document.body.appendChild(wrap);
  _chatActionMenuEl = wrap;

  const vw = window.innerWidth, vh = window.innerHeight;
  const left = Math.min(Math.max(8, clientX - 110), vw - 228);
  const top = Math.min(Math.max(8, clientY - 20), vh - 220);
  wrap.style.left = left + 'px';
  wrap.style.top = top + 'px';
  if (window.lucide) lucide.createIcons();

  // Listens for pointerdown, not click: the long-press gesture that just
  // opened this menu ends with a pointerup (and often a synthesized click
  // right after) back at the original bubble, outside the panel — a click
  // listener would catch that and close the menu the instant it opened. A
  // NEW pointerdown elsewhere is unambiguous "the user is now interacting
  // outside the menu" instead, so no artificial delay is needed either.
  _chatActionMenuOutsideHandler = (e) => { if (!wrap.contains(e.target)) closeChatActionMenu(); };
  document.addEventListener('pointerdown', _chatActionMenuOutsideHandler);
}

// Long-press (hold ~450ms without moving) opens the action menu; a
// deliberate horizontal drag to the right — same direction Beeper and most
// other chat apps use — triggers reply directly, the bubble following the
// finger a little as feedback and snapping back on release. Bound once per
// conversation-open via a dataset flag so re-rendering the message list
// (every poll tick) never stacks a second listener on the same container.
function initChatGestureHandlers() {
  const container = document.getElementById('chat-messages-scroll');
  if (!container || container.dataset.gesturesBound) return;
  container.dataset.gesturesBound = '1';
  const SWIPE_THRESHOLD = 60, LONG_PRESS_MS = 450, MOVE_CANCEL_PX = 10;

  container.addEventListener('pointerdown', (e) => {
    const row = e.target.closest('.chat-bubble-row');
    if (!row) return;
    const messageId = parseInt(row.dataset.messageId, 10);
    const state = { messageId, row, startX: e.clientX, startY: e.clientY, moved: false };
    state.longPressTimer = setTimeout(() => {
      if (chatTouchState === state && !state.moved) {
        openMessageActionMenu(messageId, e.clientX, e.clientY);
        chatTouchState = null;
      }
    }, LONG_PRESS_MS);
    chatTouchState = state;
  });

  container.addEventListener('pointermove', (e) => {
    const state = chatTouchState;
    if (!state) return;
    const dx = e.clientX - state.startX, dy = e.clientY - state.startY;
    if (!state.moved && (Math.abs(dx) > MOVE_CANCEL_PX || Math.abs(dy) > MOVE_CANCEL_PX)) {
      state.moved = true;
      clearTimeout(state.longPressTimer);
    }
    if (state.moved && dx > 0 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      state.row.style.transform = `translateX(${Math.min(dx, 80)}px)`;
    }
  });

  const endGesture = (e) => {
    const state = chatTouchState;
    if (!state) return;
    clearTimeout(state.longPressTimer);
    state.row.style.transform = '';
    const dx = (e.clientX ?? state.startX) - state.startX;
    if (state.moved && dx > SWIPE_THRESHOLD) startChatReply(state.messageId);
    chatTouchState = null;
  };
  container.addEventListener('pointerup', endGesture);
  container.addEventListener('pointercancel', endGesture);
}

// --- Attachments (image / file / GIF) ---

function toggleChatAttachMenu(btn) {
  toggleMoreMenu(btn, [
    { icon: 'image', label: 'Bild', onclick: () => triggerChatFilePicker('image/*') },
    { icon: 'file', label: 'Datei', onclick: () => triggerChatFilePicker('') },
    { icon: 'sticker', label: 'GIF', onclick: () => openChatGifPicker() },
    { icon: 'bar-chart-2', label: 'Umfrage erstellen', onclick: () => openNewPollSheet() },
  ]);
}

// --- GIF picker (GIPHY) ---

let chatGifSearchDebounce = null;

function openChatGifPicker() {
  openSheet(`
    <div style="padding:4px;">
      <div style="font-weight:700;font-size:1.05rem;margin-bottom:12px;">GIF senden</div>
      <input type="search" name="search" class="m3-input" id="chat-gif-search" placeholder="GIFs durchsuchen…" style="margin-bottom:12px;" oninput="chatGifSearchInput()" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="search" enterkeyhint="search" data-form-type="other" data-lpignore="true" data-1p-ignore="true" data-bwignore="true">
      <div id="chat-gif-results" style="max-height:55vh;overflow-y:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;"></div>
    </div>
  `);
  loadChatGifs('');
  setTimeout(() => document.getElementById('chat-gif-search')?.focus(), 150);
}

function chatGifSearchInput() {
  clearTimeout(chatGifSearchDebounce);
  const q = document.getElementById('chat-gif-search').value;
  chatGifSearchDebounce = setTimeout(() => loadChatGifs(q), 350);
}

async function loadChatGifs(q) {
  const grid = document.getElementById('chat-gif-results');
  if (!grid) return;
  grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;opacity:0.5;padding:30px 10px;">Lädt…</div>';
  try {
    const data = await API.searchChatGifs(q);
    if (!document.getElementById('chat-gif-results')) return; // sheet closed while awaiting
    if (!data.results.length) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;opacity:0.5;padding:30px 10px;">Keine GIFs gefunden.</div>';
      return;
    }
    // No loading="lazy" here (unlike message-bubble images): the grid sits
    // inside the bottom sheet while it's still mid CSS-transform (sliding
    // up from translateY(100%)), and populating it fires right after
    // openSheet() returns — a browser's lazy-load intersection check can
    // read the sheet as "not near viewport" at that instant and then never
    // gets a scroll event to re-check once the transform finishes, leaving
    // the image stuck on its placeholder background forever. The grid is
    // small and bounded (max 24 tiles, ~100KB each) and the user just
    // explicitly asked to browse it, so loading everything eagerly is fine.
    grid.innerHTML = data.results.map(g => `
      <img src="${g.preview_url}" style="width:100%;border-radius:10px;cursor:pointer;aspect-ratio:${g.width && g.height ? g.width + '/' + g.height : '1/1'};object-fit:cover;background:rgba(0,0,0,0.06);" onclick="sendChatGif('${g.gif_url.replace(/'/g, "\\'")}')">
    `).join('');
  } catch (e) {
    if (!document.getElementById('chat-gif-results')) return;
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;opacity:0.6;padding:30px 10px;font-size:0.85rem;">${e.status === 503 ? 'GIF-Suche ist noch nicht eingerichtet.' : 'GIFs konnten nicht geladen werden.'}</div>`;
  }
}

async function sendChatGif(url) {
  closeSheet();
  if (!chatCurrentConversationId) return;
  try {
    const msg = await API.sendChatMessage(chatCurrentConversationId, {
      msg_type: 'image', external_url: url, reply_to_id: chatReplyTo?.id || null,
    });
    chatMessages.push(msg);
    renderChatMessages();
    cancelChatReply();
    const conv = chatConversations.find(c => c.id === chatCurrentConversationId);
    if (conv) { conv.last_message = chatMessagePreviewText(msg); conv.last_message_at = msg.created_at; }
  } catch {
    showToast('GIF konnte nicht gesendet werden');
  }
}

function triggerChatFilePicker(accept) {
  const input = document.getElementById('chat-file-input');
  input.accept = accept;
  input.click();
}

async function handleChatFileSelect(file) {
  const input = document.getElementById('chat-file-input');
  if (!file || !chatCurrentConversationId) { input.value = ''; return; }
  await uploadAndSendChatFile(file);
  input.value = '';
}

// Shared by the attach-menu (image/file/GIF) and voice-recording flows —
// uploads first, then sends a message referencing the result. overrideType
// lets the caller force msg_type (voice recordings upload as a generic
// audio blob that the server would otherwise classify as "file").
async function uploadAndSendChatFile(file, overrideType) {
  if (!file || !chatCurrentConversationId) return;
  showToast('Wird hochgeladen…');
  try {
    const form = new FormData();
    form.append('file', file);
    const uploaded = await API.uploadChatFile(chatCurrentConversationId, form);
    const msg = await API.sendChatMessage(chatCurrentConversationId, {
      msg_type: overrideType || uploaded.msg_type, storage_filename: uploaded.storage_filename,
      file_name: uploaded.file_name, file_size: uploaded.file_size, mime_type: uploaded.mime_type,
      reply_to_id: chatReplyTo?.id || null,
    });
    chatMessages.push(msg);
    renderChatMessages();
    cancelChatReply();
    const conv = chatConversations.find(c => c.id === chatCurrentConversationId);
    if (conv) { conv.last_message = chatMessagePreviewText(msg); conv.last_message_at = msg.created_at; }
  } catch {
    showToast('Upload fehlgeschlagen');
  }
}

// --- Voice messages ---

let chatMediaRecorder = null, chatRecordedChunks = [], chatRecordingStartTime = null;
let chatRecordingTimerInterval = null, chatRecordingStream = null, chatRecordingCancelled = false;

async function toggleChatVoiceRecording() {
  if (chatMediaRecorder && chatMediaRecorder.state === 'recording') {
    chatMediaRecorder.stop();
    return;
  }
  if (!navigator.mediaDevices?.getUserMedia) { showToast('Sprachnachrichten werden hier nicht unterstützt'); return; }
  try {
    chatRecordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    showToast('Mikrofonzugriff nicht möglich');
    return;
  }
  chatRecordedChunks = [];
  chatRecordingCancelled = false;
  chatMediaRecorder = new MediaRecorder(chatRecordingStream);
  chatMediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chatRecordedChunks.push(e.data); };
  chatMediaRecorder.onstop = async () => {
    chatRecordingStream.getTracks().forEach(t => t.stop());
    clearInterval(chatRecordingTimerInterval);
    document.getElementById('chat-recording-bar').style.display = 'none';
    document.getElementById('chat-compose-row').style.display = 'flex';
    if (chatRecordingCancelled) return;
    const mimeType = chatMediaRecorder.mimeType || 'audio/webm';
    const blob = new Blob(chatRecordedChunks, { type: mimeType });
    if (blob.size < 500) { showToast('Aufnahme zu kurz'); return; }
    const ext = mimeType.includes('ogg') ? 'ogg' : (mimeType.includes('mp4') ? 'm4a' : 'webm');
    const file = new File([blob], `sprachnachricht.${ext}`, { type: mimeType });
    await uploadAndSendChatFile(file, 'voice');
  };
  chatMediaRecorder.start();
  chatRecordingStartTime = Date.now();
  document.getElementById('chat-compose-row').style.display = 'none';
  document.getElementById('chat-recording-bar').style.display = 'flex';
  document.getElementById('chat-recording-time').textContent = '0:00';
  chatRecordingTimerInterval = setInterval(() => {
    const secs = Math.floor((Date.now() - chatRecordingStartTime) / 1000);
    const el = document.getElementById('chat-recording-time');
    if (el) el.textContent = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
  }, 200);
}

function cancelChatVoiceRecording() {
  chatRecordingCancelled = true;
  if (chatMediaRecorder && chatMediaRecorder.state === 'recording') chatMediaRecorder.stop();
}

// --- Voice message playback (custom player, no native <audio controls> UI) ---

function chatVoiceFormatTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) seconds = 0;
  const s = Math.floor(seconds);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function toggleChatVoicePlayback(messageId) {
  const audio = document.getElementById(`chat-voice-audio-${messageId}`);
  if (!audio) return;
  if (chatPlayingVoiceId !== null && chatPlayingVoiceId !== messageId) {
    // Only one voice message plays at a time — pause whichever else was playing.
    const other = document.getElementById(`chat-voice-audio-${chatPlayingVoiceId}`);
    if (other) other.pause();
    setChatVoiceIcon(chatPlayingVoiceId, 'play');
  }
  if (audio.paused) {
    audio.play();
    chatPlayingVoiceId = messageId;
    setChatVoiceIcon(messageId, 'pause');
  } else {
    audio.pause();
    chatPlayingVoiceId = null;
    setChatVoiceIcon(messageId, 'play');
  }
}

function setChatVoiceIcon(messageId, name) {
  const icon = document.getElementById(`chat-voice-icon-${messageId}`);
  if (!icon) return;
  icon.setAttribute('data-lucide', name);
  icon.style.marginLeft = name === 'play' ? '1px' : '0';
  if (window.lucide) lucide.createIcons();
}

function onChatVoiceLoaded(messageId) {
  const audio = document.getElementById(`chat-voice-audio-${messageId}`);
  const time = document.getElementById(`chat-voice-time-${messageId}`);
  if (audio && time && !audio.currentTime) time.textContent = chatVoiceFormatTime(audio.duration);
}

function onChatVoiceProgress(messageId) {
  const audio = document.getElementById(`chat-voice-audio-${messageId}`);
  const fill = document.getElementById(`chat-voice-fill-${messageId}`);
  const time = document.getElementById(`chat-voice-time-${messageId}`);
  if (!audio) return;
  if (fill && audio.duration) fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
  if (time) time.textContent = chatVoiceFormatTime(audio.duration - audio.currentTime);
}

function onChatVoiceEnded(messageId) {
  const fill = document.getElementById(`chat-voice-fill-${messageId}`);
  const time = document.getElementById(`chat-voice-time-${messageId}`);
  const audio = document.getElementById(`chat-voice-audio-${messageId}`);
  if (fill) fill.style.width = '0%';
  if (time && audio) time.textContent = chatVoiceFormatTime(audio.duration);
  if (chatPlayingVoiceId === messageId) chatPlayingVoiceId = null;
  setChatVoiceIcon(messageId, 'play');
}

function seekChatVoice(e, messageId) {
  const audio = document.getElementById(`chat-voice-audio-${messageId}`);
  const wrap = e.currentTarget;
  if (!audio || !audio.duration) return;
  const rect = wrap.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
  audio.currentTime = ratio * audio.duration;
  onChatVoiceProgress(messageId);
}

// --- Polls ---

function openNewPollSheet() {
  openSheet(`
    <div style="padding:4px;">
      <div style="font-weight:700;font-size:1.05rem;margin-bottom:14px;">Umfrage erstellen</div>
      <input type="text" class="m3-input" id="chat-poll-question" placeholder="Frage" style="margin-bottom:12px;">
      <div id="chat-poll-options">
        <input type="text" class="m3-input chat-poll-opt-input" placeholder="Option 1" style="margin-bottom:8px;">
        <input type="text" class="m3-input chat-poll-opt-input" placeholder="Option 2" style="margin-bottom:8px;">
      </div>
      <button type="button" class="chip" onclick="addChatPollOptionField()" style="margin-bottom:14px;">+ Option hinzufügen</button>
      <label style="display:flex;align-items:center;gap:10px;margin-bottom:16px;cursor:pointer;">
        <input type="checkbox" id="chat-poll-multi" style="width:18px;height:18px;">
        <span style="font-size:0.88rem;">Mehrere Antworten pro Person erlauben</span>
      </label>
      <div id="chat-poll-err" style="color:#b3261e;font-size:0.82rem;min-height:18px;margin-bottom:4px;"></div>
      <button class="m3-btn-full" onclick="submitNewPoll()">Umfrage senden</button>
    </div>
  `);
  setTimeout(() => document.getElementById('chat-poll-question')?.focus(), 100);
}

function addChatPollOptionField() {
  const wrap = document.getElementById('chat-poll-options');
  const n = wrap.querySelectorAll('.chat-poll-opt-input').length + 1;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'm3-input chat-poll-opt-input';
  input.placeholder = `Option ${n}`;
  input.style.marginBottom = '8px';
  wrap.appendChild(input);
  input.focus();
}

async function submitNewPoll() {
  const question = document.getElementById('chat-poll-question').value.trim();
  const options = [...document.querySelectorAll('.chat-poll-opt-input')].map(i => i.value.trim()).filter(Boolean);
  const err = document.getElementById('chat-poll-err');
  if (!question) { err.textContent = 'Frage eingeben'; return; }
  if (options.length < 2) { err.textContent = 'Mindestens 2 Antwortmöglichkeiten eingeben'; return; }
  const pollMulti = document.getElementById('chat-poll-multi').checked;
  try {
    const msg = await API.sendChatMessage(chatCurrentConversationId, { msg_type: 'poll', text: question, poll_options: options, poll_multi: pollMulti });
    chatMessages.push(msg);
    renderChatMessages();
    cancelChatReply();
    const conv = chatConversations.find(c => c.id === chatCurrentConversationId);
    if (conv) { conv.last_message = '📊 Umfrage: ' + question; conv.last_message_at = msg.created_at; }
    closeSheet();
  } catch (e) {
    err.textContent = e.detail || 'Fehler beim Erstellen';
  }
}

// --- Mute ---

function updateChatMuteIcon(muted) {
  const icon = document.getElementById('chat-mute-icon');
  const btn = document.getElementById('chat-mute-btn');
  if (!icon || !btn) return;
  icon.setAttribute('data-lucide', muted ? 'bell-off' : 'bell');
  btn.title = muted ? 'Stummschaltung aufheben' : 'Stummschalten';
  btn.dataset.muted = muted ? '1' : '0';
  if (window.lucide) lucide.createIcons();
}

async function toggleChatMute() {
  if (!chatCurrentConversationId) return;
  const conv = chatConversations.find(c => c.id === chatCurrentConversationId);
  const newMuted = !(conv && conv.is_muted);
  try {
    await API.setChatMute(chatCurrentConversationId, newMuted);
    if (conv) conv.is_muted = newMuted;
    updateChatMuteIcon(newMuted);
    showToast(newMuted ? 'Chat stummgeschaltet' : 'Stummschaltung aufgehoben');
  } catch {
    showToast('Fehler beim Ändern');
  }
}
</script>
