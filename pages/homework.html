<div class="page" id="page-homework" style="background:#fff5f8;">
  <div class="page-header">
    <button class="back-btn"><i data-lucide="arrow-left" style="width:22px;height:22px;"></i></button>
    <span class="page-title">Hausaufgaben</span>
    <div style="flex:1;"></div>
    <div style="display:flex;gap:8px;">
      <button onclick="hwFilter('all',this)" class="chip active" id="hw-f-all">Alle</button>
      <button onclick="hwFilter('open',this)" class="chip" id="hw-f-open">Offen</button>
    </div>
  </div>

  <div class="page-scroll">
    <div id="hw-list"></div>
    <div id="hw-empty" style="display:none;text-align:center;padding:60px 20px;opacity:0.4;">
      <i data-lucide="check-circle" style="width:48px;height:48px;margin-bottom:12px;"></i>
      <div>Keine Hausaufgaben!</div>
    </div>
  </div>

  <button class="fab" onclick="openHwSheet()">
    <i data-lucide="plus" style="width:24px;height:24px;"></i>
  </button>
</div>

<script>
let hwItems = [], hwSubjects = [], hwCurrentFilter = 'all', hwCurrentUser = null;

async function init_homework() {
  [hwItems, hwSubjects, hwCurrentUser] = await Promise.all([
    API.homework().catch(() => []),
    API.subjects().catch(() => []),
    API.me().catch(() => null),
  ]);
  renderHw();
}

function hwFilter(f, btn) {
  hwCurrentFilter = f;
  document.querySelectorAll('#page-homework .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  renderHw();
}

function renderHw() {
  const today = new Date().toISOString().slice(0,10);
  let items = [...hwItems].sort((a,b) => a.due_date.localeCompare(b.due_date));
  if (hwCurrentFilter === 'open') items = items.filter(h => !h.checked_by.includes(hwCurrentUser?.id) && h.due_date >= today);
  const list = document.getElementById('hw-list');
  if (!items.length) {
    list.innerHTML = '';
    document.getElementById('hw-empty').style.display = 'block';
    return;
  }
  document.getElementById('hw-empty').style.display = 'none';
  const subMap = Object.fromEntries(hwSubjects.map(s => [s.id, s]));
  const uid = hwCurrentUser?.id;
  list.innerHTML = items.map(h => {
    const sub = subMap[h.subject_id] || {};
    const checked = h.checked_by.includes(uid);
    const overdue = h.due_date < today && !checked;
    return `
    <div class="hw-item ${checked?'done':''}" id="hw-${h.id}">
      <div class="hw-check ${checked?'checked':''}" onclick="toggleHw(${h.id})">
        ${checked?'<i data-lucide="check" style="width:14px;height:14px;color:white;"></i>':''}
      </div>
      <div style="flex:1;">
        <div style="font-weight:600;${checked?'text-decoration:line-through;':''}">${h.description}</div>
        <div style="display:flex;gap:8px;margin-top:6px;align-items:center;flex-wrap:wrap;">
          <span style="background:${sub.color||'#eaddff'};color:${sub.color?'#21005d':'#21005d'};padding:3px 10px;border-radius:8px;font-size:0.75rem;font-weight:600;">${sub.name||'?'}</span>
          <span style="font-size:0.78rem;opacity:0.6;${overdue?'color:#b3261e;font-weight:600;':''}">${overdue?'Überfällig · ':''} ${new Date(h.due_date+'T00:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'})}</span>
        </div>
      </div>
      <button onclick="deleteHw(${h.id})" style="background:none;border:none;cursor:pointer;opacity:0.3;padding:4px;flex-shrink:0;">
        <i data-lucide="trash-2" style="width:16px;height:16px;"></i>
      </button>
    </div>`;
  }).join('');
  lucide.createIcons();
}

async function toggleHw(id) {
  try {
    await API.checkHomework(id);
    const idx = hwItems.findIndex(h => h.id === id);
    if (idx >= 0) {
      const uid = hwCurrentUser?.id;
      const arr = [...(hwItems[idx].checked_by||[])];
      const i = arr.indexOf(uid);
      if (i >= 0) arr.splice(i,1); else arr.push(uid);
      hwItems[idx].checked_by = arr;
    }
    renderHw();
  } catch { showToast('Fehler'); }
}

async function deleteHw(id) {
  try {
    await API.deleteHomework(id);
    hwItems = hwItems.filter(h => h.id !== id);
    renderHw();
    showToast('Gelöscht');
  } catch { showToast('Fehler'); }
}

function openHwSheet() {
  openSheet(`
    <div style="font-size:1.1rem;font-weight:700;margin-bottom:20px;">Neue Hausaufgabe</div>
    <select class="m3-select" id="hw-subject">
      ${hwSubjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
    </select>
    <textarea class="m3-input" id="hw-desc" placeholder="Beschreibung" rows="3" style="resize:none;height:auto;"></textarea>
    <input class="m3-input" id="hw-due" type="date" value="${new Date(Date.now()+86400000).toISOString().slice(0,10)}">
    <button class="m3-btn-full" onclick="saveHw()">Speichern</button>
  `);
}

async function saveHw() {
  const subject_id = parseInt(document.getElementById('hw-subject').value);
  const description = document.getElementById('hw-desc').value.trim();
  const due_date = document.getElementById('hw-due').value;
  if (!description || !due_date) { showToast('Felder ausfüllen'); return; }
  try {
    const hw = await API.createHomework({ subject_id, description, due_date });
    hwItems.push(hw);
    closeSheet();
    renderHw();
    showToast('Gespeichert');
  } catch { showToast('Fehler'); }
}
</script>
