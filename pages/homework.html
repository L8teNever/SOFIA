<script>
document.getElementById('ph-homework').outerHTML = pageHeader({
  title: 'Aufgaben',
  titleStyle: 'color:#31111d;',
  subtitle: 'Lade…',
  subtitleId: 'hw-header-sub',
  subtitleStyle: 'color:#31111d;',
});
document.getElementById('hw-empty-slot').outerHTML = emptyState({
  icon: 'check-circle', title: 'Keine Hausaufgaben!', wrapperId: 'hw-empty'
});
document.getElementById('hw-fab-slot').outerHTML = fab({
  onclick: 'openHwSheet()', title: 'Neue Aufgabe erstellen'
});
document.getElementById('hw-chips-slot').innerHTML = chipRow({
  onclick: 'hwFilter',
  idPrefix: 'hw-f',
  items: [
    { value: 'all', label: 'Alle', active: true },
    { value: 'open', label: 'Offen' },
    { value: 'done', label: 'Erledigt' },
  ],
});
let hwItems = [], hwSubjects = [], hwCurrentFilter = 'all', hwCurrentUser = null, hwTimetable = null;
let hwDueMode = 'next', hwCustomDate = null;
let hwPendingFiles = []; // Array of { url, type, name }
let hwDetailId = null;

async function init_homework() {
  [hwItems, hwSubjects, hwCurrentUser] = await Promise.all([
    API.homework().catch(() => []),
    API.subjects().catch(() => []),
    API.me().catch(() => null),
  ]);
  renderHwStats(); renderHw();
  API.timetable().then(tt => { hwTimetable = tt; }).catch(() => {});
}

function hwCurrentSubjectId() {
  if (!hwTimetable || !hwTimetable.configured || hwTimetable.error) return null;
  const lessons = hwTimetable.this_week?.lessons || [];
  const now = new Date();
  const todayStr = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
  const nowHHMM = now.getHours() * 100 + now.getMinutes();
  const active = lessons.find(l => l.date === todayStr && !l.cancelled && nowHHMM >= l.startTime && nowHHMM <= l.endTime);
  if (!active) return null;
  const name = (active.subject_short || active.subject || '').toLowerCase();
  const match = hwSubjects.find(s => (s.short_name || '').toLowerCase() === name || (s.name || '').toLowerCase() === name);
  return match ? match.id : null;
}

function hwSubjectLessonDates(subjectId) {
  if (!hwTimetable || !hwTimetable.configured || hwTimetable.error) return [];
  const sub = hwSubjects.find(s => s.id === subjectId);
  if (!sub) return [];
  const subName = (sub.name || '').toLowerCase();
  const subShort = (sub.short_name || '').toLowerCase();
  if (!subName && !subShort) return [];
  const lessons = [...(hwTimetable.this_week?.lessons || []), ...(hwTimetable.next_week?.lessons || [])];
  const now = new Date();
  const todayNum = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
  const nowHHMM = now.getHours() * 100 + now.getMinutes();

  const matches = lessons.filter(l => {
    if (l.cancelled) return false;
    const lname = (l.subject || '').toLowerCase();
    const lshort = (l.subject_short || '').toLowerCase();
    const isMatch = (subShort && lshort === subShort) || (subName && lname === subName);
    if (!isMatch) return false;
    if (l.date < todayNum) return false;
    if (l.date === todayNum && l.endTime < nowHHMM) return false;
    return true;
  }).sort((a, b) => a.date.localeCompare(b.date) || a.startTime - b.startTime);

  const seen = new Set(), dates = [];
  for (const l of matches) {
    if (seen.has(l.date)) continue;
    seen.add(l.date);
    dates.push(l.date);
  }
  return dates;
}

function yyyymmddToIso(d) {
  return `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6, 8)}`;
}

function hwDefaultTomorrow() {
  return new Date(Date.now() + 86400000).toISOString().slice(0, 10);
}

function hwFormatDueLabel(iso) {
  if (!iso) return '–';
  const d = new Date(iso + 'T00:00');
  return d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function renderHwStats() {
  const uid = hwCurrentUser && hwCurrentUser.id;
  const open = hwItems.filter(h => !(h.checked_by || []).includes(uid)).length;
  const done = hwItems.filter(h => (h.checked_by || []).includes(uid)).length;
  const sub = document.getElementById('hw-header-sub');
  if (sub) sub.textContent = open + ' offen · ' + done + ' erledigt';
}

function hwFilter(f, btn) {
  hwCurrentFilter = f;
  document.querySelectorAll('#page-homework .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active'); renderHw();
}

function sectionLabel(text) {
  return '<div class="section-label" style="color:#31111d;">' + text + '</div>';
}

function getHwAttachments(h) {
  if (Array.isArray(h.attachments) && h.attachments.length > 0) return h.attachments;
  if (h.file_url) return [{ url: h.file_url, type: h.file_type || 'file', name: 'Anhang' }];
  return [];
}

function hwCard(h, sub, uid, today) {
  const checked = (h.checked_by || []).includes(uid);
  const overdue = h.due_date < today && !checked;
  // Subject color comes from an open color picker in admin (any hex, not
  // just soft palette tones) — mixed down to a pastel tint here so a
  // fully-saturated pick (e.g. pure red) doesn't paint the whole card in
  // it, matching the soft-card look every other list in the app uses.
  const bg = `color-mix(in srgb, ${sub.color || '#ffd8e4'} 18%, white)`;
  const d = new Date(h.due_date+'T00:00');
  const isToday = h.due_date === today;
  const isTomorrow = h.due_date === new Date(Date.now()+86400000).toISOString().slice(0,10);
  const dateLabel = isToday ? 'Heute' : isTomorrow ? 'Morgen' : d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});

  const atts = getHwAttachments(h);
  const hasImages = atts.some(a => a.type === 'image');
  const attachmentBadge = atts.length > 0
    ? `<span class="hw-card-attachment-badge"><i data-lucide="${hasImages ? 'image' : 'paperclip'}" style="width:12px;height:12px;"></i> ${atts.length > 1 ? atts.length : ''}</span>`
    : '';

  return `
    <div class="list-card-enter" onclick="openHwDetail(${h.id})" style="background:${bg};border-radius:24px;padding:18px;cursor:pointer;transition:transform 0.12s ease;${checked ? 'opacity:0.55;' : ''}">
      <div style="display:flex;gap:12px;align-items:flex-start;">
        <div class="hw-check" onclick="event.stopPropagation();toggleHw(${h.id},this)" style="width:28px;height:28px;border-radius:50%;flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;${checked ? 'background:rgba(0,0,0,0.3);' : 'border:2.5px solid rgba(0,0,0,0.25);background:transparent;'}">
          ${checked ? '<i data-lucide="check" style="width:14px;height:14px;color:white;"></i>' : ''}
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:0.95rem;${checked ? 'text-decoration:line-through;' : ''}">${escapeHtml(h.description)}</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;">
            <span style="font-size:0.72rem;font-weight:700;background:rgba(0,0,0,0.1);padding:4px 10px;border-radius:10px;">${escapeHtml(sub.name || '?')}</span>
            <span style="font-size:0.72rem;font-weight:${overdue ? '700' : '500'};opacity:0.7;${overdue ? 'color:#b3261e;' : ''}">
              ${overdue ? '⚠ Überfällig · ' : ''}${dateLabel}
            </span>
            ${attachmentBadge}
          </div>
        </div>
        ${moreMenuBtn(`openHwCardMenu(this, ${h.id})`)}
      </div>
    </div>
  `;
}

function renderHw() {
  const today = new Date().toISOString().slice(0,10);
  const thisWeekEnd = new Date(Date.now() + 6*86400000).toISOString().slice(0,10);
  const uid = hwCurrentUser && hwCurrentUser.id;
  const subMap = Object.fromEntries(hwSubjects.map(s => [s.id, s]));
  let items = [...hwItems].sort((a,b) => a.due_date.localeCompare(b.due_date));
  const list = document.getElementById('hw-list');

  if (hwCurrentFilter === 'open') items = items.filter(h => !(h.checked_by || []).includes(uid));
  if (hwCurrentFilter === 'done') items = items.filter(h => (h.checked_by || []).includes(uid));

  if (!items.length) { list.innerHTML = ''; document.getElementById('hw-empty').style.display = 'block'; return; }
  document.getElementById('hw-empty').style.display = 'none';

  if (hwCurrentFilter !== 'done') {
    const todayItems    = items.filter(h => !(h.checked_by || []).includes(uid) && h.due_date === today);
    const weekItems     = items.filter(h => !(h.checked_by || []).includes(uid) && h.due_date > today && h.due_date <= thisWeekEnd);
    const laterItems    = items.filter(h => !(h.checked_by || []).includes(uid) && h.due_date > thisWeekEnd);
    const overdueItems  = items.filter(h => !(h.checked_by || []).includes(uid) && h.due_date < today);
    const doneItems     = hwCurrentFilter === 'all' ? items.filter(h => (h.checked_by || []).includes(uid)) : [];
    let html = '';
    if (overdueItems.length) { html += sectionLabel('Überfällig'); html += overdueItems.map(h => hwCard(h, subMap[h.subject_id]||{}, uid, today)).join(''); }
    if (todayItems.length)   { html += sectionLabel('Heute fällig'); html += todayItems.map(h => hwCard(h, subMap[h.subject_id]||{}, uid, today)).join(''); }
    if (weekItems.length)    { html += sectionLabel('Diese Woche'); html += weekItems.map(h => hwCard(h, subMap[h.subject_id]||{}, uid, today)).join(''); }
    if (laterItems.length)   { html += sectionLabel('Später'); html += laterItems.map(h => hwCard(h, subMap[h.subject_id]||{}, uid, today)).join(''); }
    if (doneItems.length)    { html += sectionLabel('Erledigt'); html += doneItems.map(h => hwCard(h, subMap[h.subject_id]||{}, uid, today)).join(''); }
    list.innerHTML = html;
  } else {
    list.innerHTML = items.map(h => hwCard(h, subMap[h.subject_id]||{}, uid, today)).join('');
  }
  if (window.lucide) lucide.createIcons();
}

function toggleHw(id, checkEl) {
  const idx = hwItems.findIndex(h => h.id === id);
  if (idx < 0) return Promise.resolve();
  const uid = hwCurrentUser && hwCurrentUser.id;
  const nowChecked = !(hwItems[idx].checked_by || []).includes(uid);

  // Pop the checkbox to its new look right away instead of waiting on the
  // API round-trip, then give that a beat to actually register before the
  // list re-render sorts the card into a different section (or removes it
  // under "Offen") — otherwise checking a task off just makes it vanish
  // with no felt confirmation that anything happened. Skipped when called
  // without a checkbox element (the detail view's header button pops
  // itself instead — see toggleHwFromDetail).
  if (checkEl) {
    checkEl.style.background = nowChecked ? 'rgba(0,0,0,0.3)' : 'transparent';
    checkEl.style.border = nowChecked ? 'none' : '2.5px solid rgba(0,0,0,0.25)';
    checkEl.innerHTML = nowChecked ? '<i data-lucide="check" style="width:14px;height:14px;color:white;"></i>' : '';
    checkEl.classList.remove('hw-check-pop');
    void checkEl.offsetWidth; // restart the animation if toggled again quickly
    checkEl.classList.add('hw-check-pop');
    if (window.lucide) lucide.createIcons();
  }

  return new Promise(resolve => {
    setTimeout(async () => {
      try {
        await API.checkHomework(id);
        const arr = [...(hwItems[idx].checked_by||[])];
        const i = arr.indexOf(uid); if (i>=0) arr.splice(i,1); else arr.push(uid);
        hwItems[idx].checked_by = arr;
      } catch {
        showToast('Fehler');
      }
      renderHwStats(); renderHw();
      resolve();
    }, checkEl ? 260 : 0);
  });
}

function openHwCardMenu(btn, hwId) {
  toggleMoreMenu(btn, [
    { icon: 'pencil', label: 'Bearbeiten', onclick: () => openHwSheet(hwId) },
    { icon: 'trash-2', label: 'Löschen', onclick: () => confirmDelHw(hwId), danger: true },
  ]);
}

function confirmDelHw(id) {
  const hw = hwItems.find(h => h.id === id);
  const title = hw ? `„${escapeHtml(hw.description.slice(0, 40))}${hw.description.length > 40 ? '…' : ''}“` : 'diese Aufgabe';
  openModal(confirmDelete({
    title: 'Aufgabe löschen?',
    message: `Willst du ${title} wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden.`,
    onConfirm: `executeDeleteHw(${id})`,
  }));
}

async function executeDeleteHw(id) {
  closeModal();
  try {
    await API.deleteHomework(id);
    hwItems = hwItems.filter(h => h.id !== id);
    renderHwStats(); renderHw();
    if (hwDetailId === id) closeHwDetail();
    showToast('Aufgabe gelöscht');
  } catch { showToast('Fehler beim Löschen'); }
}

// ---- Detail Overlay (Unterseite) ----

function openHwDetail(id) {
  const hw = hwItems.find(h => h.id === id);
  if (!hw) return;
  hwDetailId = id;
  const existing = document.getElementById('page-hw-detail');
  if (existing) existing.remove();
  const tpl = document.getElementById('tpl-hw-detail').content.cloneNode(true);
  document.body.appendChild(tpl);
  document.getElementById('ph-hwd').outerHTML = pageHeader({
    title: '–',
    titleId: 'hwd-title',
    titleStyle: 'color:#31111d;font-size:1.25rem;',
    subtitle: '–',
    subtitleId: 'hwd-subject',
    subtitleStyle: 'color:#31111d;opacity:0.6;',
    backAction: 'event.stopPropagation();closeHwDetail();',
    trailing: `<button class="icon-btn" id="hwd-toggle-btn" onclick="toggleHwFromDetail()" title="Als erledigt markieren"><i data-lucide="check" style="width:20px;height:20px;"></i></button>
      <button class="icon-btn" onclick="deleteHwFromDetail()" style="color:#ba1a1a;" title="Aufgabe löschen"><i data-lucide="trash-2" style="width:20px;height:20px;"></i></button>`
  });
  const page = document.getElementById('page-hw-detail');
  page.style.setProperty('--ox', '50%');
  page.style.setProperty('--oy', '50%');
  requestAnimationFrame(() => requestAnimationFrame(() => page.classList.add('active')));
  renderHwDetail(hw);
  loadHwSolutions(hw.id);
  history.pushState({ hwDetail: id }, '', window.location.pathname);
  if (window.lucide) lucide.createIcons();
}

function renderHwDetail(hw) {
  const sub = hwSubjects.find(s => s.id === hw.subject_id) || {};
  const uid = hwCurrentUser && hwCurrentUser.id;
  const checked = (hw.checked_by || []).includes(uid);
  const today = new Date().toISOString().slice(0, 10);
  const overdue = hw.due_date < today && !checked;
  const isToday = hw.due_date === today;

  const subEl = document.getElementById('hwd-subject');
  if (subEl) subEl.textContent = sub.name || '?';

  const titleEl = document.getElementById('hwd-title');
  if (titleEl) titleEl.textContent = hw.description;

  const descEl = document.getElementById('hwd-desc');
  if (descEl) descEl.textContent = hw.description;

  const dueEl = document.getElementById('hwd-due');
  if (dueEl) dueEl.textContent = hwFormatDueLabel(hw.due_date);

  const statusBadge = document.getElementById('hwd-status-badge');
  if (statusBadge) {
    if (checked) {
      statusBadge.innerHTML = `<span style="font-size:0.75rem;font-weight:700;background:#c4eed0;color:#074d1a;padding:4px 10px;border-radius:10px;display:inline-flex;align-items:center;gap:4px;"><i data-lucide="check" style="width:12px;height:12px;"></i> Erledigt</span>`;
    } else if (overdue) {
      statusBadge.innerHTML = `<span style="font-size:0.75rem;font-weight:700;background:#ffdad6;color:#ba1a1a;padding:4px 10px;border-radius:10px;display:inline-flex;align-items:center;gap:4px;"><i data-lucide="alert-triangle" style="width:12px;height:12px;"></i> Überfällig</span>`;
    } else if (isToday) {
      statusBadge.innerHTML = `<span style="font-size:0.75rem;font-weight:700;background:#ffe082;color:#5d4037;padding:4px 10px;border-radius:10px;">Heute fällig</span>`;
    } else {
      statusBadge.innerHTML = `<span style="font-size:0.75rem;font-weight:700;background:rgba(0,0,0,0.06);color:#49454f;padding:4px 10px;border-radius:10px;">Offen</span>`;
    }
  }

  const toggleBtn = document.getElementById('hwd-toggle-btn');
  if (toggleBtn) {
    if (checked) {
      toggleBtn.style.background = '#c4eed0';
      toggleBtn.style.color = '#074d1a';
      toggleBtn.title = 'Als offen markieren';
    } else {
      toggleBtn.style.background = '';
      toggleBtn.style.color = '';
      toggleBtn.title = 'Als erledigt markieren';
    }
  }

  // Render Attachments
  const wrap = document.getElementById('hwd-attachment-wrap');
  const imgBox = document.getElementById('hwd-attachment-images');
  const fileBox = document.getElementById('hwd-attachment-files');
  const attLabel = document.getElementById('hwd-attachment-label');

  const atts = getHwAttachments(hw);
  if (atts.length > 0) {
    wrap.style.display = 'block';
    if (attLabel) attLabel.textContent = `Anhänge zur Aufgabe (${atts.length})`;

    const images = atts.filter(a => a.type === 'image');
    const files = atts.filter(a => a.type !== 'image');

    if (images.length > 0) {
      imgBox.style.display = 'grid';
      imgBox.innerHTML = images.map(img => `
        <div class="hw-gallery-item" onclick="openHwLightbox('${img.url}', '${escapeHtml(img.name || 'Aufgaben-Bild')}')">
          <img class="hw-gallery-img" src="${img.url}" loading="lazy">
          <div class="hw-gallery-overlay">
            <span style="font-size:0.7rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(img.name || 'Bild')}</span>
          </div>
        </div>
      `).join('');
    } else {
      imgBox.style.display = 'none';
    }

    if (files.length > 0) {
      fileBox.style.display = 'block';
      fileBox.innerHTML = files.map(f => `
        <div class="hw-file-card">
          <div style="display:flex;align-items:center;gap:12px;min-width:0;flex:1;">
            <div class="icon-box" style="width:38px;height:38px;background:rgba(103,80,164,0.1);border-radius:10px;flex-shrink:0;">
              <i data-lucide="file-text" style="width:18px;height:18px;color:#6750a4;"></i>
            </div>
            <div style="font-weight:600;font-size:0.85rem;color:#1c1b1f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
              ${escapeHtml(f.name || 'Dokument')}
            </div>
          </div>
          <a href="${f.url}" target="_blank" class="m3-btn-tonal" style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;font-size:0.78rem;text-decoration:none;border-radius:10px;flex-shrink:0;">
            <i data-lucide="external-link" style="width:13px;height:13px;"></i> Öffnen
          </a>
        </div>
      `).join('');
    } else {
      fileBox.style.display = 'none';
    }
  } else {
    wrap.style.display = 'none';
  }

  if (window.lucide) lucide.createIcons();
}

function closeHwDetail() {
  hwDetailId = null;
  history.back();
}

async function toggleHwFromDetail() {
  if (hwDetailId == null) return;
  const btn = document.getElementById('hwd-toggle-btn');
  if (btn) {
    btn.classList.remove('hw-check-pop');
    void btn.offsetWidth;
    btn.classList.add('hw-check-pop');
  }
  await toggleHw(hwDetailId);
  const hw = hwItems.find(h => h.id === hwDetailId);
  if (hw) renderHwDetail(hw);

function deleteHwFromDetail() {
  if (hwDetailId == null) return;
  confirmDelHw(hwDetailId);
}

      `;
      if (window.lucide) lucide.createIcons();
      return;
    }

    container.innerHTML = solutions.map(sol => {
      const u = sol.user || {};
      const name = escapeHtml(u.display_name || u.email || 'Mitschüler');
      const initials = (name[0] || 'M').toUpperCase();
      const dt = new Date(sol.created_at);
      const timeFmt = dt.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' }) + ', ' + dt.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr';
      const isAuthor = hwCurrentUser && (sol.user_id === hwCurrentUser.id || hwCurrentUser.role === 'admin' || hwCurrentUser.role === 'super_admin');

      const atts = Array.isArray(sol.attachments) ? sol.attachments : [];
      const images = atts.filter(a => a.type === 'image');
      const files = atts.filter(a => a.type !== 'image');

      const imagesHtml = images.length > 0 ? `
        <div class="hw-gallery-grid" style="margin-top:10px;">
          ${images.map(img => `
            <div class="hw-gallery-item" onclick="openHwLightbox('${img.url}', '${escapeHtml(img.name || 'Lösung')}')">
              <img class="hw-gallery-img" src="${img.url}" loading="lazy">
              <div class="hw-gallery-overlay">
                <span style="font-size:0.7rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(img.name || 'Lösungs-Bild')}</span>
              </div>
            </div>

      const filesHtml = files.length > 0 ? `
        <div style="margin-top:8px;">
          ${files.map(f => `
            <div class="hw-file-card" style="background:#f9f7fc;">
              <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1;">
                <div class="icon-box" style="width:34px;height:34px;background:rgba(103,80,164,0.1);border-radius:10px;flex-shrink:0;">

    <div class="section-label" style="margin:12px 4px 6px 4px;">Anhänge (Bilder / Dateien)</div>

function openHwSolutionMenu(btn, solId) {
  const sol = hwSolutionsCache[solId];
  toggleMoreMenu(btn, [
    { icon: 'pencil', label: 'Bearbeiten', onclick: () => openUploadSolutionSheet(sol) },
    { icon: 'trash-2', label: 'Löschen', onclick: () => confirmDelSolution(solId), danger: true },
  ]);
}

async function solFilesSelected(inputEl) {
  const files = Array.from(inputEl.files || []);
  inputEl.value = '';
  if (!files.length) return;

  const preview = document.getElementById('sol-files-preview');
  if (preview) preview.innerHTML = '<div style="font-size:0.8rem;opacity:0.6;padding:6px 0;">Dateien werden hochgeladen…</div>';

  try {
    for (const file of files) {
      const form = new FormData();
      form.append('file', file);
      const res = await API.uploadHwFile(form);
      solPendingFiles.push(res);
    }
    renderSolFilesPreview();
  } catch {
    showToast('Upload fehlgeschlagen');
    renderSolFilesPreview();
  }
}

function renderSolFilesPreview() {
  const preview = document.getElementById('sol-files-preview');
  if (!preview) return;
  if (!solPendingFiles.length) { preview.innerHTML = ''; return; }

  preview.innerHTML = solPendingFiles.map((f, idx) => {
    const isImg = f.type === 'image';
    return `
      <div style="display:flex;align-items:center;gap:10px;background:#f5f3f9;border-radius:12px;padding:8px 10px;margin-bottom:6px;">
        ${isImg
          ? `<img src="${f.url}" style="width:38px;height:38px;border-radius:8px;object-fit:cover;flex-shrink:0;">`
          : `<div class="icon-box" style="width:38px;height:38px;background:rgba(103,80,164,0.1);border-radius:8px;flex-shrink:0;"><i data-lucide="file" style="width:18px;height:18px;color:#6750a4;"></i></div>`}
        <span style="flex:1;font-size:0.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(f.name || 'Datei')}</span>
        <button type="button" onclick="removeSolFile(${idx})" style="background:rgba(0,0,0,0.06);border:none;border-radius:8px;width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <i data-lucide="x" style="width:14px;height:14px;"></i>
        </button>
      </div>
    `;
  }).join('');
  if (window.lucide) lucide.createIcons();
}

function removeSolFile(idx) {
  solPendingFiles.splice(idx, 1);
  renderSolFilesPreview();
}

async function submitSolution() {
  if (!hwDetailId) return;
  const text = (document.getElementById('sol-text')?.value || '').trim();
  if (!text && !solPendingFiles.length) {
    showToast('Bitte gib einen Text ein oder hänge Dateien an');
    return;
  }

  try {
    if (solEditId) {
      await API.updateSolution(hwDetailId, solEditId, { text, attachments: solPendingFiles });
      showToast('Lösung aktualisiert');
    } else {
      await API.createSolution(hwDetailId, { text, attachments: solPendingFiles });
      showToast('Lösung geteilt!');
    }
    solEditId = null;
    closeSheet();
    loadHwSolutions(hwDetailId);
  } catch (err) {
    showToast(err.detail || 'Fehler beim Hochladen');
  }
}

function confirmDelSolution(solId) {
  openModal(confirmDelete({
    title: 'Lösung löschen?',
    message: 'Willst du deine hochgeladene Lösung wirklich löschen?',
    onConfirm: `executeDeleteSolution(${solId})`,
  }));
}

async function executeDeleteSolution(solId) {
  closeModal();
  if (!hwDetailId) return;
  try {
    await API.deleteSolution(hwDetailId, solId);
    loadHwSolutions(hwDetailId);
    showToast('Lösung gelöscht');
  } catch (err) {
    showToast(err.detail || 'Fehler beim Löschen');
  }
}

// ---- Image Lightbox Helpers ----

let hwLightboxHome = null; // { parent, nextSibling } — where to put it back on close

function openHwLightbox(url, title) {
  const lb = document.getElementById('hw-lightbox');
  if (!lb) return;
  // The lightbox lives inside #page-homework so it survives the page-swap
  // (only .page's own top-level element is kept when a page closes —
  // anything else in the fetched HTML is discarded). But that traps its
  // z-index inside #page-homework's own stacking context, so opening it
  // from the detail overlay (a separate, later-appended .page painted on
  // top) left it invisible behind that overlay despite "being open". Move
  // it to <body> right before showing it so it stacks above whatever page
  // or overlay is active, and move it back on close (see closeHwLightbox)
  // instead of leaving an orphaned copy behind if homework itself closes
  // while the lightbox is portaled out of it.
  if (lb.parentElement !== document.body) {
    hwLightboxHome = { parent: lb.parentElement, nextSibling: lb.nextSibling };
    document.body.appendChild(lb);
  }
  const img = document.getElementById('hw-lightbox-img');
  const titleEl = document.getElementById('hw-lightbox-title');
  const link = document.getElementById('hw-lightbox-open-link');
  if (img) img.src = url;
  if (titleEl) titleEl.textContent = title || 'Bild-Vorschau';
  if (link) link.href = url;
  lb.style.display = 'flex';
  requestAnimationFrame(() => lb.style.opacity = '1');
  if (window.lucide) lucide.createIcons();
}

function closeHwLightbox(isPopState = false) {
  const lb = document.getElementById('hw-lightbox');
  if (!lb) return;
  lb.style.opacity = '0';
  setTimeout(() => {
    lb.style.display = 'none';
    // Put it back where it came from if that's still around (the normal
    // case — the user just closed the image, homework is still open);
    // otherwise homework itself closed while the lightbox was portaled
    // out of it, so drop it instead of leaving it stuck in <body> forever.
    if (hwLightboxHome && document.body.contains(hwLightboxHome.parent)) {
      hwLightboxHome.parent.insertBefore(lb, hwLightboxHome.nextSibling);
    } else if (lb.parentElement === document.body) {
      lb.remove();
    }
    hwLightboxHome = null;
  }, 220);
}

function onHwLightboxBgClick(e) {
  if (e.target.id === 'hw-lightbox') closeHwLightbox();
}

let hwEditId = null;

  renderHwDueSection();

function renderHwDueSection() {
  const container = document.getElementById('hw-due-section');
  const subjectSelect = document.getElementById('hw-subject');
  if (!container || !subjectSelect) return;
  const subjectId = parseInt(subjectSelect.value);
  const untisReady = !!(hwTimetable && hwTimetable.configured && !hwTimetable.error);

  if (!untisReady) {
    container.innerHTML = `<input class="m3-input" id="hw-due" type="date" value="${hwCustomDate || hwDefaultTomorrow()}" onchange="hwCustomDate=this.value">`;
    if (typeof enhanceDateTimeInputs === 'function') enhanceDateTimeInputs(container);
    return;
  }

  const dates = hwSubjectLessonDates(subjectId);
  if (dates.length === 0 && hwDueMode !== 'custom') hwDueMode = 'custom';
  const nextIso = dates[0] ? yyyymmddToIso(dates[0]) : null;
  const next2Iso = dates[1] ? yyyymmddToIso(dates[1]) : null;

  let html = `<div class="hw-due-segments">
    <button type="button" class="hw-due-seg ${hwDueMode==='next'?'active':''}" ${!nextIso?'disabled':''} onclick="setHwDueMode('next')">Nächste Stunde</button>
    <button type="button" class="hw-due-seg ${hwDueMode==='next2'?'active':''}" ${!next2Iso?'disabled':''} onclick="setHwDueMode('next2')">Übernächste</button>
    <button type="button" class="hw-due-seg ${hwDueMode==='custom'?'active':''}" onclick="setHwDueMode('custom')">Datum wählen</button>
  </div>`;

  if (hwDueMode === 'next' || hwDueMode === 'next2') {
    const iso = hwDueMode === 'next' ? nextIso : next2Iso;
    html += `<div class="hw-due-computed">${hwFormatDueLabel(iso)}</div>`;
  } else {
    const chipDays = [];
    for (let i = 0; i < 14; i++) {
      const iso = new Date(Date.now() + i*86400000).toISOString().slice(0,10);
      chipDays.push({ iso, num: iso.replace(/-/g,''), hasLesson: dates.includes(iso.replace(/-/g,'')) });
    }
    if (!hwCustomDate) hwCustomDate = (chipDays[1] || chipDays[0]).iso;
    const chipsHtml = chipDays.map(d => {
      const dt = new Date(d.iso + 'T00:00');
      const wd = dt.toLocaleDateString('de-DE', { weekday: 'short' });
      const isSel = d.iso === hwCustomDate;
      return `<button type="button" class="hw-day-chip ${d.hasLesson?'has-lesson':''} ${isSel?'selected':''}" onclick="pickHwCustomDate('${d.iso}')">
        <span class="hw-day-chip-wd">${wd}</span><span class="hw-day-chip-num">${dt.getDate()}</span>
      </button>`;
    }).join('');
    html += `<div class="hw-day-chip-strip no-scrollbar">${chipsHtml}</div>
      <div style="margin-top:10px;">
        <input class="m3-input" id="hw-due-custom-input" type="date" value="${hwCustomDate}" onchange="pickHwCustomDate(this.value)">
      </div>`;
  }

  container.innerHTML = html;
  if (typeof enhanceDateTimeInputs === 'function') enhanceDateTimeInputs(container);
}

function setHwDueMode(mode) {
  hwDueMode = mode;
  renderHwDueSection();
}

function pickHwCustomDate(iso) {
  hwCustomDate = iso;
  renderHwDueSection();
}

function getHwDueDateValue() {
  const plainInput = document.getElementById('hw-due');
  if (plainInput) return plainInput.value;
  if (hwDueMode === 'next' || hwDueMode === 'next2') {
    const subjectId = parseInt(document.getElementById('hw-subject').value);
    const dates = hwSubjectLessonDates(subjectId);
    const iso = hwDueMode === 'next' ? dates[0] : dates[1];
    return iso ? yyyymmddToIso(iso) : (hwCustomDate || hwDefaultTomorrow());
  }
  return hwCustomDate || hwDefaultTomorrow();
}

async function hwFilesSelected(inputEl) {
  const files = Array.from(inputEl.files || []);
  inputEl.value = '';
  if (!files.length) return;

  const preview = document.getElementById('hw-file-preview');
  if (preview) preview.innerHTML = '<div style="font-size:0.8rem;opacity:0.6;margin-top:8px;">Dateien werden hochgeladen…</div>';

  try {
    for (const file of files) {
      const form = new FormData();
      form.append('file', file);
      const res = await API.uploadHwFile(form);
      hwPendingFiles.push(res);
    }
    renderHwFilePreview();
  } catch {
    showToast('Upload fehlgeschlagen');
    renderHwFilePreview();
  }
}

function renderHwFilePreview() {
  const preview = document.getElementById('hw-file-preview');
  if (!preview) return;
  if (!hwPendingFiles.length) { preview.innerHTML = ''; return; }

  preview.innerHTML = hwPendingFiles.map((f, idx) => {
    const isImg = f.type === 'image';
    return `
      <div style="display:flex;align-items:center;gap:10px;margin-top:6px;background:#f5f3f9;border-radius:12px;padding:8px 10px;">
        ${isImg
          ? `<img src="${f.url}" style="width:38px;height:38px;border-radius:8px;object-fit:cover;flex-shrink:0;">`
          : `<div class="icon-box" style="width:38px;height:38px;background:rgba(103,80,164,0.1);border-radius:8px;flex-shrink:0;"><i data-lucide="file" style="width:18px;height:18px;color:#6750a4;"></i></div>`}
        <span style="flex:1;font-size:0.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(f.name || 'Datei')}</span>
        <button type="button" onclick="removeHwFile(${idx})" style="background:rgba(0,0,0,0.06);border:none;border-radius:8px;width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <i data-lucide="x" style="width:14px;height:14px;"></i>
        </button>
      </div>
    `;
  }).join('');
  if (window.lucide) lucide.createIcons();
}

function removeHwFile(idx) {
  hwPendingFiles.splice(idx, 1);
  renderHwFilePreview();
}

async function saveHw() {
  const subject_id = parseInt(document.getElementById('hw-subject').value);
  const description = document.getElementById('hw-desc').value.trim();
  const due_date = getHwDueDateValue();
  if (!description || !due_date) { showToast('Felder ausfüllen'); return; }

  try {
    const payload = {
      subject_id,
      description,
      due_date,
      attachments: hwPendingFiles,
      file_url: hwPendingFiles[0]?.url || null,
      file_type: hwPendingFiles[0]?.type || null
    };
    if (hwEditId) {
      const updated = await API.updateHomework(hwEditId, payload);
      const idx = hwItems.findIndex(h => h.id === hwEditId);
      if (idx >= 0) hwItems[idx] = updated;
      hwEditId = null;
      showToast('Aufgabe aktualisiert');
    } else {
      const hw = await API.createHomework(payload);
      hwItems.push(hw);
      showToast('Aufgabe gespeichert');
    }
    closeSheet();
    renderHwStats();
    renderHw();
  } catch (err) {
    showToast(err.detail || 'Fehler beim Speichern');
  }
}
</script>
