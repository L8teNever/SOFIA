<div class="page" id="page-timetable" style="background:#fff8ef;">
  <div class="page-header">
    <button class="back-btn"><i data-lucide="arrow-left" style="width:22px;height:22px;"></i></button>
    <span class="page-title" style="color:#442b00;">Stundenplan</span>
  </div>
  <div class="page-scroll-1col"><div class="page-inner">
    <div id="tt-loading" style="text-align:center;padding:60px;opacity:0.5;">Stundenplan wird geladen…</div>
    <div id="tt-not-configured" style="display:none;text-align:center;padding:60px 20px;">
      <i data-lucide="settings" style="width:48px;height:48px;margin-bottom:16px;opacity:0.4;"></i>
      <div style="font-weight:700;margin-bottom:8px;">Nicht konfiguriert</div>
      <div style="opacity:0.6;font-size:0.9rem;">Der Klassen-Admin muss Untis-Zugangsdaten hinterlegen.</div>
    </div>
    <div id="tt-error" style="display:none;text-align:center;padding:40px 20px;color:#b3261e;"></div>
    <div id="tt-content" style="display:none;">
      <div class="section-label" style="color:#442b00;" id="tt-this-week-label">Diese Woche</div>
      <div id="tt-this-week"></div>
      <div class="section-label" style="color:#442b00;margin-top:24px;" id="tt-next-week-label">Nächste Woche</div>
      <div id="tt-next-week"></div>
    </div>
  </div></div>
</div>

<script>
const TT_COLORS = ['#eaddff','#d3e3fd','#c4eed0','#ffdec1','#ffd8e4','#e8def8','#cfe2ff'];
const TT_DAYS = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const TT_MONTHS = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

async function init_timetable() {
  try {
    const data = await API.timetable();
    document.getElementById('tt-loading').style.display = 'none';
    if (!data.configured) {
      document.getElementById('tt-not-configured').style.display = 'block';
      return;
    }
    if (data.error) {
      document.getElementById('tt-error').style.display = 'block';
      document.getElementById('tt-error').textContent = 'Fehler: ' + data.error;
      return;
    }
    document.getElementById('tt-content').style.display = 'block';
    renderWeek(data.this_week, 'tt-this-week', 'tt-this-week-label', true);
    renderWeek(data.next_week, 'tt-next-week', 'tt-next-week-label', false);
    if (window.lucide) lucide.createIcons();
  } catch(e) {
    document.getElementById('tt-loading').style.display = 'none';
    document.getElementById('tt-error').style.display = 'block';
    document.getElementById('tt-error').textContent = 'Stundenplan konnte nicht geladen werden.';
  }
}

function fmtTime(t) {
  if (!t) return '';
  const s = String(t).padStart(4, '0');
  return s.slice(0, 2) + ':' + s.slice(2);
}

function fmtDate(dateStr) {
  // dateStr like "20260513"
  if (!dateStr || dateStr.length < 8) return dateStr;
  const d = new Date(dateStr.slice(0,4) + '-' + dateStr.slice(4,6) + '-' + dateStr.slice(6,8) + 'T00:00');
  return TT_DAYS[d.getDay()] + ', ' + d.getDate() + '. ' + TT_MONTHS[d.getMonth()];
}

function weekRangeLabel(startIso) {
  if (!startIso) return '';
  const monday = new Date(startIso + 'T00:00');
  const friday = new Date(monday); friday.setDate(monday.getDate() + 4);
  return monday.getDate() + '. – ' + friday.getDate() + '. ' + TT_MONTHS[friday.getMonth()] + ' ' + friday.getFullYear();
}

function renderWeek(week, containerId, labelId, isThisWeek) {
  const container = document.getElementById(containerId);
  const label = document.getElementById(labelId);
  if (!week) { container.innerHTML = '<div style="opacity:0.4;text-align:center;padding:20px;">Keine Daten</div>'; return; }

  if (label) label.textContent = (isThisWeek ? 'Diese Woche' : 'Nächste Woche') + ' · ' + weekRangeLabel(week.start);

  const lessons = week.lessons || [];
  if (!lessons.length) {
    container.innerHTML = '<div style="background:#fff3e0;border-radius:20px;padding:24px;text-align:center;opacity:0.6;">Keine Stunden</div>';
    return;
  }

  // Build subject→color map
  const colorMap = {};
  let ci = 0;
  lessons.forEach(l => { if (l.subject && !colorMap[l.subject]) colorMap[l.subject] = TT_COLORS[ci++ % TT_COLORS.length]; });

  // Group by date
  const byDay = {};
  lessons.forEach(l => { (byDay[l.date] = byDay[l.date] || []).push(l); });

  const todayStr = new Date().toISOString().slice(0,10).replace(/-/g,'');

  let html = '';
  Object.keys(byDay).sort().forEach(dateKey => {
    const dayLessons = byDay[dateKey];
    const isToday = dateKey === todayStr;
    html += '<div style="margin-bottom:14px;">';
    html += '<div style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;'
          + (isToday ? 'color:#6750a4;' : 'opacity:0.5;')
          + 'margin-bottom:6px;padding-left:4px;">'
          + fmtDate(dateKey)
          + (isToday ? ' <span style="background:#6750a4;color:white;border-radius:6px;padding:1px 7px;font-size:0.65rem;margin-left:4px;">Heute</span>' : '')
          + '</div>';
    dayLessons.forEach(l => {
      const color = l.cancelled ? '#f9dedc' : (colorMap[l.subject] || '#eaddff');
      const textColor = l.cancelled ? '#b3261e' : 'inherit';
      html += '<div class="tt-block" style="background:' + color + ';color:' + textColor + ';margin-bottom:7px;opacity:' + (l.cancelled ? '0.7' : '1') + ';">'
            + '<div style="min-width:44px;text-align:center;">'
            + '<div style="font-size:0.72rem;font-weight:700;font-variant-numeric:tabular-nums;">' + fmtTime(l.startTime) + '</div>'
            + '<div style="font-size:0.65rem;opacity:0.5;">–</div>'
            + '<div style="font-size:0.72rem;font-weight:700;font-variant-numeric:tabular-nums;">' + fmtTime(l.endTime) + '</div>'
            + '</div>'
            + '<div style="flex:1;min-width:0;">'
            + '<div style="font-weight:700;font-size:0.95rem;' + (l.cancelled ? 'text-decoration:line-through;' : '') + '">' + (l.subject || '–') + '</div>'
            + '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;">'
            + (l.teacher ? '<span style="font-size:0.68rem;font-weight:600;background:rgba(0,0,0,0.08);padding:2px 7px;border-radius:8px;">' + l.teacher + '</span>' : '')
            + (l.room ? '<span style="font-size:0.68rem;font-weight:600;background:rgba(0,0,0,0.08);padding:2px 7px;border-radius:8px;">' + l.room + '</span>' : '')
            + '</div></div>'
            + (l.cancelled ? '<span style="background:#f9dedc;color:#b3261e;padding:3px 9px;border-radius:8px;font-size:0.68rem;font-weight:700;flex-shrink:0;">Ausfall</span>' : '')
            + (l.substituted ? '<span style="background:#ffdec1;color:#7d3c00;padding:3px 9px;border-radius:8px;font-size:0.68rem;font-weight:700;flex-shrink:0;">Vertretung</span>' : '')
            + '</div>';
    });
    html += '</div>';
  });

  container.innerHTML = html;
}
</script>
