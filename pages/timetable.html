<div class="page" id="page-timetable" style="background:#fff8ef;">
<style>
/* The day and the week follow the finger. Vertical scrolling stays native. */
#tt-day-view, #tt-week-view { position: relative; touch-action: pan-y; overflow-x: hidden; }
#tt-day-view [onclick], #tt-week-view [onclick] { touch-action: pan-y; }
.tt-swipe-track {
  position: absolute; left: 0; display: flex; z-index: 8;
  pointer-events: none; background: #fff8ef; will-change: transform;
}
.tt-swipe-track > .tt-swipe-pane { background: #fff8ef; }
</style>
  <div id="ph-timetable"></div>

  <!-- Mode chips (same pattern as homework) -->
  <div id="tt-chips-slot" class="page-subbar" style="padding-top:0;padding-bottom:8px;display:flex;gap:8px;flex-shrink:0;"></div>

  <div id="tt-loading" style="text-align:center;padding:60px;opacity:0.5;">Stundenplan wird geladen…</div>
  <div id="tt-not-configured" style="display:none;text-align:center;padding:60px 20px;">
    <i data-lucide="settings" style="width:48px;height:48px;margin-bottom:16px;opacity:0.4;display:block;margin-left:auto;margin-right:auto;"></i>
    <div style="font-weight:700;margin-bottom:8px;">Nicht konfiguriert</div>
    <div id="tt-not-configured-sub" style="opacity:0.6;font-size:0.9rem;">Der Klassen-Admin muss Untis-Zugangsdaten hinterlegen oder ein Foto vom Stundenplan hochladen.</div>
    <button id="tt-admin-cta" onclick="openPage('admin')" style="display:none;margin-top:18px;background:#442b00;color:#fff8ef;border:none;border-radius:14px;padding:12px 20px;font-size:0.85rem;font-weight:700;cursor:pointer;font-family:inherit;">
      Zur Konfiguration
    </button>
  </div>
  <div id="tt-error" style="display:none;text-align:center;padding:40px 20px;color:#b3261e;"></div>

  <!-- Day view -->
  <div id="tt-day-view" class="page-scroll-1col no-scrollbar" style="display:none;padding-bottom:100px;">
    <div id="tt-day-lessons" class="page-inner" style="padding:0 20px;"></div>
  </div>

  <!-- Week view -->
  <div id="tt-week-view" style="display:none;flex:1;overflow-x:hidden;overflow-y:auto;padding:0 12px 100px 12px;">
    <div id="tt-week-grid" style="display:grid;grid-template-columns:30px repeat(5,1fr);gap:4px;min-width:320px;max-width:900px;margin:0 auto;padding:0 8px;"></div>
  </div>
</div>

<script>
document.getElementById('ph-timetable').outerHTML = pageHeader({
  title: 'Stundenplan',
  titleStyle: 'color:#442b00;',
  subtitle: '',
  subtitleId: 'tt-header-sub',
  subtitleStyle: 'color:#442b00;',
  trailing: `<button onclick="ttNav(-1)" class="icon-btn"><i data-lucide="chevron-left" style="width:20px;height:20px;"></i></button>
    <button onclick="ttNav(1)"  class="icon-btn"><i data-lucide="chevron-right" style="width:20px;height:20px;"></i></button>`
});
document.getElementById('tt-chips-slot').innerHTML = chipRow({
  onclick: 'ttSetMode',
  idPrefix: 'tt-chip',
  items: [
    { value: 'day', label: 'Tag', active: true },
    { value: 'week', label: 'Woche' },
  ],
});
const TT_COLORS  = ['#eaddff','#d3e3fd','#c4eed0','#ffdec1','#ffd8e4','#e8def8','#cfe2ff'];
const TT_DAYS_S  = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const TT_DAYS_L  = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const TT_MONTHS  = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

let ttLessons = [], ttColorMap = {}, ttMode = 'day';
let ttDayOffset = 0, ttWeekOffset = 0;
let ttHolidays = [];
let ttNowLineInterval = null;
// Freshly rebuilt on every render (day and week both) — a lesson block's
// onclick references its index here rather than embedding the lesson's own
// data inline, since some fields (subst_text, room names, ...) can contain
// characters ("'" from an umlaut/name) that would otherwise need careful
// escaping to survive inside an onclick="" attribute string.
let ttModalLessons = [];

// Returns the holiday covering date `dateStr` (YYYYMMDD), if any — start/end
// from Untis are inclusive, so a plain string-range compare is enough.
function ttHolidayFor(dateStr) {
  return ttHolidays.find(h => dateStr >= h.start && dateStr <= h.end) || null;
}

function _today() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function _addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function _dateStr(d) {
  return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
}
function _fmtTime(t) { const s=String(t).padStart(4,'0'); return s.slice(0,2)+':'+s.slice(2); }
function _toMin(t) { return Math.floor(t/100)*60 + (t%100); }

// Untis frequently reports a cancelled period AND a separate substitute
// ("irregular") period for the exact same time slot — e.g. "TPh" cancelled
// and "Wahlfach/KL" taking its place. Without combining them, the week
// grid's absolute positioning stacks both blocks exactly on top of each
// other (same top/height) and only one is visible; the day view would also
// show two redundant cards for what is really one lesson slot. Fold them
// into a single block that carries the substitute's info plus the name of
// what it replaced.
function ttCombineSubstitutions(lessons) {
  const used = new Set();
  const out = [];
  for (let i = 0; i < lessons.length; i++) {
    if (used.has(i)) continue;
    const l = lessons[i];
    if (l.cancelled) {
      const j = lessons.findIndex((o, oi) => oi !== i && !used.has(oi) &&
        o.startTime === l.startTime && o.endTime === l.endTime && !o.cancelled);
      if (j !== -1) {
        used.add(i); used.add(j);
        out.push({ ...lessons[j], substituted: true, cancelled_subject: l.subject, cancelled_subject_short: l.subject_short });
        continue;
      }
    }
    used.add(i);
    out.push(l);
  }
  return out;
}

function ttMerge(lessons) {
  if (!lessons.length) return lessons;
  const out = [];
  let cur = {...lessons[0]};
  for (let i = 1; i < lessons.length; i++) {
    const l = lessons[i];
    const gap = _toMin(l.startTime) - _toMin(cur.endTime);
    if (l.subject_short && l.subject_short === cur.subject_short &&
        l.date === cur.date && gap <= 5 &&
        !l.cancelled && !cur.cancelled) {
      cur = {...cur, endTime: l.endTime, _double: true};
    } else {
      out.push(cur);
      cur = {...l};
    }
  }
  out.push(cur);
  return out;
}

function _thisMonday() {
  const t = _today();
  const dow = t.getDay();
  return _addDays(t, dow === 0 ? -6 : 1 - dow);
}

async function init_timetable() {
  try {
    const data = await API.timetable();
    document.getElementById('tt-loading').style.display = 'none';
    if (!data.configured) {
      document.getElementById('tt-not-configured').style.display='block';
      if (currentUser && (currentUser.role === 'admin' || currentUser.role === 'super_admin')) {
        document.getElementById('tt-admin-cta').style.display = 'inline-block';
      }
      return;
    }
    if (data.error) {
      document.getElementById('tt-error').style.display = 'block';
      document.getElementById('tt-error').textContent = 'Fehler: ' + data.error;
      return;
    }
    ttLessons = [...(data.this_week?.lessons||[]), ...(data.next_week?.lessons||[])];
    ttHolidays = data.holidays || [];
    let ci = 0;
    ttLessons.forEach(l => { if (l.subject_short && !ttColorMap[l.subject_short]) ttColorMap[l.subject_short] = TT_COLORS[ci++ % TT_COLORS.length]; });

    // Start on today, skip weekend
    const dow = _today().getDay();
    if (dow === 0) ttDayOffset = 1;
    else if (dow === 6) ttDayOffset = 2;

    let savedMode = 'day';
    try { savedMode = localStorage.getItem('tt_mode') === 'week' ? 'week' : 'day'; } catch {}
    ttSetMode(savedMode, document.getElementById('tt-chip-' + savedMode));
    initTtSwipe();
    if (window.lucide) lucide.createIcons();

    // Keep the "now" line (and which lessons count as already-past) moving
    // in real time instead of freezing at whatever minute the page opened.
    clearInterval(ttNowLineInterval);
    ttNowLineInterval = setInterval(() => {
      if (ttSwipeBusy || ttSwipeTrack) return;
      if (ttMode === 'day') ttRenderDay(); else ttRenderWeek();
    }, 60000);
  } catch {
    document.getElementById('tt-loading').style.display = 'none';
    document.getElementById('tt-error').style.display = 'block';
    document.getElementById('tt-error').textContent = 'Stundenplan konnte nicht geladen werden.';
  }
}

function ttSetMode(mode, btn) {
  teardownTtSwipe();
  ttMode = mode;
  try { localStorage.setItem('tt_mode', mode); } catch {}
  document.querySelectorAll('.chip[id^="tt-chip"]').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('tt-day-view').style.display  = mode==='day'  ? 'block' : 'none';
  document.getElementById('tt-week-view').style.display = mode==='week' ? 'block' : 'none';
  if (mode === 'day') ttRenderDay(); else ttRenderWeek();
}

// The timetable only ever has this week and the next one loaded, so a week
// swipe stops at those two. Days skip Saturday and Sunday, same as the arrows.
let ttSwipeBusy = false;
let ttSwipeTrack = null;

function teardownTtSwipe(track) {
  const held = track || ttSwipeTrack;
  if (held && held.parentNode) held.remove();
  if (!track || ttSwipeTrack === track) ttSwipeTrack = null;
}
function shiftTtDay(dir) {
  ttDayOffset += dir;
  const dow = _addDays(_today(), ttDayOffset).getDay();
  if (dow === 0) ttDayOffset += dir > 0 ? 1 : -2;
  else if (dow === 6) ttDayOffset += dir > 0 ? 2 : -1;
}
function ttCanShift(dir) {
  if (ttMode !== 'week') return true;
  const next = ttWeekOffset + dir;
  return next >= 0 && next <= 1;
}
function shiftTt(dir) {
  if (ttMode === 'day') { shiftTtDay(dir); return true; }
  if (!ttCanShift(dir)) return false;
  ttWeekOffset += dir;
  return true;
}
function paintTtPane(pane, dir) {
  const savedDay = ttDayOffset, savedWeek = ttWeekOffset, savedModal = ttModalLessons;
  const ok = dir === 0 ? true : shiftTt(dir);
  try {
    if (!ok) { pane.replaceChildren(); return; }
    if (ttMode === 'day') ttRenderDay(pane);
    else ttRenderWeek(pane);
  } finally {
    ttDayOffset = savedDay;
    ttWeekOffset = savedWeek;
    ttModalLessons = savedModal;
  }
}
function makeTtPane(viewEl, dir, width, height) {
  const pane = viewEl.cloneNode(true);
  pane.querySelectorAll('.tt-swipe-track').forEach(n => n.remove());
  pane.classList.add('tt-swipe-pane');
  pane.style.width = width + 'px';
  pane.style.height = height + 'px';
  pane.style.flex = '0 0 ' + width + 'px';
  pane.style.overflow = 'hidden';
  pane.style.display = 'block';
  pane.style.position = 'relative';
  if (dir !== 0) paintTtPane(pane, dir);
  return pane;
}
function buildTtSwipeTrack(viewEl) {
  const width = viewEl.clientWidth;
  const height = viewEl.clientHeight;
  if (!width || !height) return null;
  const prev = makeTtPane(viewEl, -1, width, height);
  const current = makeTtPane(viewEl, 0, width, height);
  const next = makeTtPane(viewEl, 1, width, height);
  const track = document.createElement('div');
  track.className = 'tt-swipe-track';
  track.append(prev, current, next);
  track._width = width;
  track.style.top = viewEl.scrollTop + 'px';
  track.style.height = height + 'px';
  track.style.width = (width * 3) + 'px';
  track.style.transition = 'none';
  track.style.transform = 'translate3d(' + (-width) + 'px,0,0)';
  viewEl.appendChild(track);
  track.offsetHeight;
  [prev, current, next].forEach(pane => { pane.scrollTop = viewEl.scrollTop; });
  if (window.lucide) lucide.createIcons();
  ttSwipeTrack = track;
  return track;
}
function setTtSwipeX(track, dx) {
  track.style.transition = 'none';
  track.style.transform = 'translate3d(' + (-track._width + dx) + 'px,0,0)';
}
function animateTtSwipeTo(track, x, ms) {
  return new Promise(resolve => {
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      track.removeEventListener('transitionend', onEnd);
      resolve();
    };
    const onEnd = (e) => { if (e.target === track && e.propertyName === 'transform') finish(); };
    track.addEventListener('transitionend', onEnd);
    track.style.transition = 'transform ' + ms + 'ms cubic-bezier(0.22, 0.8, 0.28, 1)';
    track.style.transform = 'translate3d(' + x + 'px,0,0)';
    setTimeout(finish, ms + 60);
  });
}

function initTtSwipe() {
  ['tt-day-view', 'tt-week-view'].forEach(id => {
    const el = document.getElementById(id);
    if (!el || el._ttSwipe) return;
    el._ttSwipe = true;
    let tracking = false, horizontal = false, startX = 0, startY = 0, dx = 0;
    let lastDx = 0, lastT = 0, velocity = 0, track = null;
    const reset = () => { tracking = false; horizontal = false; track = null; };

    el.addEventListener('touchstart', (e) => {
      if (ttSwipeBusy || e.touches.length !== 1) return;
      if (el.style.display === 'none') return;
      const x = e.touches[0].clientX;
      if (x < 16) return;
      tracking = true;
      horizontal = false;
      startX = x;
      startY = e.touches[0].clientY;
      dx = 0; lastDx = 0; velocity = 0; lastT = performance.now();
      track = null;
    }, { passive: true });

    el.addEventListener('touchmove', (e) => {
      if (!tracking) return;
      const x = e.touches[0].clientX;
      const y = e.touches[0].clientY;
      dx = x - startX;
      const dy = y - startY;
      if (!horizontal) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        if (Math.abs(dy) > Math.abs(dx)) { reset(); return; }
        horizontal = true;
        track = buildTtSwipeTrack(el);
        if (!track) { reset(); return; }
      }
      if (e.cancelable) e.preventDefault();
      const now = performance.now();
      velocity = (dx - lastDx) / Math.max(1, now - lastT);
      lastDx = dx;
      lastT = now;
      const dir = dx < 0 ? 1 : -1;
      const width = track._width;
      const visual = ttCanShift(dir)
        ? Math.max(-width, Math.min(width, dx))
        : Math.max(-72, Math.min(72, dx * 0.32));
      setTtSwipeX(track, visual);
    }, { passive: false });

    const finish = async (commit) => {
      if (!track) { reset(); return; }
      const width = track._width;
      const dir = dx < 0 ? 1 : -1;
      const go = commit && ttCanShift(dir) && dx !== 0;
      const target = go ? (dir === 1 ? -2 * width : 0) : -width;
      const shown = ttCanShift(dir) ? dx : Math.max(-72, Math.min(72, dx * 0.32));
      const remaining = Math.abs(target - (-width + shown));
      const ms = Math.max(160, Math.min(320, remaining * 0.45));
      const held = track;
      reset();
      ttSwipeBusy = true;
      if (go) ttNav(dir, { fromSwipe: true });
      await animateTtSwipeTo(held, target, ms);
      teardownTtSwipe(held);
      ttSwipeBusy = false;
    };

    el.addEventListener('touchend', () => {
      if (!tracking || !horizontal) { reset(); return; }
      const width = track ? track._width : el.clientWidth;
      const flung = Math.abs(velocity) > 0.4 && Math.sign(velocity) === Math.sign(dx || velocity);
      const commit = Math.abs(dx) > Math.min(width * 0.28, 96) || (flung && Math.abs(dx) > 28);
      finish(commit);
    }, { passive: true });

    el.addEventListener('touchcancel', () => {
      if (horizontal && track) finish(false);
      else reset();
    }, { passive: true });
  });
}

function ttNav(dir, opts = {}) {
  if (ttMode === 'day') {
    shiftTtDay(dir);
    const render = () => ttRenderDay();
    if (opts.fromSwipe) render();
    else slideNav(document.getElementById('tt-day-lessons'), dir, render);
  } else if (shiftTt(dir)) {
    const render = () => ttRenderWeek();
    if (opts.fromSwipe) render();
    else slideNav(document.getElementById('tt-week-grid'), dir, render);
  }
}

// A horizontal "now" divider — same visual language as the existing "Pause"
// divider between lesson cards, just in the accent color so it reads as
// "current time" rather than "gap in the schedule".
function ttNowLineHtml(now) {
  const hh = String(now.getHours()).padStart(2,'0'), mm = String(now.getMinutes()).padStart(2,'0');
  return '<div style="display:flex;align-items:center;gap:8px;padding:2px 4px 10px;">'
    +'<div style="flex:1;height:2px;background:#b3261e;border-radius:1px;"></div>'
    +'<span style="font-size:0.68rem;font-weight:800;color:#b3261e;">Jetzt · '+hh+':'+mm+'</span>'
    +'<div style="flex:1;height:2px;background:#b3261e;border-radius:1px;"></div>'
    +'</div>';
}

function ttRenderDay(root) {
  const d = _addDays(_today(), ttDayOffset);
  const isToday = ttDayOffset === 0;
  const isPast  = d < _today();
  const now = new Date();
  const nowMin = isToday ? now.getHours()*60 + now.getMinutes() : null;
  const sub = document.getElementById('tt-header-sub');
  // "Heute" already says it's today, so stating the weekday name too on top of
  // that (the old "Dienstag, ... · Heute") was redundant AND long enough to
  // wrap to a second line in the header — swap the weekday for "Heute" instead
  // of appending it. A neighbour pane keeps the live subtitle where it is.
  if (!root && sub) {
    sub.textContent = (isToday ? 'Heute' : TT_DAYS_L[d.getDay()]) + ', ' + d.getDate() + '. ' + TT_MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  const dateStr = _dateStr(d);
  const lessons = ttMerge(ttCombineSubstitutions(ttLessons.filter(l => l.date === dateStr)));
  const el = (root || document).querySelector('#tt-day-lessons');
  if (!el) return;
  const holiday = ttHolidayFor(dateStr);
  if (!lessons.length) {
    el.innerHTML = holiday
      ? '<div style="text-align:center;padding:60px 20px;opacity:0.6;">'
        + '<div style="font-size:2rem;margin-bottom:8px;">🏖️</div>'
        + '<div style="font-weight:600;">Ferien</div>'
        + '<div style="font-size:0.85rem;opacity:0.75;margin-top:4px;">'+holiday.name+'</div></div>'
      : '<div style="text-align:center;padding:60px 20px;opacity:0.4;">'
      + '<div style="font-size:2rem;margin-bottom:8px;">🎉</div>'
      + '<div style="font-weight:600;">Kein Unterricht</div></div>';
    return;
  }
  // 1 card ≈ 68px content + 8px gap → double = 68*2+8 = 144px
  const SINGLE_H = 68, GAP = 8;
  let html = '';
  let nowLineInserted = nowMin === null;
  ttModalLessons = [];
  for (let i = 0; i < lessons.length; i++) {
    const l = lessons[i];
    const prev = i > 0 ? lessons[i-1] : null;
    if (prev) {
      const gap = _toMin(l.startTime) - _toMin(prev.endTime);
      if (gap > 5) {
        const gStr = gap >= 60 ? Math.floor(gap/60)+'h'+(gap%60?' '+gap%60+' min':'') : gap+' min';
        html += '<div style="display:flex;align-items:center;gap:8px;padding:2px 4px 10px;opacity:0.35;">'
          +'<div style="flex:1;height:1px;background:currentColor;"></div>'
          +'<span style="font-size:0.65rem;font-weight:700;">Pause · '+gStr+'</span>'
          +'<div style="flex:1;height:1px;background:currentColor;"></div>'
          +'</div>';
      }
    }

    // Insert the "now" line right before the first lesson that hasn't
    // ended yet — everything above it in the list has already happened.
    // Comparing against startTime here (instead of endTime, as the comment
    // above always intended) made the line skip past whatever lesson was
    // currently in progress and land one lesson too late — right after it
    // instead of right before it.
    if (!nowLineInserted && nowMin < _toMin(l.endTime)) {
      html += ttNowLineHtml(now);
      nowLineInserted = true;
    }

    const lessonPast = isPast || (nowMin !== null && _toMin(l.endTime) <= nowMin);
    // Same "neutral hatch instead of the subject's own color" treatment as
    // the week grid — a cancelled lesson should read as an empty slot at a
    // glance, not as a normal colored block that happens to have
    // struck-through text.
    const fillStyle = l.cancelled
      ? 'background-color:#f7f3ef;background-image:repeating-linear-gradient(135deg, rgba(179,26,26,0.09) 0, rgba(179,26,26,0.09) 4px, transparent 4px, transparent 12px);'
      : 'background:'+(lessonPast ? '#ebebeb' : (ttColorMap[l.subject_short]||'#eaddff'))+';';
    const dblStyle = l._double ? 'min-height:'+(SINGLE_H*2+GAP)+'px;align-items:flex-start;padding-top:16px;' : '';
    // A changed room/teacher gets its own amber chip showing old → new,
    // instead of a plain chip that looks identical to a normal lesson's —
    // otherwise a room swap is invisible unless you already knew to expect it.
    const teacherChip = l.original_teacher
      ? '<span style="font-size:0.68rem;font-weight:700;background:#ffdec1;color:#7d3c00;padding:2px 7px;border-radius:8px;">'+l.original_teacher+' → '+(l.teacher||'–')+'</span>'
      : (l.teacher ? '<span style="font-size:0.68rem;font-weight:600;background:rgba(0,0,0,0.08);padding:2px 7px;border-radius:8px;">'+l.teacher+'</span>' : '');
    const roomChip = l.original_room
      ? '<span style="font-size:0.68rem;font-weight:700;background:#ffdec1;color:#7d3c00;padding:2px 7px;border-radius:8px;">'+l.original_room+' → '+(l.room||'–')+'</span>'
      : (l.room ? '<span style="font-size:0.68rem;font-weight:600;background:rgba(0,0,0,0.08);padding:2px 7px;border-radius:8px;">'+l.room+'</span>' : '');
    const modalIdx = ttModalLessons.push(l) - 1;
    html += '<div class="tt-block" onclick="openTtLessonModal('+modalIdx+')" style="cursor:pointer;'+fillStyle+'margin-bottom:'+GAP+'px;opacity:'+(lessonPast?.55:1)+';'+dblStyle+(l.cancelled?'border:1px dashed rgba(179,26,26,0.3);':'')+'">'
      +'<div style="min-width:44px;text-align:center;">'
      +'<div style="font-size:0.72rem;font-weight:700;">'+_fmtTime(l.startTime)+'</div>'
      +'<div style="font-size:0.62rem;opacity:0.4;">–</div>'
      +'<div style="font-size:0.72rem;font-weight:700;">'+_fmtTime(l.endTime)+'</div>'
      +'</div>'
      +'<div style="flex:1;min-width:0;">'
      +'<div style="font-weight:700;font-size:0.95rem;'+(l.cancelled?'text-decoration:line-through;color:#8a3a3a;':'')+'">'+( l.subject||'–')+'</div>'
      +'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;">'
      +teacherChip+roomChip
      +'</div>'
      +(l.cancelled_subject?'<div style="font-size:0.7rem;opacity:0.65;font-style:italic;margin-top:4px;">statt '+l.cancelled_subject+'</div>':'')
      +(l.subst_text?'<div style="font-size:0.7rem;opacity:0.65;font-style:italic;margin-top:4px;">'+l.subst_text+'</div>':'')
      +'</div>'
      +(l._double    ?'<span style="background:rgba(0,0,0,0.08);color:inherit;padding:3px 8px;border-radius:8px;font-size:0.66rem;font-weight:700;flex-shrink:0;">2×</span>':'')
      +(l.cancelled  ?'<span style="background:#f9dedc;color:#b3261e;padding:3px 8px;border-radius:8px;font-size:0.66rem;font-weight:700;flex-shrink:0;">Ausfall</span>':'')
      +(l.substituted?'<span style="background:#ffdec1;color:#7d3c00;padding:3px 8px;border-radius:8px;font-size:0.66rem;font-weight:700;flex-shrink:0;">Vertr.</span>':'')
      +'</div>';
  }
  if (!nowLineInserted) html += ttNowLineHtml(now);
  el.innerHTML = html;
  if (window.lucide) lucide.createIcons();
}

// Pixels per minute for the week grid's shared time axis — every day column
// positions its blocks against the same scale, so a lesson starting later in
// the day (e.g. period 3) lines up at the same height across every weekday,
// and free periods/breaks show up as proportional empty space instead of
// needing a separate "Pause" label (there's no room for one at 1/5 width).
const TT_WEEK_PX_PER_MIN = 1.4;
const TT_WEEK_MIN_BLOCK_H = 34;

function ttRenderWeek(root) {
  const monday = _addDays(_thisMonday(), ttWeekOffset * 7);
  const friday = _addDays(monday, 4);
  const todayStr = _dateStr(_today());
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();

  const sub = document.getElementById('tt-header-sub');
  if (!root && sub) {
    sub.textContent =
      monday.getDate() + '. – ' + friday.getDate() + '. ' + TT_MONTHS[friday.getMonth()] + ' ' + friday.getFullYear();
  }

  const grid = (root || document).querySelector('#tt-week-grid');
  if (!grid) return;
  const days = Array.from({length:5}, (_,i) => _addDays(monday, i));
  const dayLessons = days.map(d => ttMerge(ttCombineSubstitutions(ttLessons.filter(l => l.date === _dateStr(d)))));
  const allLessons = dayLessons.flat();

  // Shared time range for the whole week, rounded out to full hours; a
  // sensible fallback when there's nothing to show at all this week.
  let minStart = allLessons.length ? Math.min(...allLessons.map(l => _toMin(l.startTime))) : 8*60;
  let maxEnd   = allLessons.length ? Math.max(...allLessons.map(l => _toMin(l.endTime)))   : 16*60;
  minStart = Math.floor(minStart / 60) * 60;
  maxEnd   = Math.max(Math.ceil(maxEnd / 60) * 60, minStart + 60);
  const gridHeight = (maxEnd - minStart) * TT_WEEK_PX_PER_MIN;

  let hourLines = '';
  for (let m = minStart; m <= maxEnd; m += 60) {
    const top = (m - minStart) * TT_WEEK_PX_PER_MIN;
    hourLines += '<div style="position:absolute;top:'+top+'px;left:0;right:0;height:1px;background:rgba(68,43,0,0.08);"></div>';
  }

  let axisHtml = '<div style="position:relative;height:'+gridHeight+'px;">';
  for (let m = minStart; m <= maxEnd; m += 60) {
    const top = (m - minStart) * TT_WEEK_PX_PER_MIN;
    axisHtml += '<div style="position:absolute;top:'+(top-5)+'px;right:2px;font-size:0.56rem;opacity:0.4;">'+Math.floor(m/60)+'</div>';
  }
  axisHtml += '</div>';

  const headerHtml = '<div></div>' + days.map(d => {
    const isToday = _dateStr(d) === todayStr;
    const isHoliday = !!ttHolidayFor(_dateStr(d));
    return '<div style="text-align:center;font-size:0.72rem;font-weight:700;padding:6px 2px;border-radius:10px;'
      +(isToday?'background:#442b00;color:#fff;':'opacity:0.55;color:#442b00;')+'">'+TT_DAYS_S[d.getDay()]+' '+d.getDate()+'.'
      +(isHoliday?'<div style="font-size:0.6rem;font-weight:600;margin-top:1px;">🏖️ Ferien</div>':'')+'</div>';
  }).join('');

  ttModalLessons = [];
  const colsHtml = days.map((d, di) => {
    const lessons = dayLessons[di];
    const dayPast = d < _today();
    const isToday = _dateStr(d) === todayStr;
    const blocks = lessons.map(l => {
      const top = (_toMin(l.startTime) - minStart) * TT_WEEK_PX_PER_MIN;
      const height = Math.max((_toMin(l.endTime) - _toMin(l.startTime)) * TT_WEEK_PX_PER_MIN, TT_WEEK_MIN_BLOCK_H);
      const lessonPast = dayPast || (isToday && _toMin(l.endTime) <= nowMin);

      // Cancelled periods used to keep their subject's normal color, just
      // with struck-through text — at a glance that reads as "a real
      // lesson, weirdly crossed out" rather than "nothing happening here",
      // and a whole grid of those looks busy. A neutral diagonal-hatch
      // fill (the same "unavailable" language calendar apps use) instead
      // of the subject color makes a cancelled slot visually recede, so
      // the lessons that ARE happening are what actually draws the eye.
      // A substituted period keeps its full subject color (it IS still
      // happening) but gets an amber accent + a small "changed" glyph —
      // enough to notice without needing room for a text badge.
      let fillStyle, borderStyle;
      if (l.cancelled) {
        fillStyle = 'background-color:#f7f3ef;background-image:repeating-linear-gradient(135deg, rgba(179,26,26,0.09) 0, rgba(179,26,26,0.09) 3px, transparent 3px, transparent 10px);';
        borderStyle = 'border:1px dashed rgba(179,26,26,0.3);';
      } else {
        fillStyle = 'background:'+(lessonPast ? '#ebebeb' : (ttColorMap[l.subject_short]||'#eaddff'))+';';
        borderStyle = l.substituted ? 'border-left:3px solid #b3720a;' : '';
      }

      const roomLine = l.room
        ? (l.original_room
            ? '<div style="font-size:0.54rem;font-weight:700;color:#7d3c00;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+l.original_room+'→'+l.room+'</div>'
            : '<div style="font-size:0.54rem;opacity:0.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+l.room+'</div>')
        : '';
      const opacity = lessonPast ? 0.5 : 1;
      const modalIdx = ttModalLessons.push(l) - 1;

      return '<div onclick="openTtLessonModal('+modalIdx+')" style="cursor:pointer;position:absolute;top:'+top+'px;left:1px;right:1px;height:'+height+'px;'+fillStyle+borderStyle+'border-radius:8px;padding:4px 5px;overflow:hidden;opacity:'+opacity+';">'
        +'<div style="font-size:0.68rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'+(l.cancelled?'text-decoration:line-through;color:#8a3a3a;':'')+'">'
          +(l.subject_short||l.subject||'–')
          +(l._double?' <span style="font-size:0.56rem;opacity:0.6;">2×</span>':'')
          +(l.substituted?' <span style="font-size:0.62rem;">↻</span>':'')
        +'</div>'
        +(height >= 44 ? '<div style="font-size:0.56rem;opacity:0.55;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'+(l.cancelled?'color:#8a3a3a;':'')+'">'+(l.cancelled?'Ausfall · ':(l.cancelled_subject_short?'statt '+l.cancelled_subject_short+' · ':''))+_fmtTime(l.startTime)+'–'+_fmtTime(l.endTime)+'</div>' : '')
        +(height >= 60 && !l.cancelled ? roomLine : '')
        +'</div>';
    }).join('');
    const holidayBg = ttHolidayFor(_dateStr(d)) ? 'background:repeating-linear-gradient(135deg, rgba(68,43,0,0.035) 0, rgba(68,43,0,0.035) 6px, transparent 6px, transparent 16px);' : '';
    // Live "now" line — only in today's column, and only while the current
    // time actually falls within the hours shown (before school starts or
    // after the last lesson of the day, there's nothing to point at).
    let nowLine = '';
    if (isToday && nowMin >= minStart && nowMin <= maxEnd) {
      const nowTop = (nowMin - minStart) * TT_WEEK_PX_PER_MIN;
      nowLine = '<div style="position:absolute;top:'+nowTop+'px;left:0;right:0;height:2px;background:#b3261e;z-index:5;">'
        +'<div style="position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:#b3261e;"></div>'
        +'</div>';
    }
    return '<div style="position:relative;height:'+gridHeight+'px;'+holidayBg+'">'+hourLines+blocks+nowLine+'</div>';
  }).join('');

  grid.innerHTML = headerHtml + axisHtml + colsHtml;
}

// Tapping any lesson block (day or week view, including a substituted or
// cancelled one) opens this with the full detail — mainly worth it for the
// week grid, whose compact blocks have no room to show subst_text or a
// room change at all, and for a substitution's full replacement note in
// the day view too (there it's only ever shown as one truncation-free but
// still easy-to-miss line among several).
function openTtLessonModal(idx) {
  const l = ttModalLessons[idx];
  if (!l) return;

  const color = l.cancelled ? '#f7f3ef' : (ttColorMap[l.subject_short] || '#eaddff');
  const badges = [
    l._double    ? { label: '2× Doppelstunde', bg: 'rgba(0,0,0,0.08)', fg: '#442b00' } : null,
    l.cancelled  ? { label: 'Ausfall', bg: '#f9dedc', fg: '#b3261e' } : null,
    l.substituted? { label: 'Vertretung', bg: '#ffdec1', fg: '#7d3c00' } : null,
  ].filter(Boolean);

  const teacherRow = l.original_teacher
    ? `<div style="display:flex;justify-content:space-between;gap:12px;"><span style="opacity:0.6;">Lehrkraft</span><b>${escapeHtml(l.original_teacher)} → ${escapeHtml(l.teacher||'–')}</b></div>`
    : (l.teacher ? `<div style="display:flex;justify-content:space-between;gap:12px;"><span style="opacity:0.6;">Lehrkraft</span><b>${escapeHtml(l.teacher)}</b></div>` : '');
  const roomRow = l.original_room
    ? `<div style="display:flex;justify-content:space-between;gap:12px;"><span style="opacity:0.6;">Raum</span><b>${escapeHtml(l.original_room)} → ${escapeHtml(l.room||'–')}</b></div>`
    : (l.room ? `<div style="display:flex;justify-content:space-between;gap:12px;"><span style="opacity:0.6;">Raum</span><b>${escapeHtml(l.room)}</b></div>` : '');

  openModal(`
    <div style="text-align:center;padding:4px 4px 14px;">
      <div style="width:54px;height:54px;border-radius:16px;background:${color};display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">
        <i data-lucide="book-open" style="width:26px;height:26px;color:#442b00;"></i>
      </div>
      <div style="font-size:1.25rem;font-weight:800;color:#1c1b1f;${l.cancelled?'text-decoration:line-through;color:#8a3a3a;':''}">${escapeHtml(l.subject||'–')}</div>
      <div style="color:#49454f;font-size:0.85rem;font-weight:600;margin-top:4px;">${_fmtTime(l.startTime)} – ${_fmtTime(l.endTime)} Uhr</div>
      ${badges.length ? `<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px;">
        ${badges.map(b => `<span style="background:${b.bg};color:${b.fg};padding:4px 10px;border-radius:8px;font-size:0.72rem;font-weight:700;">${b.label}</span>`).join('')}
      </div>` : ''}
    </div>
    ${(teacherRow || roomRow) ? `<div style="background:#f7f3ef;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:0.88rem;color:#1c1b1f;">
      ${teacherRow}${roomRow}
    </div>` : ''}
    ${l.cancelled_subject ? `<div style="margin-top:14px;font-size:0.85rem;opacity:0.7;font-style:italic;">Ersetzt: ${escapeHtml(l.cancelled_subject)}</div>` : ''}
    ${l.subst_text ? `<div style="margin-top:14px;font-size:0.85rem;color:#1c1b1f;line-height:1.4;">${escapeHtml(l.subst_text)}</div>` : ''}
    <button class="m3-btn-full" style="margin-top:20px;" onclick="closeModal()">Schließen</button>
  `);
}
</script>
