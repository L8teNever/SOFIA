<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <script>
    window.__APP_VERSION__ = "1.2.0";
    window.__BUILD_TS__ = "__BUILD__";
    window.deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredInstallPrompt = e;
      if (typeof updatePwaInstallState === 'function') {
        updatePwaInstallState();
      }
    });
    window.addEventListener('appinstalled', function() {
      window.deferredInstallPrompt = null;
      if (typeof updatePwaInstallState === 'function') {
        updatePwaInstallState();
      }
      if (typeof showToast === 'function') {
        showToast('Sofia wurde erfolgreich als App installiert! ✓');
      }
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function(){});
    }
  </script>
  <title>Sofia</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#6750a4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sofia">
  <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png">
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/static/css/base.css?v=__BUILD__">
  <link rel="stylesheet" href="/static/css/components.css?v=__BUILD__">
</head>
<body>

<!-- Intro Overlay -->
<div id="intro-overlay" onclick="skipIntro()">
  <div class="m3-blob" style="width:400px;height:400px;background:#d0bcff;top:-100px;left:-100px;"></div>
  <div class="m3-blob" style="width:300px;height:300px;background:#ffd8e4;bottom:-50px;right:-50px;animation-delay:3s;"></div>
  <div class="intro-text-container" id="intro-text"></div>
</div>

<!-- App Shell -->
<div class="app-container" id="app">

  <!-- Dashboard Header -->
  <div id="dashboard-header" class="dashboard-header">
    <div class="dashboard-header-row">
      <div>
        <div style="font-size:0.78rem;opacity:0.5;font-weight:500;" id="greeting-date"></div>
        <div style="font-size:1.6rem;font-weight:700;color:#e6e1e5;" id="greeting-name">Hallo!</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <button onclick="openPage('notifications')" style="background:rgba(255,255,255,0.08);border:none;border-radius:16px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#e6e1e5;position:relative;" id="notif-btn">
          <i data-lucide="bell" style="width:20px;height:20px;"></i>
          <span id="notif-badge" style="display:none;position:absolute;top:8px;right:8px;width:8px;height:8px;background:#f2b8b5;border-radius:50%;"></span>
        </button>
        <button onclick="openPage('settings')" style="background:rgba(255,255,255,0.08);border:none;border-radius:16px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#e6e1e5;">
          <i data-lucide="settings" style="width:20px;height:20px;"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Widget Grid -->
  <div class="widget-grid" id="widget-grid">

    <!-- Calendar: full-width banner -->
    <div class="widget w-full-span" style="background:#eaddff;color:#21005d;" onclick="openPage('calendar',this)" data-page="calendar">
      <div>
        <div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;opacity:0.6;">Nächster Termin</div>
        <div style="font-size:1.4rem;font-weight:700;margin-top:4px;" id="w-next-event">Keine Termine</div>
        <div style="font-size:0.82rem;opacity:0.65;margin-top:2px;" id="w-next-event-sub"></div>
      </div>
      <div class="icon-box" style="width:52px;height:52px;background:rgba(33,0,93,0.12);">
        <i data-lucide="calendar" style="width:26px;height:26px;"></i>
      </div>
    </div>

    <!-- Homework -->
    <div class="widget w-square" style="background:#ffd8e4;color:#31111d;" onclick="openPage('homework',this)" data-page="homework">
      <div class="icon-box" style="width:48px;height:48px;background:rgba(49,17,29,0.1);">
        <i data-lucide="book-open" style="width:24px;height:24px;"></i>
      </div>
      <div>
        <div style="font-size:1.1rem;font-weight:700;">Aufgaben</div>
        <div style="font-size:3rem;font-weight:800;line-height:1;margin-top:2px;" id="w-hw-count">0</div>
      </div>
    </div>

    <!-- Grades -->
    <div class="widget w-square" style="background:#d3e3fd;color:#041e49;" onclick="openPage('grades',this)" data-page="grades">
      <div class="icon-box" style="width:48px;height:48px;background:rgba(4,30,73,0.1);">
        <i data-lucide="trending-up" style="width:24px;height:24px;"></i>
      </div>
      <div>
        <div style="font-size:1.1rem;font-weight:700;">Schnitt</div>
        <div style="font-size:3rem;font-weight:800;line-height:1;margin-top:2px;" id="w-grade-avg">–</div>
      </div>
    </div>

    <!-- Timetable, Essensplan: plain 1x1 squares like every other widget
         above — the grid always divides evenly (see the .w-full-span
         comment in base.css for the exact math). -->
    <div class="widget w-square" style="background:#ffdec1;color:#442b00;" onclick="openPage('timetable',this)" data-page="timetable">
      <div class="icon-box" style="width:48px;height:48px;background:rgba(68,43,0,0.1);">
        <i data-lucide="clock" style="width:24px;height:24px;"></i>
      </div>
      <div>
        <div style="font-size:1.1rem;font-weight:700;">Stundenplan</div>
        <div style="font-size:0.8rem;opacity:0.65;margin-top:2px;">Jetzt</div>
        <div style="font-size:1.25rem;font-weight:700;" id="w-current-lesson">–</div>
      </div>
    </div>

    <div class="widget w-square" style="background:#c4eed0;color:#072711;" onclick="openPage('mealplan',this)" data-page="mealplan">
      <div class="icon-box" style="width:44px;height:44px;background:rgba(7,39,17,0.1);">
        <i data-lucide="utensils" style="width:22px;height:22px;"></i>
      </div>
      <div style="overflow:hidden;min-width:0;width:100%;">
        <div style="font-size:0.8rem;opacity:0.65;margin-top:2px;" id="w-meal-sub">Heute</div>
        <div style="font-size:1.02rem;font-weight:700;line-height:1.25;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;" id="w-meal-today">Lade…</div>
      </div>
    </div>

    <!-- Drive + Share: same plain 1x1 square from tablet up, but a short
         half-height bar on mobile (each still its own grid cell, so they
         sit side by side, not stacked) — their content is a single short
         line each, not enough to justify a full square on the narrowest
         screens (see the .w-mobile-half override in base.css). -->
    <div class="widget w-square w-mobile-half" style="background:#e8def8;color:#1d192b;" onclick="openPage('drive',this)" data-page="drive">
      <div class="icon-box" style="width:48px;height:48px;background:rgba(29,25,43,0.1);">
        <i data-lucide="hard-drive" style="width:24px;height:24px;"></i>
      </div>
      <div>
        <div style="font-size:1.1rem;font-weight:700;">Drive</div>
        <div style="font-size:0.72rem;opacity:0.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;">Dateien</div>
      </div>
    </div>

    <div class="widget w-square w-mobile-half" style="background:#f9dedc;color:#410e0b;" onclick="openPage('quickshare',this)" data-page="quickshare">
      <div class="icon-box" style="width:48px;height:48px;background:rgba(65,14,11,0.1);">
        <i data-lucide="share-2" style="width:24px;height:24px;"></i>
      </div>
      <div style="overflow:hidden;min-width:0;">
        <div style="font-size:1.1rem;font-weight:700;">Share</div>
        <div style="font-size:0.72rem;opacity:0.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;"><span id="w-files-count">0</span> geteilt</div>
      </div>
    </div>

    <!-- Chat: a full-width banner like Calendar rather than a 9th plain
         square — 9 squares would leave the grid's last row half-empty on
         every breakpoint (see the .widget-grid comment in base.css: the
         existing 8-unit total was chosen specifically because 4 columns
         divides it evenly). A banner showing the latest message is also
         more useful here than a bare icon tile, same reasoning as Calendar
         showing the next event instead of just an icon. -->
    <div class="widget w-full-span" style="background:#c2e7ff;color:#001d31;" onclick="openPage('chat',this)" data-page="chat">
      <div style="min-width:0;overflow:hidden;">
        <div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;opacity:0.6;">Chat</div>
        <div style="font-size:1.4rem;font-weight:700;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" id="w-chat-preview">Keine Nachrichten</div>
        <div style="font-size:0.82rem;opacity:0.65;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" id="w-chat-preview-sub"></div>
      </div>
      <div class="icon-box" style="width:52px;height:52px;background:rgba(0,29,49,0.12);position:relative;flex-shrink:0;">
        <i data-lucide="message-circle" style="width:26px;height:26px;"></i>
        <span id="w-chat-badge" style="display:none;position:absolute;top:-6px;right:-6px;background:#b3261e;color:#fff;font-size:0.68rem;font-weight:700;min-width:20px;height:20px;border-radius:10px;align-items:center;justify-content:center;padding:0 5px;">0</span>
      </div>
    </div>

  </div>
</div>

<!-- Page Container (SPA pages load here) -->
<div id="page-container"></div>

<!-- Bottom Sheet Scrim -->
<div id="bottom-sheet-scrim"></div>

<!-- Modal Scrim -->
<div id="modal-scrim"><div class="modal" id="modal-content"></div></div>

<!-- M3 Date/Time Picker Scrim -->
<div id="m3-picker-scrim"></div>

<!-- Toast -->
<div id="toast" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#1c1b1f;color:#e6e1e5;padding:12px 20px;border-radius:16px;font-size:0.85rem;font-weight:500;opacity:0;transition:all 0.3s;z-index:1000;pointer-events:none;white-space:nowrap;"></div>

<script src="/static/js/api.js?v=__BUILD__"></script>
<script src="/static/js/notifications.js?v=__BUILD__"></script>
<script src="/static/js/onboarding.js?v=__BUILD__"></script>
<script src="/static/js/app.js?v=__BUILD__"></script>
</body>
</html>
