<div class="page" id="page-settings" style="background:#f5f3f9;">
  <div class="page-header">
    <button class="back-btn"><i data-lucide="arrow-left" style="width:22px;height:22px;"></i></button>
    <span class="page-title">Einstellungen</span>
  </div>

  <div class="page-scroll-1col"><div class="page-inner">
    <!-- Profile -->
    <div class="section-label">Profil</div>
    <div class="m3-card">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;">
        <div class="avatar" id="settings-avatar" style="background:#6750a4;width:56px;height:56px;font-size:1.2rem;"></div>
        <div>
          <div style="font-weight:700;" id="settings-name">–</div>
          <div style="font-size:0.8rem;opacity:0.5;" id="settings-email">–</div>
          <div style="font-size:0.75rem;background:#eaddff;color:#21005d;padding:3px 10px;border-radius:8px;display:inline-block;margin-top:4px;font-weight:600;" id="settings-role">–</div>
        </div>
      </div>
      <input class="m3-input" id="settings-name-input" placeholder="Anzeigename">
      <button class="m3-btn-tonal" onclick="saveName()" style="width:100%;">Name speichern</button>
    </div>

    <!-- Notifications -->
    <div class="section-label">Benachrichtigungen</div>
    <div class="m3-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
        <div>
          <div style="font-weight:600;">Push-Benachrichtigungen</div>
          <div style="font-size:0.8rem;opacity:0.6;">Für neue Hausaufgaben, Termine & mehr</div>
        </div>
        <div class="m3-switch" id="push-switch" onclick="togglePush(this)"></div>
      </div>
    </div>

    <!-- Class -->
    <div class="section-label">Meine Klasse</div>
    <div class="m3-card" id="settings-class-card">
      <div style="font-weight:600;margin-bottom:4px;" id="settings-class-name">Keine Klasse</div>
      <div style="font-size:0.8rem;opacity:0.5;" id="settings-class-info"></div>
    </div>

    <!-- App info -->
    <div class="section-label">App</div>
    <div class="m3-card">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;">
        <span style="opacity:0.7;">Version</span><span style="font-weight:600;">1.0.0</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-top:1px solid rgba(0,0,0,0.05);">
        <span style="opacity:0.7;">Powered by</span><span style="font-weight:600;">Sofia</span>
      </div>
    </div>

    <!-- Legal -->
    <div class="section-label">Rechtliches</div>
    <div class="m3-card" style="cursor:pointer;" onclick="openImpressum()">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;">
        <span style="opacity:0.7;font-weight:600;color:#1c1b1f;">Impressum & Datenschutz</span>
        <i data-lucide="chevron-right" style="width:18px;height:18px;opacity:0.5;color:#1c1b1f;"></i>
      </div>
    </div>
  </div></div>
</div>

<script>
let settingsUser = null;

async function init_settings() {
  settingsUser = await API.me().catch(()=>null);
  if (!settingsUser) return;
  const name = settingsUser.display_name || settingsUser.email.split('@')[0];
  document.getElementById('settings-avatar').textContent = name.slice(0,2).toUpperCase();
  document.getElementById('settings-name').textContent = name;
  document.getElementById('settings-email').textContent = settingsUser.email;
  document.getElementById('settings-name-input').value = settingsUser.display_name || '';
  const roleLabel = { student:'Schüler', admin:'Admin', super_admin:'Super-Admin' };
  document.getElementById('settings-role').textContent = roleLabel[settingsUser.role] || settingsUser.role;

  // Check push status
  if ('serviceWorker' in navigator && 'PushManager' in window) {
    const reg = await navigator.serviceWorker.ready.catch(()=>null);
    if (reg) {
      const sub = await reg.pushManager.getSubscription().catch(()=>null);
      if (sub) document.getElementById('push-switch').classList.add('on');
    }
  }

  // Load class info
  if (settingsUser.class_id) {
    const classes = await API.classes().catch(()=>[]);
    const cls = classes.find(c=>c.id===settingsUser.class_id);
    if (cls) {
      document.getElementById('settings-class-name').textContent = cls.name;
      document.getElementById('settings-class-info').textContent = 'ID: ' + cls.id;
    }
  }
}

async function saveName() {
  const name = document.getElementById('settings-name-input').value.trim();
  if (!name) return;
  await API.updateMe({ display_name: name }).catch(()=>{ showToast('Fehler'); return; });
  document.getElementById('settings-name').textContent = name;
  document.getElementById('settings-avatar').textContent = name.slice(0,2).toUpperCase();
  showToast('Name gespeichert');
}

async function togglePush(sw) {
  if (sw.classList.contains('on')) {
    await Push.unsubscribe().catch(()=>{});
    sw.classList.remove('on');
    showToast('Benachrichtigungen deaktiviert');
  } else {
    if (!Push._vapidKey) {
      // Try re-initializing once (key may have been generated after page load)
      await Push.init().catch(()=>{});
      if (!Push._vapidKey) { showToast('Push nicht verfügbar'); return; }
    }
    if (Notification.permission === 'denied') {
      showToast('Berechtigung blockiert — bitte in den Browser-Einstellungen erlauben');
      return;
    }
    try {
      const ok = await Push.subscribe();
      if (ok) { sw.classList.add('on'); showToast('Benachrichtigungen aktiviert'); }
      else showToast('Berechtigung verweigert');
    } catch(e) {
      console.error('Push subscribe error:', e);
      if (Notification.permission === 'denied') showToast('Berechtigung verweigert');
      else showToast('Fehler: ' + (e.message || 'Aktivierung fehlgeschlagen'));
    }
  }
}
</script>
