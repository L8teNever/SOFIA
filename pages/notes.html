<div class="page" id="page-notes" style="background:#f9f6fc;">
  <div id="ph-notes"></div>

  <div class="page-scroll-1col"><div class="page-inner">
    <div id="notes-list"></div>
    <div id="notes-empty" style="display:none;text-align:center;padding:60px 20px;opacity:0.45;">
      <i data-lucide="layout-dashboard" style="width:40px;height:40px;margin-bottom:10px;"></i>
      <div style="font-weight:600;">Noch keine Boards</div>
      <div style="font-size:0.85rem;margin-top:4px;">Tipp unten rechts auf + für dein erstes Board.</div>
    </div>
  </div></div>

  <div id="notes-fab-slot"></div>

  <!-- Full-screen canvas overlay — position:fixed so it covers everything
       regardless of the list view's scroll state, no global body/html
       style changes needed. Hidden by default; shown by
       openNotesBoardCanvas(). Ported near-verbatim from sofianotes'
       frontend/app.js/index.html (C:\tmp\sofianotes-explore) — same
       element ids so the ported drawing/gesture logic needs no renaming,
       only the M3 restyle below and the WS URL/factory-wrapping changes
       described in the script block. -->
  <div id="notes-canvas-view" style="display:none;">
    <canvas id="board"></canvas>
    <div id="eraser-cursor"></div>

    <div id="nb-canvas-header">
      <button class="icon-btn" id="nb-canvas-back" onclick="closeNotesCanvasView()" title="Zurück zur Liste">
        <i data-lucide="arrow-left" style="width:20px;height:20px;"></i>
      </button>
      <div id="nb-canvas-title-wrap">
        <div id="nb-canvas-title">Board</div>
        <div id="status"><span class="dot"></span><span id="status-text">Verbinde…</span></div>
      </div>
    </div>

    <div id="zoom-indicator">100%</div>

    <div id="toolbar">
      <button id="undo-btn" class="tool-btn" title="Rückgängig (Strg/Cmd+Z)"><i data-lucide="undo-2"></i></button>
      <button id="redo-btn" class="tool-btn" title="Wiederholen (Strg/Cmd+Shift+Z)"><i data-lucide="redo-2"></i></button>
      <div class="divider"></div>
      <button class="tool-btn active" data-tool="pen" title="Stift"><i data-lucide="pen"></i></button>
      <button class="tool-btn" data-tool="marker" title="Textmarker"><i data-lucide="highlighter"></i></button>
      <button class="tool-btn" data-tool="eraser" title="Radiergummi"><i data-lucide="eraser"></i></button>
      <button class="tool-btn" data-tool="select" title="Auswahl (Lasso) — markieren &amp; verschieben"><i data-lucide="lasso"></i></button>
      <div class="divider"></div>
      <button id="shape-toggle" class="tool-btn active" title="Formen-Erkennung (Kreis/Rechteck/Dreieck/Linie beim Halten erkennen)"><i data-lucide="shapes"></i></button>
      <button id="finger-draw-toggle" class="tool-btn" title="Mit dem Finger zeichnen erlauben (sonst nur Stift/Maus, Finger = Navigation)"><i data-lucide="hand"></i></button>
      <div class="divider"></div>
      <button class="swatch active" style="background:#1c1b1f" data-color="#1c1b1f"></button>
      <button class="swatch" style="background:#ba1a1a" data-color="#ba1a1a"></button>
      <button class="swatch" style="background:#006399" data-color="#006399"></button>
      <button class="swatch" style="background:#006d3a" data-color="#006d3a"></button>
      <button class="swatch" style="background:#8a5a00" data-color="#8a5a00"></button>
      <div class="divider"></div>
      <input type="range" id="size-slider" min="1" max="40" value="4">
    </div>
  </div>

  overflow: hidden; touch-action: none;

}

  position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px;

  background: rgba(255,255,255,0.92); backdrop-filter: blur(10px);

</div>

<script>
document.getElementById('ph-notes').outerHTML = pageHeader({ title: 'Tafel' });
document.getElementById('notes-fab-slot').outerHTML = fab({ onclick: 'openNewNotesBoardSheet()', title: 'Neues Board erstellen' });

const NOTES_COLORS = ['#eaddff','#d3e3fd','#c4eed0','#ffdec1','#ffd8e4','#fff3c4'];
let notesBoards = [];
let notesSubjects = [];

async function init_notes() {
  [notesBoards, notesSubjects] = await Promise.all([
    API.notesBoards('mine').catch(() => []),
    API.subjects().catch(() => []),
  ]);
  renderNotesList();
}

function renderNotesList() {
  const list = document.getElementById('notes-list');
  const empty = document.getElementById('notes-empty');
  if (!notesBoards.length) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  list.innerHTML = notesBoards.map(b => {
    const color = NOTES_COLORS[Math.abs(b.id) % NOTES_COLORS.length];
    const folderLabel = b.subject_name ? (b.topic ? `${b.subject_name} · ${b.topic}` : b.subject_name) : 'Kein Fach';
    return `
    <div class="notes-row" onclick="openNotesBoardCanvas(${b.id})">
      <div class="notes-icon" style="background:${color};">
        <i data-lucide="layout-dashboard" style="width:20px;height:20px;"></i>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(b.title)}</div>
        <div style="font-size:0.75rem;opacity:0.6;">${escapeHtml(folderLabel)}</div>
      </div>
      <span class="notes-vis-badge ${b.is_public ? 'public' : 'private'}">${b.is_public ? 'Öffentlich' : 'Privat'}</span>
      <button class="notes-row-action" onclick="event.stopPropagation();openEditNotesBoardSheet(${b.id})" title="Bearbeiten">
        <i data-lucide="pencil" style="width:16px;height:16px;"></i>
      </button>
      <button class="notes-row-action" onclick="event.stopPropagation();deleteNotesBoardConfirm(${b.id})" title="Löschen">
        <i data-lucide="trash-2" style="width:16px;height:16px;"></i>
      </button>
    </div>`;
  }).join('');
  if (window.lucide) lucide.createIcons();
}

let notesActiveEngine = null;

async function openNotesBoardCanvas(id) {
  let board;
  try {
    board = await API.notesBoard(id);
  } catch {
    showToast('Board nicht gefunden');
    return;
  }
  document.getElementById('nb-canvas-title').textContent = board.title;
  document.getElementById('notes-canvas-view').style.display = 'block';
  if (window.lucide) lucide.createIcons();
  notesActiveEngine = createWhiteboardEngine(id);
}

function closeNotesCanvasView() {
  if (notesActiveEngine) { notesActiveEngine.stop(); notesActiveEngine = null; }
  document.getElementById('notes-canvas-view').style.display = 'none';
  init_notes(); // refresh the list (title/visibility may have changed elsewhere)
}

function notesSubjectOptions(selectedId) {
  return (notesSubjects || []).map(s =>
    `<option value="${s.id}" ${s.id === selectedId ? 'selected' : ''}>${escapeHtml(s.name || s.short_name || '')}</option>`
  ).join('');
}

function openNewNotesBoardSheet() {
  openSheet(`
    <div class="sheet-title" style="font-size:1.25rem;font-weight:800;color:#1c1b1f;margin-bottom:16px;">Neues Board</div>

    <div class="m3-field">
      <label class="m3-field-label">Titel:</label>
      <input class="m3-input" id="nb-title" placeholder="z. B. Mathe Mitschrift">
    </div>

    <div class="m3-field">
      <label class="m3-field-label">Fach (optional):</label>
      <select class="m3-select" id="nb-subject">
        <option value="">Kein Fach</option>
        ${notesSubjectOptions(null)}
      </select>
    </div>

    <div class="m3-field">
      <label class="m3-field-label">Ordner/Thema (optional):</label>
      <input class="m3-input" id="nb-topic" placeholder="z. B. Kapitel 3">
    </div>

    <div class="m3-field" style="display:flex;align-items:center;gap:10px;">
      <input type="checkbox" id="nb-public" style="width:18px;height:18px;accent-color:#6750a4;cursor:pointer;">
      <label for="nb-public" style="font-size:0.9rem;cursor:pointer;">Für die ganze Klasse sichtbar (auch in Drive)</label>
    </div>

    <button class="m3-btn-full" onclick="submitNewNotesBoard()">Board erstellen</button>
  `);
}

async function submitNewNotesBoard() {
  const title = document.getElementById('nb-title').value.trim();
  if (!title) { showToast('Bitte einen Titel eingeben'); return; }
  const subjectId = document.getElementById('nb-subject').value;
  const topic = document.getElementById('nb-topic').value.trim();
  const isPublic = document.getElementById('nb-public').checked;
  try {
    const board = await API.createNotesBoard({
      title,
      subject_id: subjectId ? parseInt(subjectId) : null,
      topic: topic || null,
      is_public: isPublic,
    });
    notesBoards.unshift(board);
    renderNotesList();
    closeSheet();
    showToast('Board erstellt');
  } catch {
    showToast('Fehler beim Erstellen');
  }
}

function openEditNotesBoardSheet(id) {
  const b = notesBoards.find(x => x.id === id);
  if (!b) return;
  openSheet(`
    <div class="sheet-title" style="font-size:1.25rem;font-weight:800;color:#1c1b1f;margin-bottom:16px;">Board bearbeiten</div>

    <div class="m3-field">
      <label class="m3-field-label">Titel:</label>
      <input class="m3-input" id="nb-edit-title" value="${escapeHtml(b.title)}">
    </div>

    <div class="m3-field">
      <label class="m3-field-label">Fach (optional):</label>
      <select class="m3-select" id="nb-edit-subject">
        <option value="">Kein Fach</option>
        ${notesSubjectOptions(b.subject_id)}
      </select>
    </div>

    <div class="m3-field">
      <label class="m3-field-label">Ordner/Thema (optional):</label>
      <input class="m3-input" id="nb-edit-topic" value="${escapeHtml(b.topic || '')}">
    </div>

    <div class="m3-field" style="display:flex;align-items:center;gap:10px;">
      <input type="checkbox" id="nb-edit-public" ${b.is_public ? 'checked' : ''} style="width:18px;height:18px;accent-color:#6750a4;cursor:pointer;">
      <label for="nb-edit-public" style="font-size:0.9rem;cursor:pointer;">Für die ganze Klasse sichtbar (auch in Drive)</label>
    </div>

    <button class="m3-btn-full" onclick="submitEditNotesBoard(${id})">Speichern</button>
  `);
}

async function submitEditNotesBoard(id) {
  const title = document.getElementById('nb-edit-title').value.trim();
  const subjectId = document.getElementById('nb-edit-subject').value;
  const topic = document.getElementById('nb-edit-topic').value.trim();
  const isPublic = document.getElementById('nb-edit-public').checked;
  try {
    const updated = await API.updateNotesBoard(id, {
      title: title || undefined,
      subject_id: subjectId ? parseInt(subjectId) : null,
      topic: topic || null,
      is_public: isPublic,
    });
    const idx = notesBoards.findIndex(x => x.id === id);
    if (idx !== -1) notesBoards[idx] = updated;
    renderNotesList();
    closeSheet();
    showToast('Gespeichert');
  } catch {
    showToast('Fehler beim Speichern');
  }
}

function deleteNotesBoardConfirm(id) {
  const b = notesBoards.find(x => x.id === id);
  if (!b) return;
  openModal(confirmDelete({
    title: 'Board löschen?',
    message: `<b>${escapeHtml(b.title)}</b> wird unwiderruflich gelöscht.`,
    onConfirm: `deleteNotesBoardDo(${id})`,
  }));
}

async function deleteNotesBoardDo(id) {
  try {
    await API.deleteNotesBoard(id);
    notesBoards = notesBoards.filter(x => x.id !== id);
    renderNotesList();
    closeModal();
    showToast('Gelöscht');
  } catch {
    showToast('Fehler beim Löschen');
  }
}

// ============================================================================
// Whiteboard drawing engine — ported from sofianotes' frontend/app.js almost
// verbatim (same variable names, same gesture/shape/undo logic), wrapped in
// a factory so a fresh, isolated instance is created per opened board
// instead of sofianotes' original top-level IIFE (which assumed one full
// standalone page load — this SPA tears down/rebuilds page DOM on every
// navigation, so a fixed-at-load IIFE would leak WS connections and RAF
// loops across repeated open/close). The WS message protocol is completely
// unchanged; only the WS URL (board-scoped) and this factory/teardown
// wrapper are new. Canvas-internal drawing/gesture math is untouched.
// ============================================================================
function createWhiteboardEngine(boardId) {
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const eraserCursorEl = document.getElementById("eraser-cursor");
  const statusEl = document.getElementById("status");
  const statusTextEl = document.getElementById("status-text");
  const zoomIndicatorEl = document.getElementById("zoom-indicator");
  const toolbarEl = document.getElementById("toolbar");
  const sizeSlider = document.getElementById("size-slider");
  const shapeToggleEl = document.getElementById("shape-toggle");
  const fingerDrawToggleEl = document.getElementById("finger-draw-toggle");
  const undoBtn = document.getElementById("undo-btn");
  const redoBtn = document.getElementById("redo-btn");

  const MIN_ZOOM = 0.25;
  const MAX_ZOOM = 4;
  const GRID_SIZE = 32;
  const POINTS_FLUSH_MS = 30;
  const ERASE_FLUSH_MS = 60;
  const CURSOR_SEND_MS = 45;
  const HOLD_MS = 450;
  const MIN_MOVE_WORLD = 1.2;

  const uuid = () =>
    (crypto.randomUUID && crypto.randomUUID()) ||
    "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
      const r = (Math.random() * 16) | 0;
      const v = c === "x" ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });

  let stopped = false;

  // ---- view transform (world <-> screen, CSS px) ----------------------
  let scale = 1;
  let offsetX = 0;
  let offsetY = 0;
  let dpr = Math.max(1, window.devicePixelRatio || 1);

  function worldToScreen(x, y) { return { x: x * scale + offsetX, y: y * scale + offsetY }; }
  function screenToWorld(x, y) { return { x: (x - offsetX) / scale, y: (y - offsetY) / scale }; }
  function clampZoom(z) { return Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, z)); }

  function resizeCanvas() {
    dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    requestRedraw();
  }
  window.addEventListener("resize", resizeCanvas);

  // ---- board state ------------------------------------------------------
  const boardStrokes = new Map();
  const remoteInProgress = new Map();
  let currentStroke = null;
  let dirty = true;
  function requestRedraw() { dirty = true; }

  function makeBBox(points) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of points) {
      if (p.x < minX) minX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.x > maxX) maxX = p.x;
      if (p.y > maxY) maxY = p.y;
    }
    return { minX, minY, maxX, maxY };
  }
  function unionBBox(boxes) {
    if (boxes.length === 0) return null;
    const u = { ...boxes[0] };
    for (const b of boxes.slice(1)) {
      if (b.minX < u.minX) u.minX = b.minX;
      if (b.minY < u.minY) u.minY = b.minY;
      if (b.maxX > u.maxX) u.maxX = b.maxX;
      if (b.maxY > u.maxY) u.maxY = b.maxY;
    }
    return u;
  }

  function widthAt(size, pressure) {
    const p = pressure && pressure > 0 ? pressure : 0.5;
    return Math.max(1, size * (0.3 + 0.7 * p));
  }

  function drawStroke(stroke) {
    const pts = stroke.points;
    if (pts.length === 0) return;
    const isMarker = stroke.tool === "marker";
    ctx.globalAlpha = isMarker ? 0.35 : 1;
    if (pts.length === 1) {
      const p = pts[0];
      ctx.beginPath();
      ctx.fillStyle = stroke.color;
      ctx.arc(p.x, p.y, widthAt(stroke.size, p.p) / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      return;
    }
    ctx.strokeStyle = stroke.color;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1];
      const b = pts[i];
      ctx.beginPath();
      ctx.lineWidth = widthAt(stroke.size, (a.p + b.p) / 2);
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawGrid() {
    const topLeft = screenToWorld(0, 0);
    const bottomRight = screenToWorld(window.innerWidth, window.innerHeight);
    const startX = Math.floor(topLeft.x / GRID_SIZE) * GRID_SIZE;
    const startY = Math.floor(topLeft.y / GRID_SIZE) * GRID_SIZE;

    ctx.lineWidth = 1 / scale;
    for (let x = startX; x <= bottomRight.x; x += GRID_SIZE) {
      const bold = Math.round(x / GRID_SIZE) % 4 === 0;
      ctx.strokeStyle = bold ? "rgba(103,80,164,0.22)" : "rgba(103,80,164,0.1)";
      ctx.beginPath();
      ctx.moveTo(x, topLeft.y);
      ctx.lineTo(x, bottomRight.y);
      ctx.stroke();
    }
    for (let y = startY; y <= bottomRight.y; y += GRID_SIZE) {
      const bold = Math.round(y / GRID_SIZE) % 4 === 0;
      ctx.strokeStyle = bold ? "rgba(103,80,164,0.22)" : "rgba(103,80,164,0.1)";
      ctx.beginPath();
      ctx.moveTo(topLeft.x, y);
      ctx.lineTo(bottomRight.x, y);
      ctx.stroke();
    }
  }

  function drawLassoAndSelection() {
    if (lassoPoints && lassoPoints.length > 1) {
      ctx.save();
      ctx.setLineDash([6 / scale, 5 / scale]);
      ctx.strokeStyle = "#6750a4";
      ctx.lineWidth = 1.5 / scale;
      ctx.beginPath();
      ctx.moveTo(lassoPoints[0].x, lassoPoints[0].y);
      for (let i = 1; i < lassoPoints.length; i++) ctx.lineTo(lassoPoints[i].x, lassoPoints[i].y);
      ctx.stroke();
      ctx.restore();
    }
    if (selection.ids.size > 0 && selection.bbox) {
      const b = selection.bbox;
      const pad = 10 / scale;
      ctx.save();
      ctx.setLineDash([6 / scale, 5 / scale]);
      ctx.strokeStyle = "#6750a4";
      ctx.lineWidth = 1.5 / scale;
      ctx.fillStyle = "rgba(103,80,164,0.08)";
      const x = b.minX - pad, y = b.minY - pad, w = b.maxX - b.minX + pad * 2, h = b.maxY - b.minY + pad * 2;
      ctx.fillRect(x, y, w, h);
      ctx.strokeRect(x, y, w, h);
      ctx.restore();
    }
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#ece9e3";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, offsetX * dpr, offsetY * dpr);
    drawGrid();

    for (const stroke of boardStrokes.values()) if (stroke.tool === "marker") drawStroke(stroke);
    for (const stroke of remoteInProgress.values()) if (stroke.tool === "marker") drawStroke(stroke);
    if (currentStroke && currentStroke.tool === "marker") drawStroke(currentStroke);

    for (const stroke of boardStrokes.values()) if (stroke.tool !== "marker") drawStroke(stroke);
    for (const stroke of remoteInProgress.values()) if (stroke.tool !== "marker") drawStroke(stroke);
    if (currentStroke && currentStroke.tool && currentStroke.tool !== "marker") drawStroke(currentStroke);

    drawLassoAndSelection();

    zoomIndicatorEl.textContent = Math.round(scale * 100) + "%";
    repositionPresenceLabels();
  }

  function tick() {
    // Safety net: if the canvas view got torn down some other way than
    // closeNotesCanvasView() (e.g. the app's own back navigation), stop
    // instead of drawing into/reconnecting from a detached page.
    if (stopped || !canvas.isConnected) { stop(); return; }
    if (dirty) { draw(); dirty = false; }
    flushNetworkBuffers();
    requestAnimationFrame(tick);
  }

  // ---- toolbar ------------------------------------------------------
  let currentTool = "pen";
  let currentColor = "#1c1b1f";
  let penSize = 4;
  let markerSize = 18;
  let eraserSize = 24;
  let shapeRecognitionEnabled = true;
  let fingerDrawEnabled = false;

  function activeSize() {
    if (currentTool === "eraser") return eraserSize;
    if (currentTool === "marker") return markerSize;
    return penSize;
  }

  const toolBtnHandlers = [];
  toolbarEl.querySelectorAll(".tool-btn[data-tool]").forEach((btn) => {
    const h = () => {
      toolbarEl.querySelectorAll(".tool-btn[data-tool]").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      currentTool = btn.dataset.tool;
      sizeSlider.value = String(activeSize());
      updateEraserCursorVisibility();
      if (currentTool !== "select") clearSelection();
    };
    btn.addEventListener("click", h);
    toolBtnHandlers.push([btn, h]);
  });
  const swatchHandlers = [];
  toolbarEl.querySelectorAll(".swatch").forEach((btn) => {
    const h = () => {
      toolbarEl.querySelectorAll(".swatch").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      currentColor = btn.dataset.color;
    };
    btn.addEventListener("click", h);
    swatchHandlers.push([btn, h]);
  });
  function onSizeInput() {
    const v = Number(sizeSlider.value);
    if (currentTool === "eraser") eraserSize = v * 2;
    else if (currentTool === "marker") markerSize = v * 1.5;
    else penSize = v;
    updateEraserCursorVisibility();
  }
  sizeSlider.addEventListener("input", onSizeInput);
  sizeSlider.value = String(penSize);

  function onShapeToggle() {
    shapeRecognitionEnabled = !shapeRecognitionEnabled;
    shapeToggleEl.classList.toggle("active", shapeRecognitionEnabled);
  }
  shapeToggleEl.addEventListener("click", onShapeToggle);

  function onFingerDrawToggle() {
    fingerDrawEnabled = !fingerDrawEnabled;
    fingerDrawToggleEl.classList.toggle("active", fingerDrawEnabled);
  }
  fingerDrawToggleEl.addEventListener("click", onFingerDrawToggle);

  function updateEraserCursorVisibility() {
    if (currentTool !== "eraser") eraserCursorEl.style.display = "none";
  }

  // ---- websocket ------------------------------------------------------
  let ws = null;
  let reconnectDelay = 1000;
  let reconnectTimer = null;

  function wsSend(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }

  function setConnected(connected) {
    statusEl.classList.toggle("connected", connected);
    statusTextEl.textContent = connected ? "Live" : "Verbinde…";
  }

  function connectWS() {
    if (stopped) return;
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${proto}//${location.host}/api/v1/notes/ws/${boardId}`);

    ws.onopen = () => { setConnected(true); reconnectDelay = 1000; };
    ws.onclose = () => {
      setConnected(false);
      if (stopped) return;
      reconnectTimer = setTimeout(connectWS, reconnectDelay);
      reconnectDelay = Math.min(10000, reconnectDelay * 1.7);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (ev) => handleMessage(JSON.parse(ev.data));
  }

  let myClientId = null;
  function finalizeIncomingStroke(id) {
    const s = remoteInProgress.get(id);
    if (!s) return;
    remoteInProgress.delete(id);
    if (s.points.length > 0) {
      s.bbox = makeBBox(s.points);
      boardStrokes.set(s.id, s);
    }
  }

  function handleMessage(msg) {
    switch (msg.type) {
      case "init": {
        myClientId = msg.clientId;
        boardStrokes.clear();
        for (const s of msg.strokes) {
          s.bbox = makeBBox(s.points);
          boardStrokes.set(s.id, s);
        }
        requestRedraw();
        break;
      }
      case "presence_join":
        ensurePresence(msg.id, msg.color);
        break;
      case "presence_leave":
        removePresence(msg.id);
        break;
      case "cursor": {
        const p = ensurePresence(msg.id, msg.color);
        p.x = msg.x; p.y = msg.y; p.tool = msg.tool; p.size = msg.size; p.lastSeen = performance.now();
        requestRedraw();
        break;
      }
      case "stroke_start":
        remoteInProgress.set(msg.strokeId, { id: msg.strokeId, tool: msg.tool, color: msg.color, size: msg.size, points: msg.points || [], ownerId: msg.id });
        requestRedraw();
        break;
      case "stroke_points": {
        const s = remoteInProgress.get(msg.strokeId);
        if (s) s.points.push(...msg.points);
        requestRedraw();
        break;
      }
      case "stroke_replace": {
        const s = remoteInProgress.get(msg.strokeId);
        if (s) s.points = msg.points;
        requestRedraw();
        break;
      }
      case "stroke_end":
        finalizeIncomingStroke(msg.strokeId);
        requestRedraw();
        break;
      case "stroke_abort":
        remoteInProgress.delete(msg.strokeId);
        requestRedraw();
        break;
      case "stroke_move": {
        const s = msg.stroke;
        if (s && s.id) { s.bbox = makeBBox(s.points); boardStrokes.set(s.id, s); requestRedraw(); }
        break;
      }
      case "erase":
        for (const id of msg.strokeIds) { boardStrokes.delete(id); remoteInProgress.delete(id); }
        requestRedraw();
        break;
    }
  }

  // ---- presence (other users' live cursor + active tool) ---------------
  const presence = new Map();
  const PRESENCE_TIMEOUT_MS = 4000;
  const TOOL_LABELS = { pen: "✏️ Stift", marker: "🖍️ Marker", eraser: "🧹 Radierer", select: "👆 Auswahl" };

  function ensurePresence(id, color) {
    let p = presence.get(id);
    if (!p) {
      const el = document.createElement("div");
      el.className = "presence-label";
      document.body.appendChild(el);
      p = { el, color: color || "#888", x: 0, y: 0, tool: "pen", size: 4, lastSeen: performance.now() };
      presence.set(id, p);
    }
    if (color) p.color = color;
    return p;
  }
  function removePresence(id) {
    const p = presence.get(id);
    if (p) { p.el.remove(); presence.delete(id); }
  }
  function clearAllPresence() {
    for (const [id] of presence) removePresence(id);
  }
  function repositionPresenceLabels() {
    const now = performance.now();
    for (const [id, p] of presence) {
      if (now - p.lastSeen > PRESENCE_TIMEOUT_MS) { removePresence(id); continue; }
      const s = worldToScreen(p.x, p.y);
      p.el.style.left = s.x + "px";
      p.el.style.top = s.y - 14 + "px";
      p.el.style.background = p.color;
      p.el.textContent = TOOL_LABELS[p.tool] || p.tool;
    }
  }

  // ---- network buffering (batch outgoing points / erase ids) -----------
  let lastPointsFlush = 0;
  let lastEraseFlush = 0;
  let lastCursorSend = 0;
  const pendingErase = new Set();
  let erasedThisGesture = new Set();
  let erasedStrokesThisGesture = new Map();

  function flushNetworkBuffers() {
    const now = performance.now();
    if (currentStroke && currentStroke.unsent && currentStroke.unsent.length > 0 && now - lastPointsFlush > POINTS_FLUSH_MS) {
      wsSend({ type: "stroke_points", strokeId: currentStroke.id, points: currentStroke.unsent });
      currentStroke.unsent = [];
      lastPointsFlush = now;
    }
    if (pendingErase.size > 0 && now - lastEraseFlush > ERASE_FLUSH_MS) {
      wsSend({ type: "erase", strokeIds: Array.from(pendingErase) });
      pendingErase.clear();
      lastEraseFlush = now;
    }
  }

  function sendCursor(x, y, tool, size) {
    const now = performance.now();
    if (now - lastCursorSend < CURSOR_SEND_MS) return;
    lastCursorSend = now;
    wsSend({ type: "cursor", x, y, tool, size });
  }

  // ---- Undo/Redo ----------------------------------------------------
  const undoStack = [];
  const redoStack = [];
  const MAX_UNDO = 100;

  function cloneStroke(s) {
    return { id: s.id, tool: s.tool, color: s.color, size: s.size, points: s.points.map((p) => ({ ...p })) };
  }
  function updateUndoRedoButtons() {
    undoBtn.disabled = undoStack.length === 0;
    redoBtn.disabled = redoStack.length === 0;
  }
  function pushUndo(action) {
    undoStack.push(action);
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    redoStack.length = 0;
    updateUndoRedoButtons();
  }
  function putStroke(stroke) {
    const withBBox = { ...stroke, bbox: makeBBox(stroke.points) };
    boardStrokes.set(withBBox.id, withBBox);
    wsSend({ type: "stroke_move", stroke: { id: stroke.id, tool: stroke.tool, color: stroke.color, size: stroke.size, points: stroke.points } });
  }
  function removeStrokes(ids) {
    for (const id of ids) boardStrokes.delete(id);
    wsSend({ type: "erase", strokeIds: ids });
  }
  function applyAction(action, direction) {
    if (action.type === "add") {
      if (direction === 1) putStroke(action.stroke);
      else removeStrokes([action.stroke.id]);
    } else if (action.type === "erase") {
      if (direction === 1) removeStrokes(action.strokes.map((s) => s.id));
      else for (const s of action.strokes) putStroke(s);
    } else if (action.type === "move") {
      for (const m of action.moves) {
        const s = boardStrokes.get(m.id);
        const points = direction === 1 ? m.after : m.before;
        if (s) {
          s.points = points.map((p) => ({ ...p }));
          s.bbox = makeBBox(s.points);
          wsSend({ type: "stroke_move", stroke: { id: s.id, tool: s.tool, color: s.color, size: s.size, points: s.points } });
        }
      }
    }
    requestRedraw();
  }
  function undo() {
    if (undoStack.length === 0) return;
    const action = undoStack.pop();
    applyAction(action, -1);
    redoStack.push(action);
    updateUndoRedoButtons();
  }
  function redo() {
    if (redoStack.length === 0) return;
    const action = redoStack.pop();
    applyAction(action, 1);
    undoStack.push(action);
    updateUndoRedoButtons();
  }
  undoBtn.addEventListener("click", undo);
  redoBtn.addEventListener("click", redo);
  function onKeydownUndo(e) {
    const meta = e.ctrlKey || e.metaKey;
    if (!meta || e.key.toLowerCase() !== "z") return;
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
  }
  window.addEventListener("keydown", onKeydownUndo);
  updateUndoRedoButtons();

  // ---- Formen-Erkennung ------------------------------------------------
  let holdTimer = null;
  function clearHoldTimer() { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } }
  function armHoldTimer() {
    clearHoldTimer();
    if (!shapeRecognitionEnabled) return;
    if (!currentStroke || currentStroke.tool !== "pen" || currentStroke.locked) return;
    holdTimer = setTimeout(tryShapeSnap, HOLD_MS);
  }

  function perpDist(p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx * dx + dy * dy;
    if (len2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
    let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
  }
  function rdpSimplify(points, epsilon) {
    function section(pts) {
      if (pts.length < 3) return pts;
      let maxDist = 0, index = 0;
      const a = pts[0], b = pts[pts.length - 1];
      for (let i = 1; i < pts.length - 1; i++) {
        const d = perpDist(pts[i], a, b);
        if (d > maxDist) { maxDist = d; index = i; }
      }
      if (maxDist > epsilon) {
        const left = section(pts.slice(0, index + 1));
        const right = section(pts.slice(index));
        return left.slice(0, -1).concat(right);
      }
      return [a, b];
    }
    return section(points);
  }

  function detectShape(rawPoints) {
    if (rawPoints.length < 6) return null;
    const bbox = makeBBox(rawPoints);
    const w = bbox.maxX - bbox.minX, h = bbox.maxY - bbox.minY;
    const diagonal = Math.hypot(w, h);
    if (diagonal < 20) return null;

    const avgPressure = rawPoints.reduce((s, p) => s + (p.p || 0.5), 0) / rawPoints.length;
    const start = rawPoints[0], end = rawPoints[rawPoints.length - 1];
    const startEndDist = Math.hypot(end.x - start.x, end.y - start.y);

    let pathLength = 0;
    for (let i = 1; i < rawPoints.length; i++) pathLength += Math.hypot(rawPoints[i].x - rawPoints[i - 1].x, rawPoints[i].y - rawPoints[i - 1].y);

    const closed = startEndDist < diagonal * 0.3;

    if (!closed) {
      let maxDev = 0;
      for (const p of rawPoints) { const d = perpDist(p, start, end); if (d > maxDev) maxDev = d; }
      if (pathLength > 0 && maxDev / pathLength < 0.09) {
        return { type: "line", points: [{ x: start.x, y: start.y, p: avgPressure }, { x: end.x, y: end.y, p: avgPressure }] };
      }
      return null;
    }

    const cx = (bbox.minX + bbox.maxX) / 2, cy = (bbox.minY + bbox.maxY) / 2;
    const centroid = rawPoints.reduce((acc, p) => ({ x: acc.x + p.x, y: acc.y + p.y }), { x: 0, y: 0 });
    centroid.x /= rawPoints.length;
    centroid.y /= rawPoints.length;
    const radii = rawPoints.map((p) => Math.hypot(p.x - centroid.x, p.y - centroid.y));
    const meanR = radii.reduce((a, b) => a + b, 0) / radii.length;
    const variance = radii.reduce((a, r) => a + (r - meanR) * (r - meanR), 0) / radii.length;
    const circleFit = meanR > 0 ? Math.sqrt(variance) / meanR : 1;

    if (circleFit < 0.2) {
      const rx = w / 2, ry = h / 2;
      const aspectDiff = Math.abs(rx - ry) / Math.max(rx, ry);
      const useCircle = aspectDiff < 0.15;
      const N = 64;
      const pts = [];
      for (let i = 0; i <= N; i++) {
        const t = (i / N) * Math.PI * 2;
        pts.push({ x: cx + (useCircle ? meanR : rx) * Math.cos(t), y: cy + (useCircle ? meanR : ry) * Math.sin(t), p: avgPressure });
      }
      return { type: "circle", points: pts };
    }

    const simplified = rdpSimplify(rawPoints, diagonal * 0.06);
    const corners = simplified.slice(0, simplified.length - 1);
    if (corners.length === 3) {
      return { type: "triangle", points: [...corners, corners[0]].map((p) => ({ x: p.x, y: p.y, p: avgPressure })) };
    }
    if (corners.length === 4) {
      const nearBBox = corners.every((p) => {
        const dCorner = Math.min(
          Math.hypot(p.x - bbox.minX, p.y - bbox.minY), Math.hypot(p.x - bbox.maxX, p.y - bbox.minY),
          Math.hypot(p.x - bbox.maxX, p.y - bbox.maxY), Math.hypot(p.x - bbox.minX, p.y - bbox.maxY)
        );
        return dCorner < diagonal * 0.12;
      });
      const quad = nearBBox
        ? [{ x: bbox.minX, y: bbox.minY }, { x: bbox.maxX, y: bbox.minY }, { x: bbox.maxX, y: bbox.maxY }, { x: bbox.minX, y: bbox.maxY }]
        : corners;
      return { type: "rectangle", points: [...quad, quad[0]].map((p) => ({ x: p.x, y: p.y, p: avgPressure })) };
    }
    return null;
  }

  function tryShapeSnap() {
    holdTimer = null;
    if (!currentStroke || currentStroke.tool !== "pen" || currentStroke.locked) return;
    const detected = detectShape(currentStroke.points);
    if (!detected) return;
    currentStroke.points = detected.points;
    currentStroke.unsent = [];
    currentStroke.locked = true;
    wsSend({ type: "stroke_replace", strokeId: currentStroke.id, points: detected.points });
    requestRedraw();
  }

  // ---- drawing (pointer handling with palm rejection) -------------------
  const activePointers = new Map();
  const touchPointers = new Map();
  let pinchState = null;
  let panState = null;
  let spacePressed = false;

  let lassoPoints = null;
  let lassoPointerId = null;
  let selection = { ids: new Set(), bbox: null };
  let dragState = null;

  function clearSelection() {
    selection = { ids: new Set(), bbox: null };
    lassoPoints = null;
    lassoPointerId = null;
    dragState = null;
    requestRedraw();
  }

  function pointInPolygon(pt, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
      const intersect = yi > pt.y !== yj > pt.y && pt.x < ((xj - xi) * (pt.y - yi)) / (yj - yi) + xi;
      if (intersect) inside = !inside;
    }
    return inside;
  }
  function pointInBBox(pt, b, pad) {
    return pt.x >= b.minX - pad && pt.x <= b.maxX + pad && pt.y >= b.minY - pad && pt.y <= b.maxY + pad;
  }

  function finalizeLasso() {
    if (!lassoPoints || lassoPoints.length < 3) { clearSelection(); lassoPoints = null; return; }
    const poly = lassoPoints;
    const ids = new Set();
    for (const stroke of boardStrokes.values()) {
      for (const p of stroke.points) {
        if (pointInPolygon(p, poly)) { ids.add(stroke.id); break; }
      }
    }
    lassoPoints = null;
    if (ids.size === 0) { clearSelection(); return; }
    selection = { ids, bbox: unionBBox(Array.from(ids).map((id) => boardStrokes.get(id).bbox)) };
    requestRedraw();
  }

  function startSelectionDrag(pointerId, world) {
    const snapshot = new Map();
    for (const id of selection.ids) {
      const s = boardStrokes.get(id);
      if (s) snapshot.set(id, s.points.map((p) => ({ x: p.x, y: p.y, p: p.p })));
    }
    dragState = { pointerId, startWorld: world, snapshot };
  }

  function updateSelectionDrag(world) {
    const dx = world.x - dragState.startWorld.x;
    const dy = world.y - dragState.startWorld.y;
    const boxes = [];
    for (const [id, pts] of dragState.snapshot) {
      const s = boardStrokes.get(id);
      if (!s) continue;
      s.points = pts.map((p) => ({ x: p.x + dx, y: p.y + dy, p: p.p }));
      s.bbox = makeBBox(s.points);
      boxes.push(s.bbox);
    }
    selection.bbox = unionBBox(boxes);
    requestRedraw();
  }

  function finalizeSelectionDrag() {
    const moves = [];
    for (const [id, beforePts] of dragState.snapshot) {
      const s = boardStrokes.get(id);
      if (s) {
        wsSend({ type: "stroke_move", stroke: { id: s.id, tool: s.tool, color: s.color, size: s.size, points: s.points } });
        moves.push({ id, before: beforePts, after: s.points.map((p) => ({ ...p })) });
      }
    }
    if (moves.length > 0) pushUndo({ type: "move", moves });
    dragState = null;
  }
  function cancelSelectionDrag() {
    for (const [id, pts] of dragState.snapshot) {
      const s = boardStrokes.get(id);
      if (s) { s.points = pts; s.bbox = makeBBox(pts); }
    }
    dragState = null;
    requestRedraw();
  }

  function onKeydownSpace(e) { if (e.code === "Space") spacePressed = true; }
  function onKeyupSpace(e) { if (e.code === "Space") spacePressed = false; }
  window.addEventListener("keydown", onKeydownSpace);
  window.addEventListener("keyup", onKeyupSpace);

  function pointerPressure(e) {
    if (e.pointerType === "pen") return e.pressure > 0 ? e.pressure : 0.5;
    if (e.pointerType === "mouse") return 1;
    return e.pressure > 0 ? e.pressure : 0.5;
  }

  function startStroke(pointerId, pointerType, wx, wy, pressure) {
    const id = uuid();
    const tool = currentTool === "marker" ? "marker" : "pen";
    const size = activeSize();
    currentStroke = { id, tool, color: currentColor, size, points: [{ x: wx, y: wy, p: pressure }], unsent: [], pointerId, pointerType, locked: false };
    wsSend({ type: "stroke_start", strokeId: id, tool, color: currentColor, size, points: currentStroke.points });
    if (tool === "pen") armHoldTimer();
    requestRedraw();
  }

  function extendStroke(wx, wy, pressure) {
    if (!currentStroke || currentStroke.locked) return;
    const last = currentStroke.points[currentStroke.points.length - 1];
    const moved = !last || Math.hypot(wx - last.x, wy - last.y) >= MIN_MOVE_WORLD;
    if (!moved) return;
    const point = { x: wx, y: wy, p: pressure };
    currentStroke.points.push(point);
    currentStroke.unsent.push(point);
    if (currentStroke.tool === "pen") armHoldTimer();
    requestRedraw();
  }

  function endStroke() {
    if (!currentStroke) return;
    clearHoldTimer();
    if (currentStroke.unsent.length > 0) {
      wsSend({ type: "stroke_points", strokeId: currentStroke.id, points: currentStroke.unsent });
      currentStroke.unsent = [];
    }
    wsSend({ type: "stroke_end", strokeId: currentStroke.id });
    currentStroke.bbox = makeBBox(currentStroke.points);
    boardStrokes.set(currentStroke.id, currentStroke);
    pushUndo({ type: "add", stroke: cloneStroke(currentStroke) });
    currentStroke = null;
    requestRedraw();
  }

  function abortStroke() {
    if (!currentStroke) return;
    clearHoldTimer();
    wsSend({ type: "stroke_abort", strokeId: currentStroke.id });
    currentStroke = null;
    requestRedraw();
  }

  function eraseSegment(x0, y0, x1, y1) {
    const r = eraserSize / 2;
    const dist = Math.hypot(x1 - x0, y1 - y0);
    const steps = Math.max(1, Math.ceil(dist / Math.max(4, r * 0.5)));
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const sx = x0 + (x1 - x0) * t;
      const sy = y0 + (y1 - y0) * t;
      for (const stroke of boardStrokes.values()) {
        if (erasedThisGesture.has(stroke.id)) continue;
        const b = stroke.bbox;
        if (sx < b.minX - r || sx > b.maxX + r || sy < b.minY - r || sy > b.maxY + r) continue;
        const hitR = r + stroke.size / 2;
        for (const p of stroke.points) {
          const dx = p.x - sx, dy = p.y - sy;
          if (dx * dx + dy * dy <= hitR * hitR) {
            erasedThisGesture.add(stroke.id);
            erasedStrokesThisGesture.set(stroke.id, cloneStroke(stroke));
            break;
          }
        }
      }
    }
    if (erasedThisGesture.size > 0) {
      for (const id of erasedThisGesture) { boardStrokes.delete(id); pendingErase.add(id); }
      requestRedraw();
    }
  }

  function updateEraserCursor(clientX, clientY) {
    eraserCursorEl.style.display = "block";
    eraserCursorEl.style.left = clientX + "px";
    eraserCursorEl.style.top = clientY + "px";
    const diameterScreen = eraserSize * scale;
    eraserCursorEl.style.width = diameterScreen + "px";
    eraserCursorEl.style.height = diameterScreen + "px";
  }

  function distance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function midpoint(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

  function dispatchPrimaryDown(e) {
    const world = screenToWorld(e.clientX, e.clientY);
    if (currentTool === "select") {
      if (selection.bbox && pointInBBox(world, selection.bbox, 10 / scale)) {
        startSelectionDrag(e.pointerId, world);
      } else {
        clearSelection();
        lassoPointerId = e.pointerId;
        lassoPoints = [world];
      }
    } else if (currentTool === "eraser") {
      erasedThisGesture.clear();
      erasedStrokesThisGesture.clear();
      currentStroke = { pointerId: e.pointerId, eraser: true, lastX: world.x, lastY: world.y };
      eraseSegment(world.x, world.y, world.x, world.y);
      updateEraserCursor(e.clientX, e.clientY);
    } else {
      startStroke(e.pointerId, e.pointerType, world.x, world.y, pointerPressure(e));
    }
    sendCursor(world.x, world.y, currentTool, activeSize());
  }

  function onPointerDown(e) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    activePointers.set(e.pointerId, { type: e.pointerType, x: e.clientX, y: e.clientY });

    if (e.pointerType === "touch") {
      touchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (touchPointers.size === 2) {
        if (currentStroke) abortStroke();
        if (dragState) cancelSelectionDrag();
        lassoPoints = null;
        lassoPointerId = null;
        erasedThisGesture.clear();
        panState = null;
        const pts = Array.from(touchPointers.values());
        const mid = midpoint(pts[0], pts[1]);
        pinchState = { initialDist: distance(pts[0], pts[1]), initialScale: scale, anchorWorld: screenToWorld(mid.x, mid.y) };
        return;
      }
      if (touchPointers.size === 1) {
        if (fingerDrawEnabled && !pinchState) { dispatchPrimaryDown(e); return; }
        if (!pinchState) panState = { lastX: e.clientX, lastY: e.clientY };
      }
      return;
    }

    if (e.pointerType === "mouse" && (spacePressed || e.button === 1)) {
      panState = { lastX: e.clientX, lastY: e.clientY, pointerId: e.pointerId };
      return;
    }
    if (e.pointerType === "mouse" && e.button !== 0) return;

    dispatchPrimaryDown(e);
  }
  canvas.addEventListener("pointerdown", onPointerDown);

  function onPointerMove(e) {
    activePointers.set(e.pointerId, { type: e.pointerType, x: e.clientX, y: e.clientY });

    if (e.pointerType === "touch") {
      touchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pinchState && touchPointers.size === 2) {
        const pts = Array.from(touchPointers.values());
        const mid = midpoint(pts[0], pts[1]);
        const dist = distance(pts[0], pts[1]);
        const newScale = clampZoom(pinchState.initialScale * (dist / Math.max(1, pinchState.initialDist)));
        scale = newScale;
        offsetX = mid.x - pinchState.anchorWorld.x * scale;
        offsetY = mid.y - pinchState.anchorWorld.y * scale;
        requestRedraw();
        return;
      }
      const isActiveDrawTouch =
        (dragState && dragState.pointerId === e.pointerId) ||
        lassoPointerId === e.pointerId ||
        (currentStroke && currentStroke.pointerId === e.pointerId);
      if (!isActiveDrawTouch) {
        if (panState && touchPointers.size === 1) {
          offsetX += e.clientX - panState.lastX;
          offsetY += e.clientY - panState.lastY;
          panState.lastX = e.clientX;
          panState.lastY = e.clientY;
          requestRedraw();
        }
        return;
      }
    } else if (panState && (panState.pointerId === undefined || panState.pointerId === e.pointerId)) {
      offsetX += e.clientX - panState.lastX;
      offsetY += e.clientY - panState.lastY;
      panState.lastX = e.clientX;
      panState.lastY = e.clientY;
      requestRedraw();
      return;
    }

    const world = screenToWorld(e.clientX, e.clientY);

    if (currentTool === "eraser") updateEraserCursor(e.clientX, e.clientY);

    if (dragState && dragState.pointerId === e.pointerId) {
      if (touchPointers.size >= 2) { cancelSelectionDrag(); return; }
      updateSelectionDrag(world);
    } else if (lassoPointerId === e.pointerId && lassoPoints) {
      if (touchPointers.size >= 2) { lassoPoints = null; lassoPointerId = null; return; }
      lassoPoints.push(world);
      requestRedraw();
    } else if (currentStroke && currentStroke.pointerId === e.pointerId) {
      if (touchPointers.size >= 2) {
        if (currentStroke.eraser) currentStroke = null;
        else abortStroke();
        return;
      }
      if (currentStroke.eraser) {
        eraseSegment(currentStroke.lastX, currentStroke.lastY, world.x, world.y);
        currentStroke.lastX = world.x;
        currentStroke.lastY = world.y;
      } else {
        extendStroke(world.x, world.y, pointerPressure(e));
      }
    }

    sendCursor(world.x, world.y, currentTool, activeSize());
  }
  canvas.addEventListener("pointermove", onPointerMove);

  function endPointer(e) {
    activePointers.delete(e.pointerId);

    if (e.pointerType === "touch") {
      touchPointers.delete(e.pointerId);
      if (touchPointers.size < 2) pinchState = null;
      if (touchPointers.size === 0) panState = null;
      const wasActiveDrawTouch =
        (dragState && dragState.pointerId === e.pointerId) ||
        lassoPointerId === e.pointerId ||
        (currentStroke && currentStroke.pointerId === e.pointerId);
      if (!wasActiveDrawTouch) return;
    } else if (panState && (panState.pointerId === undefined || panState.pointerId === e.pointerId)) {
      panState = null;
      return;
    }

    if (dragState && dragState.pointerId === e.pointerId) { finalizeSelectionDrag(); return; }
    if (lassoPointerId === e.pointerId) { lassoPointerId = null; finalizeLasso(); return; }

    if (currentStroke && currentStroke.pointerId === e.pointerId) {
      if (currentStroke.eraser) {
        if (pendingErase.size > 0) { wsSend({ type: "erase", strokeIds: Array.from(pendingErase) }); pendingErase.clear(); }
        if (erasedStrokesThisGesture.size > 0) {
          pushUndo({ type: "erase", strokes: Array.from(erasedStrokesThisGesture.values()) });
          erasedStrokesThisGesture.clear();
        }
        currentStroke = null;
      } else {
        endStroke();
      }
    }
    if (currentTool === "eraser") eraserCursorEl.style.display = "none";
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  function onPointerLeave(e) {
    if (currentTool === "eraser" && !activePointers.has(e.pointerId)) eraserCursorEl.style.display = "none";
  }
  canvas.addEventListener("pointerleave", onPointerLeave);

  function onWheel(e) {
    e.preventDefault();
    const anchor = screenToWorld(e.clientX, e.clientY);
    const factor = Math.exp(-e.deltaY * 0.0015);
    scale = clampZoom(scale * factor);
    offsetX = e.clientX - anchor.x * scale;
    offsetY = e.clientY - anchor.y * scale;
    requestRedraw();
  }
  canvas.addEventListener("wheel", onWheel, { passive: false });

  function onContextMenu(e) { e.preventDefault(); }
  canvas.addEventListener("contextmenu", onContextMenu);

  function stop() {
    if (stopped) return;
    stopped = true;
    if (reconnectTimer) clearTimeout(reconnectTimer);
    if (ws) { ws.onclose = null; ws.close(); }
    clearAllPresence();
    window.removeEventListener("resize", resizeCanvas);
    window.removeEventListener("keydown", onKeydownUndo);
    window.removeEventListener("keydown", onKeydownSpace);
    window.removeEventListener("keyup", onKeyupSpace);
  }

  // ---- boot ------------------------------------------------------
  resizeCanvas();
  offsetX = window.innerWidth / 2;
  offsetY = window.innerHeight / 2;
  connectWS();
  requestAnimationFrame(tick);

  return { stop };
}
</script>
