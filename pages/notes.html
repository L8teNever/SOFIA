<div class="page" id="page-notes" style="background:#f9f6fc;">
  <div id="ph-notes"></div>

  <div class="page-scroll-1col"><div class="page-inner">
    <div id="notes-list"></div>
    <div id="notes-empty" style="display:none;text-align:center;padding:60px 20px;opacity:0.45;">
      <i data-lucide="layout-dashboard" style="width:40px;height:40px;margin-bottom:10px;"></i>
      <div style="font-weight:600;">Noch keine Boards</div>
      <div style="font-size:0.85rem;margin-top:4px;">Tipp unten rechts auf + für dein erstes Board.</div>
    </div>
  </div></div>

  <div id="notes-fab-slot"></div>

  <!-- Canvas chrome matches current sofianotes (Material docks, top bar, selection). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&icon_names=add,arrow_back,arrow_downward,arrow_forward,arrow_upward,brush,check,close,content_copy,content_cut,content_paste,crop_landscape,crop_square,edit,folder,gesture,grain,grid_4x4,hexagon,highlight,palette,redo,remove,reorder,share,touch_app,tune,undo,zoom_in&display=block" />
  <div id="notes-canvas-view" style="display:none;">
    <canvas id="board"></canvas>
    <div id="eraser-cursor"></div>
    <div id="selection-toolbar" class="selection-toolbar hidden">
      <button type="button" id="btn-sel-copy" title="Kopieren"><span class="material-symbols-rounded">content_copy</span></button>
      <button type="button" id="btn-sel-cut" title="Ausschneiden"><span class="material-symbols-rounded">content_cut</span></button>
      <button type="button" id="btn-sel-paste" class="hidden" title="Einfügen"><span class="material-symbols-rounded">content_paste</span></button>
    </div>

    <header id="top-filename-bar">
      <button type="button" id="nb-canvas-back" class="file-icon" title="Zurück zur Liste" onclick="closeNotesCanvasView()">
        <span class="material-symbols-rounded">arrow_back</span>
      </button>
      <button type="button" id="btn-open-library" class="file-icon" title="Alle Boards" onclick="closeNotesCanvasView()">
        <span class="material-symbols-rounded">folder</span>
      </button>
      <input id="canvas-filename" type="text" value="Board" maxlength="80" title="Klicken zum Umbenennen" />
      <button type="button" id="btn-share-board" class="icon-btn" title="Board bearbeiten / teilen">
        <span class="material-symbols-rounded">share</span>
      </button>
      <div class="bar-divider"></div>
      <div id="status"><span class="dot"></span><span id="status-text">Verbinde…</span></div>
    </header>

    <aside id="undo-redo-dock" class="corner-top-left">
      <button id="undo-btn" class="icon-btn" title="Rückgängig" disabled>
        <span class="material-symbols-rounded">undo</span>
      </button>
      <button id="redo-btn" class="icon-btn" title="Wiederholen" disabled>
        <span class="material-symbols-rounded">redo</span>
      </button>
      <div class="bar-divider"></div>
      <div class="zoom-wrap">
        <button id="btn-zoom-toggle" class="icon-btn" type="button" title="Zoom">
          <span class="material-symbols-rounded">zoom_in</span>
        </button>
        <div id="zoom-popover" class="popover hidden">
          <div class="popover-head">
            <span>Zoom</span>
            <span id="zoom-indicator" class="chip">100%</span>
          </div>
          <div class="zoom-row">
            <button id="btn-zoom-out" class="icon-btn" type="button" title="Herauszoomen"><span class="material-symbols-rounded">remove</span></button>
            <button id="btn-zoom-reset" class="text-btn" type="button">100%</button>
            <button id="btn-zoom-in" class="icon-btn" type="button" title="Hereinzoomen"><span class="material-symbols-rounded">add</span></button>
          </div>
        </div>
      </div>
    </aside>

    <nav id="toolbar" class="dock-bottom">
      <div class="tools-container">
        <div class="tool-wrapper">
          <button class="tool-btn active" data-tool="pen" title="Stift"><span class="material-symbols-rounded">edit</span></button>
        </div>
        <div class="tool-wrapper">
          <button class="tool-btn" data-tool="marker" title="Textmarker"><span class="material-symbols-rounded">highlight</span></button>
        </div>
        <div class="tool-wrapper">
          <button class="tool-btn" data-tool="eraser" title="Radiergummi"><span class="material-symbols-rounded">crop_square</span></button>
        </div>
        <div class="tool-wrapper">
          <button class="tool-btn" data-tool="select" title="Auswahl (Lasso)"><span class="material-symbols-rounded">gesture</span></button>
        </div>
        <div id="tool-popover" class="tool-popover hidden">
          <div class="popover-head">
            <span id="popover-tool-title">Stift Stärke</span>
            <span id="popover-size-text" class="chip">6 px</span>
          </div>
          <input id="size-slider" type="range" min="1" max="45" value="6" />
        </div>
      </div>
      <div id="swatches-container">
        <button class="swatch active" data-color="#1E1F22" style="background:#1E1F22"></button>
        <button class="swatch" data-color="#EA4335" style="background:#EA4335"></button>
        <button class="swatch" data-color="#1A73E8" style="background:#1A73E8"></button>
        <button class="swatch" data-color="#34A853" style="background:#34A853"></button>
        <button class="swatch" data-color="#FBBC04" style="background:#FBBC04"></button>
      </div>
      <div class="dock-divider"></div>
      <div class="settings-wrap">
        <button id="btn-settings-toggle" class="icon-btn" type="button" title="Einstellungen">
          <span class="material-symbols-rounded">tune</span>
        </button>
      </div>
    </nav>

    <div id="settings-backdrop" class="settings-backdrop hidden">
      <div id="settings-popover" class="settings-modal" role="dialog">
        <div class="settings-modal-head">
          <h2>Einstellungen</h2>
          <button type="button" id="btn-settings-close" class="icon-btn"><span class="material-symbols-rounded">close</span></button>
        </div>
        <div class="popover-label">Leiste</div>
        <div class="dock-quick-row">
          <button class="btn-dock-quick" data-pos="top" type="button" title="Oben"><span class="material-symbols-rounded">arrow_upward</span></button>
          <button class="btn-dock-quick" data-pos="bottom" type="button" title="Unten"><span class="material-symbols-rounded">arrow_downward</span></button>
          <button class="btn-dock-quick" data-pos="left" type="button" title="Links"><span class="material-symbols-rounded">arrow_back</span></button>
          <button class="btn-dock-quick" data-pos="right" type="button" title="Rechts"><span class="material-symbols-rounded">arrow_forward</span></button>
        </div>
        <div class="popover-label">Zeichnen</div>
        <button id="shape-toggle" class="setting-toggle active" type="button">
          <span class="material-symbols-rounded">hexagon</span> Formen erkennen
        </button>
        <button id="finger-draw-toggle" class="setting-toggle" type="button">
          <span class="material-symbols-rounded">touch_app</span> Finger zeichnet
        </button>
      </div>
    </div>
  </div>
