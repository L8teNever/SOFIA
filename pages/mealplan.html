        <div id="meal-image-toggle-row" style="display:flex;align-items:center;gap:12px;cursor:pointer;" onclick="toggleMealImage()">
          <div class="icon-box" style="width:38px;height:38px;background:rgba(7,39,17,0.08);flex-shrink:0;">
            <i data-lucide="image" style="width:20px;height:20px;color:#072711;"></i>
          </div>
          <span style="flex:1;font-weight:600;font-size:0.9rem;color:#1c1b1f;">Foto des Speiseplans anzeigen</span>

  <!-- Fullscreen Image Lightbox Preview -->

        <i data-lucide="image" style="width:20px;height:20px;color:#c4eed0;"></i>

      <div style="display:flex;gap:8px;">

<script>
document.getElementById('ph-mealplan').outerHTML = pageHeader({

  subtitle: 'Mensa Speiseplan',

});

    { value: '2', label: 'Di' },
    { value: '3', label: 'Mi' },
    { value: '4', label: 'Do' },
    { value: '5', label: 'Fr' },
  ],
});
let mealPlan = null;
let mealCanDelete = false;
let mealCanEdit = false; // correcting a day's text — upload stays open to everyone, editing is admin-only
let mealDays = [];
let mealDayIndex = 0;
let mealActiveDate = null;
let mealPollInterval = null;
let mealSwipeBusy = false;

const MEAL_CATEGORY_CONFIG = {
  'hauptgericht': { label: 'Hauptgericht',         icon: 'utensils',  bg: 'rgba(26,115,232,0.1)', color: '#1a73e8' },
  'menü':         { label: 'Menü 1',               icon: 'utensils',  bg: 'rgba(26,115,232,0.1)', color: '#1a73e8' },
  'menü 1':       { label: 'Menü 1',               icon: 'utensils',  bg: 'rgba(26,115,232,0.1)', color: '#1a73e8' },
  'menü 2':       { label: 'Vegetarisch',          icon: 'leaf',      bg: 'rgba(46,125,50,0.1)',  color: '#2e7d32' },
  'vegetarisch':  { label: 'Vegetarisch',          icon: 'leaf',      bg: 'rgba(46,125,50,0.1)',  color: '#2e7d32' },
  'veggie':       { label: 'Vegetarisch',          icon: 'leaf',      bg: 'rgba(46,125,50,0.1)',  color: '#2e7d32' },
  'muslimisch':   { label: 'Muslimisch / Geflügel',icon: 'moon',      bg: 'rgba(0,105,92,0.1)',   color: '#00695c' },
  'halal':        { label: 'Halal / Geflügel',     icon: 'moon',      bg: 'rgba(0,105,92,0.1)',   color: '#00695c' },
  'suppe':        { label: 'Tagessuppe',           icon: 'soup',      bg: 'rgba(178,106,0,0.1)',  color: '#b26a00' },
  'vorspeise':    { label: 'Vorspeise',            icon: 'soup',      bg: 'rgba(178,106,0,0.1)',  color: '#b26a00' },
  'dessert':      { label: 'Dessert',              icon: 'ice-cream', bg: 'rgba(194,24,91,0.1)',  color: '#c2185b' },
  'nachtisch':    { label: 'Dessert',              icon: 'ice-cream', bg: 'rgba(194,24,91,0.1)',  color: '#c2185b' },
};

function formatMealDayHtml(rawMeal) {
  if (!rawMeal) {
    return `
      <div class="meal-course-row">
        <div class="icon-box" style="width:38px;height:38px;border-radius:12px;background:rgba(0,0,0,0.05);color:#79747e;flex-shrink:0;">
          <i data-lucide="utensils" style="width:18px;height:18px;"></i>
        </div>
        <div style="flex:1;min-width:0;padding-top:8px;">
          <span style="opacity:0.5;font-size:0.92rem;">Keine Angaben für diesen Tag</span>
        </div>
      </div>
    `;
  }

  const lines = rawMeal.split('\n')
    .map(l => l.trim())
    .filter(Boolean)
    // Filter out diabetic and related lines
    .filter(l => !/^(?:diabetiker|schonkost|vital):/i.test(l));

  if (!lines.length) {
    return `
      <div class="meal-course-row">
        <div class="icon-box" style="width:38px;height:38px;border-radius:12px;background:rgba(0,0,0,0.05);color:#79747e;flex-shrink:0;">
          <i data-lucide="utensils" style="width:18px;height:18px;"></i>
        </div>
        <div style="flex:1;min-width:0;padding-top:8px;">
          <span style="opacity:0.5;font-size:0.92rem;">Keine Angaben für diesen Tag</span>
        </div>
      </div>
    `;
  }

  let hasCategories = false;
  const parsed = lines.map(line => {
    const match = line.match(/^([^:]+):\s*(.*)$/);
    if (match) {
      const key = match[1].toLowerCase().trim();
      if (MEAL_CATEGORY_CONFIG[key]) {
        hasCategories = true;
        return { cfg: MEAL_CATEGORY_CONFIG[key], text: match[2].trim() };
      }
    }
    return { cfg: null, text: line };
  });

  if (!hasCategories) {
    if (rawMeal.includes(' / ')) {
      const parts = rawMeal.split(' / ').map(p => p.trim()).filter(Boolean);
      return parts.map((p, idx) => `
        <div class="meal-course-row">
          <div class="icon-box" style="width:38px;height:38px;border-radius:12px;background:rgba(26,115,232,0.1);color:#1a73e8;flex-shrink:0;">
            <i data-lucide="utensils" style="width:18px;height:18px;"></i>
          </div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#1a73e8;margin-bottom:2px;">Gericht ${idx + 1}</div>
            <div style="font-size:0.98rem;font-weight:600;color:#1c1b1f;line-height:1.38;">${escapeHtml(p)}</div>
          </div>
        </div>
      `).join('');
    }
    return lines.map((l, idx) => `
      <div class="meal-course-row">
        <div class="icon-box" style="width:38px;height:38px;border-radius:12px;background:rgba(26,115,232,0.1);color:#1a73e8;flex-shrink:0;">
          <i data-lucide="utensils" style="width:18px;height:18px;"></i>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#1a73e8;margin-bottom:2px;">Menü ${lines.length > 1 ? idx + 1 : ''}</div>
          <div style="font-size:0.98rem;font-weight:600;color:#1c1b1f;line-height:1.38;">${escapeHtml(l)}</div>
        </div>
      </div>
    `).join('');
  }

  return parsed.map((item, idx) => {
    const cfg = item.cfg || {
      label: 'Gericht',
      icon: 'utensils',
      bg: 'rgba(0,0,0,0.06)',
      color: '#49454f'
    };

    return `
      <div class="meal-course-row">
        <div class="icon-box" style="width:38px;height:38px;border-radius:12px;background:${cfg.bg};color:${cfg.color};flex-shrink:0;">
          <i data-lucide="${cfg.icon}" style="width:18px;height:18px;"></i>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:${cfg.color};margin-bottom:2px;">${cfg.label}</div>
          <div style="font-size:0.98rem;font-weight:600;color:#1c1b1f;line-height:1.38;">${escapeHtml(item.text)}</div>
        </div>
      </div>
    `;
  }).join('');
}

function mealFormatDate(iso) {
  const d = new Date(iso + 'T00:00');
  return {
    weekday: d.toLocaleDateString('de-DE', { weekday: 'long' }),
    dayNum: d.getDate(),
    monthName: d.toLocaleDateString('de-DE', { month: 'long' }),
    dow: d.getDay(),
  };
}

function mealShortDish(raw) {
  if (!raw) return '';
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean)
    .filter(l => !/^(?:diabetiker|schonkost|vital):/i.test(l));
  if (!lines.length) return '';
  for (const l of lines) {
    const m = l.match(/^(?:hauptgericht|menü|menü 1):\s*(.*)/i);
    if (m && m[1]) return m[1];
  }
  return lines[0].replace(/^[^:]+:\s*/, '');
}

function mealCardHtml(d) {
  const { weekday, dayNum, monthName, dow } = mealFormatDate(d.date);
  const isToday = d.date === localDateStr();
  return `
    <div class="m3-card meal-day-card ${isToday ? 'is-today' : ''}" data-dow="${dow}" data-date="${d.date}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-size:1.15rem;font-weight:700;color:#1c1b1f;">${weekday}</span>
          <span style="font-size:0.85rem;opacity:0.5;font-weight:500;">${dayNum}. ${monthName}</span>
          ${isToday ? '<span style="background:#c4eed0;color:#072711;font-size:0.72rem;font-weight:700;padding:3px 9px;border-radius:10px;">Heute</span>' : ''}
        </div>
        ${mealCanEdit ? `<button class="icon-btn" style="width:34px;height:34px;border-radius:50%;" onclick="editMealDay(${d.id})" title="Bearbeiten">
          <i data-lucide="pencil" style="width:14px;height:14px;"></i>
        </button>` : ''}
      </div>
      <div class="meal-card-courses">
        ${formatMealDayHtml(d.meal)}
      </div>
      ${d.edited ? '<div style="font-size:0.68rem;opacity:0.45;margin-top:12px;font-weight:600;">✓ Manuell angepasst</div>' : ''}
    </div>
  `;
}

function mealPickIndex(days) {
  if (mealActiveDate) {
    const kept = days.findIndex(d => d.date === mealActiveDate);
    if (kept >= 0) return kept;
  }
  const today = localDateStr();
  const exact = days.findIndex(d => d.date === today);
  if (exact >= 0) return exact;
  const upcoming = days.findIndex(d => d.date >= today);
  return upcoming >= 0 ? upcoming : days.length - 1;
}

function mealSyncChips() {
  const day = mealDays[mealDayIndex];
  const dow = day ? String(new Date(day.date + 'T00:00').getDay()) : '';
  document.querySelectorAll('#meal-day-chips .chip').forEach(c => {
    const value = c.id.replace('meal-chip-', '');
    const has = mealDays.some(d => String(new Date(d.date + 'T00:00').getDay()) === value);
    c.classList.toggle('active', value === dow);
    c.style.opacity = has ? '' : '0.4';
  });
}

function paintMealDay(el, index) {
  if (!el) return;
  const day = mealDays[index];
  el.innerHTML = day ? mealCardHtml(day) : '';
}

function paintMealSubtitle() {
  const sub = document.getElementById('meal-header-sub');
  const day = mealDays[mealDayIndex];
  if (!sub || !day) return;
  const dish = mealShortDish(day.meal);
  const { weekday } = mealFormatDate(day.date);
  const label = day.date === localDateStr() ? 'Heute' : weekday;
  sub.textContent = dish ? (label + ': ' + dish) : (label + ' steht nichts im Plan');
}

function mealShowDay(index) {
  if (!mealDays.length) return;
  mealDayIndex = Math.max(0, Math.min(mealDays.length - 1, index));
  mealActiveDate = mealDays[mealDayIndex].date;
  mealSyncChips();
  paintMealDay(document.getElementById('meal-day-pane'), mealDayIndex);
  paintMealSubtitle();
  if (window.lucide) lucide.createIcons();
}

function mealFilter(mode) {
  const i = mealDays.findIndex(d => String(new Date(d.date + 'T00:00').getDay()) === String(mode));
  if (i < 0) {
    showToast('Für diesen Tag steht nichts im Plan');
    mealSyncChips();
    return;
  }
  mealShowDay(i);
}

async function init_mealplan() {
  const me = await API.me().catch(() => null);
  mealCanDelete = !!(me && (me.role === 'admin' || me.role === 'super_admin'));
  mealCanEdit = mealCanDelete;
  initMealSwipe();
  await refreshMealPlan();
}

function mealCanShift(dir) {
  const next = mealDayIndex + dir;
  return next >= 0 && next < mealDays.length;
}

function mealSwipeGap(stage) {
  const scroll = stage.closest('.page-scroll-1col');
  if (!scroll) return 40;
  const cs = getComputedStyle(scroll);
  const pad = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
  const inner = stage.closest('.page-inner');
  const extra = scroll.clientWidth - pad - (inner ? inner.clientWidth : stage.clientWidth);
  return pad + Math.max(0, extra);
}

function teardownMealSwipe(track) {
  if (track && track.parentNode) track.remove();
}

function buildMealSwipeTrack(stage) {
  const width = stage.clientWidth;
  if (!width) return null;
  const gap = mealSwipeGap(stage);
  const stride = width + gap;
  const pane = (index) => {
    const el = document.createElement('div');
    el.style.width = width + 'px';
    el.style.flex = '0 0 ' + width + 'px';
    if (index >= 0 && index < mealDays.length) paintMealDay(el, index);
    return el;
  };
  const track = document.createElement('div');
  track.className = 'meal-swipe-track';
  track.append(pane(mealDayIndex - 1), pane(mealDayIndex), pane(mealDayIndex + 1));
  track._width = width;
  track._stride = stride;
  track.style.gap = gap + 'px';
  track.style.width = (width * 3 + gap * 2) + 'px';
  track.style.height = stage.offsetHeight + 'px';
  track.style.transition = 'none';
  track.style.transform = 'translate3d(' + (-stride) + 'px,0,0)';
  stage.appendChild(track);
  if (window.lucide) lucide.createIcons();
  return track;
}

function animateMealSwipeTo(track, x, ms) {
  return new Promise(resolve => {
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      track.removeEventListener('transitionend', onEnd);
      resolve();
    };
    const onEnd = (e) => { if (e.target === track && e.propertyName === 'transform') finish(); };
    track.addEventListener('transitionend', onEnd);
    track.style.transition = 'transform ' + ms + 'ms cubic-bezier(0.22, 0.8, 0.28, 1)';
    track.style.transform = 'translate3d(' + x + 'px,0,0)';
    setTimeout(finish, ms + 60);
  });
}

function initMealSwipe() {
  const el = document.getElementById('meal-day-stage');
  if (!el || el._mealSwipe) return;
  el._mealSwipe = true;
  let tracking = false, horizontal = false, startX = 0, startY = 0, dx = 0, visualDx = 0;
  let lastDx = 0, lastT = 0, velocity = 0, track = null;
  const reset = () => { tracking = false; horizontal = false; track = null; };

  el.addEventListener('pointerdown', (e) => {
    if (mealSwipeBusy || !mealDays.length) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.pointerType === 'touch' && e.clientX < 16) return;
    tracking = true;
    horizontal = false;
    startX = e.clientX;
    startY = e.clientY;
    dx = 0; visualDx = 0; lastDx = 0; velocity = 0; lastT = performance.now();
    track = null;
  });

  el.addEventListener('pointermove', (e) => {
    if (!tracking || mealSwipeBusy) return;
    dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (!horizontal) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (Math.abs(dy) > Math.abs(dx)) { reset(); return; }
      horizontal = true;
      track = buildMealSwipeTrack(el);
      if (!track) { reset(); return; }
      el.setPointerCapture(e.pointerId);
    }
    if (e.cancelable) e.preventDefault();
    const now = performance.now();
    velocity = (dx - lastDx) / Math.max(1, now - lastT);
    lastDx = dx;
    lastT = now;
    const dir = dx < 0 ? 1 : -1;
    const stride = track._stride;
    visualDx = mealCanShift(dir)
      ? Math.max(-stride, Math.min(stride, dx))
      : Math.max(-72, Math.min(72, dx * 0.32));
    track.style.transition = 'none';
    track.style.transform = 'translate3d(' + (-stride + visualDx) + 'px,0,0)';
  });

  const finish = async (commit) => {
    if (!track) { reset(); return; }
    const stride = track._stride;
    const dir = dx < 0 ? 1 : -1;
    const go = commit && mealCanShift(dir) && dx !== 0;
    const target = go ? (dir === 1 ? -2 * stride : 0) : -stride;
    const remaining = Math.abs(target - (-stride + visualDx));
    const ms = Math.max(160, Math.min(320, remaining * 0.45));
    const held = track;
    reset();
    mealSwipeBusy = true;
    await animateMealSwipeTo(held, target, ms);
    if (go) mealShowDay(mealDayIndex + dir);
    teardownMealSwipe(held);
    mealSwipeBusy = false;
  };

  el.addEventListener('click', (e) => {
    if (!el._suppressClick) return;
    el._suppressClick = false;
    e.preventDefault();
    e.stopPropagation();
  }, true);

  el.addEventListener('pointerup', () => {
    if (!tracking || !horizontal) { reset(); return; }
    el._suppressClick = true;
    const width = track ? track._width : el.clientWidth;
    const flung = Math.abs(velocity) > 0.4 && Math.sign(velocity) === Math.sign(dx || velocity);
    const commit = Math.abs(dx) > Math.min(width * 0.28, 96) || (flung && Math.abs(dx) > 28);
    finish(commit && dx !== 0);
  });

  el.addEventListener('pointercancel', () => {
    if (horizontal && track) finish(false);
    else reset();
  });
}

async function refreshMealPlan() {
  let res;
  try { res = await API.mealplanCurrent(); } catch { res = null; }
  mealPlan = res && res.plan;

  const loadingEl = document.getElementById('meal-loading');
  if (res && res.status === 'processing') {
    if (loadingEl) loadingEl.style.display = 'block';
    document.getElementById('meal-empty').style.display = 'none';
    document.getElementById('meal-content').style.display = 'none';
    startMealStatusPolling();
  } else {
    if (loadingEl) loadingEl.style.display = 'none';
    stopMealStatusPolling();
    renderMealPlan(res);
  }
}

function startMealStatusPolling() {
  if (mealPollInterval) return;
  mealPollInterval = setInterval(async () => {
    try {
      const res = await API.mealplanCurrent();
      if (res.status === 'ready' || (res.plan && res.status !== 'processing')) {
        stopMealStatusPolling();
        document.getElementById('meal-loading').style.display = 'none';
        mealPlan = res.plan;
        renderMealPlan(res);
        showToast('Neuer Speiseplan ist jetzt für alle verfügbar!');
      } else if (res.status === 'error') {
        stopMealStatusPolling();
        document.getElementById('meal-loading').style.display = 'none';
        mealPlan = res.plan;
        renderMealPlan(res);
        showToast(res.status_error || 'KI-Erkennung fehlgeschlagen');
      }
    } catch (e) {}
  }, 2500);
}

function stopMealStatusPolling() {
  if (mealPollInterval) {
    clearInterval(mealPollInterval);
    mealPollInterval = null;
  }
}

function renderMealPlan(res) {
  const sub = document.getElementById('meal-header-sub');
  const deleteBtn = document.getElementById('meal-delete-btn');
  const dayOfWeek = new Date().getDay();
  const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

  const days = mealPlan && mealPlan.days
    ? [...mealPlan.days]
        .filter(d => {
          const w = new Date(d.date + 'T00:00').getDay();
          return w !== 0 && w !== 6;
        })
        .sort((a, b) => a.date.localeCompare(b.date))
    : [];
  mealDays = days;

  if (!mealPlan || !days.length) {
    mealActiveDate = null;
    document.getElementById('meal-empty').style.display = 'block';
    document.getElementById('meal-content').style.display = 'none';
    if (sub) sub.textContent = isWeekend ? 'Wochenende – Noch kein Plan für nächste Woche' : 'Kein Plan für diese Woche vorhanden';
    if (deleteBtn) deleteBtn.style.display = 'none';
    mealSyncChips();
    return;
  }

  document.getElementById('meal-empty').style.display = 'none';
  document.getElementById('meal-content').style.display = 'block';
  if (deleteBtn) deleteBtn.style.display = mealCanDelete ? 'flex' : 'none';

  document.getElementById('meal-image').src = mealPlan.image_url;
  if (!(mealActiveDate && days.some(d => d.date === mealActiveDate))) mealActiveDate = null;
  mealShowDay(mealPickIndex(days));
}

function deleteMealPlanConfirm() {
  if (!mealPlan) return;
  openModal(confirmDelete({
    title: 'Speiseplan löschen?',
    message: 'Willst du diesen Speiseplan wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden.',
    onConfirm: 'doDeleteMealPlan()',
  }));
}

async function doDeleteMealPlan() {
  closeModal();
  if (!mealPlan) return;
  try {
    await API.deleteMealPlan(mealPlan.id);
    mealPlan = null;
    renderMealPlan(null);
    showToast('Essensplan gelöscht');
  } catch {
    showToast('Fehler beim Löschen');
  }
}

function toggleMealImage() {
  const wrapper = document.getElementById('meal-image-wrapper');
  const chevron = document.getElementById('meal-image-chevron');
  const showing = wrapper.style.display !== 'none';
  wrapper.style.display = showing ? 'none' : 'block';
  chevron.style.transform = showing ? 'rotate(0deg)' : 'rotate(180deg)';
  if (!showing && window.lucide) lucide.createIcons();
}

function openMealLightbox() {
  const imgSrc = document.getElementById('meal-image')?.src;
  if (!imgSrc) return;
  const lb = document.getElementById('meal-lightbox');
  const lbImg = document.getElementById('meal-lightbox-img');
  const link = document.getElementById('meal-lightbox-open-link');
  if (!lb || !lbImg) return;
  lbImg.src = imgSrc;
  if (link) link.href = imgSrc;
  lb.style.display = 'flex';
  requestAnimationFrame(() => {
    lb.style.opacity = '1';
  });
  if (window.lucide) lucide.createIcons();
  history.pushState({ page: currentPage, mealLightbox: true }, '', window.location.pathname);
  window.addEventListener('keydown', onMealLightboxKeyDown);
}

function closeMealLightbox(isPopState = false) {
  const lb = document.getElementById('meal-lightbox');
  if (!lb || lb.style.display === 'none') return;
  lb.style.opacity = '0';
  setTimeout(() => {
    lb.style.display = 'none';
  }, 250);
  window.removeEventListener('keydown', onMealLightboxKeyDown);

  if (!isPopState && history.state && history.state.mealLightbox) {
    isSelfPopping = true;
    history.back();
  }
}

function onMealLightboxBgClick(e) {
  if (e.target.id === 'meal-lightbox') {
    closeMealLightbox(false);
  }
}

function onMealLightboxKeyDown(e) {
  if (e.key === 'Escape') {
    closeMealLightbox();
  }
}

function editMealDay(dayId) {
  const day = mealPlan.days.find(d => d.id === dayId);
  if (!day) return;
  const { weekday, dayNum } = mealFormatDate(day.date);
  openSheet(`
    <div class="sheet-title">${weekday}, ${dayNum}. — Essen bearbeiten</div>
    <div style="font-size:0.75rem;opacity:0.6;margin-bottom:8px;line-height:1.4;">
      Tipp: Zeilen können mit einer Kategorie beginnen, z.&nbsp;B.:<br>
      <code>Suppe: ...</code>, <code>Hauptgericht: ...</code>, <code>Vegetarisch: ...</code>, <code>Muslimisch: ...</code>, <code>Dessert: ...</code>
    </div>
    <textarea class="m3-input" id="meal-edit-text" rows="6" style="resize:none;height:auto;font-family:inherit;line-height:1.4;">${escapeHtml(day.meal)}</textarea>
    <button class="m3-btn-full" onclick="saveMealDay(${dayId})">Speichern</button>
  `);
}

async function saveMealDay(dayId) {
  const meal = document.getElementById('meal-edit-text').value.trim();
  if (!meal) { showToast('Darf nicht leer sein'); return; }
  try {
    await API.updateMealDay(dayId, { meal });
    const day = mealPlan.days.find(d => d.id === dayId);
    if (day) { day.meal = meal; day.edited = true; }
    closeSheet();
    renderMealPlan({ plan: mealPlan, today: mealPlan.days.find(d => d.date === localDateStr()) });
    showToast('Gespeichert');
  } catch {
    showToast('Fehler beim Speichern');
  }
}

async function mealFileSelected(inputEl) {
  const file = inputEl.files[0];
  inputEl.value = '';
  if (!file) return;

  const emptyEl = document.getElementById('meal-empty');
  const contentEl = document.getElementById('meal-content');
  const loadingEl = document.getElementById('meal-loading');
  const sub = document.getElementById('meal-header-sub');

  if (emptyEl) emptyEl.style.display = 'none';
  if (contentEl) contentEl.style.display = 'none';
  if (loadingEl) loadingEl.style.display = 'block';
  if (sub) sub.textContent = 'Upload läuft…';

  showToast('Foto wird hochgeladen…', 2500);

  try {
    const form = new FormData();
    form.append('file', file);
    await API.uploadMealPlan(form);
    showToast('Foto empfangen! Die KI analysiert den Plan im Hintergrund. Du kannst den Tab verlassen.', 7000);
    startMealStatusPolling();
  } catch (err) {
    if (loadingEl) loadingEl.style.display = 'none';
    showToast(err.detail || 'Upload fehlgeschlagen');
    await refreshMealPlan();
  }
}
</script>
