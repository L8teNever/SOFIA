name: apply meal swipe once

on:
  push:
    paths:
      - .github/workflows/meal-swipe-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: apply mealplan swipe patch
        run: |
          set -euo pipefail
          cat .github/mealpatch/part*.txt | tr -d '\n' | base64 -d > /tmp/meal.patch
          git apply --check /tmp/meal.patch
          git apply /tmp/meal.patch
          python3 - <<'PY'
          import hashlib
          path = "pages/mealplan.html"
          data = open(path, "rb").read()
          got = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          sha, size = "bb27ea7ac0acb52a69ab4f44e2907bbdadcce604", 29585
          if got != sha or len(data) != size:
              raise SystemExit(f"mismatch {got} {len(data)}")
          print("blob checks ok")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/mealplan.html
          git commit -m "feat(mealplan): swipe between days and open on today"
          git push origin HEAD:main
