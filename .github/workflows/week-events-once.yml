name: Apply week event list once

on:
  push:
    paths:
      - .github/workflows/week-events-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - name: Apply the week-list patch
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, pathlib, hashlib, subprocess
          parts = sorted(pathlib.Path('.github/calpatch').glob('part*.txt'))
          blob_b64 = ''.join(p.read_text().strip() for p in parts)
          pathlib.Path('/tmp/week-events.patch').write_bytes(base64.b64decode(blob_b64))
          subprocess.check_call(['git', 'apply', '/tmp/week-events.patch'])
          data = pathlib.Path('pages/calendar.html').read_bytes()
          header = ("blob %d\0" % len(data)).encode()
          digest = hashlib.sha1(header + data).hexdigest()
          print('blob', digest, 'size', len(data))
          if digest != 'e096e087d067be30fc024120c6162b63dc6aca09' or len(data) != 100439:
              raise SystemExit('hash mismatch')
          PY
          git config user.name "L8teNever"
          git config user.email "144357086+L8teNever@users.noreply.github.com"
          git add pages/calendar.html
          git commit -m "fix(calendar): week list is this week, and phones skip it"
          git push
