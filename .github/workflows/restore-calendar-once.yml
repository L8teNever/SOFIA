name: Restore calendar file once

on:
  push:
    paths:
      - .github/workflows/restore-calendar-once.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Write the desktop month calendar back
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cal-old.html \
            "https://raw.githubusercontent.com/L8teNever/SOFIA/97d653e9c5fc1a368e68ebf2dcd3bb6e5015ca9f/pages/calendar.html"
          python3 << 'PY'
          from pathlib import Path
          import hashlib
          src = Path('/tmp/cal-old.html').read_text()
          old = '<div class="cal-mini-weekdays"><div>M</div><div>D</div><div>M</div><div>D</div><div>F</div><div>D</div><div>F</div><div>S</div><div>S</div></div>'
          new = '<div class="cal-mini-weekdays"><div>M</div><div>D</div><div>M</div><div>D</div><div>F</div><div>S</div><div>S</div></div>'
          if src.count(old) != 1:
              raise SystemExit('weekday line count %s' % src.count(old))
          Path('pages/calendar.html').write_text(src.replace(old, new, 1))
          blob = Path('pages/calendar.html').read_bytes()
          digest = hashlib.sha1(b'blob %d\0' % len(blob) + blob).hexdigest()
          print('blob', digest, 'size', len(blob))
          if digest != '04733b0be221bc649d4789b69d6e255648e2ad36' or len(blob) != 100010:
              raise SystemExit('hash mismatch, refusing to commit')
          PY
          git config user.name "L8teNever"
          git config user.email "144357086+L8teNever@users.noreply.github.com"
          git add pages/calendar.html
          if git diff --cached --quiet; then
            echo 'calendar already matches'
            exit 0
          fi
          git commit -m "fix(calendar): restore the large month on desktop"
          git push
