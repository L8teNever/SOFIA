name: Remove calendar patch helpers

on:
  push:
    paths:
      - .github/workflows/restore-calendar-once.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - name: Drop the one-shot patch
        run: |
          set -euo pipefail
          git rm -r .github/calpatch
          git rm .github/workflows/restore-calendar-once.yml
          git config user.name "L8teNever"
          git config user.email "144357086+L8teNever@users.noreply.github.com"
          git commit -m "ci: remove the one-shot calendar patch"
          git push
