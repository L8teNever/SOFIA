name: Apply agent patch
on:
  push:
    paths:
      - '.github/agent-patch/**'
      - '.github/workflows/apply-agent-patch.yml'
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and assert hashes
        env:
          WANT_SHA: e755b0e5b04ebea97c01e7ddd3b19a24bd6014ed
          WANT_SIZE: "108097"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, base64, subprocess, pathlib, os, sys
          parts = sorted(glob.glob('.github/agent-patch/part-*.b64'))
          if not parts:
              sys.exit('no patch parts')
          data = b''.join(base64.b64decode(pathlib.Path(p).read_text().strip()) for p in parts)
          pathlib.Path('/tmp/patch.diff').write_bytes(data)
          subprocess.check_call(['git', 'apply', '/tmp/patch.diff'])
          sha = subprocess.check_output(['git', 'hash-object', 'pages/calendar.html'], text=True).strip()
          size = pathlib.Path('pages/calendar.html').stat().st_size
          want_sha = os.environ['WANT_SHA']
          want_size = int(os.environ['WANT_SIZE'])
          assert sha == want_sha, f'sha {sha} != {want_sha}'
          assert size == want_size, f'size {size} != {want_size}'
          print('ok', sha, size)
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add pages/calendar.html
          git commit -m "feat(calendar): show event files in month view and restore last view"
          git push
