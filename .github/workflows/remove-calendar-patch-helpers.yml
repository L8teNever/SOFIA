name: remove calendar patch helpers
on:
  push:
    paths:
      - '.github/workflows/remove-calendar-patch-helpers.yml'
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove helper files
        run: |
          set -euo pipefail
          git rm -r .github/agent-patch || true
          git rm -f .github/workflows/apply-agent-patch.yml || true
          git rm -f .github/workflows/remove-calendar-patch-helpers.yml || true
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "chore: remove calendar patch helpers"
          git push
