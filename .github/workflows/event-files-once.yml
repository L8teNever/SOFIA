name: remove calendar patch helpers

on:
  push:
    paths:
      - .github/workflows/event-files-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: remove patch helpers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .github/calpatch
          git rm .github/workflows/event-files-once.yml
          git commit -m "chore: remove calendar patch helpers"
          git push origin HEAD:main
